# lib/backend/xla/device_lowering_table.yaml
#
# One entry per device-classified builtin: what it is applied to, and the
# StableHLO graph it lowers to.
#
# WHY THIS IS DATA AND NOT C++.
#
# Two consumers need the same fact — "what StableHLO does `silu` mean?" — and
# they are not the same program. tests/xla/builtin_parity_test measures the
# lowering against the language's own host implementation today; region
# formation (S5) will outline eligible subgraphs and needs exactly this map to
# do it. A lowering written as C++ inside the harness would have to be written
# a second time inside the compiler, and the two would drift the first time
# either was corrected. So the lowering lives here, once, in a form both can
# read.
#
# HOW A ROW IS GRADED. The reference comes from running the REAL builtin
# through eshkol-run with the device switch off — not from evaluating the
# `lowering` below in double precision. Those are two independent code paths,
# which is the only arrangement under which the comparison means anything: a
# reference computed from the same formula as the device graph would agree with
# it however wrong both were.
#
# FIELDS
#   kind             scalar | tensor. `scalar` applies the builtin to each
#                    input value separately on the host (N independent scalar
#                    calls) while the device evaluates one rank-1 graph over
#                    all N at once — deliberately different shapes of work.
#                    `tensor` applies it to a rank-1 tensor on both sides,
#                    for builtins the language only accepts tensors for.
#   arity            1 or 2.
#   tolerance_class  arithmetic | transcendental, per the class rule in
#                    docs/design/ESHKOL_S_FRAGMENT.md.
#   inputs           one {count, base, step} per operand; value i is
#                    base + i*step. Domains are chosen so every input is
#                    inside the builtin's mathematical domain — an asin of 2
#                    is a question about NaN handling, not about parity.
#   lowering         SSA list. Operands are a0, a1; each step names its
#                    output. Steps:
#                      {op: unary,  kind: <UnaryOp>,  in: X,        out: R}
#                      {op: binary, kind: <BinaryOp>, lhs: X, rhs: Y, out: R}
#                      {op: const,  value: <double>,  like: X,      out: R}
#                    <UnaryOp>/<BinaryOp> are the enumerators in
#                    inc/eshkol/backend/xla/stablehlo_emitter.h.
#   result           which SSA name is the answer.
#
# NOT IN THIS FILE, and why:
#   sign, _max2, _min2, _atan1, _atan2 — classified device, but not callable
#   from an Eshkol program (probed: "Unknown function"). They are registry or
#   internal names, so no host reference can be obtained for them by running
#   the language, and a row that cannot get a reference is reported uncovered
#   rather than given a hand-written expected value.
#
#   sign — a real registry builtin ({"sign", 743, 1} in lib/backend/eshkol_vm.c
#   and lib/backend/eshkol_compiler.c) but implemented ONLY as a VM bytecode
#   special form (lib/backend/eshkol_compiler.c:3428, emitting
#   OP_NATIVE_CALL 743). The native/LLVM backend has no `sign` at all — the
#   string does not appear in llvm_codegen.cpp or any *_codegen.cpp — so
#   `eshkol-run -r` answers "Unknown function: sign" for every syntactic form
#   of it, and no host reference can be obtained through the path this
#   harness drives. It stays classified device and counted, and stays
#   uncovered, until either the native backend implements it or the reference
#   generator learns to drive the VM.
#
# Copyright (C) tsotchke
# SPDX-License-Identifier: MIT

version: 1
builtins:

  # ── Scalar math: direct StableHLO ops ─────────────────────────────────
  sqrt:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: 0.25, step: 0.25}]     # strictly positive
    lowering: [{op: unary, kind: Sqrt, in: a0, out: r}]
    result: r

  cbrt:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering: [{op: unary, kind: Cbrt, in: a0, out: r}]
    result: r

  abs:
    kind: scalar
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering: [{op: unary, kind: Abs, in: a0, out: r}]
    result: r

  fabs:
    kind: scalar
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering: [{op: unary, kind: Abs, in: a0, out: r}]
    result: r

  tan:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.0, step: 0.125}]    # clear of the poles
    lowering: [{op: unary, kind: Tan, in: a0, out: r}]
    result: r

  square:
    kind: scalar
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering: [{op: binary, kind: Multiply, lhs: a0, rhs: a0, out: r}]
    result: r

  # ── Scalar math: compositions ─────────────────────────────────────────
  # Each is an exact identity, not an approximation of the host's algorithm:
  # the device evaluates the same mathematical function by a different route.

  sinh:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # (e^x - e^-x) / 2
      - {op: unary,  kind: Exp,      in: a0,  out: ex}
      - {op: unary,  kind: Negate,   in: a0,  out: nx}
      - {op: unary,  kind: Exp,      in: nx,  out: enx}
      - {op: binary, kind: Subtract, lhs: ex, rhs: enx, out: d}
      - {op: const,  value: 2.0,     like: a0, out: two}
      - {op: binary, kind: Divide,   lhs: d,  rhs: two, out: r}
    result: r

  cosh:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # (e^x + e^-x) / 2
      - {op: unary,  kind: Exp,    in: a0,  out: ex}
      - {op: unary,  kind: Negate, in: a0,  out: nx}
      - {op: unary,  kind: Exp,    in: nx,  out: enx}
      - {op: binary, kind: Add,    lhs: ex, rhs: enx, out: s}
      - {op: const,  value: 2.0,   like: a0, out: two}
      - {op: binary, kind: Divide, lhs: s,  rhs: two, out: r}
    result: r

  exp2:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # 2^x
      - {op: const,  value: 2.0,   like: a0,  out: two}
      - {op: binary, kind: Power,  lhs: two, rhs: a0, out: r}
    result: r

  log2:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: 0.25, step: 0.25}]
    lowering:                                          # ln(x) / ln(2)
      - {op: unary,  kind: Log,    in: a0, out: lx}
      - {op: const,  value: 0.6931471805599453, like: a0, out: ln2}
      - {op: binary, kind: Divide, lhs: lx, rhs: ln2, out: r}
    result: r

  log10:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: 0.25, step: 0.25}]
    lowering:                                          # ln(x) / ln(10)
      - {op: unary,  kind: Log,    in: a0, out: lx}
      - {op: const,  value: 2.302585092994046, like: a0, out: ln10}
      - {op: binary, kind: Divide, lhs: lx, rhs: ln10, out: r}
    result: r

  atan:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # atan2(x, 1)
      - {op: const,  value: 1.0,   like: a0, out: one}
      - {op: binary, kind: Atan2,  lhs: a0, rhs: one, out: r}
    result: r

  asin:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -0.875, step: 0.125}]   # inside (-1, 1)
    lowering:                                          # atan2(x, sqrt(1-x^2))
      - {op: binary, kind: Multiply, lhs: a0, rhs: a0, out: x2}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Subtract, lhs: one, rhs: x2, out: d}
      - {op: unary,  kind: Sqrt,     in: d,  out: s}
      - {op: binary, kind: Atan2,    lhs: a0, rhs: s, out: r}
    result: r

  acos:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -0.875, step: 0.125}]
    lowering:                                          # atan2(sqrt(1-x^2), x)
      - {op: binary, kind: Multiply, lhs: a0, rhs: a0, out: x2}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Subtract, lhs: one, rhs: x2, out: d}
      - {op: unary,  kind: Sqrt,     in: d,  out: s}
      - {op: binary, kind: Atan2,    lhs: s,  rhs: a0, out: r}
    result: r

  asinh:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # ln(x + sqrt(x^2+1))
      - {op: binary, kind: Multiply, lhs: a0, rhs: a0, out: x2}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Add,      lhs: x2, rhs: one, out: s1}
      - {op: unary,  kind: Sqrt,     in: s1, out: s}
      - {op: binary, kind: Add,      lhs: a0, rhs: s, out: t}
      - {op: unary,  kind: Log,      in: t,  out: r}
    result: r

  acosh:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: 1.25, step: 0.25}]      # domain is x >= 1
    lowering:                                          # ln(x + sqrt(x^2-1))
      - {op: binary, kind: Multiply, lhs: a0, rhs: a0, out: x2}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Subtract, lhs: x2, rhs: one, out: s1}
      - {op: unary,  kind: Sqrt,     in: s1, out: s}
      - {op: binary, kind: Add,      lhs: a0, rhs: s, out: t}
      - {op: unary,  kind: Log,      in: t,  out: r}
    result: r

  atanh:
    kind: scalar
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -0.875, step: 0.125}]
    lowering:                                          # 0.5 * ln((1+x)/(1-x))
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Add,      lhs: one, rhs: a0, out: num}
      - {op: binary, kind: Subtract, lhs: one, rhs: a0, out: den}
      - {op: binary, kind: Divide,   lhs: num, rhs: den, out: q}
      - {op: unary,  kind: Log,      in: q,  out: lq}
      - {op: const,  value: 0.5,     like: a0, out: half}
      - {op: binary, kind: Multiply, lhs: lq, rhs: half, out: r}
    result: r

  # ── Scalar math, two operands ─────────────────────────────────────────
  pow:
    kind: scalar
    arity: 2
    tolerance_class: transcendental
    inputs:
      - {count: 12, base: 0.25, step: 0.25}            # positive base
      - {count: 12, base: -1.5, step: 0.25}
    lowering: [{op: binary, kind: Power, lhs: a0, rhs: a1, out: r}]
    result: r

  expt:
    kind: scalar
    arity: 2
    tolerance_class: transcendental
    inputs:
      - {count: 12, base: 0.25, step: 0.25}
      - {count: 12, base: -1.5, step: 0.25}
    lowering: [{op: binary, kind: Power, lhs: a0, rhs: a1, out: r}]
    result: r

  atan2:
    kind: scalar
    arity: 2
    tolerance_class: transcendental
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 0.25, step: 0.25}            # positive, one branch
    lowering: [{op: binary, kind: Atan2, lhs: a0, rhs: a1, out: r}]
    result: r

  max:
    kind: scalar
    arity: 2
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 1.25, step: -0.25}           # crosses the first
    lowering: [{op: binary, kind: Maximum, lhs: a0, rhs: a1, out: r}]
    result: r

  min:
    kind: scalar
    arity: 2
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 1.25, step: -0.25}
    lowering: [{op: binary, kind: Minimum, lhs: a0, rhs: a1, out: r}]
    result: r

  "%":
    kind: scalar
    arity: 2
    tolerance_class: arithmetic
    inputs:
      # a_i - 2*b_i must not be constant: with b stepping by exactly half of
      # a's step, every remainder came out 1.0 and the row would have passed
      # for a device that computed a - 2b instead of a remainder.
      - {count: 12, base: 7.0, step: 1.0}
      - {count: 12, base: 2.0, step: 0.31}             # never zero
    lowering: [{op: binary, kind: Remainder, lhs: a0, rhs: a1, out: r}]
    result: r

  # ── Activations. The language accepts these only as tensor ops, so the
  #    reference applies them to a rank-1 tensor. ─────────────────────────
  gelu:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    # THE VARIANT IS PINNED BY CITATION, NOT BY THIS ROW.
    #
    # Eshkol's forward gelu is the PyTorch tanh approximation, stated as such
    # at lib/backend/tensor_activation_codegen.cpp:906 ("PyTorch-standard
    # tanh-approximation GELU") and written out at
    # lib/backend/autodiff_codegen.cpp:12689 as
    #     gelu(x) = 0.5*x*(1 + tanh(u)),  u = sqrt(2/pi)*(x + 0.044715*x^3)
    # which is the form lowered below.
    #
    # A discriminating input set was sought and does not exist. The erf and
    # tanh forms diverge by at most 4.73e-4 ABSOLUTE (at x = 2.699), which is
    # inside the absolute branch of the 1e-3 transcendental bound, so under
    # the contract's "absolute or relative, whichever is looser" rule no input
    # can separate them. Their RELATIVE divergence is large in the left tail
    # (0.32 at x = -3.5), but that is precisely where 1 + tanh(u) cancels to
    # ~5e-4 and the device's own tanh error — measured at 4.4e-5 absolute on
    # this hardware — is amplified into the same relative range:
    #
    #     x      variant divergence   device tanh noise
    #     -3.50  3.21e-01             1.25e-01
    #     -3.00  1.13e-01             1.81e-02
    #     -2.50  2.92e-02             3.65e-03
    #     -2.00  2.16e-03             9.69e-04
    #
    # The two track each other within a factor of 2 to 8 everywhere they are
    # large. A bound threaded into that window would be tuned to one
    # measurement on one device and would break on the next, which is the
    # fragility the 100x class factor was chosen to avoid. So the inputs below
    # are the well-conditioned range every other activation uses, and this row
    # tests that the lowering agrees with the host — not which variant the
    # host is. That fact comes from the two source lines above.
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:
      - {op: binary, kind: Multiply, lhs: a0, rhs: a0, out: x2}
      - {op: binary, kind: Multiply, lhs: x2, rhs: a0, out: x3}
      - {op: const,  value: 0.044715, like: a0, out: k}
      - {op: binary, kind: Multiply, lhs: x3, rhs: k, out: kx3}
      - {op: binary, kind: Add,      lhs: a0, rhs: kx3, out: inner}
      - {op: const,  value: 0.7978845608028654, like: a0, out: c}
      - {op: binary, kind: Multiply, lhs: inner, rhs: c, out: u}
      - {op: unary,  kind: Tanh,     in: u,  out: t}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Add,      lhs: one, rhs: t, out: p}
      - {op: const,  value: 0.5,     like: a0, out: half}
      - {op: binary, kind: Multiply, lhs: a0, rhs: half, out: hx}
      - {op: binary, kind: Multiply, lhs: hx, rhs: p, out: r}
    result: r

  softplus:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # log(1 + e^x)
      - {op: unary, kind: Exp,   in: a0, out: ex}
      - {op: unary, kind: Log1p, in: ex, out: r}
    result: r

  elu:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # x>0 ? x : e^x - 1
      - {op: unary,  kind: Expm1,   in: a0, out: em1}
      - {op: const,  value: 0.0,    like: a0, out: zero}
      - {op: binary, kind: Minimum, lhs: em1, rhs: zero, out: neg}
      - {op: binary, kind: Maximum, lhs: a0,  rhs: zero, out: pos}
      - {op: binary, kind: Add,     lhs: pos, rhs: neg,  out: r}
    result: r

  celu:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # alpha = 1: same as elu
      - {op: unary,  kind: Expm1,   in: a0, out: em1}
      - {op: const,  value: 0.0,    like: a0, out: zero}
      - {op: binary, kind: Minimum, lhs: em1, rhs: zero, out: neg}
      - {op: binary, kind: Maximum, lhs: a0,  rhs: zero, out: pos}
      - {op: binary, kind: Add,     lhs: pos, rhs: neg,  out: r}
    result: r

  selu:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # scale*(x>0 ? x : alpha*(e^x-1))
      - {op: unary,  kind: Expm1,    in: a0, out: em1}
      - {op: const,  value: 1.6732632423543772, like: a0, out: alpha}
      - {op: binary, kind: Multiply, lhs: em1, rhs: alpha, out: sc}
      - {op: const,  value: 0.0,     like: a0, out: zero}
      - {op: binary, kind: Minimum,  lhs: sc,  rhs: zero, out: neg}
      - {op: binary, kind: Maximum,  lhs: a0,  rhs: zero, out: pos}
      - {op: binary, kind: Add,      lhs: pos, rhs: neg,  out: sum}
      - {op: const,  value: 1.0507009873554805, like: a0, out: scale}
      - {op: binary, kind: Multiply, lhs: sum, rhs: scale, out: r}
    result: r

  silu:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # x * sigmoid(x)
      - {op: unary,  kind: Logistic, in: a0, out: s}
      - {op: binary, kind: Multiply, lhs: a0, rhs: s, out: r}
    result: r

  mish:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # x * tanh(softplus(x))
      - {op: unary,  kind: Exp,      in: a0, out: ex}
      - {op: unary,  kind: Log1p,    in: ex, out: sp}
      - {op: unary,  kind: Tanh,     in: sp, out: t}
      - {op: binary, kind: Multiply, lhs: a0, rhs: t, out: r}
    result: r

  leaky-relu:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # max(x, 0.01x)
      - {op: const,  value: 0.01,   like: a0, out: slope}
      - {op: binary, kind: Multiply, lhs: a0, rhs: slope, out: lx}
      - {op: binary, kind: Maximum,  lhs: a0, rhs: lx, out: r}
    result: r

  hard-sigmoid:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # min(max(x/6 + 0.5, 0), 1)
      - {op: const,  value: 0.16666666666666666, like: a0, out: sixth}
      - {op: binary, kind: Multiply, lhs: a0, rhs: sixth, out: sc}
      - {op: const,  value: 0.5,     like: a0, out: half}
      - {op: binary, kind: Add,      lhs: sc, rhs: half, out: sh}
      - {op: const,  value: 0.0,     like: a0, out: zero}
      - {op: binary, kind: Maximum,  lhs: sh, rhs: zero, out: lo}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Minimum,  lhs: lo, rhs: one, out: r}
    result: r

  hard-swish:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                                          # x * hard-sigmoid(x)
      - {op: const,  value: 0.16666666666666666, like: a0, out: sixth}
      - {op: binary, kind: Multiply, lhs: a0, rhs: sixth, out: sc}
      - {op: const,  value: 0.5,     like: a0, out: half}
      - {op: binary, kind: Add,      lhs: sc, rhs: half, out: sh}
      - {op: const,  value: 0.0,     like: a0, out: zero}
      - {op: binary, kind: Maximum,  lhs: sh, rhs: zero, out: lo}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Minimum,  lhs: lo, rhs: one, out: hs}
      - {op: binary, kind: Multiply, lhs: a0, rhs: hs, out: r}
    result: r

  # ── Tensor elementwise: the tensor-* spellings of ops already lowered.
  #    They are separate builtins with separate host implementations, so they
  #    get separate rows rather than being assumed equivalent. ─────────────
  tensor-abs:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering: [{op: unary, kind: Abs, in: a0, out: r}]
    result: r

  tensor-neg:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering: [{op: unary, kind: Negate, in: a0, out: r}]
    result: r

  tensor-sqrt:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    inputs: [{count: 12, base: 0.25, step: 0.25}]
    lowering: [{op: unary, kind: Sqrt, in: a0, out: r}]
    result: r

  tensor-pow:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    # The exponent is a scalar second argument to the builtin, not a tensor,
    # so it is passed to the reference as a literal and appears on the device
    # side as a constant. Squaring is the case where a wrong exponent is still
    # plausible-looking, which is why the inputs straddle 1.0: x^2 and x are
    # far apart on both sides of it.
    extra_args: "2.0"
    inputs: [{count: 12, base: 0.25, step: 0.25}]
    lowering:
      - {op: const,  value: 2.0,   like: a0, out: two}
      - {op: binary, kind: Power,  lhs: a0, rhs: two, out: r}
    result: r

  tensor-maximum:
    kind: tensor
    arity: 2
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 1.25, step: -0.25}
    lowering: [{op: binary, kind: Maximum, lhs: a0, rhs: a1, out: r}]
    result: r

  tensor-minimum:
    kind: tensor
    arity: 2
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 1.25, step: -0.25}
    lowering: [{op: binary, kind: Minimum, lhs: a0, rhs: a1, out: r}]
    result: r

  # ── Reductions to a scalar. result_shape: scalar means the reference is one
  #    number and the device graph ends rank 0. ────────────────────────────
  tensor-var:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    result_shape: scalar
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                       # population variance: mean((x - mean)^2)
      - {op: reduce,    kind: Sum,      in: a0, axes: [0], out: s}
      - {op: const,     value: 12.0,    like: s, out: n}
      - {op: binary,    kind: Divide,   lhs: s, rhs: n, out: mean}
      - {op: broadcast, in: mean, shape: [12], dims: [], out: meanb}
      - {op: binary,    kind: Subtract, lhs: a0, rhs: meanb, out: d}
      - {op: binary,    kind: Multiply, lhs: d, rhs: d, out: sq}
      - {op: reduce,    kind: Sum,      in: sq, axes: [0], out: ssq}
      - {op: binary,    kind: Divide,   lhs: ssq, rhs: n, out: r}
    result: r

  tensor-std:
    kind: tensor
    arity: 1
    tolerance_class: transcendental
    result_shape: scalar
    inputs: [{count: 12, base: -1.5, step: 0.25}]
    lowering:                       # sqrt of the population variance
      - {op: reduce,    kind: Sum,      in: a0, axes: [0], out: s}
      - {op: const,     value: 12.0,    like: s, out: n}
      - {op: binary,    kind: Divide,   lhs: s, rhs: n, out: mean}
      - {op: broadcast, in: mean, shape: [12], dims: [], out: meanb}
      - {op: binary,    kind: Subtract, lhs: a0, rhs: meanb, out: d}
      - {op: binary,    kind: Multiply, lhs: d, rhs: d, out: sq}
      - {op: reduce,    kind: Sum,      in: sq, axes: [0], out: ssq}
      - {op: binary,    kind: Divide,   lhs: ssq, rhs: n, out: v}
      - {op: unary,     kind: Sqrt,     in: v, out: r}
    result: r

  # ── Losses. Every one reduces to a scalar, and the inputs are chosen so the
  #    per-element difference crosses 1.0 — the piecewise losses below have a
  #    quadratic and a linear branch, and a row that only ever exercised one
  #    of them would pass for a lowering that got the other wrong. ─────────
  mse-loss:
    kind: tensor
    arity: 2
    tolerance_class: arithmetic
    result_shape: scalar
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 0.5, step: 0.1}
    lowering:                       # mean((p - q)^2)
      - {op: binary, kind: Subtract, lhs: a0, rhs: a1, out: d}
      - {op: binary, kind: Multiply, lhs: d, rhs: d, out: sq}
      - {op: reduce, kind: Sum,      in: sq, axes: [0], out: s}
      - {op: const,  value: 12.0,    like: s, out: n}
      - {op: binary, kind: Divide,   lhs: s, rhs: n, out: r}
    result: r

  mae-loss:
    kind: tensor
    arity: 2
    tolerance_class: arithmetic
    result_shape: scalar
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 0.5, step: 0.1}
    lowering:                       # mean(|p - q|)
      - {op: binary, kind: Subtract, lhs: a0, rhs: a1, out: d}
      - {op: unary,  kind: Abs,      in: d, out: ad}
      - {op: reduce, kind: Sum,      in: ad, axes: [0], out: s}
      - {op: const,  value: 12.0,    like: s, out: n}
      - {op: binary, kind: Divide,   lhs: s, rhs: n, out: r}
    result: r

  huber-loss:
    kind: tensor
    arity: 2
    tolerance_class: arithmetic
    result_shape: scalar
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 0.5, step: 0.1}
    lowering:                       # delta = 1: mean(0.5*min(|d|,1)^2 + max(|d|-1,0))
      - {op: binary, kind: Subtract, lhs: a0, rhs: a1, out: d}
      - {op: unary,  kind: Abs,      in: d, out: ad}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Minimum,  lhs: ad, rhs: one, out: q}
      - {op: binary, kind: Multiply, lhs: q, rhs: q, out: q2}
      - {op: const,  value: 0.5,     like: a0, out: half}
      - {op: binary, kind: Multiply, lhs: q2, rhs: half, out: quad}
      - {op: binary, kind: Subtract, lhs: ad, rhs: one, out: ex}
      - {op: const,  value: 0.0,     like: a0, out: zero}
      - {op: binary, kind: Maximum,  lhs: ex, rhs: zero, out: lin}
      - {op: binary, kind: Add,      lhs: quad, rhs: lin, out: e}
      - {op: reduce, kind: Sum,      in: e, axes: [0], out: s}
      - {op: const,  value: 12.0,    like: s, out: n}
      - {op: binary, kind: Divide,   lhs: s, rhs: n, out: r}
    result: r

  smooth-l1-loss:
    kind: tensor
    arity: 2
    tolerance_class: arithmetic
    result_shape: scalar
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 0.5, step: 0.1}
    lowering:                       # beta = 1, which coincides with huber above
      - {op: binary, kind: Subtract, lhs: a0, rhs: a1, out: d}
      - {op: unary,  kind: Abs,      in: d, out: ad}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Minimum,  lhs: ad, rhs: one, out: q}
      - {op: binary, kind: Multiply, lhs: q, rhs: q, out: q2}
      - {op: const,  value: 0.5,     like: a0, out: half}
      - {op: binary, kind: Multiply, lhs: q2, rhs: half, out: quad}
      - {op: binary, kind: Subtract, lhs: ad, rhs: one, out: ex}
      - {op: const,  value: 0.0,     like: a0, out: zero}
      - {op: binary, kind: Maximum,  lhs: ex, rhs: zero, out: lin}
      - {op: binary, kind: Add,      lhs: quad, rhs: lin, out: e}
      - {op: reduce, kind: Sum,      in: e, axes: [0], out: s}
      - {op: const,  value: 12.0,    like: s, out: n}
      - {op: binary, kind: Divide,   lhs: s, rhs: n, out: r}
    result: r

  hinge-loss:
    kind: tensor
    arity: 2
    tolerance_class: arithmetic
    result_shape: scalar
    inputs:
      - {count: 12, base: -1.5, step: 0.25}
      - {count: 12, base: 0.5, step: 0.1}
    lowering:                       # mean(max(0, 1 - p*q))
      - {op: binary, kind: Multiply, lhs: a0, rhs: a1, out: pq}
      - {op: const,  value: 1.0,     like: a0, out: one}
      - {op: binary, kind: Subtract, lhs: one, rhs: pq, out: m}
      - {op: const,  value: 0.0,     like: a0, out: zero}
      - {op: binary, kind: Maximum,  lhs: m, rhs: zero, out: e}
      - {op: reduce, kind: Sum,      in: e, axes: [0], out: s}
      - {op: const,  value: 12.0,    like: s, out: n}
      - {op: binary, kind: Divide,   lhs: s, rhs: n, out: r}
    result: r

  # ── Float rounding. These are float ops, so they stay on the f32 graph.
  #    `round` is StableHLO's round_nearest_even and not round_nearest_afz:
  #    the host answers 2 for (round 2.5), which is the banker's-rounding tie
  #    convention, and afz would answer 3. The two agree everywhere except at
  #    a tie, so the inputs below include one. ─────────────────────────────
  floor:
    kind: scalar
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.5}]
    lowering: [{op: unary, kind: Floor, in: a0, out: r}]
    result: r
  ceiling:
    kind: scalar
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.5}]
    lowering: [{op: unary, kind: Ceil, in: a0, out: r}]
    result: r
  ceil:
    kind: scalar
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.5}]
    lowering: [{op: unary, kind: Ceil, in: a0, out: r}]
    result: r
  round:
    kind: scalar
    arity: 1
    tolerance_class: arithmetic
    inputs: [{count: 12, base: -1.5, step: 0.5}]
    lowering: [{op: unary, kind: RoundNearestEven, in: a0, out: r}]
    result: r
  # ── Integer bitwise. etype s64 builds the graph over i64 rather than f32:
  #    bitwise-and of two floats is not a question StableHLO answers, and
  #    rounding an integer through f32 would look exact below 2^24 and stop
  #    being exact above it. ──────────────────────────────────────────────
  bitwise-and:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: 12, step: 1}
      - {count: 12, base: 10, step: 3}
    lowering: [{op: binary, kind: And, lhs: a0, rhs: a1, out: r}]
    result: r
  bitwise-or:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: 12, step: 1}
      - {count: 12, base: 10, step: 3}
    lowering: [{op: binary, kind: Or, lhs: a0, rhs: a1, out: r}]
    result: r
  bitwise-xor:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: 12, step: 1}
      - {count: 12, base: 10, step: 3}
    lowering: [{op: binary, kind: Xor, lhs: a0, rhs: a1, out: r}]
    result: r
  bit-shift-left:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: 3, step: 2}
      - {count: 12, base: 1, step: 0}
    lowering: [{op: binary, kind: ShiftLeft, lhs: a0, rhs: a1, out: r}]
    result: r
  bit-shift-right:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    inputs:
      - {count: 12, base: 12, step: 5}
      - {count: 12, base: 1, step: 0}
    lowering: [{op: binary, kind: ShiftRightArithmetic, lhs: a0, rhs: a1, out: r}]
    result: r
  bitwise-not:
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    inputs: [{count: 12, base: 13, step: 7}]
    lowering: [{op: unary, kind: Not, in: a0, out: r}]
    result: r
  bit-count:
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    inputs: [{count: 12, base: 13, step: 7}]
    lowering: [{op: unary, kind: PopulationCount, in: a0, out: r}]
    result: r
  popcount:
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    inputs: [{count: 12, base: 13, step: 7}]
    lowering: [{op: unary, kind: PopulationCount, in: a0, out: r}]
    result: r
  # ── Integer division. stablehlo.divide truncates toward zero on integers
  #    and stablehlo.remainder takes the dividend's sign, which is exactly
  #    Scheme's quotient/remainder pair. modulo, gcd and lcm are NOT here:
  #    modulo is floor-division and needs a sign-dependent correction, and
  #    gcd/lcm need a bounded stablehlo.while. Both are their own work. ────
  quotient:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    # The dividend must not track the divisor, or every quotient comes out
    # the same. The first inputs written here stepped 17 by 3 against 5 by 1
    # and produced the quotient 3 twelve times over; the degeneracy guard
    # rejected the row, which is what it is for.
    inputs:
      - {count: 12, base: 100, step: -7}
      - {count: 12, base: 3, step: 1}
    lowering: [{op: binary, kind: Divide, lhs: a0, rhs: a1, out: r}]
    result: r
  remainder:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    # The dividend must not track the divisor, or every quotient comes out
    # the same. The first inputs written here stepped 17 by 3 against 5 by 1
    # and produced the quotient 3 twelve times over; the degeneracy guard
    # rejected the row, which is what it is for.
    inputs:
      - {count: 12, base: 100, step: -7}
      - {count: 12, base: 3, step: 1}
    lowering: [{op: binary, kind: Remainder, lhs: a0, rhs: a1, out: r}]
    result: r
  truncate-quotient:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    # The dividend must not track the divisor, or every quotient comes out
    # the same. The first inputs written here stepped 17 by 3 against 5 by 1
    # and produced the quotient 3 twelve times over; the degeneracy guard
    # rejected the row, which is what it is for.
    inputs:
      - {count: 12, base: 100, step: -7}
      - {count: 12, base: 3, step: 1}
    lowering: [{op: binary, kind: Divide, lhs: a0, rhs: a1, out: r}]
    result: r
  truncate-remainder:
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    # The dividend must not track the divisor, or every quotient comes out
    # the same. The first inputs written here stepped 17 by 3 against 5 by 1
    # and produced the quotient 3 twelve times over; the degeneracy guard
    # rejected the row, which is what it is for.
    inputs:
      - {count: 12, base: 100, step: -7}
      - {count: 12, base: 3, step: 1}
    lowering: [{op: binary, kind: Remainder, lhs: a0, rhs: a1, out: r}]
    result: r
  # ── Comparisons and numeric predicates. The host answers #t/#f and the
  #    device answers i1; both are mapped to 1/0, the host with an `if` in
  #    the generated program and the device with a convert. Two different
  #    routes to the same encoding is what keeps the row a comparison of
  #    implementations rather than of spellings. ─────────────────────────
  "<":
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs:
      - {count: 12, base: -5, step: 1}
      - {count: 12, base: 3, step: -1}
    lowering:
      - {op: compare, dir: LT, lhs: a0, rhs: a1, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  "<=":
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs:
      - {count: 12, base: -5, step: 1}
      - {count: 12, base: 3, step: -1}
    lowering:
      - {op: compare, dir: LE, lhs: a0, rhs: a1, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  "=":
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs:
      - {count: 12, base: -5, step: 1}
      - {count: 12, base: 3, step: -1}
    lowering:
      - {op: compare, dir: EQ, lhs: a0, rhs: a1, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  ">":
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs:
      - {count: 12, base: -5, step: 1}
      - {count: 12, base: 3, step: -1}
    lowering:
      - {op: compare, dir: GT, lhs: a0, rhs: a1, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  ">=":
    kind: scalar
    arity: 2
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs:
      - {count: 12, base: -5, step: 1}
      - {count: 12, base: 3, step: -1}
    lowering:
      - {op: compare, dir: GE, lhs: a0, rhs: a1, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  "zero?":
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs: [{count: 12, base: -5, step: 1}]
    lowering:
      - {op: const,   value: 0.0, like: a0, out: zero}
      - {op: compare, dir: EQ, lhs: a0, rhs: zero, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  "positive?":
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs: [{count: 12, base: -5, step: 1}]
    lowering:
      - {op: const,   value: 0.0, like: a0, out: zero}
      - {op: compare, dir: GT, lhs: a0, rhs: zero, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  "negative?":
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs: [{count: 12, base: -5, step: 1}]
    lowering:
      - {op: const,   value: 0.0, like: a0, out: zero}
      - {op: compare, dir: LT, lhs: a0, rhs: zero, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  "even?":
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs: [{count: 12, base: -5, step: 1}]
    lowering:                       # (x rem 2) == 0, or != 0 for odd?
      - {op: const,   value: 2.0, like: a0, out: two}
      - {op: binary,  kind: Remainder, lhs: a0, rhs: two, out: m}
      - {op: const,   value: 0.0, like: a0, out: zero}
      - {op: compare, dir: EQ, lhs: m, rhs: zero, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r
  "odd?":
    kind: scalar
    arity: 1
    etype: s64
    tolerance_class: arithmetic
    reference_wrap: predicate
    inputs: [{count: 12, base: -5, step: 1}]
    lowering:                       # (x rem 2) == 0, or != 0 for odd?
      - {op: const,   value: 2.0, like: a0, out: two}
      - {op: binary,  kind: Remainder, lhs: a0, rhs: two, out: m}
      - {op: const,   value: 0.0, like: a0, out: zero}
      - {op: compare, dir: NE, lhs: m, rhs: zero, out: p}
      - {op: convert, to: s64, in: p, out: r}
    result: r

  # ── The remaining losses. Every formula below was derived from the host's
  #    own answers and then checked against them to full double precision on
  #    soft labels, so the lowering computes the function the language means
  #    rather than the one its name suggests. Two were not what the name
  #    suggests: cross-entropy-loss is a SUM over a log-softmax, not a mean,
  #    and contrastive-loss treats label 1 as DISSIMILAR (its answer is
  #    0.5*max(0, margin - d)^2). Guessing either would have produced a row
  #    that failed for a correct lowering.
  #
  #    All inputs stay inside (0, 1): these take logarithms, and a log of a
  #    non-positive number is a question about NaN handling rather than about
  #    parity. The two operands step at different rates so their difference
  #    varies — with equal steps the elementwise difference is constant and
  #    the distance-based losses would all see the same d.
  #
  #    LIMITATION, stated rather than hidden: the table has no way to pass a
  #    runtime scalar to a lowering, so an entry with extra arguments fixes
  #    them and the lowering hard-codes the matching constants (K=4 and
  #    eps=0.1 for label smoothing, margin 1.0 elsewhere). Both sides use the
  #    same fixed arguments, so the row is a real comparison; it just does
  #    not sweep those parameters. ────────────────────────────────────────
  bce-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: const,  value: 1.0, like: a0, out: one}
      - {op: binary, kind: Subtract, lhs: one, rhs: a0, out: omp}
      - {op: binary, kind: Subtract, lhs: one, rhs: a1, out: omy}
      - {op: unary,  kind: Log, in: a0, out: lp}
      - {op: unary,  kind: Log, in: omp, out: l1p}
      - {op: binary, kind: Multiply, lhs: a1, rhs: lp, out: t1}
      - {op: binary, kind: Multiply, lhs: omy, rhs: l1p, out: t2}
      - {op: binary, kind: Add, lhs: t1, rhs: t2, out: e}
      - {op: reduce, kind: Sum, in: e, axes: [0], out: s}
      - {op: const,  value: 12.0, like: s, out: n}
      - {op: binary, kind: Divide, lhs: s, rhs: n, out: q}
      - {op: unary,  kind: Negate, in: q, out: r}
    result: r
  binary-cross-entropy-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: const,  value: 1.0, like: a0, out: one}
      - {op: binary, kind: Subtract, lhs: one, rhs: a0, out: omp}
      - {op: binary, kind: Subtract, lhs: one, rhs: a1, out: omy}
      - {op: unary,  kind: Log, in: a0, out: lp}
      - {op: unary,  kind: Log, in: omp, out: l1p}
      - {op: binary, kind: Multiply, lhs: a1, rhs: lp, out: t1}
      - {op: binary, kind: Multiply, lhs: omy, rhs: l1p, out: t2}
      - {op: binary, kind: Add, lhs: t1, rhs: t2, out: e}
      - {op: reduce, kind: Sum, in: e, axes: [0], out: s}
      - {op: const,  value: 12.0, like: s, out: n}
      - {op: binary, kind: Divide, lhs: s, rhs: n, out: q}
      - {op: unary,  kind: Negate, in: q, out: r}
    result: r
  # NOT a mean over a plain log. lib/backend/tensor_loss_codegen.cpp:133-134:
  #   "CE = -sum(target * log(softmax(logits)))"
  #   "Numerically stable: CE = -sum(target * (logits - logsumexp(logits)))"
  # It re-normalises its first argument and it SUMS. A mean over log(p) would
  # be a different number for every input.
  cross-entropy-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: unary,  kind: Exp, in: a0, out: ex}
      - {op: reduce, kind: Sum, in: ex, axes: [0], out: se}
      - {op: unary,  kind: Log, in: se, out: lse}
      - {op: broadcast, in: lse, shape: [12], dims: [], out: lseb}
      - {op: binary, kind: Subtract, lhs: a0, rhs: lseb, out: ls}
      - {op: binary, kind: Multiply, lhs: a1, rhs: ls, out: m}
      - {op: reduce, kind: Sum, in: m, axes: [0], out: s}
      - {op: unary,  kind: Negate, in: s, out: r}
    result: r
  kl-div-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: binary, kind: Divide, lhs: a0, rhs: a1, out: ratio}
      - {op: unary,  kind: Log, in: ratio, out: lr}
      - {op: binary, kind: Multiply, lhs: a0, rhs: lr, out: m}
      - {op: reduce, kind: Sum, in: m, axes: [0], out: r}
    result: r
  focal-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: const,  value: 1.0, like: a0, out: one}
      - {op: binary, kind: Subtract, lhs: one, rhs: a0, out: omp}
      - {op: binary, kind: Subtract, lhs: one, rhs: a1, out: omy}
      - {op: binary, kind: Multiply, lhs: a1, rhs: a0, out: t1}
      - {op: binary, kind: Multiply, lhs: omy, rhs: omp, out: t2}
      - {op: binary, kind: Add, lhs: t1, rhs: t2, out: pt}
      - {op: binary, kind: Subtract, lhs: one, rhs: pt, out: ompt}
      - {op: const,  value: 2.0, like: a0, out: two}
      - {op: binary, kind: Power, lhs: ompt, rhs: two, out: w}
      - {op: unary,  kind: Log, in: pt, out: lg}
      - {op: binary, kind: Multiply, lhs: w, rhs: lg, out: e}
      - {op: reduce, kind: Sum, in: e, axes: [0], out: s}
      - {op: const,  value: 12.0, like: s, out: n}
      - {op: binary, kind: Divide, lhs: s, rhs: n, out: q}
      - {op: unary,  kind: Negate, in: q, out: r}
    result: r
  label-smoothing-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    extra_args: "4"
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: unary,  kind: Exp, in: a0, out: ex}
      - {op: reduce, kind: Sum, in: ex, axes: [0], out: se}
      - {op: unary,  kind: Log, in: se, out: lse}
      - {op: broadcast, in: lse, shape: [12], dims: [], out: lseb}
      - {op: binary, kind: Subtract, lhs: a0, rhs: lseb, out: ls}
      - {op: const,  value: 0.9, like: a1, out: keep}
      - {op: binary, kind: Multiply, lhs: a1, rhs: keep, out: ys1}
      - {op: const,  value: 0.025, like: a1, out: spread}
      - {op: binary, kind: Add, lhs: ys1, rhs: spread, out: ys}
      - {op: binary, kind: Multiply, lhs: ys, rhs: ls, out: m}
      - {op: reduce, kind: Sum, in: m, axes: [0], out: s}
      - {op: unary,  kind: Negate, in: s, out: r}
    result: r
  cosine-embedding-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    extra_args: "1.0"
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: binary, kind: Multiply, lhs: a0, rhs: a1, out: pr}
      - {op: reduce, kind: Sum, in: pr, axes: [0], out: dot}
      - {op: binary, kind: Multiply, lhs: a0, rhs: a0, out: p2}
      - {op: reduce, kind: Sum, in: p2, axes: [0], out: sp}
      - {op: unary,  kind: Sqrt, in: sp, out: np}
      - {op: binary, kind: Multiply, lhs: a1, rhs: a1, out: q2}
      - {op: reduce, kind: Sum, in: q2, axes: [0], out: sq}
      - {op: unary,  kind: Sqrt, in: sq, out: nq}
      - {op: binary, kind: Multiply, lhs: np, rhs: nq, out: den}
      - {op: binary, kind: Divide, lhs: dot, rhs: den, out: cs}
      - {op: const,  value: 1.0, like: cs, out: one}
      - {op: binary, kind: Subtract, lhs: one, rhs: cs, out: r}
    result: r
  # Label 1 means DISSIMILAR here, which is the opposite of the convention
  # most references use. lib/backend/tensor_loss_codegen.cpp:1318:
  #   "Args: tensor1, tensor2, labels (0=similar, 1=dissimilar) [, margin]"
  # and lines 1397-1406 build 0.5*((1-y)*d^2 + y*max(0, margin-d)^2). With the
  # label 1.0 passed below only the second term survives, so the answer is
  # 0.5*max(0, margin - d)^2 and not the mean of d^2.
  contrastive-loss:
    kind: tensor
    arity: 2
    tolerance_class: transcendental
    result_shape: scalar
    extra_args: "1.0"
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
    lowering:
      - {op: binary, kind: Subtract, lhs: a0, rhs: a1, out: d}
      - {op: binary, kind: Multiply, lhs: d, rhs: d, out: d2}
      - {op: reduce, kind: Sum, in: d2, axes: [0], out: sd}
      - {op: unary,  kind: Sqrt, in: sd, out: dist}
      - {op: const,  value: 1.0, like: dist, out: margin}
      - {op: binary, kind: Subtract, lhs: margin, rhs: dist, out: m}
      - {op: const,  value: 0.0, like: dist, out: zero}
      - {op: binary, kind: Maximum, lhs: m, rhs: zero, out: mx}
      - {op: binary, kind: Multiply, lhs: mx, rhs: mx, out: sq}
      - {op: const,  value: 0.5, like: dist, out: half}
      - {op: binary, kind: Multiply, lhs: sq, rhs: half, out: r}
    result: r
  triplet-loss:
    kind: tensor
    arity: 3
    tolerance_class: transcendental
    result_shape: scalar
    inputs:
      - {count: 12, base: 0.05, step: 0.07}
      - {count: 12, base: 0.06, step: 0.06}
      - {count: 12, base: 0.9, step: -0.06}
    lowering:
      - {op: binary, kind: Subtract, lhs: a0, rhs: a1, out: dp}
      - {op: binary, kind: Multiply, lhs: dp, rhs: dp, out: dp2}
      - {op: reduce, kind: Sum, in: dp2, axes: [0], out: sp}
      - {op: unary,  kind: Sqrt, in: sp, out: dap}
      - {op: binary, kind: Subtract, lhs: a0, rhs: a2, out: dn}
      - {op: binary, kind: Multiply, lhs: dn, rhs: dn, out: dn2}
      - {op: reduce, kind: Sum, in: dn2, axes: [0], out: sn}
      - {op: unary,  kind: Sqrt, in: sn, out: dan}
      - {op: binary, kind: Subtract, lhs: dap, rhs: dan, out: diff}
      - {op: const,  value: 1.0, like: diff, out: margin}
      - {op: binary, kind: Add, lhs: diff, rhs: margin, out: sm}
      - {op: const,  value: 0.0, like: diff, out: zero}
      - {op: binary, kind: Maximum, lhs: sm, rhs: zero, out: r}
    result: r

  # ── Generators: no operands at all, only literal arguments. The device
  #    side builds them from stablehlo.iota. ─────────────────────────────
  arange:
    kind: tensor
    arity: 0
    extra_args: "12"
    result_len: 12
    tolerance_class: arithmetic
    lowering: [{op: iota, out: r, dim: 0, shape: [12]}]
    result: r

  linspace:
    kind: tensor
    arity: 0
    extra_args: "0.0 1.0 12"
    result_len: 12
    tolerance_class: arithmetic
    # linspace(a, b, n) puts b at the LAST element, so the step is
    # (b - a)/(n - 1) and not (b - a)/n. Getting that wrong is the classic
    # off-by-one here and it shows in every element but the first.
    lowering:
      - {op: iota,   out: i, dim: 0, shape: [12]}
      - {op: const,  value: 0.09090909090909091, like: i, out: step}
      - {op: binary, kind: Multiply, lhs: i, rhs: step, out: r}
    result: r

  ones:
    kind: tensor
    arity: 0
    extra_args: "12"
    result_len: 12
    tolerance_class: arithmetic
    # CONSTANT BY DEFINITION. The degeneracy guard asks whether the reference
    # varies across the inputs, and for a builtin whose whole answer is one
    # repeated value there is nothing to vary — the constancy is the
    # semantics, not a badly chosen input set as it was for `%` and
    # `quotient`. The row still checks that the constant is the right
    # constant and that the length is right, and it prints as the weaker
    # thing it is so no reader mistakes it for a strong row.
    reference_constant: true
    lowering:
      - {op: iota,  out: i, dim: 0, shape: [12]}
      - {op: const, value: 1.0, like: i, out: r}
    result: r

  zeros:
    kind: tensor
    arity: 0
    extra_args: "12"
    result_len: 12
    tolerance_class: arithmetic
    reference_constant: true      # see `ones` above
    lowering:
      - {op: iota,  out: i, dim: 0, shape: [12]}
      - {op: const, value: 0.0, like: i, out: r}
    result: r

  # ── The reshape family. These rearrange without computing, so the SHAPE is
  #    the answer: compared on values alone every one of them would pass for
  #    a lowering that did nothing at all. Each row therefore takes an input
  #    of one rank and asserts a result of another, and the harness compares
  #    the host's shape against the shape declared here. ─────────────────
  flatten:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    input_dims: [3, 4]
    result_dims: [12]
    inputs: [{count: 12, base: 0.5, step: 0.25}]
    lowering: [{op: reshape, in: a0, shape: [12], out: r}]
    result: r

  unsqueeze:
    kind: tensor
    arity: 1
    extra_args: "0"
    tolerance_class: arithmetic
    result_dims: [1, 12]
    inputs: [{count: 12, base: 0.5, step: 0.25}]
    lowering: [{op: reshape, in: a0, shape: [1, 12], out: r}]
    result: r

  squeeze:
    kind: tensor
    arity: 1
    tolerance_class: arithmetic
    input_dims: [1, 12]
    result_dims: [12]
    inputs: [{count: 12, base: 0.5, step: 0.25}]
    lowering: [{op: reshape, in: a0, shape: [12], out: r}]
    result: r

  tensor-reshape:
    kind: tensor
    arity: 1
    extra_args: "3 4"
    tolerance_class: arithmetic
    result_dims: [3, 4]
    inputs: [{count: 12, base: 0.5, step: 0.25}]
    lowering: [{op: reshape, in: a0, shape: [3, 4], out: r}]
    result: r

