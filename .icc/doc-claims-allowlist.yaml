detector_fix_references:
- gap: family-sum misattribution
  detail: When a sentence states an aggregate line count across a list of files (e.g. 'totalling roughly
    N lines across thirteen per-domain *_codegen.cpp modules'), doc-typed-claims binds N to a single file
    (usually the nearest or last-named file in the sentence) instead of recognising the multi-file list
    and either (a) skipping the claim as an aggregate, or (b) checking N against the summed line count
    of every named file.
  affected_count: 13
- gap: cross-repo citation
  detail: doc-typed-claims has no notion of a document that deliberately cites another repository's files
    (design RFCs written against a dependency's source tree). Every non-indexed file_path claim is scored
    'wrong' regardless of whether the document states its cross-repo scope up front. A fix would let a
    doc declare its external repos (front-matter or an inline marker) and skip grounding for citations
    under those roots.
  affected_count: 52
- gap: ambiguous duplicate basename
  detail: 'Bare filename citations (no directory) fail to resolve to ''wrong'' when two or more files
    share a basename anywhere in the tree, even when the surrounding document (an ADR''s own Scope: line,
    here) disambiguates which one is meant. Fixed at the doc level in this pass by qualifying the citations
    with their directory; a detector fix would prefer a directory named in the same document''s front-matter/Scope
    before giving up.'
  affected_count: 0
- gap: estimate-vs-current-size claim-type confusion
  detail: Prose estimating the size of code YET TO BE WRITTEN ('llvm_codegen.cpp additions (~4,000 lines)'
    inside a 'Total estimated implementation' proposal) is parsed as a claim about the file's CURRENT
    total line count. A fix would recognise 'additions'/'extensions'/'estimated' qualifiers and either
    skip the claim or classify it as a distinct claim_type (e.g. 'estimated_addition') that current-size
    grounding does not apply to.
  affected_count: 3
- gap: per-release delta vs current-total confusion
  detail: 'Prose describing how many lines a SPECIFIC PAST RELEASE added (''v1.3.1-evolve added ... documentation
    ... under inc/eshkol/ (~4,650 lines)'') is parsed as a claim about inc/eshkol/''s current total size.
    Same class of fix as the estimate-vs-current-size gap: a claim scoped by a named past version should
    not be checked against present-day totals.'
  affected_count: 2
- gap: illustrative/hypothetical example read as a file citation
  detail: Prose using a made-up filename to illustrate a bug ('for a 3-line entry file requiring a module,
    the reported location was entry.esk:6:13') is parsed as a real file_path claim. A fix would recognise
    the illustrative framing ('For a 3-line X file...', 'the reported location was') or require the cited
    file to appear elsewhere in the document as a real artifact.
  affected_count: 1
- gap: rhetorical line-count phrasing read as a LOC claim
  detail: '''in N lines using X'' as a description of algorithmic conciseness is parsed as a total-file-line-count
    claim, even when the same document''s explicit LOC column states the correct total two words later.'
  affected_count: 1
