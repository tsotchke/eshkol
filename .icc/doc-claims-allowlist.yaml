description: 'Allowlist for icc doc-typed-claims ''wrong'' findings that are not real documentation defects.
  Consumed by the doc-typed-claims-residual release-oracle criterion: final_wrong_count MUST equal len(entries)
  here plus any open build-item count, with zero unexplained remainder. Each entry names the exact claim_id
  (stable hash from the icc doc-typed-claims JSON output) plus path:line so a re-run can be cross-checked
  without re-deriving the reasoning. Two dispositions live here: EXEMPT-HISTORICAL (a dated CHANGELOG/RELEASE_NOTES/ROADMAP-[x]/dated-report
  row describing a past point-in-time fact, correct as written, now superseded by later code changes)
  and DETECTOR-MISATTRIBUTION (the underlying doc text is accurate but icc doc-typed-claims bound the
  wrong subject file to a numeric/file_path claim -- see reason for the specific detector gap).'
