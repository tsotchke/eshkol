  # GPU-vs-GPU diff — blind to three CRT defects (fixed 2026-07-17):
  #   A) modulus product P overflowed __int128 for N>16 -> NaN/garbage,
  #   B) adaptive-N minimised precision -> truncated fractional inputs,
  #   C) the input-scaling exponent E dropped the frac_A/frac_B terms the
  #      CRT uniqueness bound requires.
  # tests/gpu/ozaki_correctness_gate.sh drives the real Metal Ozaki kernel
  # against an independent in-process CPU f64 reference across integer /
  # fractional / pi-e / wide-magnitude regimes at K up to 4096, and asserts
  # the default (fixed N=16) and adaptive paths are bit-exact and that an
  # out-of-range moduli request fails loudly instead of returning garbage.
  # Metal-only + real-GPU-only, so it SKIPS (no trace) on GPU-less hosts.
  # ─────────────────────────────────────────────────────────────────
  - name: ozaki-ii-correctness
    aliases: [ozaki-correctness, ozaki-ii, p-ozaki-correctness]
    requires:
      - runtime_event:
          event_kinds: [ozaki_correctness]
          event_names: ["ozaki_correctness_gate"]
          event_values: ["PASS"]
        severity: high
        label: Ozaki-II CRT exact DGEMM (shipped fixed N=16) is bit-exact vs an independent CPU f64 reference across integer/fractional/pi-e/wide-magnitude regimes at K<=4096, with out-of-range moduli clamped loudly and opt-in adaptive free of gross CRT error
        action: ./tests/gpu/ozaki_correctness_gate.sh

  # Ozaki-II certification. This gate validates a deterministic integer witness
  # on real Metal fixed-N16 dispatch, sampling 512x512 output tiles and checking
  # every sample against an independent native-i128 reference with signed
  # magnitude < 2^58. It also explicitly requires both cached JIT and AOT execution to pass,
  # verifies Apple Accelerate disagrees with the identical witness on at least one
  # sampled output, and asserts no CPU fallback path was used.
  # ─────────────────────────────────────────────────────────────────
  - name: ozaki-certification
    aliases: [ozaki-exact-reference, exact-reference-certification, p-ozaki-certification]
    requires:
      - runtime_event:
          event_kinds: [ozaki_certification]
          event_names: ["ozaki_certification_gate"]
          event_values: ["PASS"]
        severity: high
        label: Metal fixed-N16 exact Ozaki dispatch certification checks that every sampled deterministic 512x512 integer-witness output matches an independent native-i128 reference with signed magnitude < 2^58, where the native-i128 reference is converted to correctly rounded f64 before equality comparison, that both cached JIT and AOT execute successfully, that Apple Accelerate on the identical witness disagrees on at least one sampled output, and that no CPU fallback path is used
        action: ./tests/gpu/ozaki_certification_gate.sh
        # Also driven by scripts/run_gpu_tests.sh (hence run_all_tests.sh's `gpu`
        # suite) whenever a real GPU device is present; on a GPU-less host that
        # suite prints a LOUD skip and this criterion correctly stays evidence-less
        # rather than green. No hosted CI runner has a GPU — see
        # .github/workflows/gpu-execution-gate.yml.

  # ─────────────────────────────────────────────────────────────────
  # INT8 tensor-core Ozaki f64 GEMM (CUDA, opt-in). Recovers FP64-accurate
  # C = A*B from the INT8 (IMMA) tensor cores via per-row/col-scaled 7-bit
  # integer slicing + diagonal-fused int32 reconstruction — measured 4.74
  # TFLOP/s-eq (8.8x native cublasDgemm) at full f64 on an RTX 3090, ~30 TF
  # (20x native f64) on RTX PRO 6000 Blackwell. Opt-in via
  # ESHKOL_CUDA_F64_KERNEL=ozaki-int8; the accuracy/throughput knob is
  # ESHKOL_OZAKI_CUDA_T (default 6 = full f64, T=4 ~1e-11). Guarded K<133000
  # for int32 exactness (loud fallback to cublasDgemm out of range).
  # tests/gpu/cuda_ozaki_correctness_gate.sh drives the real CUDA kernel vs an
  # independent in-process CPU f64 reference across integer / fractional / pi-e /
  # wide-magnitude regimes at K up to 4096, asserting T=6 is machine-precision
  # (normwise < 1e-9), T=4 correct, and the out-of-range knob clamps loudly and
  # stays correct. CUDA-only + real-GPU-only, so it SKIPS (no trace) on Metal or
  # GPU-less hosts.
  # ─────────────────────────────────────────────────────────────────
  - name: cuda-ozaki-int8-correctness
    aliases: [cuda-ozaki-correctness, cuda-ozaki-int8, int8-ozaki, p-cuda-ozaki-correctness]
    requires:
      - runtime_event:
          event_kinds: [cuda_ozaki_correctness]
          event_names: ["cuda_ozaki_correctness_gate"]
          event_values: ["PASS"]
        severity: high
        label: INT8 tensor-core Ozaki f64 GEMM (CUDA, opt-in ESHKOL_CUDA_F64_KERNEL=ozaki-int8) recovers full f64 (normwise < 1e-9 at T=6) vs an independent CPU f64 reference across integer/fractional/pi-e/wide-magnitude regimes at K<=4096, with the T=4 fast tier correct and the out-of-range accuracy knob clamped loudly
        action: ./tests/gpu/cuda_ozaki_correctness_gate.sh
  # Ozaki-II REDUCED-PRECISION fast tier (opt-in). ESHKOL_SF64_KERNEL=
  # ozaki-fast selects a fully-GPU pipeline: GPU residue split + df32
  # CRT reconstruction over FEWER moduli (the accuracy knob), which
  # eliminates the exact tier's O(num_moduli·N^2) CPU reconstruction.
  # Being reduced precision, it is gated at the documented ~1e-8 bound
  # (rel err <= 1e-7 across the same four regimes), NOT bit-exactness —
  # and the gate also asserts the fast path genuinely engages (marker +
  # no silent fallback to the exact tier). The DEFAULT path is untouched
  # and stays covered by ozaki-ii-correctness above. Metal-only; SKIPS
  # (no trace) on GPU-less hosts.
  # ─────────────────────────────────────────────────────────────────
  - name: ozaki-ii-fast
    aliases: [ozaki-fast, ozaki-fast-tier, p-ozaki-fast]
    requires:
      - runtime_event:
          event_kinds: [ozaki_fast]
          event_names: ["ozaki_fast_gate"]
          event_values: ["PASS"]
        severity: high
        label: Ozaki-II reduced-precision fast tier (opt-in ozaki-fast, GPU residue split + df32 CRT reconstruction) is within the documented ~1e-8 bound (rel err <= 1e-7) across integer/fractional/pi-e/wide-magnitude regimes at K<=4096, with the fully-GPU fast path verified to engage (no silent fallback to the exact tier)
        action: ./tests/gpu/ozaki_fast_gate.sh

  # ─────────────────────────────────────────────────────────────────
  # v1.3.4 DYNAMIC EDGE COVERAGE — one criterion per new-surface family the
  # v1.3.4 wave added. Driven by scripts/gen_edge_v134.py (bounded, seeded,
  # depth-parametric) and scripts/run_edge_coverage_v134.sh, which runs every
  # generated self-checking probe across the execution axes (JIT / AOT-O2 /
  # AOT-O0, plus the bytecode VM for VM-capable families: i128 differential
  # native-vs-VM, adtape VM-only) and emits kind:"edge_coverage" events into
  # scripts/icc_traces/edge_coverage_v134.jsonl. A family gate is PASS iff every
  # generated probe for that family passed on every axis it runs on.
  #
  # STAGED (not gated here, pending surface landing — see the branch report):
  #   * roundtrip  number->string . string->number identity — needs the
  #     shortest-round-trip printer (number->string is still %g-lossy on master).
  #   * matmul on the VM — the VM registers only flat arity-2 tensor-ref /
  #     arity-3 tensor-set! / arity-2 reshape / arity-1 arange, so multi-dim
  #     tensor parity is native-only until VM tensor parity lands. matmul IS
  #     gated on the native axes.
  # ─────────────────────────────────────────────────────────────────
  - name: v1.3.4-edge-coverage
    aliases: [edge-coverage-v134, v134-edge, dynamic-edge-v134]
    requires:
      - runtime_event:
          event_kinds: [edge_coverage]
          event_names: ["edge_v134_nursery_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Nursery iter-scope (ESH-0214e): guard-wrapped mutating self-tail/named-let loops compute exact checksums while each of the six barrier channels (hash-table-set!, vector-set!, set-car!, set-cdr!, string-set!, bytevector-u8-set!) promotes its persistent-mutation escapee — swept over escape-set size {1,4,16,64} and nested-loop depth 1..N; verified on JIT + AOT-O0 + AOT-O2'
        action: ./scripts/run_edge_coverage_v134.sh
      - runtime_event:
          event_kinds: [edge_coverage]
          event_names: ["edge_v134_parallel_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'parallel-map / parallel-execute (#331): capturing closures returning collections are value-correct swept over n at the pool threshold {1,4,15,16,17,64,500}, over nested-list/string/#f closure shapes, over scope-op-heavy (memv + internal named-let) workers, and over parallel-map nesting depth 1..N; verified on JIT + AOT'
        action: ./scripts/run_edge_coverage_v134.sh
      - runtime_event:
          event_kinds: [edge_coverage]
          event_names: ["edge_v134_gradient_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Exact gradient through a callable parameter + curried form (#330): a wrapped/annotated arity-2..5 scalar loss is byte-identical to the direct (gradient f point) call; the arity-1 tensor-loss path, list-vs-vector points, non-polynomial compositions, gradient-in-loop repetition, and gradient-composition depth 1..N all agree with the analytic gradient; verified on JIT + AOT'
        action: ./scripts/run_edge_coverage_v134.sh
      - runtime_event:
          event_kinds: [edge_coverage]
          event_names: ["edge_v134_i128_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Native 128-bit integer (#314): boundary constructors/round-trip, two''s-complement wraparound at +-2^127 (add/sub/mul/neg, min*min), conversion edges, and arithmetic-chain depth 1..N match a Python-computed wrapping reference — DIFFERENTIAL native-vs-VM agreement (the guard-based out-of-range conversions probe is native-only)'
        action: ./scripts/run_edge_coverage_v134.sh
      - runtime_event:
          event_kinds: [edge_coverage]
          event_names: ["edge_v134_matmul_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Tensor/matmul (native): arange arities, matmul from reshape/arange literals vs an independent product reference, and multi-dim tensor-ref/tensor-set! round-trip are value-correct on JIT + AOT-O0 + AOT-O2 (VM parity for multi-dim tensors is staged — see report)'
        action: ./scripts/run_edge_coverage_v134.sh
      - runtime_event:
          event_kinds: [edge_coverage]
          event_names: ["edge_v134_adtape_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Low-level ad-tape / ad-pow (VM): ad-pow with fractional/negative/zero exponents matches value + analytic gradient, tape reuse across new/release cycles is stable, and the >1024-node growth boundary preserves the forward value and gradient — VM-only surface (ad-pow/ad-tape-length are not registered in the native backend)'
        action: ./scripts/run_edge_coverage_v134.sh
      - runtime_event:
          event_kinds: [edge_coverage]
          event_names: ["edge_v134_sweep_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'v1.3.4 edge-coverage sweep is clean: every generated probe across every applicable execution axis (JIT / AOT-O0 / AOT-O2 / VM) passed, with no native-vs-VM differential divergence'
        action: ./scripts/run_edge_coverage_v134.sh

  # ─────────────────────────────────────────────────────────────────
  # WASM execute-and-diff. Closes the WASM-correctness cell: prior CI
  # only asserted a produced .wasm is a valid binary (magic bytes) —
  # nothing EXECUTED Eshkol-compiled WASM and diffed its output against
  # native. scripts/run_wasm_differential.sh builds the bytecode VM to
  # WebAssembly (Emscripten, from lib/backend/vm_wasm_repl.c — the same
  # module that powers the browser REPL, whose C display/number-format
  # code IS what runs in WASM), executes each program of the VM-supported
  # subset (tests/vm_parity/corpus) under node via its run_program export,
  # and byte-diffs the captured stdout against native `eshkol-run -r`
  # (vm-parity newline normalization; float text compared RAW). Over that
  # subset native codegen == native VM, so any wasm value divergence
  # isolates the WASM compilation. Writes kind:"wasm_parity" events to
  # scripts/icc_traces/wasm_parity.jsonl.
  # ─────────────────────────────────────────────────────────────────
  - name: wasm-execute-diff
    aliases: [wasm_parity, wasm-parity, wasm-execute-parity, wasm-correctness]
    requires:
      - runtime_event:
          event_kinds: [wasm_parity]
          event_names: ["wasm_parity_gate"]
          event_values: ["PASS"]
        severity: high
        label: WASM execute-and-diff gate (Eshkol-compiled WASM output byte-matches native `eshkol-run -r` on the VM-supported subset; out-of-subset programs fail cleanly / are excluded with reasons)
        action: ./scripts/run_wasm_differential.sh
