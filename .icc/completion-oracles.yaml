          event_names: ["v14_udp_roundtrip"]
          event_values: ["PASS"]
        severity: high
        label: 'UDP sockets (#161): bind/sendto/recvfrom — NOT YET IMPLEMENTED (no udp-socket/udp-bind primitive exists anywhere in lib/, inc/, or tests/)'
        action: run_v14_connection_gate

