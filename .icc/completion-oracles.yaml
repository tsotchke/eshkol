  # ─────────────────────────────────────────────────────────────────
  # v1.3-evolve readiness — tracks the v1.3 roadmap items in
  # ROADMAP.md.  Mirrors the v1.2 oracle's shape: each line item that
  # has a source-tree contract gets a runtime_event probe via
  # scripts/run_icc_smoke.sh.  Shipped items must emit PASS; planned
  # items may remain as explicit FAIL probes until their implementation
  # lands.
  #
  # The three "[x]" items already in v1.3-evolve (string interpolation,
  # named keyword arguments, let-match) get smoke probes that pin
  # their behavior so a regression downstream surfaces immediately.
  #
  # ENFORCEMENT (ADR-0010, closes AR1 gap A5): this target is now
  # release-blocking. .github/workflows/release.yml::release-readiness-gate
  # regenerates traces at the tagged SHA and fails the release on any verdict
  # but ready/100 from `icc readiness --target v1.3-evolve`. Adding a criterion
  # below therefore hard-gates publication: keep planned/unlanded items as
  # explicit FAIL probes, never as new required criteria without evidence, or
  # the release self-blocks.
  # ─────────────────────────────────────────────────────────────────
  - name: v1.3-evolve
    aliases: [v1.3, release-1.3, evolve]
    requires:
      # The release-line mirror of the compiler-readiness silent-wrong gate.
      # A v1.3.x tag is a promise to consumers about answers, not about
      # features, so the flaw ledger gates the release target too. See the
      # long comment on the same criterion in eshkol-compiler-readiness.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["no_open_silent_wrong"]
          event_values: ["PASS"]
        severity: high
        label: 'No open, unwaived SILENT-WRONG flaw ships in the v1.3 line (.icc/silent-wrong-ledger.yaml graded by scripts/gate_no_silent_wrong.py; fails closed)'
        action: python3 scripts/gate_no_silent_wrong.py

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["string_interpolation_works"]
          event_values: ["PASS"]
        severity: high
        label: '"…~{expr}…" parses and evaluates the embedded expression'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["keyword_args_work"]
          event_values: ["PASS"]
        severity: high
        label: '(f #:k v) bind by name and reorder freely'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["let_match_destructures"]
          event_values: ["PASS"]
        severity: high
        label: '(let-match (((list a b) (list 1 2))) …) destructures and binds'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["define_loop_flat_rss_aot"]
          event_values: ["PASS"]
        severity: high
        label: 'ESH-0214b v1.3.1: AOT guard-wrapped define loop stays under the 200MB flat-RSS ceiling'
        action: ./scripts/run_icc_smoke.sh

      # ESH-0214e: closes the ESH-0214 series. ESH-0214b's automatic
      # per-iteration reclamation was all-or-nothing — it rejected any loop body
      # that mutated persistent state, so a resident tick loop that mutates every
      # tick got NO reclamation and leaked one tick's transient garbage forever.
      # ESH-0214e lowers a mutating-but-escape-safe loop with a per-loop nursery
      # region that reuses the 48h-validated with-region deep-promotion path: the
      # write barrier promotes each persistent-mutation escapee out of the
      # nursery, the loop-carried out-values are promoted at each back edge, then
      # the nursery is reset. The gate compiles the tick loop AOT (flat RSS +
      # correct read-back of KB/workspace/list), re-runs it under
      # ESHKOL_ARENA_POISON=1 (a missed escapee crashes at 0xCB.. instead of
      # reading recycled memory), checks the JIT path, and A/Bs against the
      # explicit with-region twin.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["iter_scope_partial_reclaim"]
          event_values: ["PASS"]
        severity: high
        label: 'ESH-0214e: resident tick loop that mutates persistent state every tick (hash-table-set!/vector-set!/set-cdr!) reclaims transient garbage automatically via a nursery region — AOT flat RSS, correct read-back, clean under ESHKOL_ARENA_POISON=1, within 10x of the with-region baseline'
        action: ./scripts/run_icc_smoke.sh

      # #341 user-reachable region handles. The automatic nursery above cannot
      # help an AD training step: its static escape analysis disqualifies any
      # loop body containing a gradient/derivative op, a set! or a tensor-set!,
      # and a training step trips all three (by design — the nursery targets
      # pure or structurally-mutating tick loops). region-open / region-close
      # give the SAME region machinery a non-lexical surface. The gate requires
      # flat peak RSS across step counts on a 161-parameter MLP doing a
      # full-batch gradient per step, trained parameters bit-identical to both
      # the unscoped baseline and the with-region twin, and the whole misuse
      # matrix (double close, use-after-close, out-of-order cascade, fabricated
      # tokens, raise + call/cc unwind crossing an open handle, slot reuse,
      # never-closed) clean on AOT and JIT under ESHKOL_ARENA_POISON=1.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["region_handle_scoped_reclamation"]
          event_values: ["PASS"]
        severity: high
        label: '#341: user-reachable region handles (region-open / region-close / region-open?) keep an AD training loop flat with identical numerics, and every misuse is a clean catchable error or a defined cascade — never a dangling pointer'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["reader_fuzz_smoke"]
          event_values: ["PASS"]
        severity: high
        label: 'v1.3.1 iterative reader (runtime_reader_hosted.cpp): seeded adversarial fuzz harness finds no crash/hang, depth guard degrades gracefully'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["define_library_import_works"]
          event_values: ["PASS"]
        severity: high
        label: '(define-library …) + (import …) round-trip works in a single file'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["matmul_kernel_grad_nonzero"]
          event_values: ["PASS"]
        severity: high
        label: 'gradient flows through tensor-matmul to the kernel (input2) side'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_input2_conv2d_grad_works"]
          event_values: ["PASS"]
        severity: high
        label: 'gradient flows through conv2d to the kernel operand (literal-form scalar path only; full first-class + vector coverage is tensor_input2_grad_exact_firstclass_and_vector)'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_input2_batchnorm_grad_works"]
          event_values: ["PASS"]
        severity: high
        label: 'gradient flows through batch-norm to the gamma operand (literal-form scalar path only; full first-class + vector coverage is tensor_input2_grad_exact_firstclass_and_vector)'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_input2_layernorm_grad_works"]
          event_values: ["PASS"]
        severity: high
        label: 'gradient flows through layer-norm to the gamma operand (literal-form scalar path only; full first-class + vector coverage is tensor_input2_grad_exact_firstclass_and_vector)'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_input2_attention_grad_works"]
          event_values: ["PASS"]
        severity: high
        label: 'gradient flows through scaled-dot-attention to K/V operands (literal-form scalar path only; full first-class + vector coverage is tensor_input2_grad_exact_firstclass_and_vector)'
        action: ./scripts/run_icc_smoke.sh

      # -- arbitrary-order AD Taylor-tower v1.3 track --
      - runtime_event:
          event_kinds: [ad_depth]
          event_names: ["ad_taylor_p1_runtime_tower"]
          event_values: ["PASS"]
        severity: high
        label: 'P1 runtime Taylor tower: derivative^d passes to d=8 and closes ESH-0118'
        action: ./scripts/run_ad_depth.sh

      - runtime_event:
          event_kinds: [mono_equiv]
          event_names: ["ad_taylor_p2_monomorphization"]
          event_values: ["PASS"]
        severity: high
        label: 'P2 compile-time-K monomorphized towers match runtime towers bit-exactly'
        action: run_mono_equiv_ad_taylor_gate

      - runtime_event:
          event_kinds: [mono_equiv]
          event_names: ["ad_taylor_p3_jet8_subsumed"]
          event_values: ["PASS"]
        severity: high
        label: 'P3 JET8 route is subsumed by tagged Taylor towers without regression'
        action: run_mono_equiv_ad_taylor_gate

      # severity: high (F19 false-green sweep): measured cache-correctness
      # behaviour (hit + invalidate-on-edit), not fixture bookkeeping.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["jit_cache_hit_invalidates"]
          event_values: ["PASS"]
        severity: high
        label: 'eshkol-run -r persistent cache hits and source edits invalidate'
        action: ./scripts/run_icc_smoke.sh

      # severity: high (F19 false-green sweep): asserts a real platform code
      # path executed rather than a bundled fallback — the same
      # real-vs-fake-implementation claim already raised for stdlib-ready's
      # no_stubbed_paths criterion.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["native_image_io_no_stb"]
          event_values: ["PASS"]
        severity: high
        label: 'image-read uses platform APIs, not bundled deps/stb'
        action: ./scripts/run_icc_smoke.sh

      # severity: high (F19 false-green sweep): measured behaviour (the PGO
      # pipeline actually produces a working profile-guided binary), not
      # fixture bookkeeping.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["pgo_pipeline_works"]
          event_values: ["PASS"]
        severity: high
        label: 'cmake -DESHKOL_PGO=generate/use supports a profile-guided binary'
        action: ./scripts/run_icc_smoke.sh

      # ── depth-campaign + P7 pillar gates (v1.3-evolve expanded contract) ──
      # Each now-merged adversarial pillar must have recorded a PASS in its
      # own oracle-run trace for the release to be ready. These mirror the
      # standalone pillar oracles (recursion-depth, ad-depth, numeric-depth,
      # metaprog-depth, metamorphic-laws, sanitizer-fuzz-clean, depth-coverage)
      # and fold them into the release readiness contract.
      - runtime_event:
          event_kinds: [depth_coverage]
          event_names: ["depth_coverage_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Depth-coverage auditor: every composable construct has a registered sweep or tracked gap'
        action: python3 scripts/check_depth_coverage.py
      - runtime_event:
          event_kinds: [recursion_depth]
          event_names: ["recursion_depth_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Recursion/control depth sweep: no silent crash, no wrong value at any tested depth (-r and AOT)'
        action: ./scripts/run_recursion_depth.sh
      - runtime_event:
          event_kinds: [ad_depth]
          event_names: ["ad_depth_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Depth-parametric AD oracle: no construct regresses below its baseline max-correct-depth (-r and AOT)'
        action: ./scripts/run_ad_depth.sh
      - runtime_event:
          event_kinds: [numeric_depth]
          event_names: ["numeric_depth_sweep_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Numeric-tower depth sweep clean vs baseline (no new silent-wrong, no regressed max-correct-n)'
        action: python3 scripts/gen_numeric_depth.py && ./scripts/run_numeric_depth.sh
      - runtime_event:
          event_kinds: [metaprog_depth]
          event_names: ["metaprog_depth_sweep_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'No metaprogramming/module family produces a WRONG value at any swept depth'
        action: ./scripts/run_metaprog_depth.sh
      - runtime_event:
          event_kinds: [nesting_depth]
          event_names: ["nesting_depth_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Syntax/data nesting-depth sweep: no silent wrong value, no -r/AOT-O0/AOT-O2 divergence at any nested depth'
        action: ./scripts/run_nesting_depth.sh
      - runtime_event:
          event_kinds: [metamorphic]
          event_names: ["metamorphic_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Deterministic metamorphic law corpus passes with only tracked XKNOWN violations'
        action: ./scripts/run_metamorphic.sh
      - runtime_event:
          event_kinds: [sanitizer_fuzz]
          event_names: ["sanitizer_fuzz_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Full ASan+UBSan fuzz/tests corpus has zero sanitizer signatures'
        action: ./scripts/run_sanitizer_fuzz.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["printer_roundtrip_oracle"]
          event_values: ["PASS"]
        severity: high
        label: '#310: number->string / display emit the shortest decimal that reads back to the exact same double (no 6-sig-fig truncation); integral doubles keep the no-".0" form; byte-identical across JIT, AOT and VM'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["pipe_symbol_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'R7RS 7.1.1 vertical-line symbols: |weird sym| reads as one symbol (full <symbol element> alphabet incl. \x<hex>;), |.| is distinct from the bare dotted-pair delimiter, write emits bars iff the name cannot be spelled bare, display never bars, write->read recovers an eq? symbol -- byte-identical across JIT, AOT and VM'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["edge_v134_dynamic_coverage"]
          event_values: ["PASS"]
        severity: high
        label: 'v1.3.4 dynamic edge coverage: the seeded, bounded, depth-parametric generator (scripts/gen_edge_v134.py) exercises every new-surface family — nursery iter-scope (6 barrier channels), capturing parallel-map/parallel-execute, exact gradient-through-callable + curried, native i128 wraparound (differential native-vs-VM), native matmul, and VM ad-pow/ad-tape — green across JIT/AOT-O0/AOT-O2/VM with no native-vs-VM divergence (full per-family gates in the v1.3.4-edge-coverage oracle)'
        action: ./scripts/run_icc_smoke.sh

      - test_evidence: true
        severity: high
        label: 'v1.3 edge-case tests are indexed and runnable'
        action: cd build && cmake --build . && ctest -R v1_3

      - no_contract_gap:
          - missing_expected_contract_kind
          - flag_without_contract
        severity: high
        label: 'All v1.3 features have wired contracts (plan ↔ test ↔ runtime)'
        action: regenerate_contract_graph

      - no_stubbed_paths:
          - production_fallback
          - synthetic_model_only
        severity: high
        label: 'No silent fallbacks or synthetic implementations in v1.3 production paths'
        action: classify_or_replace_each_stub

  # -----------------------------------------------------------------
  # v1.3.5-evolve -- release-machinery finding B1 (2026-08-26 audit).
  # v1.3-evolve grades the v1.3.x line; nothing gave "all of v1.3.5" a
  # machine representation, so a v1.3.5 tag had no readiness target of
  # its own to certify against. Criteria enumerate this release's actual
  # scope as recorded in CHANGELOG.md's [Unreleased] section at the time
  # this target was authored (verified against origin/release/v135-cut),
  # each bound to a real, already-committed gate/script/ctest name rather
  # than a fabricated PASS -- the same discipline the v1.4-connection
  # placeholder fix (#467) established after it shipped with one
  # criterion nothing in the repo ever emitted. Several criteria are
  # intentionally the SAME runtime_event already graded under
  # eshkol-compiler-readiness / v1.3-evolve / adr0000-s1-identity: this
  # target is a release-scoped VIEW over those probes, not a second
  # independent implementation of them. Extend this target's `requires`
  # list as each additional v1.3.5 PR lands, rather than opening a
  # second v1.3.5 target -- one target, one truth, same convention as
  # v1.3-evolve.
  # -----------------------------------------------------------------
  - name: v1.3.5-evolve
    aliases: [v1.3.5, release-1.3.5]
    requires:
      # ADR-0000 Stage 1 phase A: the frontend node-identity substrate.
      # Same probes as the adr0000-s1-identity target (duplicated here
      # deliberately -- see the target-level comment above).
      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["node_identity_substrate_present"]
          event_values: ["PASS"]
        severity: high
        label: 'The NodeId -> SourceSpan substrate exists and is consumed: the parser mints ids and a real consumer resolves locations through them'
        action: python3 scripts/run_node_identity_gate.py

      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["node_identity_span_coverage"]
          event_values: ["PASS"]
        severity: high
        label: Substrate span coverage at the codegen dispatcher holds its monotonic floor (resolved/queried, measured on a mixed corpus)
        action: python3 scripts/run_node_identity_gate.py

      # SW-14 flagship: the bytecode VM's Stage-1 OALR region evacuator.
      # tests/memory/vm_region_flat_rss_test.sh requires a flat RSS curve
      # across iteration counts AND the on/off separation AND identical
      # printed output either way -- a gate that can fail on any of the
      # three axes, not a liveness smoke test.
      - test_evidence: true
        severity: high
        label: 'Bytecode VM Stage-1 region evacuator: with-region reclaims on the VM heap with a flat RSS curve across iteration counts, matching output with ESHKOL_VM_REGION_EVAC on and off'
        action: cd build && cmake --build . && ctest -R vm_region_flat_rss

      - test_evidence: true
        severity: high
        label: 'Bytecode VM Stage-1 region evacuator classifies the full heap-tag space (28 HeapType members + geometric-tag extensions); a compile-time span check and a startup fatal-check guard every row is filled in'
        action: cd build && cmake --build . && ctest -R vm_region_evac_subtype_coverage

      # #471: linear Qubit violations are compile-time errors, not warnings.
      - test_evidence: true
        severity: high
        label: 'Cloning a linear Qubit is a compile-time error that exits nonzero and writes no artifact in default compilation mode (previously a warning with exit 0); measured against 24 shapes'
        action: cd build && cmake --build . && ctest -R qubit_linearity_engine_parity_gate

      # #474/SW-47: the no-finite-differences AD guarantee is enforced
      # (the FD counter had zero callers, so every green assertion was
      # true by construction), plus #487's structural carrier gate that
      # re-derives each AD op's carrier from the actual case body rather
      # than trusting a declaration -- the exact gap that let op:GRADIENT
      # be promoted on an undeclared VM-private carrier (SW-52).
      - test_evidence: true
        severity: high
        label: 'ad-note-finite-difference! counter is live on native and VM; run_ad_exactness_gate.sh proves both a positive case and a negative control (a planted difference quotient) are caught on JIT, AOT and the VM'
        action: ./scripts/run_ad_exactness_gate.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_carrier_model_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every AD operator declares its differentiation carrier in .icc/ad-carrier-manifest.yaml, re-derived from the actual case body rather than believed (scripts/gate_ad_shared_node_model.py)'
        action: python3 scripts/gate_ad_shared_node_model.py

      # #483/#478, ADR-0006 S3 / ADR-0000 Stage 4: mutual tail recursion
      # in every tail-position spelling, and the tail-transfer dispatcher
      # that keeps differing-signature and non-AArch64 mutual tail calls
      # bounded (100,000,000 hops measured at 9.1 MB peak RSS).
      - test_evidence: true
        severity: high
        label: 'Mutual tail recursion through cond/case/when/and/or is as wide as isInTailPosition; the tail-transfer dispatcher bounds differing-call-signature and non-AArch64 mutual tail calls (previously SIGBUS at ~5,000,000 hops)'
        action: cd build && cmake --build . && ctest -R tail_transfer

      - test_evidence: true
        severity: high
        label: 'OALR ABI v2 phase A groundwork and the runtime closure-upvalue capacity match the compiler constant again (MAX_UPVALUES vs. the runtime closure representation; #457, 17-32-upvalue procedures previously silently clamped and corrupted an unrelated later define)'
        action: cd build && cmake --build . && ctest -R closure_upvalue_capacity_overflow_gate

      - test_evidence: true
        severity: high
        label: 'Object ABI migration stage 0: the header-layout inventory ratchets against .icc/abi-header-baseline.json (new dependent sites fail the build) and the link-time ABI fingerprint guard + layout-pin test hold (#488, ADR-0012)'
        action: python3 scripts/abi_header_inventory.py && cd build && cmake --build . && ctest -R abi_layout_pin_test

      # #486: the leak-detection lane could not fail (LSan ran, found
      # leaks, printed them, and exited 0 regardless); four real JIT/
      # driver leaks fixed once it could.
      - test_evidence: true
        severity: high
        label: 'LeakSanitizer failure path is live end to end (__lsan_default_options no longer forces exitcode=0; the REPL calls __lsan_do_leak_check() before _Exit); every leak the now-live lane found is fixed'
        action: ASAN_OPTIONS=detect_leaks=1 LSAN_OPTIONS= ./scripts/run_sanitizer_fuzz.sh --quick

      # #480: gensym reachable on every engine (native JIT/AOT + VM),
      # previously wired into no dispatch table anywhere.
      - test_evidence: true
        severity: high
        label: 'gensym is dispatched on native JIT/AOT and the bytecode VM (fid / VM builtin id 2227), not merely defined in a module the slim runtime archive never links'
        action: cd build && cmake --build . && ctest -R gensym

      # Assurance waves 1 and 2 (#454, #465, F19/ADR-0010 A13) -- same
      # probes already graded under eshkol-compiler-readiness, viewed
      # here as v1.3.5 release scope.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ledger_integrity_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Silent-wrong ledger has no duplicate ids and every entry is well-formed (scripts/check_ledger_integrity.py)'
        action: python3 scripts/check_ledger_integrity.py

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["oracle_schema_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Completion-oracle file parses and every criterion validates to the declared count (scripts/check_oracle_schema.py)'
        action: python3 scripts/check_oracle_schema.py

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["oracle_false_green_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every oracle target has at least one severity:high criterion, so total absence of evidence forces blocked rather than ready (scripts/audit_oracle_false_green.py)'
        action: python3 scripts/audit_oracle_false_green.py

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["evidence_staleness_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'No severity:high criterion''s newest matching runtime-event evidence is older than the configured window (scripts/check_evidence_staleness.py)'
        action: python3 scripts/check_evidence_staleness.py

      - test_evidence: true
        severity: high
        label: 'Assurance wave 2: the self-verdict scanner fails a PASS-graded artifact whose text still contains a self-reported failure marker (scripts/check_self_verdicts.py), wired into run_ctest_gate.sh and run_vm_parity.sh'
        action: python3 scripts/check_self_verdicts.py --self-test

      # #455/#465: docs-only PRs report every required context.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["required_context_consistency_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every branch-protection required status context is reportable on every PR shape CI can produce, including docs-only (scripts/check_required_context_consistency.py)'
        action: python3 scripts/check_required_context_consistency.py

      # #462: R7RS 7.1.1 vertical-line symbol syntax, all four readers.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["pipe_symbol_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'R7RS 7.1.1 vertical-line symbols round-trip byte-identically across JIT, AOT and VM'
        action: ./scripts/run_icc_smoke.sh

      # #466: reader quoted-datum kinds beyond ( and '.
      - test_evidence: true
        severity: high
        label: 'parse_quoted_data_with_token dispatches every quoted-datum kind (vector, quasiquote, unquote), not only list and quote; compile_quote preserves is_char/is_inexact reader flags'
        action: cd build && cmake --build . && ctest -R reader

      # #458/audit H1: NumPy capsule keeps the tensor buffer alive.
      - test_evidence: true
        severity: high
        label: 'A NumPy array exported from a tensor eval() keeps its owning Context alive via shared_ptr + per-array capsule reference; closes silent-wrong-ledger SW-44'
        action: cd build && cmake --build . && ctest -R python_bindings_capsule_lifetime

      # N5 (2026-08-26 audit): same probe as eshkol-compiler-readiness's
      # doc_claims_residual_clean criterion (see that criterion's comment) --
      # viewed here as v1.3.5 release scope.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["doc_claims_residual_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every icc doc-typed-claims "wrong" finding is either allowlisted or an open, maintainer-tracked DOC-DEBT ledger item -- zero unexplained (scripts/check_doc_claims_residual.py)'
        action: python3 scripts/check_doc_claims_residual.py --icc-bin "$ICC_BIN" --repo "$ICC_REPO"

      - no_stubbed_paths:
          - production_fallback
          - synthetic_model_only
        severity: high
        label: 'No silent fallbacks or synthetic implementations in v1.3.5 production paths'
        action: classify_or_replace_each_stub

  # -----------------------------------------------------------------
  # Arbitrary-order AD Taylor-tower campaign -- cross-release gate.
  # The release gates below select the phase rows assigned to their
  # ROADMAP.md themes; this target keeps the whole P0..P12 campaign in
  # one place for ICC planning.
