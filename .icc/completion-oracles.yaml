# ICC completion oracles for the Eshkol compiler.
#
# Each oracle is a target name plus a list of `requires` criteria. ICC's
# `completion-oracle` subcommand checks that each criterion has evidence
# (test indexed, contract present, runtime check passed, no stub paths)
# and produces a verdict the assistant can plan against.
#
# Targets here mirror the milestone structure in ROADMAP.md / ESHKOL_VERSION.txt
# and the agent-blocker matrix in plans/note-for-eshkol-agent.md.

oracles:
  # ─────────────────────────────────────────────────────────────────
  # Main compiler readiness — the everyday "is the compiler healthy"
  # check. Used by `icc next-action --target eshkol-compiler` to surface
  # what's blocking work today.
  #
  # Each runtime_event criterion looks for a JSON-L line in
  # scripts/icc_traces/*.jsonl with kind:"eshkol_smoke" name:<id>
  # value:"PASS". scripts/run_icc_smoke.sh produces the trace; running
  # it before `icc completion-oracle` flips this oracle to green.
  # ─────────────────────────────────────────────────────────────────
  - name: eshkol-compiler-readiness
    aliases: [eshkol, compiler, eshkol-compiler]
    requires:
      - test_evidence: true
        severity: high
        label: v1.2 edge-case tests are indexed and runnable
        action: cd build && cmake --build . && ctest -R v1_2

      - no_contract_gap:
          - flag_without_contract
          - state_key_produced_without_consumer
          - state_key_consumed_without_producer
          - artifact_without_test_or_trace
          - missing_expected_contract_kind
        severity: high
        label: Compiler subsystems wire together without dangling contracts
        action: fix_contract_graph_gap

      - no_stubbed_paths:
          - production_fallback
          - synthetic_model_only
        # Runtime exercise is enforced separately by the exact runtime_event
        # criteria below and by INV-language-surface-exercise.  Do not fold
        # `not_exercised_by_real_smoke` into stub classification: that tag is a
        # symbol-name correlation heuristic and marks real compiled functions
        # whenever a trace proves behavior without spelling the C/C++ symbol.
        # Keeping it here would turn stronger, broader traces into thousands of
        # false "stub" blockers despite 100% language-surface execution.
        # This target certifies compiler/runtime/type-checker production code.
        # The public website is a separately deployed WASM application with its
        # own build/runtime gate; backend-related prose in its downloads page
        # must not be mistaken for a compiler fallback by the lexical audit.
        exclude_path_prefixes: [site/]
        severity: high
        label: Codegen / runtime / type-checker production paths are real
        action: wire_real_path_or_classify_stub

      # ── Silent-wrong flaw gate (2026-08-12) ──────────────────────────
      # Every other criterion in this oracle certifies that something
      # WORKS. None of them can certify that nothing SILENTLY LIES: a
      # defect that returns a wrong value with no diagnostic and exit 0
      # is invisible to a probe that only asserts its own happy path.
      # That is exactly how a release cut reached readiness 100 while
      # carrying an AD operator that differentiates the wrong function,
      # a `map` that ignores a shadowing binding, and seven documented
      # resource limits that are never enforced.
      #
      # `.icc/silent-wrong-ledger.yaml` is the enumeration of that class;
      # `scripts/gate_no_silent_wrong.py` grades it and emits this event.
      # The gate fails closed — a missing or unparseable ledger is FAIL,
      # because absence of the ledger is not evidence of absence of the
      # defects. An entry leaves the gate only via a terminal status
      # (closed / fixed / guarded) backed by a re-measurement SHA or a
      # committed test, or via a waiver with an owner, a reason and an
      # unexpired date. Nothing closes by bare assertion.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["no_open_silent_wrong"]
          event_values: ["PASS"]
        severity: high
        label: 'No open, unwaived SILENT-WRONG flaw ships: every entry in .icc/silent-wrong-ledger.yaml whose bucket is SILENT-WRONG (or which is IN-FLIGHT but silent_wrong_class) is closed/fixed/guarded with evidence, or carries an owner/reason/unexpired waiver — wrong values, wrong derivatives and wrong memory outcomes with no diagnostic and exit 0 are tag-blocking'
        action: python3 scripts/gate_no_silent_wrong.py

      # ── Assurance wave 1 (2026-08-24) ─────────────────────────────────
      # The silent-wrong gate above answers "is every KNOWN flaw closed or
      # waived" but assumes its own input — the ledger file — is trustworthy.
      # It is a text file merged like any other: SW-33 was independently
      # allocated on three separate branches, SW-35 twice and SW-42 twice,
      # none of which conflicted in git because a textual merge does not
      # notice two branches picking the same next-free id. This criterion is
      # the check that would have caught each collision before merge instead
      # of after.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ledger_integrity_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Silent-wrong ledger has no duplicate ids across the whole file and every entry has id/bucket/status/title plus closure evidence when not open (scripts/check_ledger_integrity.py)'
        action: python3 scripts/check_ledger_integrity.py

      # ── AD carrier wave (2026-08-25) ──────────────────────────────────
      # Eshkol differentiates on two substrates. Until now the only check
      # that compared them compared PROGRAM OUTPUT, and two independently
      # correct implementations agree on output — so the differential could
      # not report that op:GRADIENT had been promoted to vm-supported on a
      # VM-private forward-dual carrier sharing no code with the native node
      # model (SW-52). The invariant whose NAME asserts exactness,
      # INV-ad-exact-no-finite-differences, is a dependency-presence check
      # over native symbols only: it read PASS for the entire lifetime of a
      # central difference at h = 1e-7 inside the VM's curl (SW-51, SW-46).
      # This criterion grades the structural property directly — which
      # carrier answers each AD op, re-derived from source — and the one
      # below it grades the behaviour, because a structural check reads text
      # and a derivative is a number.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_carrier_model_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every AD operator declares its differentiation carrier in .icc/ad-carrier-manifest.yaml, the declaration is re-derived from source rather than believed, a vm-supported AD op is backed by an exact carrier and never a finite difference, the carrier fork does not grow past its shrink-only budget, and every difference-quotient site on either engine is ledgered with an owner and a justification (scripts/gate_ad_shared_node_model.py)'
        action: python3 scripts/gate_ad_shared_node_model.py

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_vm_curl_divergence_exact"]
          event_values: ["PASS"]
        severity: high
        label: 'VM curl of a gradient field returns exactly #(0 0 0) — not the 1.1102230246251565e-09 a central difference at h=1e-7 returned — and (ad-finite-difference-evals) reads 0 rather than 6'
        action: ./scripts/run_icc_smoke.sh

      # This oracle's own definition lives in a YAML file merged the same
      # way the ledger is. PR #429 dropped a list-item opener while adding a
      # criterion and broke the parse outright (icc readiness blocked, score
      # 85) until c8449f8a restored it by hand. The sharper failure this
      # criterion is built for is quieter: the file still parses but a
      # criterion silently normalises to nothing (a runtime_event with no
      # event_kinds, a duplicated criterion id) and readiness keeps running,
      # grading fewer criteria than this file's author wrote, with nothing
      # in the output to say so.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["oracle_schema_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'This completion-oracle file parses and every criterion in every oracle validates to the same count declared — no criterion is silently dropped by the grader (scripts/check_oracle_schema.py)'
        action: python3 scripts/check_oracle_schema.py

      # 2026-08-25 (F19 / ADR-0010 A13): every oracle target now carries at
      # least one severity:high criterion, so absent evidence forces
      # `blocked` (scripts/audit_oracle_false_green.py enforces that
      # invariant below). This criterion covers the OTHER half of A13's
      # proposal: evidence that exists but is stale. ICC's own grader has
      # no `max_age_days` support for `runtime_event` criteria (only
      # `performance_budget` — see scripts/check_evidence_staleness.py's
      # docstring for the exact code path), so staleness is graded here,
      # repo-side, over the trace corpus, and fed back in as an ordinary
      # eshkol_smoke event the same way the schema/ledger gates above are.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["evidence_staleness_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'No severity:high criterion''s newest matching runtime-event evidence is older than the configured window (default 14 days; scripts/check_evidence_staleness.py --max-age-days / $ESHKOL_EVIDENCE_MAX_AGE_DAYS)'
        action: python3 scripts/check_evidence_staleness.py

      # 2026-08-25 (F19 / ADR-0010 A13): no oracle target may read `ready`
      # (or escape `blocked`) purely because it has zero severity:high
      # criteria — the exact mechanism that let gpu-execution read
      # `ready/94` on a host that had run no GPU code at all. This
      # criterion is this file's own regression test against that class.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["oracle_false_green_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every oracle target has at least one severity:high criterion, so total absence of evidence forces `blocked` rather than `ready`/`incomplete` (scripts/audit_oracle_false_green.py)'
        action: python3 scripts/audit_oracle_false_green.py

      # N5 (2026-08-26 audit): .icc/doc-claims-allowlist.yaml's own header
      # comment has claimed since 2026-08-14 to be "consumed by the
      # doc-typed-claims-residual release-oracle criterion", enforcing
      # current_wrong_count == len(allowlist entries) + open DOC-DEBT
      # build-item count, with zero unexplained remainder. That criterion
      # existed nowhere -- the string appeared only in the allowlist's own
      # prose. scripts/check_doc_claims_residual.py is the criterion the
      # allowlist always claimed existed; the allowlist itself was
      # regenerated in the same change (27 stale doc line-count mentions
      # corrected in the doc text; 8 claims that had only drifted line
      # number re-hashed in place; zero left unexplained).
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["doc_claims_residual_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every icc doc-typed-claims "wrong" finding is either allowlisted (.icc/doc-claims-allowlist.yaml) or an open, maintainer-tracked DOC-DEBT ledger item -- zero unexplained (scripts/check_doc_claims_residual.py)'
        action: python3 scripts/check_doc_claims_residual.py --icc-bin "$ICC_BIN" --repo "$ICC_REPO"

      # 2026-08-25 (VA-01): branch protection hardened to enforce_admins:
      # true the same day PR #455's docs-only-required-context-stubs job
      # was found to be missing 5 of its now-required matrix-derived
      # contexts (windows-arm64-lite, macos-arm64-xla, macos-x64-xla,
      # macos-arm64-lite, macos-x64-lite) — a docs-only PR would have been
      # permanently unmergeable by ANYONE, not just non-admins, the moment
      # that setting took effect. This criterion is the standing guard
      # against the underlying class: the stub matrix and branch
      # protection's required list are two lists kept in sync by hand, with
      # nothing that failed a build when they drift. It fails on either
      # direction of drift — a required context nothing in CI can report on
      # some PR shape, or (equally) a required context nothing in CI could
      # EVER report at all.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["required_context_consistency_clean"]
          event_values: ["PASS"]
        severity: high
        label: 'Every branch-protection required status context is reportable on every PR shape CI can produce, including docs-only (scripts/check_required_context_consistency.py)'
        action: python3 scripts/check_required_context_consistency.py
      # ── ADR-0010 v1.4-connection gate closures (2026-08-25) ──────────
      # A10/A11/A12 were measured NOT IMPLEMENTED by the v1.4-connection
      # oracle. Each criterion below is graded by a dedicated check_*.py
      # gate that follows the check_oracle_schema.py / check_ledger_
      # integrity.py convention exactly: --self-test fixtures prove the
      # gate can go RED, --no-trace grades without writing evidence, and a
      # missing/unusable input fails closed rather than passing silently.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["package_manifest_complete"]
          event_values: ["PASS"]
        severity: high
        label: 'A staged release package matches the declared package_surface manifest (ADR-0010 A10): every binary, static library, stdlib artifact, and lib/**/*.esk source-mirror entry in .icc/package-manifest.yaml is present in the package release.yml builds (scripts/check_package_manifest.py)'
        action: python3 scripts/check_package_manifest.py --package-dir <staged-package-dir> --platform <linux|macos|windows>

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["diagnostic_corpus_clean"]
          event_values: ["PASS"]
        severity: medium
        label: 'Every case in the diagnostic golden corpus (tests/diagnostics/, ADR-0010 A11) still produces its pinned message and file:line:col span, and every diagnosed-fatal case still fails to build and run (scripts/check_diagnostic_corpus.py)'
        action: python3 scripts/check_diagnostic_corpus.py --build-dir build

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["leak_detection_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'ASan leak detection is armed (detect_leaks=1) in the linux-x64-asan-ubsan CI lane against a reasoned suppression file, and a deliberately-introduced leak is caught by LSan under the exact CI ASAN_OPTIONS (ADR-0010 A12) (scripts/check_leak_detection_selftest.sh)'
        action: ./scripts/check_leak_detection_selftest.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["leak_audit_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'No unsuppressed leak in the real workloads under ASan+LSan — an AOT compile, the compiled program, the VM and the REPL all run leak-clean against the per-entry-justified .icc/lsan-suppressions.txt, and the one retention those rules do hide (the front-end AST, epic #182) is held to a pinned per-input-line slope so a growth regression cannot hide behind a suppression (ADR-0010 A12) (tests/memory/leak_audit_gate.sh)'
        action: BUILD_DIR=build-asan ./tests/memory/leak_audit_gate.sh

      # ── Harness infra-vs-defect taxonomy (2026-08-25 architecture audit,
      # section 3) ──────────────────────────────────────────────────────
      # Every runtime_event criterion in THIS oracle — including the ones
      # above and below this line — depends on the same premise: a probe
      # that could not obtain a verdict must never publish the same "PASS"
      # this criterion's own event_values match on for a probe that
      # genuinely succeeded, and must never publish a false FAIL either. A
      # 140s cold-start JIT compile killed by a 60s alarm once turned the
      # HIGH invariant INV-dispatch-table-completeness red through exactly
      # this channel. scripts/lib/harness_outcome.sh is the shared fix;
      # this criterion is the regression test proving the PASS/FAIL/INFRA
      # split it provides is real (tests/harness/harness_outcome_taxonomy_test.sh,
      # 17 checks: timeout and missing-binary classify INFRA and publish no
      # test_result, a completed wrong answer and a self-raised crash still
      # classify FAIL and do publish one, and only INFRA is ever retried).
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["harness_outcome_taxonomy"]
          event_values: ["PASS"]
        severity: high
        label: 'scripts/lib/harness_outcome.sh distinguishes infrastructure failure (timeout, missing binary — INFRA, no false test_result, retried once) from a genuine code defect (wrong answer or self-raised crash — FAIL, always recorded, never retried)'
        action: bash tests/harness/harness_outcome_taxonomy_test.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["llvm_module_verifier_clean"]
          event_values: ["PASS"]
        severity: high
        label: LLVM verifyModule passes on the codegen output
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["aot_link_succeeds"]
          event_values: ["PASS"]
        severity: high
        label: eshkol-run produces a runnable binary from an .esk file
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["transitive_load_agent_ffi_link"]
          event_values: ["PASS"]
        severity: high
        label: 'Driver: agent-FFI native-link requirements propagate through the full transitive source closure (load/import/require, any depth; JIT+AOT), a plain program does not over-link the archive, and a broken generated-program link under -r exits nonzero instead of masking it with a reduced in-process fallback'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ffi_boundary_fail_open"]
          event_values: ["PASS"]
        severity: high
        label: 'FFI boundary fails closed: an arity error is fatal under -r AND AOT (never a null binding, never a written binary, named diagnostic preserved), and an argument whose type cannot be an address is rejected at every `extern` pointer parameter with a catchable type error instead of being dereferenced'
        action: ./scripts/run_icc_smoke.sh

      # severity: high (raised in the F19 false-green sweep, 2026-08-25):
      # this asserts measured behaviour (the REPL/JIT exit cleanly), not
      # test-fixture presence, so absent evidence must FAIL, not WARN.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["jit_repl_clean_exit"]
          event_values: ["PASS"]
        severity: high
        label: eshkol-repl + eshkol-run -r return cleanly on a smoke input
        action: ./scripts/run_icc_smoke.sh

      # -- Full-claim adversarial gates (2026-07-10 oracle hardening). --
      # These assert the COMPLETE feature claims that an audit found the
      # oracle was silently over-promising. The narrow ad_input2_* probes
      # in v1.3-evolve only ever exercised the one working calling pattern
      # (literal-lambda loss + scalar gamma); this criterion is the one
      # that certifies input2 gradients actually work end-to-end.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["tensor_input2_grad_exact_firstclass_and_vector"]
          event_values: ["PASS"]
        severity: high
        label: 'ESH-0212/#229: input2 tensor gradients (matmul B, conv2d kernel, attention K/V, per-feature batch/layer-norm gamma) match central finite-difference EXACTLY across literal, first-class AND higher-order loss forms and vector gamma (JIT+AOT, 24/24) — not just the literal-scalar path'
        action: ./scripts/run_icc_smoke.sh

      # Region escape-evacuator subtype coverage, run under
      # ESHKOL_ARENA_POISON=1 so a missed interior pointer crashes at a
      # 0xCB.. address rather than reading stale data. Closes the blind
      # spot where the PROMISE-corruption evacuation gap was invisible to
      # readiness=100 because no oracle criterion referenced this gate.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["region_evac_subtype_coverage"]
          event_values: ["PASS"]
        severity: high
        label: 'ESH-0214d/e: region escape-evacuator keeps promoted logic/workspace/PROMISE subtype interiors intact under ESHKOL_ARENA_POISON=1 (AOT, flat RSS)'
        action: ./scripts/run_icc_smoke.sh

      # SW-14 close (v1.3.5 flagship). The criterion above certifies the NATIVE
      # evacuator; these two certify the bytecode VM's, which did not exist
      # until the Stage-1 port. They are separated deliberately: the first is
      # the MEASUREMENT the ledger's close condition demands (a flat RSS curve,
      # not an assertion that memory is returned), the second is the COVERAGE
      # that keeps that reclamation from being wrong. On this substrate a
      # heap reference is a small integer rather than a pointer, so a subtype
      # the walk misses cannot be caught by any pointer scan — the object is
      # freed while live, and the fixture reads every promoted value back to
      # prove it was not.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["vm_region_flat_rss"]
          event_values: ["PASS"]
        severity: high
        label: 'SW-14: (with-region ...) measurably reclaims on the bytecode VM — peak RSS flat across a swept iteration count (26 MB flat at 1000/4000/16000) against 796 MB with the evacuator disabled, same printed answer either way'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["vm_region_evac_subtype_coverage"]
          event_values: ["PASS"]
        severity: high
        label: 'SW-14: every VM heap subtype a program can construct inside a region survives the pop with its interior intact — contents read back and compared under ESHKOL_ARENA_POISON=1, under the independent post-sweep audit, and with reclamation disabled'
        action: ./scripts/run_icc_smoke.sh

      # Generative adversarial AD-vs-finite-difference oracle. Where the
      # tensor_input2 gate above pins a FIXED set of second-operand losses,
      # this criterion certifies that a GENERATED family of differentiable
      # programs — random scalar/field expression trees plus tensor/ML-op
      # loss compositions (matmul/conv2d/attention/batch+layer-norm/softmax),
      # differentiated to gradient, laplacian AND hessian, at scalar, vector
      # and tensor-literal points, across literal/first-class/wrapper loss
      # forms — matches a central finite difference. It is the continuous
      # silent-wrong-gradient tripwire: a NEW zero-where-FD-is-nonzero (the
      # worst AD defect class) turns readiness red instead of shipping wrong
      # training gradients. The smoke probe runs the --quick subset (one file
      # per family); the full JIT+AOT sweep is scripts/run_ad_adversarial.sh.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_adversarial_fd_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Generative adversarial AD oracle: a seeded, growing family of random differentiable programs (scalar + field + tensor/ML-op compositions; gradient/laplacian/hessian; scalar/vector/tensor-literal points; literal/first-class/wrapper loss forms) matches central finite differences — continuous silent-wrong-gradient tripwire, no zero-gradient-where-FD-is-nonzero'
        action: ./scripts/run_icc_smoke.sh

      # SW-47. The headline exactness claim ("no finite-difference fallback
      # anywhere in the gradient path") had an executable form —
      # `(= (ad-finite-difference-evals) 0)` — whose counter had NO writer on
      # the native back end. The assertion was true by construction: green, and
      # incapable of going red under the very regression it names. Readiness
      # consumed that green as evidence of exactness.
      #
      # This criterion is deliberately paired: the probe passes only when the
      # POSITIVE case (an exact vector gradient reports zero finite-difference
      # evaluations, one primal call, one reverse pass) and the NEGATIVE control
      # (a real central-difference backward reports EXACTLY the perturbations it
      # evaluated, and the shipped assertion form evaluates #f in that state)
      # both hold, on BOTH engines — the native and bytecode back ends keep
      # separate FD counters, which is how one stayed dead while the other was
      # live. The negative half is what makes this a gate rather than a
      # decoration; it has been demonstrated to fail when the counter is
      # unwired.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_exactness_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'SW-47: the no-finite-differences guarantee is enforced by a LIVE counter — exact gradients report 0 FD evaluations, a real finite-difference backward reports exactly its perturbation count and turns `(= (ad-finite-difference-evals) 0)` #f on BOTH engines, and matmul AD tape node counts stay within their shrink-only ratchet with gradients exact. The assertion is a measurement, not a tautology.'
        action: ./scripts/run_icc_smoke.sh

      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["language_surface_coverage"]
          event_values: ["PASS"]
        severity: high
        label: 'TOTAL-LANGUAGE exposure coverage meets the committed monotonic floor; new language surface or generator regressions cannot silently reduce coverage'
        action: ./scripts/run_language_coverage.sh

      # Fix-campaign regression gates (2026-07-10): each guards a fixed
      # silent-wrong-answer or scale bug so it cannot silently reopen.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["numeric_exactness_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Numeric exactness: gcd has a bignum path, bignum quotient/remainder satisfy a=q*b+r, and eqv?/equal? are value-correct on rationals/complex (ESH-0124/0125/0114)'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["i128_native_type_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Native 128-bit integer: distinct wrapping fixed-width type off the tower — two''s-complement wrap at +-2^127, full-range string round-trip including -2^127, shifts (0/64/127, out-of-range raises), compares, truncated quotient/remainder, i128->int range check'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["closure_set_tco_loop_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Closure mutation: a closure made in a named-let/TCO loop that set!s a captured global keeps the mutation, not a snapshot (ESH-0094)'
        action: ./scripts/run_icc_smoke.sh
      # severity: high (F19 false-green sweep): "match a reference" is a
      # correctness claim, not fixture bookkeeping.
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["stdlib_sort_filter_scale_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Stdlib scale: sort (2M) and filter (1M) are tail-recursive and match a reference sort/filter (ESH-0098/0108)'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_forward_over_reverse_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'AD nesting: jacobian/hessian differentiating through an inner forward-mode derivative is exact, not silent-zero (ESH-0120/0121)'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["ad_capture_global_shadow_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'AD capture scoping: a differentiand lambda capturing its enclosing function''s parameter is never substituted by a same-named top-level global — and the cached (-r AOT) and uncached (in-process JIT) routes produce byte-identical output (task #114)'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["higher_order_shadowing_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'Lexical scope in higher-order builtins: map/for-each/filter/fold/reduce/remove call the shadowing binding (parameter or local), never a same-named top-level procedure — static procedure-operand resolution declines when locally shadowed, and the VM upvalue search is innermost-first; gated on JIT, AOT, and the standalone VM (ESH-0070 class)'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["eshkol-vm-large-proc"]
          event_values: ["PASS"]
        severity: high
        label: 'VM closure-upvalue capacity: the compiler''s upvalue cap and the runtime closure array''s capacity are one shared constant (ESHKOL_VM_MAX_CLOSURE_UPVALUES) — a procedure referencing up to 32 distinct top-level procedures runs correctly and the top-level define compiled right after it is never corrupted (17-32 upvalues used to silently strand values on the operand stack via a hardcoded 16-slot runtime array), and one past the shared capacity fails the compile loudly instead of continuing with a missing capture (SW-45)'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["linear_solve_full_f64_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'linear-solve: mixed-precision iterative-refinement dense solver reaches full-f64 backward residual (<=1e-12, computed independently) on well-conditioned/identity systems and raises catchably on singular/dimension-mismatch — verified on JIT, AOT, and the VM'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["matmul_tensor_read_scope_oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'matmul-tensor scope (#309): a matmul result read via tensor-ref/tensor-data from inside a defined function (captured global, argument, in-function matmul, nested define, closure, with-region escape, large GPU/BLAS-dispatched matmul) returns the same data as a top-level read — never silent zeros; verified on JIT and AOT'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["vm_gradient_parity"]
          event_values: ["PASS"]
        severity: high
        label: 'self-differentiating on every substrate: `gradient` on the bytecode VM (arity-resolved forward-mode dual — direct/wrapped/curried, N-arg spread, arity-1 whole-vector, non-polynomial) is 25/25 on the VM and byte-identical to native across native/vm-src/vm-eskb; the public low-level reverse-mode AD tape surface (incl. ad-pow) is green on JIT, AOT and the VM'
        action: ./scripts/run_icc_smoke.sh

      # ─────────────────────────────────────────────────────────────
      # THE VALUE-POSITION AXIS (scripts/run_value_position_sweep.py).
      #
      # Builtins are lowered inline at the call site; referencing one as a
      # VALUE goes through different codegen. Four defects have been found
      # living there while call position was correct — LE-01 (no value
      # representation at all), SW-27 (rest-arg procedures lost their
      # variadic flag, silently), SW-31, SW-35 (rounding returned a
      # rational's heap address). None was caught by any criterion above,
      # and structurally none could be: the differential corpus compares
      # execution AXES against each other, and these defects are wrong
      # identically on every axis.
      #
      # The sweep's oracle is differential BY CONSTRUCTION — call position
      # versus value position for the same call in the same program — so it
      # asserts no expected values and cannot certify a wrong answer.
      # ─────────────────────────────────────────────────────────────
      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["value_position_sweep"]
          event_values: ["PASS"]
        severity: high
        label: 'the VALUE-POSITION axis is clean: every builtin the manifest can type answers the same referenced as a value — passed to a higher-order procedure, stored, returned, reached through a builtin combinator — as it does in call position, on every execution axis'
        action: python3 scripts/run_value_position_sweep.py
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["value_position_axis"]
          event_values: ["PASS"]
        severity: high
        label: 'the value-position axis probe is wired into the smoke harness, so the blind spot that produced SW-27/SW-31/SW-34/SW-35 one at a time is gated rather than rediscovered'
        action: ./scripts/run_icc_smoke.sh

      # ─────────────────────────────────────────────────────────────
      # P8 "escape-closure" pillar (scripts/run_p8_escape.sh). Each axis
      # is built so that a 2026-07 externally-reported bug CLASS would have
      # been caught by our own framework first; retro-catch evidence
      # against pre-fix build 010053c8 is in .swarm/P8_ESCAPE_ANALYSIS.md.
      # The CI subset emits these events (eshkol_smoke roll-up via
      # scripts/run_icc_smoke.sh; per-axis kind:"escape_matrix" via the
      # pillar runner into scripts/icc_traces/escape_matrix.jsonl). The
      # full JIT+AOT+VM sweep and the TSan / Homebrew packaging lanes are
      # NIGHTLY-ONLY (.github/workflows/adversarial-nightly.yml) and are
      # advisory — they have no hard oracle criterion here.
      # ─────────────────────────────────────────────────────────────
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["p8_escape_matrix_green"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 escape-closure pillar (CI subset) is green: every escape axis — AD binding-form + indirection sweeps, reference-free property oracles, parallel-map concurrency fuzz, native-vs-VM arity ratchet, five-way surface agreement, toolchain fault-injection, workload flat-RSS — passes with no NEW divergence / masking / regression'
        action: ./scripts/run_icc_smoke.sh
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["p8_axis1_binding-form"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-1 (binding-form): every AD operator (gradient/jacobian/hessian/laplacian/curl/divergence/derivative) at a differentiation point built as numeric/#()/vector/list/tensor/VAR/let/fnret/(the ...) form matches the closed-form ground truth AND agrees across forms — retro-catches the #339/#340/#343 point-classified-by-AST-node class (SIGSEGV / silent-zero)'
        action: ./scripts/run_p8_escape.sh
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["p8_axis2_indirection"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-2 (indirection): an AD operator reached direct / through a function parameter / curried / stored-in-let / threaded-through-two-levels is byte-identical — retro-catches the #330 gradient-through-callable arity class'
        action: ./scripts/run_p8_escape.sh
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["arity_sweep_native_vm_parity"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-3 (arity sweep): every manifest builtin with a known arity registered on BOTH native and VM agrees value-for-value (or errors identically) on its documented / wrong-arity / wrong-type calls — shrink-only baseline ratchet; a NEW native-vs-VM divergence (the #322/#327 VM-matmul class) fails the gate'
        action: ./scripts/run_p8_escape.sh
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["p8_axis4_property-oracle"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-4 (property oracles): reference-free invariants — number->string∘string->number identity over diverse doubles, (read∘write) round-trip, exact algebraic identities — hold on every substrate INDEPENDENTLY; retro-catches the 6-sig-fig printer class the lossy-normalized chibi differential missed (shared-defect blindness)'
        action: ./scripts/run_p8_escape.sh
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["p8_axis5_concurrency-fuzz"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-5 (concurrency fuzz): seeded parallel-map worker corpora (scope-op-heavy / allocating / string / mixed-#f closures × n∈{4,15,16,17,64} × 20 repeats) deep-equal the serial-map oracle every run — retro-catches the #331 shared-arena scope-stack race'
        action: ./scripts/run_p8_escape.sh
      # severity: high (F19 false-green sweep): "agree ... fails the gate"
      # is a measured cross-surface invariant, not fixture bookkeeping.
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["five_way_surface_agreement"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-6 (five-way surface): doc ↔ manifest ↔ native-registration ↔ VM-dispatch ↔ module-provide agree for every builtin — shrink-only baseline ratchet; a NEW doc-orphan or backend asymmetry (the ad-pow native-missing class) fails the gate'
        action: ./scripts/run_p8_escape.sh
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["p8_fault_injection_suite"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-7 (fault injection): every toolchain fault cell (broken --lib under -r/AOT, malformed under -r/AOT, bad output dir, undefined symbol, missing source under -r/AOT, unreadable source, unresolved require under -r/AOT, bounded hang) exits NONZERO with a diagnostic — retro-guards the #334 exit-0-masking class; all 12 cells are hard gates since the ESH-0361 residue was fixed in #354 and its five XKNOWN cells were promoted, so zero XKNOWN and zero XPASS is the passing state'
        action: ./scripts/run_p8_escape.sh
      # severity: high (F19 false-green sweep): a measured memory-safety
      # invariant (flat RSS), not fixture bookkeeping.
      - runtime_event:
          event_kinds: [escape_matrix]
          event_names: ["p8_mem_profiles_suite"]
          event_values: ["PASS"]
        severity: high
        label: 'P8 axis-8 (memory profiles): peak RSS is FLAT in the iteration count across workload shapes (AD-training step loop / resident KB tick / proof-search churn / parallel-map batch × auto-scope|with-region) — a leak that scales RSS with work (the training-loop OOM class) trips the machine-independent ratio invariant'
        action: ./scripts/run_p8_escape.sh

      # ─────────────────────────────────────────────────────────────
      # CTEST-BACKED PILLARS (wired 2026-07-31)
      #
      # Until scripts/run_ctest_gate.sh existed, NO criterion anywhere in this
      # file consumed a CTest RESULT: the only ctest mentions were `action:`
      # strings, and the `test_evidence` criteria are index-level ("the tests
      # exist and are runnable"), not execution-backed. The whole suite
      # therefore had no oracle teeth, which is how two pillars with perfectly
      # good CTest gates — the fixed-point engine and the exact-input AD tier —
      # shipped into the v1.3.4 cut ungated by the target that judges it.
      #
      # scripts/run_ctest_gate.sh runs CTest, writes one kind:"ctest" event per
      # test plus one per named GROUP plus the `ctest_suite_green` roll-up into
      # scripts/icc_traces/ctest_gate.jsonl, and also emits the canonical
      # kind:"test_result" events the architecture invariants read. A group
      # whose regex matches NO configured test is reported ABSENT and FAILS —
      # a pillar cannot quietly stop being covered because its tests were
      # renamed or configured out.
      #
      # Run it before measuring readiness, the same way run_icc_smoke.sh and
      # run_vm_parity.sh are run:
      #     BUILD_DIR=build ./scripts/run_ctest_gate.sh
      # ─────────────────────────────────────────────────────────────
      - runtime_event:
          event_kinds: [ctest]
          event_names: ["ctest_suite_green"]
          event_values: ["PASS"]
        severity: high
        label: 'The CTest suite is green AND its verdicts reach this oracle: every configured test passed, every gated group below is present and green, and ctest itself exited 0. This is the roll-up that gives the whole suite teeth — before it, a criterion could only assert that tests were INDEXED, so a red ctest run could not turn the release gate red.'
        action: ./scripts/run_ctest_gate.sh
      - runtime_event:
          event_kinds: [ctest]
          event_names: ["fixed_point_exact_accumulation_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Fixed-point / i128 exact-accumulation engine (#390): two''s-complement i128 arithmetic (wrap, compare, divide), Q-format round-trip and saturation, and an exact i128 dot product that is bit-identical to the rational reference all pass; the failure-injection runner still refuses its injected faults, and the shared-library ABI contract holds. Five CTest gates — fixedpoint_test_i128 / fixedpoint_test_fixed / fixedpoint_test_dot_exact / fixedpoint_runner_failures / fixedpoint_test_shared_abi — which existed but were run by no workflow, no smoke probe and no criterion.'
        action: ./scripts/run_ctest_gate.sh
      - runtime_event:
          event_kinds: [ctest]
          event_names: ["exact_input_ad_identity_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Exact-input AD tier (#393): derivative/gradient/hessian evaluated at an EXACT point (rational, bignum) route through the Taylor tower and satisfy the identity contract in value AND in exactness — (derivative f x) == (derivative-n f x 1), (hessian f x) == (derivative-n f x 2), exact? #t preserved — with the exact-coefficient Taylor tier itself green as the oracle they route to. Both lanes, since the JIT and the AOT lane reach codegen with different point literals: exact_point_ad_{runtime,aot}_smoke and exact_taylor_{runtime,aot}_smoke.'
        action: ./scripts/run_ctest_gate.sh
      - runtime_event:
          event_kinds: [ctest]
          event_names: ["runtime_closure_arity_spread_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'Runtime-closure gradient arity spread (#398): the gradient of a closure reached through a wrapper is analytically correct at EVERY arity in the declared 1..32 range, captured and uncaptured, and the variadic / vector-point / scalar-point forms are NOT spread. The MAX_CALL_ARGS_LIMIT=16 clamp made arity 17-32 SIGSEGV, return a silent all-zero gradient, or raise a type error — all inside the declared ceiling — so this is the retro-catch that dies at check 19 on the pre-fix build; the out-of-line spread helper must not reintroduce a per-arity ceiling. It was executed only by run_autodiff_tests.sh''s glob, which emits no trace and is referenced by no criterion.'
        action: ./scripts/run_ctest_gate.sh
      - runtime_event:
          event_kinds: [ctest]
          event_names: ["define_library_same_unit_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'R7RS-small 5.6.1 same-unit libraries: a (define-library (m …) …) written in the compilation unit being compiled is importable by the forms below it with no filesystem search, its export surface is the union of its export clauses, only/except/rename/prefix work over it, require shares the registry, and an import written ABOVE its define-library is refused as the forward reference it is. Gated on all three substrates, because the JIT (ReplJITContext::execute), the AOT lane (process_requires) and the VM (its own reader and module machinery) resolve imports at three independent call sites.'
        action: ./scripts/run_ctest_gate.sh
      - runtime_event:
          event_kinds: [ctest]
          event_names: ["module_load_path_engine_parity_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'One command, one answer: a relative (load "sib.esk") resolves identically on every execution engine `eshkol-run` can pick — the persistent JIT run cache, the in-process JIT reached by every cache-bypass switch (ESHKOL_JIT_CACHE=0, -d, --dump-ast/--dump-ir, several inputs, an active $ESHKOL_LANGUAGE_COVERAGE_TRACE_DIR), and the AOT lane. The documented order (docs/reference/language/modules.md) is the requiring FILE''s directory, then the working directory, then $ESHKOL_PATH/-I, then the install; both tiers are pinned, with a same-named decoy planted in the working directory so a cwd-rooted lane fails on a DIFFERENT ANSWER rather than merely on an error. The engines carried separate copies of the search order and disagreed, which is why the qllm suite — whose exporters load a sibling library — aborted under run_language_coverage.sh (it sets the coverage trace dir) while passing under every other harness.'
        action: ./scripts/run_ctest_gate.sh

      # ─────────────────────────────────────────────────────────────
      # VM SURFACE + PARITY ROLL-UPS pulled into the release gate
      #
      # Both existed but were measured by SIDE targets (`vm-parity` at the
      # bottom of this file), not by `eshkol-compiler-readiness` — the target
      # the v1.3.4 cut is judged on. The two are complementary and neither
      # alone is sufficient: the parity gate is a DIFFERENTIAL (a defect shared
      # by native and the VM passes by agreement), while the surface suite is
      # SELF-CHECKING against R7RS (a shared defect fails).
      # ─────────────────────────────────────────────────────────────
      - runtime_event:
          event_kinds: [vm_surface]
          event_names: ["vm_surface_regression_suite"]
          event_values: ["PASS"]
        severity: high
        label: 'VM extended-surface regressions (tests/vm/*_surface_regression.esk), compiled to .eskb and executed on the standalone VM, are all green. This is the self-checking half of the VM surface — every probe asserts against R7RS or a closed form inside ONE run, so a defect SHARED by native and the VM cannot pass by agreement. It carries #394''s 549-check numeric tag-dispatch probe: a numeric result takes its exactness from its operands'' runtime TAGS, never from the shape of its value, so an integral-valued flonum may not come back exact (the (- 2.0 1.0) -> exact 1 collapse that made (/ 1.0 3.0) answer 1/3), and a mixed flonum x ratnum computes with BOTH operands instead of truncating the flonum into the numerator (which answered 0).'
        action: ./scripts/run_vm_surface_tests.sh
      - runtime_event:
          event_kinds: [vm_parity]
          event_names: ["vm_parity_gate"]
          event_values: ["PASS"]
        severity: high
        label: 'VM parity gate: the codegen-vs-VM surface audit (every symbol supported or waived in tests/vm_parity/PARITY.tsv) plus the corpus differential on BOTH VM axes (vm-src and --emit-eskb), the out-of-subset probes and the fatal-error fail-closed probes are all green. Also measured by the `vm-parity` target; duplicated here because the release cut is judged on this one, and this is the criterion that carries the #394 numeric tag-dispatch differential (corpus/52) and the same-unit define-library differential (corpus/53).'
        action: ./scripts/run_vm_parity.sh

      # ─────────────────────────────────────────────────────────────
      # ESH-0011 PORTABLE EVENT LOOP (#399) — the probe and a criterion both
      # existed, but the criterion lived ONLY under `v1.4-release`. The event
      # loop ships in v1.3.4, and v1.3.4 is judged on this target, so it was
      # shipping outside the gate that judges the cut. Same probe, same
      # evidence; no new emitter.
      # ─────────────────────────────────────────────────────────────
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["event_loop_works"]
          event_values: ["PASS"]
        severity: high
        label: 'ESH-0011 portable event loop (kqueue/epoll/IOCP): (make-event-loop 64) yields a handle, a pipe read+write round-trips through event-loop-poll inside the timeout, an idle poll waits its budget and returns instead of hanging, a closed handle fails closed, and 1000 open/close cycles never exhaust the descriptor table — green on JIT and AOT.'
        action: ./scripts/run_icc_smoke.sh

  # ─────────────────────────────────────────────────────────────────
  # TOTAL-LANGUAGE completion — unlike the compiler-readiness ratchet above,
  # this target stays red until every high-risk category is exercised. It is
  # the phase-4 definition of done for the manifest-driven phase-3 campaign.
  # ─────────────────────────────────────────────────────────────────
  - name: total-language-coverage
    aliases: [language-coverage, total-language, exposure-engine-coverage]
    requires:
      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["language_surface_coverage"]
          event_values: ["PASS"]
        severity: high
        label: Exposure-engine coverage meets the committed monotonic floor
        action: ./scripts/run_language_coverage.sh

      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["language_surface_high_risk_complete"]
          event_values: ["PASS"]
        severity: high
        label: No numeric, tensor/AD, geometry, control-flow, consciousness, macro, or memory-region construct remains unexercised
        action: ./scripts/run_language_coverage.sh --require-zero-high-risk

      # A1 assurance gap: the coverage verdict must be EXECUTION-backed, never
      # lexical name-presence. This criterion consumes the dedicated
      # execution_backed_language_coverage event, which is PASS only when every
      # credited construct has runtime execution evidence (O/C/V) or a bounded
      # compile-time-form witness (A/G on the allowlist), the monotonic
      # deficit ledger (tests/coverage/execution_deficit.json) did not grow, and
      # execution-backed coverage did not drop. Lexical exposure is reported as
      # the diagnostic spelled_but_unproven set and earns zero credit.
      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["execution_backed_language_coverage"]
          event_values: ["PASS"]
        severity: high
        label: Coverage is certified by executed/dispatched runtime evidence only; the monotonic execution deficit ledger did not grow and execution-backed coverage did not regress (lexical name-presence earns zero credit)
        action: ./scripts/run_language_coverage.sh

      # ADVISORY (F19 false-green sweep, kept at medium): `test_evidence`
      # criteria certify that a test/fixture is indexed and runnable, not
      # that a measured behaviour holds — the actual coverage/execution
      # claims are the three `runtime_event` criteria above, all
      # severity:high. This is fixture bookkeeping, not a standalone
      # correctness claim, so absent evidence degrading to WARN is correct.
      - test_evidence: true
        severity: medium
        label: Language-surface manifest, policy, and exposure-engine tests are indexed
        action: python3 scripts/gen_language_surface.py --check

      # ADVISORY (same reasoning as above): certifies the anti-gaming
      # guard's OWN test suite is indexed/runnable, not a runtime
      # measurement in its own right — the guard's actual effect is
      # already load-bearing inside `execution_backed_language_coverage`
      # above, severity:high.
      - test_evidence: true
        severity: medium
        label: Build-free execution-backed gate guard (name-presence earns no credit; deficit ratchet is monotonic)
        action: python3 scripts/test_language_coverage_gate.py

  # ─────────────────────────────────────────────────────────────────
  # ADR-0000 Stage 1 — the frontend node-identity substrate.
  #
  # ADR-0000 sequences fourteen stages and gives each one a falsifiable
  # gate; Stage 1 is the DAG-roots stage that everything after it waits
  # on. Its identity half is the substrate ADR-0000 §7 risk 1 calls "the
  # single most important co-design constraint in the whole program":
  #
  #     NodeId -> { SourceSpan, BindingId, TypedExprInfo }
  #
  # shared by the compiler, LSP, docs, REPL and VM. ADRs 0004, 0006 and
  # 0008 are three overlapping frontend rewrites over that one substrate;
  # specified separately they fork the frontend and the "one answer"
  # invariant is false by construction.
  #
  # This oracle grades PHASE A only, and grades it honestly: the NodeId
  # key and the SourceSpan column exist, a real consumer resolves through
  # them, and the coverage is a measured number on a ratchet. It does NOT
  # claim Stage 1 attainment. Still outstanding for the stage, each in
  # its own slice and none of them half-built here:
  #   - BindingId column          -> ADR-0006 slices 1-2
  #   - TypedExprInfo column      -> ADR-0004 spine part 1
  #   - one semantic tooling core -> ADR-0008 M0/M1 (the LSP still
  #                                  counts parentheses by hand)
  #   - byte-offset canonical spans and the expansion-origin table
  #   - 0002 Phase A / 0001 Phase A / 0007 Phase 0 / 0009 contract freeze
  # ─────────────────────────────────────────────────────────────────
  - name: adr0000-s1-identity
    aliases: [s1-identity, node-identity, adr0000-stage1]
    requires:
      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["node_identity_substrate_present"]
          event_values: ["PASS"]
        severity: high
        label: 'The NodeId -> SourceSpan substrate exists and is consumed: the parser mints ids and a real consumer resolves locations through them'
        action: python3 scripts/run_node_identity_gate.py

      - runtime_event:
          event_kinds: [runtime_event]
          event_names: ["node_identity_span_coverage"]
          event_values: ["PASS"]
        severity: high
        label: Substrate span coverage at the codegen dispatcher holds its monotonic floor (resolved/queried, measured on a mixed corpus)
        action: python3 scripts/run_node_identity_gate.py

      - test_evidence: true
        severity: medium
        label: 'Substrate contract tests are indexed: a garbage or unset NodeId never resolves to a location, ids survive by-value node copies, and the parser demonstrably stamps forms'
        action: ctest -R node_identity_test

  # ─────────────────────────────────────────────────────────────────
  # Agent-FFI readiness — the contract the eshkol-agent depends on.
  # When this oracle goes green, the agent's three blockers (HTTP,
  # subprocess, session persistence) are all cleared on the eshkol side.
  # See plans/note-for-eshkol-agent.md for the originating ranked list.
  # ─────────────────────────────────────────────────────────────────
  - name: agent-ffi-ready
    aliases: [agent-ffi, eshkol-agent-runtime]
    requires:
      - runtime_event:
          event_kinds: [eshkol_smoke]
          event_names: ["native_http_get_works"]
          event_values: ["PASS"]
        severity: high
        label: qllm_http_get returns a real response body for live HTTPS
        action: ./scripts/run_icc_smoke.sh

