  - id: LE-13
    bucket: LOUD-ERROR
    subtag: structural
    status: open
    renumbered_from: >-
      LE-12 (collision). Filed as LE-12 on branch feat/tail-transfer-complete,
      independently of master's own LE-12 ("native curl SIGSEGVs on a
      list-returning vector field", from feat/ad-structural-gate / PR #487),
      both allocating the same next-free id in parallel — a textual merge does
      not conflict on this, only a duplicate-id count does. Moves to LE-13,
      the next id free across the whole ledger (highest prior id in use was
      LE-12): master's entry keeps LE-12, being the earlier-landed one, and
      is referenced from CMakeLists.txt and tests/ad/ad_vm_exactness_gate.sh
      comments this entry has none of.
    title: "VM: `when`/`unless`/`and`/`or` and local-allocating `let` bodies are not tail positions, so a tail call there dies at 256 frames"
    repro: >-
      Two mutually tail-recursive procedures whose tail call is spelled with
      `when` instead of `if`, run under the bytecode VM:
      `(define (wping n acc) (if (= n 0) acc (when #t (wpong (- n 1) (+ acc n)))))`
      `(define (wpong n acc) (if (= n 0) acc (when #t (wping (- n 1) (+ acc n)))))`
      `(display (wping 200000 0))` via
      `ESHKOL_VM_NO_DISASM=1 build/eshkol-vm-standalone-test`. Same for a tail
      call in a `let` body that allocated locals:
      `(define (lping n acc) (if (= n 0) acc (let ((m (- n 1))) (lpong m (+ acc n)))))`.
      The `if` spelling and the differing-arity and indirect shapes are the
      controls and all answer 20000100000.
    observed: >-
      `FRAME OVERFLOW` on stderr, empty stdout, **exit 0** — see LE-07, which is
      why this is silent to any caller that checks the exit status. Measured at
      200,000 hops; the real ceiling is ESHKOL_VM_MAX_FRAMES = 256
      (inc/eshkol/backend/vm_limits.h:30), so it fails at roughly depth 300.
    correct: >-
      20000100000. R7RS section 3.5 makes the `when`/`unless` body and the last
      operand of `and`/`or` tail positions exactly as much as the branches of
      `if`, and a `let` body inherits the tail position of the `let`.
    root_cause: >-
      The VM has no separate tail analysis; lib/backend/vm_compiler.c threads a
      boolean `tail` down compile_expr(). compile_form_when / compile_form_unless
      compile their bodies with a literal 0 rather than with `tail`, and so do
      the last operands of `and` / `or` — which additionally leave a DUP'd value
      on the stack that a tail call would strand, so those two are not a
      one-character fix. The let-family bodies drop to 0 whenever the scope
      allocated locals that need OP_POPN cleanup. This is the VM's exact
      analogue of SW-50 on the native side, still open.
    impact: >-
      NOT a gap in the tail-transfer dispatcher's coverage: the VM needs no
      dispatcher. Its call frames are a heap-allocated array in the VM struct,
      not the C stack, and OP_TAIL_CALL (lib/backend/vm_run.c) already reuses the
      current frame generically — measured, the VM ALREADY has the two shapes
      ESH-0102c fixed and could not fix on native: mutual tail recursion between
      DIFFERENT-ARITY procedures, and an INDIRECT tail call through a procedure
      parameter, both correct at 200,000 hops. The VM's `guard` handling is also
      more conformant than native's: its guard BODY is deliberately non-tail,
      which is what R7RS 7.3 requires (see SW-58). The gap is purely which
      SPELLINGS reach OP_TAIL_CALL.
    fix_requires: >-
      Propagate `tail` through compile_form_when / compile_form_unless (direct),
      and through the last operand of `and` / `or` after resolving the DUP'd
      short-circuit value. The let-family case needs the tail call to happen
      after OP_POPN, i.e. an opcode that pops N locals and tail-calls in one
      step, or the same shared tail epilogue ADR-0006 section 3 calls for on the
      native side. Wiring tests/tco/*.esk as a VM lane in run_vm_parity.sh would
      gate it, minus guard_loop_tail_test.esk and apply_loop_tail_test.esk which
      the VM fails by design.
    evidence: >-
      tests/vm_parity/found/when_tail_call_no_tco.esk (pre-existing) and
      tests/vm_parity/found/vm_tail_let_locals_no_tco.esk, with the two CONTROLS
      that bound the finding committed beside them:
      vm_tail_arity_ok.esk and vm_tail_indirect_ok.esk, both of which the VM
      answers correctly at 200,000 hops. The
      depth-parametric recursion harness has NO VM lane at all
      (scripts/run_recursion_depth.sh mentions the VM only in a comment about
      LLVM musttail), which is why a 256-frame ceiling on five tail spellings
      has no gate.
    caught_by: [esh-0102c-vm-assessment, parity-baselines]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, recursion-depth-parametric]
    notes: >-
      Bucket LOUD-ERROR follows LE-07's classification of the same
      exit-0-with-stderr shape, and LE-07's "Borderline SILENT-WRONG" note
      applies here unchanged.

  - id: SW-43
    bucket: SILENT-WRONG
    status: closed
    closed_at: "fix/native-hash-popcount-guards"
    closed_by: "branch fix/native-hash-popcount-guards"
    renumbered_from: >-
      SW-42 (collision with the open documented-limitation entry; see its renumbered_from
      for the recurring pattern). Filed as SW-42 on branch fix/native-hash-popcount-guards
      (PR #452), which already had an open DOCUMENTED-LIMITATION entry at that id (the
      referential-transparency / syntax-rules hygiene entry). Renumbered to SW-43, the next
      free id, once the collision was caught.
    title: "(popcount x) on a non-integer silently reinterprets the operand's tagged bits instead of erroring"
    repro: "(popcount \"notanumber\")"
    observed: "native: 14, exit 0, no diagnostic. VM: 0, exit 0, no diagnostic."
    correct: "a catchable type-error exception; popcount is documented (docs/tutorials/20_BITWISE_AND_SYSTEM.md, docs/API_REFERENCE.md) only for exact integers (fixnum and bignum)."
    root_cause: >-
      Native: EshkolLLVMCodeGen::codegenPopcount (lib/backend/llvm_codegen.cpp) branched
      only on `isHeapSubtype(n, HEAP_SUBTYPE_BIGNUM)`; anything not a bignum fell
      unconditionally into the int64 fast path, which unpacks the tagged value's raw i64
      payload and runs llvm.ctpop on it — for a string, that payload is the heap pointer,
      so popcount silently counted the pointer's set bits (14, an address-dependent number
      that happened to reproduce at this measurement). VM: case 2202 in
      lib/backend/vm_native.c dispatched non-bignum operands through as_number(), which
      returns 0.0 for any Value whose type is not VAL_INT/VAL_FLOAT/VAL_CHAR — so a string
      silently popcounted as if it were the exact integer 0.
    fix: >-
      Native: codegenPopcount now also computes `is_int64_pc` (base type == ESHKOL_VALUE_INT64)
      and routes to arith_->emitTypeError("popcount: expected an integer") — the same
      ArithmeticCodegen::emitTypeError() idiom used throughout this file and in
      call_apply_codegen.cpp — whenever the operand is neither that nor a bignum, before
      either path touches the operand's bits. VM: case 2202 now requires `a.type == VAL_INT`
      for the int64 fast path (bignum keeps its existing dedicated branch) and calls
      vm_raise_error_msg(vm, "popcount: expected an integer") otherwise.
    evidence: >-
      tests/v1_2_edge_cases/type_safety_test.esk — `guard`-wrapped check for
      (popcount "notanumber"), plus a regression check that (popcount 255) still answers 8.
      Manually verified at the branch head: AOT, `-r` JIT, and the VM
      (eshkol-vm-standalone-test on an emit-eskb of the same probe) all now print ERR under
      `guard` and exit 0, where they previously printed a wrong numeric answer with exit 0.
      tests/escape_matrix/arity_parity_baseline.json's popcount::wtype native-vs-VM
      divergence is resolved (both engines now agree: ERR); popcount::warity is a
      pre-existing, unrelated divergence (native hard-refuses at compile time on wrong
      arity, the VM does not) confirmed present on an unmodified master control build
      and left untouched by this fix.
    caught_by: [direct-measurement, arity-probes]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, p8-arity-sweep]
    notes: >-
      Textbook SILENT-WRONG: zero exit status, no diagnostic, a plausible-looking integer
      answer on the native side that differs by input (pointer-address-dependent), and a
      different but equally wrong answer (0) on the VM.

  - id: SW-44
    bucket: SILENT-WRONG
    status: closed
    closed_at: "fix/pybind-capsule-lifetime"
    closed_by: "branch fix/pybind-capsule-lifetime"
    family: interop/lifetime
    title: "Python bindings: a NumPy array from a tensor eval keeps no claim on the FFI context, so deleting the Context while the array is still live lets shutdown corrupt its backing memory (audit H1)"
    repro: >-
      tests/bindings/python_capsule_lifetime_test.py — construct eshkol.Context(),
      evaluate a tensor literal to get a zero-copy NumPy array, register a shutdown
      hook through the public eshkol_register_shutdown_hook() C API (the same
      documented mechanism a real embedder uses to free its own arena-backed state on
      shutdown — demonstrated in-tree by
      tests/core/runtime_shutdown_teardown_race_test.cpp) that overwrites the array's
      backing bytes, `del` the Context while the array is still referenced, then read
      the array.
    observed: >-
      pre-fix (bindings/python/eshkol_module.cpp before this branch, with the two
      enabling fixes below already applied so the module runs at all): `del ctx` calls
      eshkol_ffi_shutdown() unconditionally and immediately, synchronously running
      every registered shutdown hook before the array's own reference is ever
      released. The array's bytes are silently overwritten (0xEF fill). Exit 0, no
      diagnostic, no exception, no crash — the array just reads the wrong values.
    correct: >-
      the original tensor values ([1.0, 2.0, 3.0, 4.0] in the repro). Shutdown must be
      deferred until every NumPy array (or view/slice/reshape derived from one)
      exported from the context has been released — not merely until the Python
      `Context` wrapper object itself is deleted.
    root_cause: >-
      bindings/python/eshkol_module.cpp's ffi_value_to_python() built each tensor's
      NumPy array with a `base` capsule whose deleter was a stateless no-op ("arena
      managed") and which held no reference back to the owning eshkol_ffi_context_t.
      EshkolContext::~EshkolContext() called eshkol_ffi_shutdown() on the raw context
      pointer unconditionally, with nothing to stop that call from running while an
      exported array was still alive and referencing arena memory that a shutdown hook
      (or a future teardown path) is free to reclaim or overwrite. The comment marked
      "Zero-copy caveat (audit H1)" documented the hazard in the source but did not
      close it.
    fix: >-
      bindings/python/eshkol_module.cpp: EshkolContext now holds the context as
      EshkolCtxHandle (std::shared_ptr<eshkol_ffi_context_t> with eshkol_ffi_shutdown
      as its deleter) instead of a raw pointer. ffi_value_to_python() threads that
      shared handle through, and for every tensor it exports attaches a second,
      independent copy of the shared_ptr to the returned array's `base` capsule
      (heap-allocated, freed by the capsule's own destructor). NumPy keeps `base` alive
      for as long as the array — or any view/slice/reshape derived from it — is alive,
      so eshkol_ffi_shutdown() (the shared_ptr's deleter) only actually runs once every
      holder, including every live array's capsule, has released its reference.
      Deleting the Python Context object no longer invalidates arrays it already
      produced. Two further, narrower fixes were required to make this defect (and its
      fix) reachable and testable at all — both pre-existing, both unrelated to the
      capsule logic itself, both necessary enabling plumbing rather than new
      capability: (1) CMakeLists.txt's ESHKOL_PYTHON_BINDINGS block force-loaded only
      eshkol-static, not eshkol-repl-lib, so the eval-bridge's static-constructor
      registrar (BridgeRegistrar, lib/repl/eval_bridge_impl.cpp) was always linked out
      and eshkol_ffi_init() always failed with "JIT runtime is not linked" — the
      module never actually initialized under this build option before now; (2)
      eshkol_ffi_eval() (lib/ffi/eshkol_ffi.cpp) wrapped its result-carrying AST in a
      synthetic `(define __eshkol_ffi_result_N__ ...)` and tried to read the value
      back via lookupSymbol(), a mechanism that predates and is defeated by
      ReplJITContext::executeTagged()'s newer thread-local "last value" capture (which
      does not fire for a top-level DEFINE) — ctx->execute()'s already-correctly
      captured return value was being discarded, so every eval() unconditionally
      returned null/None regardless of the source expression. Neither (1) nor (2) is
      specific to tensors; fixing them is what let this ledger entry's repro (and the
      pre-existing tests/v1_2_edge_cases/python_ffi_test.py, 19/19 passing at this SHA
      for the first time) exercise the actual capsule code path at all.
    evidence: >-
      tests/bindings/python_capsule_lifetime_test.py, wired into ctest as
      python_bindings_capsule_lifetime (ESHKOL_PYTHON_BINDINGS=ON). Red/green
      demonstrated by hand at branch head: reverting only
      bindings/python/eshkol_module.cpp to its pre-fix content (keeping the two
      enabling fixes) reproduces the exact failure — "shutdown hook did NOT fire while
      the array was still live" and "array values are intact after del(ctx)" both
      FAIL, exit 1; restoring the fix, both PASS, exit 0. Full ctest suite 185/185 and
      tests/v1_2_edge_cases/python_ffi_test.py 19/19 pass at the same SHA (RelWithDebInfo,
      LLVM 21, arm64-apple-darwin24.1.0). Also run green under
      -DESHKOL_ENABLE_ASAN=ON -DESHKOL_ENABLE_UBSAN=ON (ASAN_OPTIONS=detect_leaks=0)
      to confirm the shared_ptr/capsule mechanism itself introduces no memory error;
      ASan does not additionally flag the repro's own poison step because it
      overwrites still-allocated memory (this ledger entry's shape is a wrong VALUE at
      exit 0, which is what SILENT-WRONG requires — a sanitizer-caught crash would be
      a LOUD-ERROR, a different bucket).
    caught_by: [maintainer-ratified-plan, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness]
    notes: >-
      The arena the tensor's data lives in is process-lifetime in the current hosted
      runtime, and no production code registers a shutdown hook against it today — so
      this was a latent hazard rather than a crash-on-every-run, and the repro
      registers its own hook through the same public, documented mechanism
      (eshkol_register_shutdown_hook) any embedder is free to use for exactly that
      purpose, which is the scenario the pre-fix "audit H1" comment warned about.
      Before this branch, ctest carried zero binding-level tests for
      bindings/python/eshkol_module.cpp — python_bindings_capsule_lifetime is the
      first. Scope: this closes only the capsule lifetime hazard. The separate
      double*-demotion / exactness-across-the-FFI-boundary issue is an explicitly
      different, still-open v1.4.0 lane and is not touched here.

  - id: SW-45
    bucket: SILENT-WRONG
    status: closed
    closed_at: "fix/vm-large-proc-define"
    closed_by: "branch fix/vm-large-proc-define"
    note: >-
      SW-44 was reserved by PR #458 (pybind capsule-lifetime fix) at the time
      this entry was first filed on the pre-#458 base; it was renumbered to
      SW-45 then, and confirmed still the next free id after rebasing onto
      origin/master with #458 merged and SW-44 present (verified via `grep -o
      'id: SW-[0-9]*b*' .icc/silent-wrong-ledger.yaml | sort -V | uniq -d`
      returning empty).
    title: "A VM procedure referencing more than 16 distinct top-level procedures silently corrupts the next top-level define"
    repro: >-
      A single bytecode-VM procedure that calls 17 or more DISTINCT other
      top-level procedures (each such call resolves as a free-variable
      reference through the same upvalue-capture machinery as any other
      captured name, so the procedure's own closure must relay one upvalue
      per distinct name) compiled and ran fine — the corruption showed up in
      the TOP-LEVEL DEFINE COMPILED RIGHT AFTER IT. Minimal form: 17
      `(define (helperK x) ...)` procedures, one `(define (big i) (+ i
      (helper0 i) ... (helper16 i)))`, then `(define (probe x) (+ x 1))`;
      calling `(probe 41)` failed. Discovered via
      tests/memory/vm_region_evac_subtype_coverage_test.esk on
      feat/vm-region-evacuator, whose phase-2 fixture originally called ~20
      distinct constructor procedures (make-fact, make-kb, make-workspace,
      tensor, ...) from one procedure; its header documents the same defect
      and the two-procedure split used as a workaround, which this fix makes
      unnecessary (verified: tests/vm/closure_upvalue_capacity_surface_regression.esk's
      case C re-merges that exact shape into one procedure and passes).
    observed: >-
      Calling the procedure defined immediately after the big one raised
      "ERROR: calling non-function at pc=... argc=... type=0" (VAL_NIL in the
      minimal repro; a stray leaked upvalue Value in general — the original
      report's "reads back as an integer" is a different manifestation of the
      identical leak: which stray operand-stack value lands in the corrupted
      slot depends on what else was on the stack at the time). Exit path was
      always through a hard runtime error in every reproduction attempted, but
      the value corruption itself carried NO diagnostic and would have exited
      0 (a `define` bound to a non-closure value only fails when something
      tries to CALL it; a define whose corrupted value happens to go unused
      would silently carry the wrong value with exit 0). Preceded by "UPVALUE
      INDEX OUT OF BOUNDS" on stderr from an unrelated GET_UPVALUE access,
      itself a symptom of the same stack desync.
    correct: >-
      The procedure compiled right after a large procedure must always read
      back as its own closure, regardless of how many distinct top-level
      procedures the large procedure calls, up to the documented capacity;
      beyond that capacity the compiler must refuse to compile at all rather
      than emit a program that runs with a missing capture.
    root_cause: >-
      Two independent limits on the same quantity, never kept in sync. The
      compiler's per-scope upvalue cap (MAX_UPVALUES, lib/backend/vm_parser.c)
      was 32, enforced when registering a new upvalue in the free-variable
      resolution walk (lib/backend/vm_compiler.c, both the plain-reference
      path in compile_expr_impl and the compile_form_set_bang path). The
      RUNTIME closure representation (HeapObject.closure.upvalues[16] /
      open_slots[16] in lib/backend/vm_core.c) was fixed at HALF that, 16, and
      nothing enforced parity between the two. A closure needing 17-32
      upvalues compiled cleanly under the 32 cap: the compiler emitted exactly
      that many upvalue-capture push instructions (OP_GET_LOCAL/OP_GET_UPVALUE)
      followed by one OP_CLOSURE encoding the true count in its operand. At
      runtime, OP_CLOSURE (lib/backend/vm_run.c, both the computed-goto
      dispatch's lbl_CLOSURE and the switch dispatch's case OP_CLOSURE)
      silently clamped that count to 16 (`if (n_upvalues > 16) n_upvalues =
      16;`) and then only popped the CLAMPED count of values off the operand
      stack (`for (int i = n_upvalues - 1; i >= 0; i--) { ...upvalues[i] =
      vm_pop(vm); }`) — leaving the excess (count - 16) values the compiler
      had already pushed permanently stranded on the stack. Every stack-slot
      offset the compiler had computed at compile time for the rest of the
      program (every subsequent top-level define's binding slot, every local
      variable's frame offset) assumed those values would be consumed; from
      that point on the runtime stack held (count - 16) more live values than
      the compiler's bookkeeping expected, so the next top-level `define`'s
      OP_SET_LOCAL/local-slot bookkeeping landed on a slot that actually held
      one of the stranded values instead of the newly constructed closure.
    fix: >-
      inc/eshkol/backend/vm_limits.h now defines
      ESHKOL_VM_MAX_CLOSURE_UPVALUES=32 as the single shared constant: it is
      aliased to MAX_UPVALUES for the compiler (lib/backend/vm_parser.c) and
      used directly to size HeapObject.closure.upvalues[]/open_slots[] in
      lib/backend/vm_core.c, so the two limits cannot diverge again (a
      `#error` guards it against ever exceeding the CLOSURE instruction's
      8-bit upvalue-count operand field). lib/backend/vm_run.c's two
      OP_CLOSURE handlers no longer clamp: if the encoded count ever exceeds
      the shared capacity (only reachable via a corrupted or
      build-mismatched .eskb, since the compiler now enforces the identical
      bound) they report a fatal runtime error and refuse to run rather than
      silently popping fewer values than were pushed. lib/backend/vm_native.c's
      upvalue-closing loop (native 252, letrec-style leaked-closure handling)
      had the same hardcoded 16 and is fixed the same way. Symmetrically,
      lib/backend/vm_compiler.c's two upvalue-registration sites (the
      plain-reference read path and the `set!` path) now call
      vm_compile_error() and fail the whole compilation — via the existing
      fail-closed g_vm_compile_failed flag both compile drivers already
      checked (eshkol_vm.c's JIT-run and ESKB-emit paths) — when a scope
      would need MORE than the shared capacity, instead of leaving that
      upvalue's index at -1 and continuing.
    evidence: >-
      tests/vm/closure_upvalue_capacity_surface_regression.esk (wired into
      scripts/run_vm_surface_tests.sh's existing *_surface_regression.esk
      glob, no script change needed): case A pins the historical minimum (17,
      one past the old 16-slot capacity), case B pins the full new capacity
      (32) as a margin so the fix is not merely correct at the boundary, and
      case C re-merges the original evacuator-fixture shape (20 distinct
      `vector-set!` constructor calls in one procedure) into a single
      procedure and checks the define compiled right after it. All three
      check BOTH the big procedure's own return value and that the following
      define is callable and correct.
      tests/closures/closure_upvalue_capacity_ok_test.esk (32, must run
      correctly) and closure_upvalue_capacity_overflow_test.esk (33, must
      fail the compile loudly) are exercised by
      tests/closures/closure_upvalue_capacity_overflow_gate.sh, wired into
      CTest as closure_upvalue_capacity_overflow_gate, covering both the
      in-process compile-and-run path (eshkol-vm-standalone-test <src.esk>)
      and the two-step build path (eshkol-run --profile hosted-vm
      --emit-eskb, then load and run the .eskb) so the ESKB writer/reader
      round-trip is covered too. ICC probe eshkol-vm-large-proc
      (scripts/run_icc_smoke.sh) runs both and requires all three surface
      cases to print PASS with no ERROR/FAIL, plus a clean run of the
      overflow gate.
    caught_by: [region-evacuator-fixture-development]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-surface-regression-suite, vm-parity]
    notes: >-
      The evacuator fixture's own header (tests/memory/vm_region_evac_subtype_coverage_test.esk
      on feat/vm-region-evacuator) had already named this defect precisely —
      "a single procedure carrying all twenty constructors trips an unrelated
      VM binding-slot defect (the following top-level `define` reads back as
      an integer)" — and worked around it by splitting phase 2 across
      `heavy-a`/`heavy-b` rather than fixing it, since fixing the VM compiler
      was out of scope for that branch. This entry closes the root cause so
      that workaround is no longer necessary (though the evacuator branch
      itself is untouched by this fix). Reproduces identically with `begin`
      in place of `with-region`, confirming it has nothing to do with
      regions — it is purely a function-body-size-driven upvalue count.

  - id: SW-50
    bucket: LOUD-ERROR
    subtag: structural
    status: fixed
    closed_at: "73cc7cbb"
    closed_by: "branch feat/s4-abi-tail (ADR-0000 Stage 4)"
    note: >-
      Filed as SW-50, not SW-46: ids SW-46 through SW-49 are taken or reserved
      by the in-flight PRs #466 / #473 / #474 at the time of filing, and this
      branch is cut from origin/master 73cc7cbb where the highest id present is
      SW-45. Verified next-free with `grep -o 'id: SW-[0-9]*b*'
      .icc/silent-wrong-ledger.yaml | sort -V | tail -3`.
      Bucket is LOUD-ERROR, not SILENT-WRONG: the defect crashes with the
      runtime's fatal-signal diagnostic and a non-zero exit, so it never
      returned a wrong value. It is filed anyway because it is an R7RS section
      3.5 conformance defect (proper tail calls MUST run in constant space),
      and because its shape — an analysis whose ORACLE was wider than its
      TRAVERSAL — is the reusable lesson.
    title: "Mutual tail recursion spelled with cond/case/when/unless/and/or was not tail-call optimized and exhausted the stack"
    repro: >-
      Two mutually tail-recursive procedures, written with `cond` instead of
      `if`, driven past a few million hops:
      `(define (ping n acc) (cond ((= n 0) acc) (else (pong (- n 1) (+ acc n)))))`
      `(define (pong n acc) (cond ((= n 0) acc) (else (ping (- n 1) (+ acc n)))))`
      `(display (ping 5000000 0))`.
      The byte-identical program with `if` in place of `cond` is the control and
      runs flat. Same result for `when`, for `(or #f …)`, and for a 3-cycle
      written with `cond`. Committed as the depth-parametric probes
      tests/recursion_depth/generated/rec_mutual_tail_cond_d*.esk and
      rec_mutual_tail_forms_d*.esk (generator: scripts/gen_recursion_depth.py).
    observed: >-
      exit 138 (SIGBUS, 128+10) on arm64-apple-darwin24.1.0, with the runtime's
      fatal-signal handler printing "[Eshkol] fatal signal: SIGBUS (bus error)
      … this is most likely a stack overflow (recursion too deep)". Measured
      ceiling: the cond/when/or/3-cycle spellings passed at 500,000 hops and
      died between 500,000 and 5,000,000, while `if` passed 5,000,000. The
      difference is visible directly in the emitted IR for the same program
      (`eshkol-run --dump-ir -O0`): `musttail call %eshkol_tagged_value @pong`
      for the `if` spelling versus a plain `call %eshkol_tagged_value @pong`
      — not even a `tail` hint — for the `cond` spelling.
    correct: >-
      R7RS section 3.5 makes the selected `cond`/`case` clause, the `when`/
      `unless` body and the last operand of `and`/`or` tail positions exactly as
      much as the branches of `if`. A mutual tail call must therefore run in
      constant stack in all six spellings, not only in `if`.
    root_cause: >-
      Two collaborating functions in lib/backend/llvm_codegen.cpp disagreed
      about which forms have tail positions, and nothing made them agree.
      collectMutualTailCallSites() is the WALKER that offers candidate call
      sites to the mutual-TCO lowering in codegenCall; isInTailPosition() is the
      ORACLE that confirms each offer. The oracle already handled COND_OP,
      CASE_OP, WHEN_OP, UNLESS_OP, AND_OP, OR_OP and GUARD_OP (and had
      handled cond and guard since ESH-0211 / ESH-0222 respectively), but the
      walker's switch descended only into CALL_OP("if"), CALL_OP("begin"),
      IF_OP, SEQUENCE_OP and the four LET forms, with `default: break` swallowing
      everything else. A tail call sitting in a cond clause was therefore never
      inserted into mutual_tail_call_sites_ at all, so codegenCall's
      `mutual_tail_call_sites_.count(op)` guard failed and the site fell through
      to the ordinary-call path — one native frame per hop. The self-tail path
      was unaffected because it uses a different walker
      (TailCallCodegen::allSelfCallsInTailPosition), which DOES handle all six;
      that asymmetry is why the same six spellings TCO'd fine for self recursion
      (documented as fixed in v1.3.3-evolve) and silently did not for mutual
      recursion.
    fix: >-
      collectMutualTailCallSites() now descends into COND_OP, CASE_OP, WHEN_OP,
      UNLESS_OP, AND_OP and OR_OP, mirroring form for form the tail rules
      isInTailPosition() already encodes. GUARD_OP is deliberately still not
      descended into, and the reason is recorded at the site: `musttail`
      discards the caller frame outright, which would skip the handler-stack pop
      that leaving a `guard` owes. Self-TCO can treat a guard body as tail
      because it branches to a loop header with that bookkeeping intact
      (ESH-0222); a mutual musttail cannot.
    evidence: >-
      Two new depth-parametric kinds in scripts/gen_recursion_depth.py, run by
      scripts/run_recursion_depth.sh (pillar P6b) on BOTH the JIT and AOT lanes:
      `mutual_tail_cond` (2-cycle spelled with cond) and `mutual_tail_forms`
      (4-cycle that routes its tail call through a DIFFERENT form at each hop —
      cond, then when, then or, then case — so a regression in any single form
      fails the gate). Both ladders are 500,000 / 5,000,000 / 100,000,000 and
      all cells are EXPECT pass, because a proper tail call is required to be
      unbounded: a CLEAN-LIMIT in these cells is the regression, which is the
      deliberate calibration difference from the `non_tail` kind. Measured after
      the fix: 100,000,000 hops, correct triangular-number value, exit 0, ~3-5 s,
      on JIT and AOT alike.
    caught_by: [adr-0000-stage-4-review, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, recursion-depth-parametric]
    notes: >-
      recursion-depth-parametric is in missed_by even though it is the harness
      that now catches this: its mutual_tail2 / mutual_tail3 kinds were both
      written with `if`, so the pillar had a 5,000,000-hop cell for the one
      spelling that worked and no cell at all for the five that did not. A
      depth sweep that only exercises the canonical spelling of a construct
      measures the spelling, not the construct.
      NOT fixed by this entry, and now documented in
      docs/reference/language/tail-calls.md rather than left to be discovered:
      mutual tail calls still fall back to a bounded ordinary call when the two
      procedures have DIFFERING SIGNATURES (musttail requires identical
      parameter counts and types), when the call is INDIRECT (through a
      procedure value rather than a name), when an argument points into the
      caller's frame (a forwarded stack-allocated closure), through `guard`, and
      on non-AArch64 targets where LLVM 21 refuses aggregate-return musttail
      (ESH-0171). Each of those was measured on this branch at 5,000,000 hops
      and each fails LOUDLY with the same fatal-signal diagnostic.
    followup: >-
      ESH-0102c (branch feat/tail-transfer-complete) closes two of those five
      with the tail-transfer dispatcher: DIFFERING ARITIES (probe
      `mutual_tail_arity`, 100,000,000 hops flat on JIT and AOT) and NON-AArch64
      TARGETS (the harness's `aot-xfer` lane, same depth). It leaves INDIRECT
      tail calls and CALLER-FRAME POINTER arguments bounded and loud, with the
      requirement for each recorded in docs/design/MUTUAL_TAIL_CALLS.md, and it
      REFUTES the `guard` item: a call in a guard body is not in a tail context
      under R7RS 7.3 at all, so optimizing it is not merely hard but wrong. See
      SW-58, which is the conformance consequence of the sibling decision on the
      self-TCO side.

  - id: SW-58
    bucket: SILENT-WRONG
    status: open
    title: "Self tail recursion through `guard` collapses the handler chain, so a re-raise reaches the wrong handler"
    repro: >-
      A self-recursive procedure whose recursion sits in a `guard` body, where
      the innermost handler re-raises:
      `(define (outer n) (guard (e (#t 'outer)) (s n)))`
      `(define (s n) (guard (e ((= n 0) (raise 'again)) (#t (list 'inner n)))`
      `                (if (= n 0) (raise 'boom) (s (- n 1)))))`
      `(display (outer 3))`.
      Committed as
      tests/tco/guard_tail_context/04_reraise_reaches_enclosing_guard.esk,
      alongside three control fixtures (01/02/03) on which Eshkol and the
      reference AGREE. That directory's README carries the reference answers,
      the measurement commands, and why these are deliberately not wired into
      scripts/run_tco_tests.sh (that runner gates on a clean exit, which this
      defect passes).
    observed: >-
      Eshkol prints `outer`, exit 0, no diagnostic — on the JIT and AOT alike,
      and on origin/master as well as on the ESH-0102c branch, so this is not
      introduced by either.
    correct: >-
      `(inner 1)`. Measured on chibi-scheme 0.12 (R7RS reference implementation)
      with the identical program. R7RS 7.3 derives `guard` from
      `with-exception-handler` wrapping the body, so each activation of `s`
      installs its own handler and they NEST: at n=0 there are four live guards.
      The n=0 clause re-raises, which R7RS raises in the dynamic environment of
      that guard's outer context — the n=1 guard, whose `n` is 1, so its `#t`
      clause answers `(inner 1)`. `outer` should never be reached.
    root_cause: >-
      ESH-0222 made isInTailPosition() and
      TailCallCodegen::allSelfCallsInTailPosition() treat a `guard` BODY as a
      tail position, so a self-call there is turned into a branch to the loop
      header, and emitTCOBackEdge() (lib/backend/llvm_codegen.cpp) drains
      `tco_ctx.open_guard_handlers` pops before branching. One activation with a
      mutated `n` therefore replaces the four nested activations, and with them
      the three enclosing handlers the re-raise was supposed to find. The
      handler-stack draining is correct FOR A LOOP; what is wrong is treating
      the position as tail at all. R7RS's tail-context grammar (7.1.3) does not
      list `guard`, and it cannot: the handler's whole purpose is to be in
      effect while the body runs.
    impact: >-
      Confined to programs where a guard handler RE-RAISES (or otherwise depends
      on an enclosing guard of the same recursive procedure). The common shapes
      agree with the reference: a guard that simply catches answers identically,
      because the innermost activation's own guard is the one that fires either
      way — verified on three further fixtures (guard_sem1/2/4) where Eshkol and
      chibi both answer `(caught-by-a 0)`, `(gb 0)` and `inner`.
    fix_requires: >-
      A `guard` frame that survives without a native frame — its handler held as
      a heap-owned continuation the driver can invoke rather than a `setjmp`
      landing pad in a frame the transform destroys (ADR-0006 §4,
      "make continuations explicit and heap-owned"). Reverting ESH-0222 instead
      would restore conformance at the cost of the resident-tick-loop capability
      it shipped for (docs/LONG_RUNNING_LOOPS.md), i.e. trade a rare wrong
      answer for a common crash, so it is not the fix.
    evidence: >-
      Differential against chibi-scheme 0.12 on four fixtures, three agreeing
      and one diverging; the diverging one is guard_sem5. The same differential
      is what stopped ESH-0102c from extending the tail-transfer dispatcher
      through `guard` on the mutual side — the mechanism worked, the semantics
      did not.
    caught_by: [esh-0102c-guard-soundness-differential, reference-differential]
    missed_by: [icc-correctness-chain, icc-smoke, ctest, recursion-depth-parametric, vm-parity]
    notes: >-
      Filed as SW-58: SW-46..SW-50 are taken or reserved by #466 / #473 / #474
      and the S4 lane, and SW-51 / SW-52 are taken by in-flight #480. Verified
      next-free with `grep -o 'id: SW-[0-9]*b*' .icc/silent-wrong-ledger.yaml |
      sort -V | tail -3` plus that PR's body.
      recursion-depth-parametric is in missed_by for the same reason it was in
      SW-50's: its `guard` kind measures how DEEP a guard can nest, not which
      handler answers. A depth sweep cannot see a semantic defect that costs no
      stack.
    waiver:
      reason: >-
        Pre-existing on master, not introduced by ESH-0102c, and narrow: it
        requires a guard handler that re-raises into an enclosing guard of the
        same self-recursive procedure. The fix is the heap-owned continuation
        rework named in fix_requires, which is a trajectory item (ADR-0006 §4)
        rather than a patch, and guessing at it is exactly the silent-wrong risk
        this ledger exists to prevent.
      expires: "2027-12-31"
      owner: tsotchke

  - id: SW-57
    bucket: SILENT-WRONG
    status: closed
    closed_at: "fix/resident-rss-longrun"
    closed_by: "branch fix/resident-rss-longrun"
    renumbered_from: >-
      SW-49 (collision). SW-45 was the highest id on origin/master when this
      entry was originally filed, with SW-46/SW-47/SW-48 reserved by
      in-flight PR #466 and deliberately skipped, so it took SW-49 — verified
      at the time with the usual duplicate-id scan returning empty. Master's
      own vm/prelude-cache entry (28 builtins stale) independently landed
      under the SAME id SW-49 in the meantime (a textual merge does not
      conflict on this), so on rebase this entry moves to SW-57, the next id
      free across the whole ledger (highest prior id in use was SW-52);
      master's entry keeps SW-49, being the earlier-landed one.
    title: "A resident daemon loop leaks 48 bytes per tick forever: every `guard` entry takes a handler frame that is never given back"
    repro: >-
      Any resident tick loop in the shape this project documents for daemons —
      a self-tail `define` loop wrapped in a catch-all `guard` error boundary —
      whose body performs ANY barriered persistent mutation (`vector-set!`,
      `hash-table-set!`, `set-cdr!`, or `set!` of a global). The stored value
      does not matter: storing a plain fixnum into a FIXED vector slot leaks at
      the same rate as storing a freshly consed list. Minimal form:
      `(define ws (make-vector 64 0))
       (define (tick i) (guard (e (#t i))
         (if (>= i ticks) i (begin (vector-set! ws 0 i) (tick (+ i 1))))))`
      compiled AOT with `eshkol-run` and run at increasing tick counts.
      Discovered by the public benchmark suite's axis-3 flat-RSS sweep (PR #469,
      bench/axes/03_flat_rss.sh), which extended the published 100k-tick point
      to 400k; reproduced independently here with a from-scratch harness
      (fixtures, runner and reducer all separate from the bench code).
    observed: >-
      Peak RSS grows linearly with tick count, without bound and with no
      diagnostic, exit 0 throughout. Independent reproduction, native AOT,
      one fresh process per point: 11.98 MB at 10k ticks, 23.78 at 50k, 37.42
      at 100k, 64.50 at 200k, 120.12 at 400k, 229.92 at 800k, 449.56 at 1.6M —
      dead linear at 287.9 bytes/tick over a 160x span, no plateau. Of that,
      48.0 bytes/tick is this entry (one handler frame per guard ENTRY) and
      240.0 bytes/tick is the fixture legitimately publishing five fresh cons
      cells per tick. The guard-frame half is present with NO allocation
      escaping at all: an immediate-store loop, which publishes nothing,
      still grew 40.0 bytes/tick of measured RSS (48 bytes of arena, one frame
      rounded to the arena's alignment).
    correct: >-
      A resident loop whose per-tick allocation is transient, and whose stores
      into persistent state publish nothing freshly allocated, must retain
      EXACTLY zero bytes per tick, indefinitely — the daemon promise Eshkol's
      no-GC memory model is built on ("a daemon ends exactly as large as it
      started"). The presence or absence of a `guard` around the loop body must
      not change that by one byte.
    root_cause: >-
      A lifetime/allocator mismatch, plus an accident that hid it.

      `eshkol_push_exception_handler` (lib/core/runtime_exceptions_hosted.cpp)
      bump-allocated one `eshkol_exception_handler_t` (5 words = 40 bytes, 48
      after arena alignment) out of `__repl_shared_arena` — the TRUE
      process-global arena, which AOT codegen installs at startup
      (lib/backend/llvm_codegen.cpp, the non-REPL branch of the arena-init step)
      and which region entry deliberately never hijacks.
      `eshkol_pop_exception_handler` unlinked the frame and returned the memory
      to nobody, by explicit design: "Note: If allocated from arena, memory is
      automatically freed with arena / If from heap, we leak here - but
      exception handlers should be short-lived".

      That assumption is false for exactly the shape the language most loudly
      supports. A guard around a tick-loop body is ENTERED once per tick,
      forever, so the frames are not short-lived in aggregate — they accumulate
      one per tick in an arena that is never reset. The chain itself stays
      balanced (ESH-0222 already drains `open_guard_handlers` pops at the TCO
      back edge, and the guard's handler block pops on the exception path), so
      nothing observable went wrong: the bytes were simply never reusable.

      Why nobody saw it. ESH-0214b's iter-scope reclamation rewinds the GLOBAL
      arena's bump pointer at each back edge, and the handler frame lives in
      that arena — so it was reclaimed as a SIDE EFFECT and a non-mutating tick
      loop measured perfectly flat. ESH-0214e then lowered every
      persistent-mutation tick loop (i.e. every real daemon) through a NURSERY
      REGION instead, and `eshkol_iter_nursery_recycle` resets only the nursery
      arena. From ESH-0214e onward, guard frames in the daemon shape were never
      reclaimed by anything. Measured both ways on the same binary: with
      `ESHKOL_NO_ITER_SCOPE=1` the immediate-store loop retains 39.0 MB at 800k
      ticks and with iter-scope ON it retains 39.3 MB — the nursery gave that
      loop no benefit at all, which is the signature of an allocation outside
      the span it resets.
    fix: >-
      lib/core/runtime_exceptions_hosted.cpp: handler frames now come from a
      `thread_local` LIFO FREE LIST owned by the exception subsystem.
      `eshkol_pop_exception_handler` returns the frame to the list (it is dead
      the instant it leaves the chain — `g_exception_handler_stack` is its only
      owner, and only push/pop/raise in that one file ever read it);
      `eshkol_push_exception_handler` reuses a frame before it allocates. Frames
      are malloc-backed and NEVER arena-backed: an arena frame is not merely
      unreclaimed, it is unsafe to recycle, because an iter-scope or region
      rewind can retract the span a pooled frame sits in and handing that
      address back out would alias a fresh object. Steady-state allocation per
      guard entry is therefore zero, and total frame memory is bounded by peak
      guard NESTING DEPTH rather than by guard ENTRY COUNT. The free list is
      thread-local so a concurrent push/pop on another thread cannot corrupt it.

      lib/core/runtime_arena_diagnostics_hosted.cpp: adds `ESHKOL_ARENA_REPORT=1`,
      which prints the process-global arena's own `total_allocated` once at exit
      (`[eshkol-arena] global_total_allocated_bytes=N`). Diagnostic only, off by
      default, no effect on allocation. It lives in the hosted diagnostics file
      beside the `ESHKOL_ARENA_POISON` switch because the arena core is
      freestanding-clean and may not call getenv() (enforced by
      runtime_core_boundary_test).
    evidence: >-
      tests/memory/resident_longrun_flat_gate.sh, a NEW gate that fixes both
      weaknesses that let this through. (a) Every pre-existing flat-memory gate
      stops at 100 000 ticks and asserts a peak-RSS CEILING; one point cannot
      distinguish "flat" from "linear with a small slope", and 48 bytes/tick is
      4.6 MB over 100k ticks — invisible under
      iter_scope_partial_reclaim_test.sh's 150 MB ceiling, but 3.1 GB over a
      week-long daemon run. This gate measures at TWO horizons (200k and 1.6M by
      default, 8x apart) and gates on the SLOPE. (b) It reads the exact arena
      byte counter rather than peak RSS, because `maximum resident set size` is
      a high-water mark of INSTANTANEOUS residency: under memory pressure the
      compressor evicts pages and the recorded maximum comes back LOWER than
      what the process retains. The same binary measured 97 MB and 193 MB on
      consecutive runs of a 24-core host at load average ~200 — a peak-RSS leak
      gate is quietest exactly when CI is busiest.

      Section A gates the four barriered mutation channels plus a pure-transient
      loop, each inside the catch-all `guard`, and requires BYTE-IDENTICAL arena
      totals at both horizons — not "within a factor". Section B pins the
      published-bytes rate of the ESH-0214e fixture shape (5 fresh cons/tick) to
      a 320 bytes/tick ceiling against a measured 240.0, so a re-introduced
      per-iteration leak cannot hide inside legitimate publishing.

      Verified to CATCH the defect: with only lib/core/runtime_exceptions_hosted.cpp
      reverted to its pre-fix content and everything else unchanged, section A
      fails all four channels at 40.024 bytes/tick and section B reports 288.0
      instead of 240.0. With the fix, all five section-A rows report 0.000
      bytes/tick with identical totals (917504 bytes at both 200k and 1.6M).

      Wired as ICC probe `resident_longrun_flat` (scripts/run_icc_smoke.sh) and
      as the `resident-longrun` job in .github/workflows/adversarial-nightly.yml,
      which runs the same gate at a 6.4M-tick horizon. All eight pre-existing
      tests/memory/ gates re-run green with the fix in place, including
      iter_scope_partial_reclaim_test.sh (whose ESHKOL_ARENA_POISON=1 tripwire
      run confirms the recycled frames introduce no dangling pointer).
    caught_by: [public-benchmark-suite-axis3]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, memory-gates, flat-rss-gates]
    build_item: >-
      OPEN, and deliberately NOT a weakening of the flat-memory claim. With this
      entry closed, the only remaining growth in a resident loop is bytes the
      program deliberately PUBLISHES: a tick that allocates a fresh heap object
      and stores it into a persistent slot retains that object (48 bytes/cons,
      144 bytes for an 8-element vector), because the value it supersedes is
      dead the instant it is overwritten but nothing can prove it unshared. A
      second, smaller instance of the same shape was measured while closing this
      entry and is documented rather than hidden: each `raise` allocates a
      condition object from the global arena and never gets it back, at exactly
      71.996 bytes per raise (200k vs 1.6M raises), so a resident loop whose
      error boundary FIRES every tick grows even though one whose boundary
      merely STANDS every tick is now exactly flat. It is not folded into the
      fix above because a condition object is user-reachable — for `(error ...)`
      it is what the handler's variable binds to — so recycling it needs the
      same liveness proof as row three, and guessing at one here is precisely
      the silent-wrong risk this ledger exists to prevent. The
      claim's conditions are now stated exactly — see
      docs/reference/runtime/memory-model.md "What is flat, and what is not",
      which gives the three-row matrix, names the workload class that is flat
      (zero bytes/tick, gated) and the class that is not, and shows how to write
      a genuinely flat resident loop. Removing the boundary itself needs either
      a store barrier that can retire a persistent slot's previous occupant when
      an ownership/uniqueness result proves it unshared (the OALR ownership
      layer is the natural home), or a compacting pass over persistent slots.
      Until then the third row is a documented design boundary with a measured
      rate, not an unquantified caveat.
    notes: >-
      The finding as originally reported ("flat at the published 100k point,
      119 MB by 400k") was TRUE as stated and as originally measured — no
      published number was false, and the 34 MB figure reproduces. What did not
      hold was the INTENT behind it. Splitting the measured slope into its two
      causes is what made the difference actionable: 48 bytes/tick was a genuine
      leak with no legitimate owner and is now zero, while 240 bytes/tick is the
      program's own publishing and is now documented with its exact rate rather
      than implied away.
  - id: SW-54
    bucket: SILENT-WRONG
    status: closed
    closed_at: "ced761fd"
    closed_by: "branch fix/v135-correctness-debt (PR: v1.3.5 correctness debt)"
    family: reader/quoted-data
    renumbered_from: >-
      SW-46 (collision). Filed as SW-46 on branch fix/v135-correctness-debt,
      independently of two OTHER branches that each also claimed SW-46 in
      parallel (feat/linearity-complete, renumbered to SW-53, and
      feat/ad-structural-gate, which keeps SW-46 as the rightful holder per
      SW-47's own reservation note and its external cross-references). Moves
      to SW-54, the next id free across the whole ledger after SW-53. The two
      sibling entries below (originally filed as SW-47, SW-48 in the same
      commit) move to SW-55 and SW-56 for the same reason and are renumbered
      together so this family's internal cross-references stay consistent.
    title: "native: a quoted vector literal is dropped by the reader, so a function body containing (or X '#()) answers () for every input"
    repro: >-
      (define (g x) (or x '#()))
      (display (g 7))
      — build/eshkol-run -r, and the same file compiled AOT with -o. Also
      tests/v1_3_edge_cases/quoted_datum_kinds_test.esk, whose first block is exactly
      this shape.
    observed: >-
      `()`. Exit 0, empty stderr, no diagnostic. (vector? (g 7)) is #f and
      (null? (g 7)) is #t on both native axes — the argument is gone, not merely
      mis-printed. This is the residue of #229 that ICC's capability roadmap ranks
      first (.icc/assistant-goals.yaml::or-null-miscompile-root-cause, "the codegen
      path that replaces a function body containing (or X null-literal) with return
      null"); the earlier #229 fix repaired the and/or ARGUMENT loops, one layer above
      the surviving hole. The blast radius is wider than `or`: any quoted vector
      literal anywhere is affected, and where its abandoned tokens do NOT balance the
      failure flips from silent to loud — '#(1 2) at top level swallowed the rest of
      the file and died with "source parsing failed; refusing to compile a truncated
      program", which is why the defect read as two unrelated bugs.
    correct: >-
      7 — `or` returns its first non-#f operand. And, per R7RS 7.1.2 (<vector> is a
      <datum>), (vector? '#(1 2)) is #t, (vector-length '#()) is 0, and
      (vector-ref '#(9 8) 1) is 8. chibi-scheme 0.12.0 agrees on every row.
    root_cause: >-
      lib/frontend/parser.cpp parse_quoted_data_with_token() dispatched on exactly two
      token kinds — TOKEN_LPAREN and TOKEN_QUOTE — and sent every other token to
      parse_atom(). parse_atom() has no case for TOKEN_VECTOR_START, TOKEN_BACKQUOTE,
      TOKEN_COMMA or TOKEN_COMMA_AT: it returns an empty node AND leaves the datum's
      own tokens unconsumed in the stream. Whether that is silent or loud is decided
      by whether the abandoned tokens happen to balance. `'#()` leaves exactly one,
      the `)` the enclosing form wanted anyway, so the program compiles clean and the
      quoted datum has silently become `()`. `'#(1 2)` leaves `1 2 )`, which
      desynchronises the reader and truncates the program. This is the identical
      partial-dispatch shape #229 fixed in the `and` / `or` argument loops
      (`if LPAREN parse_list else parse_atom`), surviving one layer deeper in the
      quoted-data reader.
    fix: >-
      lib/frontend/parser.cpp: parse_quoted_data_with_token() now gives every legal
      datum token a branch. TOKEN_VECTOR_START reads a quoted vector into the same 1-D
      ESHKOL_TENSOR_OP the quasiquote reader already builds, recursing through
      parse_quoted_data_with_token so elements stay DATA (symbols stay symbols).
      TOKEN_BACKQUOTE / TOKEN_COMMA / TOKEN_COMMA_AT join TOKEN_QUOTE in wrapping
      their datum in the matching homoiconic op, so '(a ,b) reads as the list
      (a (unquote b)) per R7RS 4.1.2 — exactly as ''a already read as (quote a), and
      codegenQuotedOperation already had the arms to render all three.
      lib/backend/llvm_codegen.cpp: codegenQuotedOperation() gains an ESHKOL_TENSOR_OP
      arm that materialises the elements as a list and vectorises it through
      eshkol_list_to_vector_sret — the same machinery codegenQuasiquote's vector
