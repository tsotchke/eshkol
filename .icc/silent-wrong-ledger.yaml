      divergent-program and regression counts. scripts/check_engine_parity_threshold.py
      fails closed when that payload is absent, below its floor, or exceeds the allowed
      new-divergence count of zero. The architecture model documents that ICC's generic
      exercise checker remains presence-only and requires this companion threshold gate.
