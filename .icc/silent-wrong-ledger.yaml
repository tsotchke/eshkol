  - id: SW-24
    bucket: SILENT-WRONG
    status: closed
    closed_at: "c025e209"
    closed_by: "PR #429 (branch fix/map-shadowing-resolution)"
    title: "The VM ignores a user redefinition of + : opcode dispatch bypasses the user binding"
    repro: "(define + (lambda (a b) (* a b))) (display (+ 3 4))"
    observed: "VM 7"
    correct: "12 — native answers 12"
    observed_after: >-
      the VM answers 12, and tests/parser/test_function_shadowing.esk prints
      "PASS: Function shadowing works!" on both engines. vm_head_user_rebound()
      (lib/backend/vm_compiler.c) walks the scope chain before any of
      compile_expr's builtin fast paths: a head symbol bound by USER code — a
      local of any chunk on the chain, or a root-chunk slot at or above the
      user-locals watermark — compiles as a plain call through that binding.
      Preamble and prelude slots sit BELOW the watermark and keep the fast
      paths, so the stdlib cannot be hijacked and the prelude compiles exactly
      as before; a watermark of 0 means user code has not started, so nothing
      counts as a rebinding while the prelude itself is being compiled.
    fixed_by: "PR #429 (branch fix/map-shadowing-resolution) — vm_head_user_rebound() in lib/backend/vm_compiler.c"
    evidence: >-
      tests/codegen/operator_rebinding_test.esk on the JIT, AOT and VM ctest lanes
      (operator_rebinding_{jit,aot,vm}_smoke);
      tests/differential/corpus/46_operator_rebinding.esk on the native axes;
      tests/parser/test_function_shadowing.esk REMOVED from
      ENGINE_PARITY_BASELINE.json divergent_programs — the parity ratchet
      tightens rather than the gate being told to expect the divergence.
      Revert-validated: reverting vm_compiler.c alone reproduces VM 7.
    caught_by: [parity-baselines, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, KNOWN_ISSUES]
    notes: >-
      THE SAME ROOT CLASS AS SW-01 AND SW-02. Name resolution does not respect shadowing,
      and it surfaces on both engines in different subsystems: native ignores the shadowing
      binding in AD (SW-01) and in map (SW-02); the VM ignores it in arithmetic opcode
      dispatch (this entry). Treat the three as one defect family with one root cause, not
      as three unrelated tickets. A user who redefines + gets a wrong number and no
      diagnostic — the most basic Scheme capability there is. All three closed together
      by PR #429. The VM's OTHER manifestation of the family — the upvalue search
      walking the enclosing-scope chain outermost-first — was fixed separately by
      PR #428 (tests/vm_parity/corpus/56_lexical_shadow_nearest_binding.esk); the two
      changes touch different functions in vm_compiler.c and are independent.

  - id: SW-25
    bucket: SILENT-WRONG
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/vm-region-and-upvalue"
    title: "VM set! on a captured parameter inside an immediately-invoked inner closure doesn't propagate back to the outer binding"
    repro: "(define (f n) ((lambda () (set! n (+ n 1)))) n) (display (f 5))"
    observed: "VM 5"
    correct: "6 — native answers 6"
    cross_engine: "native prints 6 (correct) under both default and ESHKOL_JIT_CACHE=0 JIT"
    observed_after: >-
      the VM answers 6. Verified together with the whole class at depths 1-3, with
      stored as well as immediately-invoked closures, with two closures sharing one
      capture, from inside a loop, through a closure that outlives the frame that
      bound the parameter, on `lambda` parameters as well as `define` parameters, and
      on let* / letrec / letrec* bindings — byte-identical to native on every line
      (tests/vm_parity/corpus/62_mutable_capture_writeback.esk).
    root_cause: >-
      lib/backend/vm_compiler.c: compile_form_let() had always run needs_boxing()
      (lib/backend/vm_parser.c:941) over its bindings, so a `let`-bound variable that
      is both `set!`-mutated and captured by a nested lambda is stored in a shared
      1-element vector and every closure reads and writes the same cell. PARAMETERS
      never got that treatment: compile_form_define() (the fixed-parameter loop),
      compile_form_lambda() and compile_form_lambda_2() called add_local() for each
      parameter and went straight to the body. OP_CLOSURE therefore copied the
      parameter's VALUE into the closure's upvalue array and the inner `set!` mutated
      a private copy that was discarded when the closure returned. The open-slot relay
      (native calls 151/252) is not an alternative: it aliases an absolute VM stack
      slot and is deliberately restricted to the top-level chunk, because a function's
      frame is destroyed on return. The same gap existed in compile_form_let_star(),
      whose own doc comment said "No mutable-capture boxing (unlike plain `let`)", and
      in compile_form_letrec() / compile_form_letrec_star().
    fix: >-
      vm_box_mutable_captured_params() (lib/backend/vm_compiler.c) heap-boxes every
      parameter that needs_boxing() reports as mutated-and-captured, by emitting
      GET_LOCAL / VEC_CREATE 1 / SET_LOCAL at function entry — after OP_PACK_REST,
      which reads the raw argument window — and marking the Local `boxed`, so every
      later read and write compiles through the existing boxed paths and a nested
      closure captures the BOX. Called from all three parameter-binding forms.
      let* boxes at its binding site with the scan widened to the later initializers
      plus the body (sequential binding); letrec and letrec* create the box with the
      placeholder, before any initializer runs, so the box pointer is already final
      when an initializer's closure captures it, and store initializers through
      VEC_SET. One mechanism, four binding forms, no new opcode and no ABI change.
    evidence: >-
      tests/vm_parity/corpus/62_mutable_capture_writeback.esk (VM-vs-native on the
      native, vm-src and vm-eskb axes; scripts/run_vm_parity.sh) and
      tests/differential/corpus/50_mutable_capture_writeback.esk (native axes).
      tests/vm_parity/corpus/56_lexical_shadow_nearest_binding.esk carried a comment
      declining to assert this defect; the comment now points at the fix instead.
      Revert-validated: restoring lib/backend/vm_compiler.c alone reproduces VM 5.
    renumbered: >-
      The corpus files were 59_ (vm_parity) and 47_ (differential) when this
      branch was written. Master's #433 then took both numbers for
      vector_ref_tensor_indexed_access. Because these are ADDED files with
      different names at the same index, git reports no conflict and the two
      would simply have coexisted — the numbering would have stopped being a
      total order silently. Renumbered on rebase to 62_ and 50_, the next free
      indices on master once PR #438's 61_/49_ are accounted for.
    caught_by: [direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, KNOWN_ISSUES]
    notes: >-
      Same FAMILY as SW-01/SW-02/SW-24 (a binding is not honoured across a closure
      boundary) but a distinct mechanism: not name resolution, which PR #428/#429
      fixed, but the absence of a shared binding CELL. Two adjacent defects were
      measured while class-killing this one and are NOT fixed here, because both are
      native-side and out of this entry's scope:
      (1) a mutated+captured REST parameter does not write back on the NATIVE axes —
          `(define (r . xs) ((lambda () (set! xs (cons 99 xs)))) (car xs))` is 99 on
          the VM after this fix and 1 natively;
      (2) `(do ((i 0 (+ i 1)) (acc 0)) ((= i 3) acc) ((lambda () (set! acc (+ acc i)))))`
          is killed by SIGKILL (exit 137) natively and answers 0 on the VM.
      Neither is baked into a gate here; both are recorded so the next pass starts
      from measurement rather than rediscovery. A third, pre-existing and LOUD, is
      that an internal `(define (bump) (set! n ...))` capturing an enclosing
      parameter is a fatal VM runtime error on unmodified master — loud, so not a
      silent-wrong entry.

  - id: SW-26
    bucket: SILENT-WRONG
    status: closed
    closed_at: "b6b2d32f"
    closed_by: "branch fix/vector-ref-tensor-and-backward-diff, commit b6b2d32f"
    title: "vector-ref into an fg-marginal result answers empty on the VM"
    repro: "(define fg (make-factor-graph 2 2)) (define m (fg-marginal fg 0)) (display (vector-ref m 0))"
    observed: "VM ()"
    correct: "0.5 — native answers 0.5"
    cross_engine: >-
      native prints 0.5 under both default and ESHKOL_JIT_CACHE=0 JIT. Displaying the whole
      marginal, `(display m)`, prints #(0.5 0.5) correctly on BOTH engines (the SW-07 fix from
      PR #424 holds) — only indexing into the result with vector-ref diverged on the VM.
    root_cause: >-
      fg-marginal returns a HEAP_TENSOR (VAL_TENSOR) value, not a HEAP_VECTOR. Every VM
      vector-ref call site — the threaded-dispatch fast path (lbl_VEC_REF), the switch-dispatch
      fallback (OP_VEC_REF), and the indirect/higher-order native call (vm_native.c case 219) —
      matched only `vec_val.type == VAL_VECTOR` and fell through to a fabricated NIL_VAL for
      anything else, including VAL_TENSOR, with no diagnostic. `vector-set!` (case 220,
      OP_VEC_SET, lbl_VEC_SET) and `vector-length` (case 221, OP_VEC_LEN, lbl_VEC_LEN) had the
      identical gap — silently a no-op and 0 respectively. Native's collection codegen
      (CollectionCodegen::vectorRef/vectorSet/vectorLength, lib/backend/collection_codegen.cpp)
      already dispatches on the heap-object header subtype and has always had a tensor arm,
      which is why native was correct and only the VM diverged.
    fixed_by: >-
      lib/backend/vm_native.c: added a VAL_TENSOR arm to native calls 219 (vector-ref), 220
      (vector-set!) and 221 (vector-length), backed by three new static helpers
      (vm_vecref_tensor_path, vm_vecset_tensor_path, vm_veclen_tensor_path) that mirror
      CollectionCodegen's native semantics exactly: vector-ref on a rank<=1 tensor returns the
      flat-indexed scalar element (bounds-checked against total element count); on a rank>1
      tensor it returns a row VIEW of rank n_dims-1 via the existing vm_tensor_slice() (no
      copy), bounds-checked against shape[0]; vector-set! always bounds-checks against the flat
      total (native does not special-case N-D row addressing for the mutating op either);
      vector-length answers the flat total element count. lib/backend/vm_run.c: added the same
      VAL_TENSOR arm to both interpreter loops (lbl_VEC_REF/lbl_VEC_SET/lbl_VEC_LEN and
      OP_VEC_REF/OP_VEC_SET/OP_VEC_LEN), calling the shared helpers so the two dispatch
      implementations cannot re-diverge.
    evidence: >-
      tests/vm_parity/corpus/59_vector_ref_tensor_indexed_access.esk (both engines: vector-ref
      and vector-length on the fg-marginal 1-D tensor, vector-set!+vector-ref round-trip on an
      independent tensor, vector-ref row-view on a rank-2 tensor, and a catchable out-of-range
      vector-ref); tests/differential/corpus/47_vector_ref_tensor_indexed_access.esk (native
      JIT/AOT axes). Revert-validated: reverting the vm_native.c/vm_run.c hunks alone reproduces
      the VM FAIL on all vector-ref/vector-length assertions in the corpus file with the fix
      applied everywhere else; reapplying restores 0 FAIL.
    caught_by: [direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, KNOWN_ISSUES]
    notes: >-
      Found by #424's author during the correctness wave, filed here after independent
      re-measurement. Distinct from SW-07/SW-08 (both closed): this is a residual found after
      those closures, on the same builtin family — the SW-07 fix corrected fg-marginal's VALUE
      but not every VM consumer of it. Maintainer ruling 2026-08-13 reversed the earlier
      waive-to-v1.3.5 default for this entry: fixed before tag, no waiver.


  - id: SW-27
    bucket: SILENT-WRONG
    status: closed
    closed_at: "256c31a8"
    closed_by: "PR #427 (branch fix/first-class-builtins)"
    title: "A REST-ARG procedure referenced as a VALUE loses its variadic shape; the rest parameter receives a bare argument instead of a list"
    repro: "(define (h f a b) (f a b)) (display (h append (list 1) (list 2)))"
    observed: "1 — the FIRST ARGUMENT, exit 0, no diagnostic"
    correct: "(1 2), which the same call in call position returns"
    affected_measured:
      - "append -> silently returns the first argument"
      - "make-list -> raises 'cdr: argument is not a pair'"
      - "iota with a rest argument -> the rest argument is ignored, (iota 3 10) as a value gives (0 1 2)"
      - "string-copy -> SIGSEGV under AOT; wrong answer under JIT"
      - "partial, json-get -> raise 'car: argument is not a pair'"
      - "every user (define (f a . rest) …) referenced as a value, at any fixed-parameter count"
    discovered_by: >-
      Found while closing LE-01, as the residue that the LE-01 fix deliberately did NOT
      absorb: `append` and `string-copy` are not inline builtins but rest-arg Scheme
      procedures (lib/core/list/transform.esk, lib/core/strings.esk), so they never reached
      LE-01's wrapper path and stayed broken after it. Reported as a finding rather than
      folded in, then ruled in scope as the same mechanism family.
    root_cause: >-
      A rest-arg procedure is called through a DIFFERENT ABI from a fixed-arity one: the
      closure dispatcher (codegenClosureCall) conses the caller's surplus arguments into a
      list and passes fixed_params values plus that list. It selects that path from the
      closure metadata — bit 63 of packed_info, which the allocator turns into
      CLOSURE_FLAG_VARIADIC, and, for the capture-less case where env is null, the
      input_arity byte, which it reads back as fixed_params. Every function-as-value site
      (emitFunctionAsCallableValue in lib/backend/llvm_codegen.cpp, the function_table
      branch of codegenVariable, and the REPL hot-reload branch) packed a plain arity and
      no variadic bit, so the dispatcher called a rest-arg procedure as if fixed-arity.
      The ABI itself was never wrong; only the VALUE representation lied about the
      procedure's shape. Call position was always correct, which is why no gate saw it.
    fix: >-
      The reference paths now resolve the rest-arg shape from the same two registries the
      call path consults (variadic_function_info, g_repl_variadic_functions) via a shared
      lookupVariadicProcedure helper, and pack the variadic bit plus the FIXED parameter
      count. NO ABI CHANGE was required — the dispatcher already implemented the rest-arg
      calling convention and already read these fields; the value side simply never set
      them. Note the asymmetry the fix has to respect: for a fixed-arity closure the arity
      field is the parameter count, but for a variadic one the dispatcher reads it as the
      FIXED count, so a 1-fixed rest-arg procedure stores 1, not 2.
    verified_at: >-
      tests/integration/first_class_variadics_test.esk, gated on JIT (cache on and off) and
      both AOT levels, plus first_class_variadics_vm_test.esk on the VM. The oracle is
      DIFFERENTIAL by construction: each check compares the value obtained through a
      higher-order function against the identical call in call position, in the same
      program, so it cannot pass by agreeing with a wrong expectation. Covers stdlib
      rest-arg procedures at 0, 1 and 2 fixed parameters (append, make-list, iota,
      string-copy, partial, json-get), user rest-arg procedures at each fixed count with
      both empty and non-empty rest, and the builtin variadics (list, +, string-append)
      as a non-regression check. Revert-validated: with the fix disabled all four native
      gates go red and the VM gate stays green.
    vm_status: >-
      NOT AFFECTED, verified rather than assumed. The VM's closures carry their rest-arg
      shape natively and its CALL opcode consumes it; pinned by
      tests/integration/first_class_variadics_vm_test.esk.
    caught_by: [direct-measurement, le-01-residue-analysis]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      The `missed_by` list is the interesting part. Every gate we own was green while
      `(h append '(1) '(2))` returned 1: the differential corpus compares AXES against each
      other and all four axes were wrong identically; vm-parity excuses native-only
      programs; and no test passed a rest-arg procedure as a value at all. A defect that is
      wrong the same way everywhere is invisible to differential testing by construction —
      the escape analysis for this one is "add a value-position axis to the HOF sweep", not
      "add a corpus program". Adjacent and still OPEN, found by the same sweep and NOT this
      defect: (zset-union …) in core.dbsp SIGSEGVs in CALL POSITION too, so it is a
      different bug and this entry's oracle can say nothing about it.

  - id: SW-28
    bucket: SILENT-WRONG
    status: closed
    closed_at: "46a3069c"
    closed_by: "branch fix/wasm-macro-batch-and-bignum-exactness (PR #432)"
    title: "The VM peephole deletes an arithmetic operation by folding CONST 0 + ADD across a jump target"
    repro: "(display (+ 1 (if #t 5 0)))"
    observed: "5 on the VM, exit 0, no diagnostic"
    correct: "6, which native prints"
    discovered_by: >-
      Found while fixing SW-13, not looked for. The SW-13 fix removed an ACCIDENTAL MASK:
      pre-fix, macro_node_add_child wrote its capacity into `_cap`, which aliased `is_char`
      on the VM hub's Node, so macro-expanded conditional nodes carried a nonzero is_char
      and took a different compile path. With the node types unified those nodes behave
      like parser-built ones and reached this pre-existing defect, which turned a
      macro-expanded `(+ (dbl a) (my-if2 #t b 0))` from 25 into 5. Confirmed PRE-EXISTING
      by re-running the reproducer on unmodified master: `(+ 1 (cond (#t 5) (else 0)))`
      answers 5 there with no macro involved at all.
    root_cause: >-
      lib/backend/vm_peephole.c rewrites the instruction PAIR (i, i+1) assuming the only
      way to reach i+1 is by falling through i. Nothing checked whether anything BRANCHES
      to i+1. `(+ x (if p a 0))` compiles to
      `CONST x; <test>; JIF Lelse; <a>; JUMP Lend; Lelse: CONST 0; Lend: ADD`, where
      `CONST 0` is the ELSE ARM's value and `ADD` is the OUTER `+`. The "CONST 0 + ADD is
      an identity" rule matched that pair across the Lend label and NOP'd both, deleting
      the enclosing addition whenever the THEN arm was taken. `CONST 1 + MUL` and
      `DUP + POP` have the same shape. Only the then-branch is affected, which is why
      `(+ 1 (cond (#f 9) (else 7)))` was correct and looked like the optimizer worked.
    fix: >-
      peephole_optimize now builds a conservative basic-block entry map before rewriting
      anything — every OP_JUMP / OP_JUMP_IF_FALSE / OP_LOOP / OP_PUSH_HANDLER operand,
      every OP_CLOSURE body entry PC (low 32 bits of the referenced constant), and every
      ChunkEntry.code_offset — and skips any pair whose SECOND instruction is an entry.
      An unknown entry blocks an optimization rather than enabling a miscompile, and an
      allocation failure skips optimizing entirely.
    verified: >-
      All four arms match native in tests/vm_parity/corpus/61_multi_macro_batch.esk
      ((+ 1 (my-if2 #t 5 0)) = 6, (+ 1 (my-if2 #f 5 0)) = 1, (* 3 (my-if2 #t 5 1)) = 15,
      (* 3 (my-if2 #f 5 1)) = 3); ctest 164/164, vm-parity 166/0, differential 288/288.
    caught_by: [direct-measurement, sw-13-unmasking]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      The escape analysis is uncomfortable: this needed only a literal 0 or 1 in the else
      arm of a conditional used as an arithmetic operand, which is ordinary code, and every
      gate was green. It survived because no corpus program put a two-armed conditional in
      an operand position with a folding-identity literal in the far arm. Worth a
      generative axis: emit conditionals in operand position with identity literals.

  - id: SW-29
    bucket: SILENT-WRONG
    status: closed
    closed_at: "92bbacd4"
    closed_by: "branch fix/numeric-tower-bignum-tail, stacked on PR #432"
    title: "floor/ceiling/truncate/round of a bignum-backed rational returns 0 natively, and an inexact double on the VM"
    repro: "(display (floor (/ (expt 2 100) 3)))"
    observed: "native -r printed 0; the VM printed 4.2255020007607644e+29"
    correct: "422550200076076467165567735125 — both engines were wrong, and they disagreed"
    root_cause: >-
      Two different mechanisms behind one symptom.
      NATIVE: lib/core/rational.cpp eshkol_rational_floor/ceil/truncate/round read
      rat->numerator and rat->denominator UNCONDITIONALLY. On the bignum path those
      fields are the inert 0/1 shadow, so the functions computed 0/1 = 0. This is the same
      int64-shadow class SW-18 closed on the VM; PR #247 made the rational substrate
      bignum-capable but did not carry that through to the rounding functions.
      VM: floor/ceiling/round (native ids 26/27/28) converted their operand with
      as_number_vm() unconditionally, so an exact rational came back inexact, and
      `truncate` had NO implementation at all — the builtin table bound it to native id
      190, which no case handled, so every call warned "unhandled native call ID 190" and
      produced the empty list.
    fix: >-
      The ABI change was implementable, so the loud-error fallback was NOT needed. Four
      tagged entry points were added — eshkol_rational_{floor,ceil,truncate,round}_tagged
      — mirroring the eshkol_rational_from_bignums_tagged precedent in the same header:
      they take an out-param and can therefore answer with an INT64 or a bignum as the
      value requires, which an int64 return could never do. They compute in the bignum
      domain via the existing bignum API (eshkol_bignum_div/mod/sub/add/mul/compare),
      correcting the truncating remainder by one for floor/ceil and implementing
      ties-to-even for round. The cascade was contained exactly as hoped: the four
      functions plus ONE codegen block (lib/backend/llvm_codegen.cpp, the shared
      floor/ceil/trunc/round rational path), no other caller. The int64 variants are kept
      for callers that have already established the operand is on the fast path.
      On the VM, ids 26/27/28 now pass an exact integer through unchanged and route a
      ratnum to the exact rational natives 342/343/345 (bignum-capable since #432), and
      native id 190 (`truncate`) is implemented for the first time, routing to 344.
    verified: >-
      tests/vm_parity/corpus/67_exact_rounding_bignum_rational.esk — all four roundings on
      positive and negative big rationals, exactness assertions, the defining inequalities
      checked rather than tabulated, an exact-integral big rational, ties-to-even at a
      bignum midpoint, small-rational and exact-integer and inexact pass-through. Byte
      identical on native, VM and wasm32.
    revert_validated: >-
      Removing the is_big branch from the four tagged functions makes native print 0 for
      floor and ceil again; removing the exact routing from VM ids 26/27/28 makes the VM
      print doubles again. Both confirmed by rebuild and re-run.
    caught_by: [direct-measurement, sw-18-adjacent-probe]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]

  - id: SW-30
    bucket: SILENT-WRONG
    status: fixed
    title: "syntax-rules hygiene for TEMPLATE-INTRODUCED BINDINGS: the VM lost the binding and corrupted a same-named top-level variable; both engines captured"
    repro: "(define-syntax hyg (syntax-rules () ((_ e) (let ((tmp 100)) (+ tmp e))))) (define tmp 7) (display (hyg 1)) (display tmp) (display (hyg tmp))"
    observed_before: "VM printed 1 then () then 0; native printed 101 then 7 then 200"
    observed_after: >-
      Both engines print 101, 7, 107 — the R7RS 4.3.2 answers. Verified on native -r,
      vm-src, vm-eskb and the wasm32 build.
    root_cause: >-
      TWO independent defects, neither of which was the one hypothesised when this entry
      was filed. The original note guessed "the VM's expander does gensym renaming that is
      applied inconsistently between binder and reference". That is not what the code did:
      vm_macro_gensym() had ZERO callers outside its own self-test, and neither expander
      contained any renaming, mark, syntactic closure or definition-environment machinery
      at all.

      (1) THE VM COLUMN WAS NOT A HYGIENE DEFECT. `define-syntax` compiled to nothing
      (lib/backend/vm_compiler.c), while every top-level and body driver POPs after a form
      that bound nothing. That POP therefore discarded a LIVE stack value and shifted every
      later local down one slot, so a template's `let` wrote slot k while the body read slot
      k+1. Hence (hyg 1) => 1 and the user's `tmp` reading back as (). The identical hazard
      was already documented and handled three cases earlier in the same function, for
      (provide)/(export), whose in-code comment says the OP_NIL "is not decorative". Fixed
      by emitting OP_NIL for define-syntax as well. This is a CLASS: any no-emit top-level
      special form has the same exposure.

      (2) NEITHER ENGINE RENAMED TEMPLATE-INTRODUCED BINDERS, so both captured. Native
      substituteBindings() emitted every non-pattern-variable identifier verbatim
      (lib/frontend/macro_expander.cpp), and the VM's vm_macro_instantiate() did the same
      (lib/backend/vm_macro.c). Fixed by alpha-renaming, in both expanders, the identifiers
      a template BINDS ITSELF — scope by scope, and before any caller code is substituted
      in, which is what makes it safe: at that point every symbol in the tree came from the
      macro definition, so no caller identifier can be touched. Covered forms: let, let*,
      letrec, letrec*, named let, lambda (including a rest parameter). Pattern variables are
      never renamed. Quoted and quasiquoted data are walked in datum mode so a gensym cannot
      leak into program OUTPUT (without that, (let ((z 5)) (list 'z z)) printed (_h0.z 5)).

      A THIRD defect fell out while pinning the classic swap!: native substituted a set!
      VALUE but never its TARGET, because the target is a bare char* rather than an AST
      node, so ((_ x y) (let ((tmp x)) (set! x y) (set! y tmp))) failed to compile with
      "set!: undefined variable 'x'". R7RS 4.3.2 substitutes a pattern variable wherever it
      occurs in a template, assignment targets included. Fixed.
    measured: >-
      An 18-cell hygiene matrix was run against both engines before and after. BEFORE:
      the VM answered 0 of 18 correctly, native 3 of 18, and the two engines disagreed on
      14 cells. AFTER: both engines agree on all 18 and 17 are R7RS-correct. The single
      remaining wrong cell is referential transparency for a template's FREE identifiers,
      which is a different defect with a different root cause and is filed as SW-35.
    fixed_by: "branch fix/syntax-rules-hygiene (PR stacked on #432)"
    evidence: >-
      tests/vm_parity/corpus/68_syntax_rules_hygiene.esk — 15 sections covering the
      template binder surviving at all, not corrupting a same-named user variable, the
      capture case where the operand IS the colliding name, use-site shadowing, nested
      macro invocation with both templates binding the same name, a recursive macro with
      a colliding global, a template-introduced lambda parameter, let*/letrec/named-let
      binders, nested template scopes, two invocations not sharing a binding, quoted and
      quasiquoted symbols keeping their literal names, and set! on pattern variables.
      Gated by vm-parity (native vs vm-src vs vm-eskb) AND by the wasm execute-and-diff
      lane, so it is pinned in the browser build too.
      tests/differential/corpus/51_syntax_rules_hygiene.esk pins the same semantics across
      the native jit-cache / jit-nocache / aot-O0 / aot-O2 axes; the JIT axis matters
      because the REPL re-feeds saved define-syntax ASTs into a fresh expander per eval,
      restarting the fresh-name counter.
      REVERT-VALIDATED: all four changes were individually reverted on a built tree and
      68_syntax_rules_hygiene.esk detects each one. Without the OP_NIL the VM prints
      1|2|100|200|101|...; without the VM renamer it prints 200 for 107, #f for 42 and
      leaks a <closure@741>; without the native renamer native does the same; without the
      set! target fix native fails to compile; without datum mode both print (_h28.z 5 9).
    caught_by: [direct-measurement, sw-13-corpus-authoring]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      tests/vm_parity/corpus/16_define_syntax.esk carried the hint in a comment
      ("recursive macros and macros that set! their operands diverge") and
      61_multi_macro_batch.esk (59_ before master's corpus renumber) said outright that no template-binder hygiene shape could be
      pinned as a parity row. Both statements are now false and 59's comment has been
      corrected to point at 63.
      RESIDUAL, deliberately not claimed as fixed: (a) referential transparency for free
      template identifiers — SW-35; (b) a template-introduced `do` loop variable is still
      captured, IDENTICALLY on both engines. `do` was left out on purpose: the native
      expander stores a do-loop in the generic call_op layout, where the loop variables are
      untyped nested lists rather than an addressable binding array, so a scope-correct
      rename is not reachable there, and renaming on the VM alone would have made the two
      engines disagree on a shape neither fully supports. (c) A template-introduced
      `define` is not renamed either; R7RS requires it, but not renaming is the status quo
      and renaming it would break the common idiom of a macro that defines something.

  - id: SW-42
    bucket: DOCUMENTED-LIMITATION
    status: open
    needs_decision: false
    renumbered_from: >-
      SW-33, then SW-35 (collision). Filed as SW-33 on the pre-rebase stack; renumbered to SW-35
      when master's own #437 landed a different SW-33/SW-34 pair first (see the original
      renumbered_because below, kept verbatim for the audit trail). SW-35 collided a SECOND time,
      independently: branch fix/value-position-axis (PR stacked on #439, merged as part of #442)
      allocated its OWN unrelated SW-35 ("floor/ceiling/truncate/round as first-class values return
      a rational's heap pointer") in parallel, and both entries reached master's committed ledger
      under the same id with no conflict (a textual merge, not a content merge — the check that
      catches this is parsing the YAML and counting ids, the same lesson SW-41's own
      id_collision_note records). Master's closed SW-35 (the rounding defect) keeps that id, being
      the earlier-landed and fully-closed entry; this one moves to SW-42, the next id free across
      the WHOLE ledger (highest prior id in use was SW-41).
    original_renumbered_because: >-
      Filed as SW-33 on the pre-rebase stack. While this branch was in review,
      master's #437 landed its own SW-33 (mutated + captured REST parameter) and
      SW-34, and #432 was rebased onto that master. Both entries then existed
      under the same id — a textual merge, not a conflict, so nothing flagged it.
      Master's SW-33 is `closed` and keeps the id; this open entry moves to the
      next truly-free id. Re-surveyed against master's canonical ledger after
      #432 merged as 6acc9030 and #430/#434/#435/#438/#439/#441 landed: master's
      highest id is still SW-34 and it has no SW-35, so SW-35 is the correct
      free id and needed no second move. [Superseded: a second, independent lane
      also landed a SW-35 around the same time; see renumbered_from above.]
    reclassified:
      from: SILENT-WRONG
      to: DOCUMENTED-LIMITATION
      on: "2026-08-13"
      by: maintainer ruling
      why: >-
        Filed SILENT because both engines resolve the shadowed free identifier with no diagnostic.
        That property is unchanged — this is NOT a loud limitation, unlike SW-14's guarded case, and
        the entry does not claim otherwise. What changed is the disposition: a loud "unsupported
        hygiene case" interim was evaluated and explicitly REJECTED (see interim_considered_and_rejected
        below) because it would fire on nearly every macro in the language. The real fix needs syntax
        objects — an environment-tagged identifier representation threaded through the reader, both
        expanders and both name-resolution paths — which is out of scope for a point release. The
        reclassification records a scope decision, not a claim that the defect stopped being silent.
    ruling:
      by: maintainer
      on: "2026-08-13"
      decision: >-
        Documented as a known use-site semantics gap for v1.3.4, with the exact repro, the correct
        R7RS answer and the root cause recorded in KNOWN_ISSUES.md. The real fix — syntax objects
        (or marks / scope sets) carrying each identifier's binding environment through the reader,
        both expanders and both name-resolution paths — is the v1.4 item; see real_fix_sketch and
        effort below, both unchanged by this ruling.
      consequences:
        - "this entry moves SILENT-WRONG -> DOCUMENTED-LIMITATION and stops gating the tag"
        - "status stays open; syntax-object infrastructure is the close condition, not a guard"
        - "no loud interim ships — one was built in prototype and rejected as unshippable noise"
    close_condition: >-
      This entry closes when a free identifier in a syntax-rules template resolves against its
      macro-definition environment rather than the use site — i.e. when cell 7 of the SW-30 hygiene
      matrix (tests/vm_parity/corpus/68_syntax_rules_hygiene.esk) prints 50, not -5, on both engines.
      Closing by assertion is forbidden (ledger invariant 3); that program's output is the proof.
    title: "syntax-rules templates have no REFERENTIAL TRANSPARENCY: a free identifier in a template resolves at the USE site, not the macro-definition site (both engines, identically)"
    repro: "(define (helper x) (* x 10)) (define-syntax usehelp (syntax-rules () ((_ a) (helper a)))) (display (let ((helper (lambda (x) (- x)))) (usehelp 5)))"
    observed: "native -5, VM -5, exit 0 on both, no diagnostic"
    correct: >-
      50. R7RS 4.3.2: an identifier that appears in a template as a free reference refers
      to the binding it had in the MACRO-DEFINITION environment, so `helper` must be the
      top-level helper regardless of what the use site binds.
    measured: >-
      Cell 7 of the 18-cell hygiene matrix run for SW-30. It is the ONLY cell of the 18
      that is still wrong after SW-30's fix, and both engines are wrong in exactly the same
      way, so it is a shared semantic gap and NOT an engine divergence.
    root_cause: >-
      Neither engine captures a macro-definition environment, so there is nothing to
      resolve a free template identifier against. Native `eshkol_macro_def_t`
      (inc/eshkol/eshkol.h) carries only name, literals and rules — no environment, no
      scope id, no phase. The VM's `VmMacro` (lib/backend/vm_macro.c) is the same, and its
      registry is a flat process-global array with no scoping at all (which is also why
      let-syntax/letrec-syntax fake their scope by saving and restoring g_n_macros). A free
      template identifier is therefore emitted as a plain name and resolved by ordinary
      lexical lookup at the use site.
    why_not_fixed_here: >-
      NEEDS-DECISION. This is the half of hygiene that genuinely requires infrastructure
      neither expander has. SW-30's capture half was fixable by alpha-renaming, because
      renaming is a pure rewrite of the template before any caller code enters it.
      Referential transparency is not: it requires every identifier to carry the
      environment it was written in, which means syntax objects (or marks / scope sets)
      threaded through the reader, both expanders, and both name-resolution paths — native
      resolves at LLVM codegen, the VM at compile time against a flat local table. That is
      a cross-cutting representation change, not a localised fix, and it is exactly the
      "full alpha-renaming/marks infrastructure that does not exist in either expander"
      case the maintainer policy says to stop and report rather than improvise.
    interim_considered_and_rejected: >-
      Raising a loud "unsupported hygiene case" error at a free template identifier was
      considered and REJECTED as unshippable: every template contains free identifiers
      (`+`, `if`, `list`, `cond`, every builtin and every user helper), so the error would
      fire on essentially every macro in the language, including all 42 .esk files in this
      repo that use define-syntax. The mis-binding only occurs when the USE site actually
      shadows one of those names, which is rare and is not detectable at expansion time
      without the very environment tracking that is missing. A precise detector — compare a
      template's free identifiers against the bindings visible at the use site and raise
      only on an actual collision — is implementable but needs the use-site environment
      plumbed into the expander, which is roughly half the work of doing it properly.
      Recommend deciding between the real fix and an explicit documented limitation rather
      than shipping a guard that either screams constantly or needs the missing machinery.
    real_fix_sketch: >-
      Give each macro definition an environment handle at registration time, and wrap
      template identifiers in a syntax object carrying that handle. Minimum viable shape:
      (1) add an env/scope id to eshkol_macro_def_t and VmMacro, assigned when
      define-syntax is registered; (2) when instantiating, tag each free template
      identifier with that id instead of emitting a bare name; (3) at name resolution,
      prefer the binding visible in the tagged environment over the use-site binding.
      Steps 1-2 are contained in the two expanders; step 3 is the expensive one because it
      touches native LLVM-codegen name lookup and the VM's local-slot resolution. Marks /
      scope sets (Flatt) are the principled version and would subsume the alpha-renaming
      added for SW-30, but are a substantially larger rewrite.
    effort: >-
      Rough sizing, NOT a commitment: the env-handle route is a moderate change to each
      expander plus a real change to each resolver, and it needs its own differential and
      parity corpus because it changes what a name means. The scope-set rewrite is a
      significantly larger piece of work touching the reader as well, and would be the
      right shape only if macro-defining-macros and let-syntax scoping are also in scope.
      Both are larger than the SW-30 fix that preceded them.
    caught_by: [direct-measurement, sw-30-hygiene-matrix]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      Filed rather than fixed, and NOT folded into SW-30's close: SW-30 names
      template-introduced BINDINGS and that surface is genuinely fixed and gated. This is
      the other half of R7RS hygiene and has a different root cause, a different blast
      radius and a different price. The two engines AGREE here, so no parity row is
      blocked by it; it is a shared semantic gap against the standard.
      A separate, unrelated observation from the same matrix run, filed here only so it is
      not lost: a macro named `inner` cannot be defined on the native engine at all —
      (define-syntax inner (syntax-rules () ((_ x) (+ 10 x)))) (inner 1) fails with
      "no matching pattern for macro 'inner'" followed by a spurious "Circular macro
      expansion detected". The same program with the macro renamed works. That is a
      reserved-name collision in the native frontend, is LOUD (exit 1) rather than silent,
      and is out of scope for this entry.

  - id: SW-31
    bucket: SILENT-WRONG
    status: closed
    closed_at: "92bbacd4"
    closed_by: "branch fix/numeric-tower-bignum-tail, stacked on PR #432"
    title: "VM numeric type predicates and eqv? answer #f across whole numeric classes"
    observed: "the VM answered #f — a type predicate denying a value's own type — with exit 0"
    correct: "the native column, which is R7RS 6.2.1/6.1 and was already right"
    root_cause: >-
      THREE mechanisms, not one.
      (1) MISSING TAG ARMS: each predicate spelled its own inline tag test and each spelled
      a different, shorter list than the tower has. lbl_NUM_P tested only VAL_INT/VAL_FLOAT;
      rational? (native 1698) tested only VAL_RATIONAL; complex? (native 317) tested only
      VAL_COMPLEX; real? (1697) omitted BIGNUM.
      (2) A DOUBLE CONVERSION THAT LIES: positive?/negative?/zero?/odd?/even? (natives
      40-44) read their operand through as_number(), which returns 0.0 for ANY heap-boxed
      value — so a bignum was neither positive nor negative, (zero? 1/3) could answer #t,
      and (odd? <bignum>) was always #f.
      (3) OPCODE ALIASING: the compiler lowered `integer?` AND `real?` to the very same
      OP_NUM_P opcode as `number?`, so (integer? 5.5) answered #t. `integer?` also had no
      builtin-table entry at all and could not be passed as a value.
      Separately, `eqv?` shares native id 133 with `eq?`, and the shared helper
      vm_identity_equal fell through to a heap-POINTER comparison for numeric boxes, so
      (eqv? 1/3 1/3) and (eqv? (expt 2 100) (expt 2 100)) were #f — two separately
      allocated boxes are never the same pointer.
    fix: >-
      One classification layer the whole family routes through — vm_tag_is_number,
      vm_tag_is_real, vm_num_is_rational, vm_num_is_integer, vm_tag_is_exact_number and
      vm_num_parity_is_odd — so a tag can only be forgotten in one place and adding a
      numeric tag later updates every predicate at once. The sign predicates compare
      through the exact comparator the ordering opcodes already use, falling back to a
      double only for a genuinely inexact operand. `integer?` gained its own native (1717)
      and a builtin entry; `real?` lowers to native 1697. vm_identity_equal compares
      heap-boxed NUMBERS by value (legal for eq?, which R7RS leaves unspecified on
      numbers, and required for eqv?).
    verified: >-
      tests/vm_parity/corpus/65_numeric_predicate_matrix.esk — a predicate x tag MATRIX
      (12 numeric rows x 10 predicates) plus the same predicates reached as first-class
      values (a different route in the VM, with its own missing arms), parity across the
      int64 boundary, and eqv?/equal? on numbers. Byte identical on native, VM and wasm32.
    revert_validated: >-
      Restoring vm_tag_is_number to its old VAL_INT/VAL_FLOAT body makes the matrix diverge
      from native again. Confirmed by rebuild and re-run.
    caught_by: [direct-measurement, sw-18-adjacent-probe]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      The escape analysis is a predicate x value-class MATRIX probe, which is cheap to
      generate and would have caught every cell at once. That matrix is now a corpus file.
  - id: SW-32
    bucket: SILENT-WRONG
    status: closed
    closed_at: "92bbacd4"
    closed_by: "branch fix/numeric-tower-bignum-tail, stacked on PR #432"
    title: "min/max return the WRONG operand and disagree with the engine's own < on the same pair"
    repro: "(define a (/ (expt 2 100) 3)) (define b (/ (+ (expt 2 100) 1) 3)) (display (list (max a b) (< a b)))"
    observed: >-
      native printed (…376/3 #t) — max answered the SMALLER operand while `<` on the same
      pair in the same program correctly said they were ordered. Re-measuring the class
      also found BOTH engines wrong, in OPPOSITE directions, for exact integers past 2^53:
      (max 9007199254740993 9007199254740992) was …993 natively and …992 on the VM, and
      (min …) was …993 natively and …992 on the VM.
    correct: "max …377/3, min …376/3; max …993, min …992"
    root_cause: >-
      min/max carried their OWN abbreviated copy of the ordering dispatch. compare() — the
      lowering behind < > = <= >= — runs bignum, then rational, then exact int64, then
      doubles. min/max ran bignum and then went straight to doubles. A bignum-backed
      rational is a HEAP_PTR with the RATIONAL subtype and never a bignum, so it missed
      the exact path entirely; two exact int64s past 2^53 missed it for the same reason.
      In the double fallback both operands of each pair round to ONE flonum, so the
      comparison reports "equal" and each engine's tie-break picks a different side. The
      VM had the identical structural defect in its own copy (natives 33/34), where the
      exactness guard covered bignums and rationals but not two plain fixnums.
    fix: >-
      ONE ordering implementation instead of two divergent copies:
      ArithmeticCodegen::emitExactFirstOrderingI1 (bignum -> rational -> exact int64 ->
      double) is now used by min and max, so a future tier can only be added where both
      callers see it. The VM's natives 33/34 take the exact comparator whenever BOTH
      operands are exact.
    verified: >-
      tests/vm_parity/corpus/66_minmax_ordering_invariant.esk expresses the fix as a
      PROPERTY rather than a table: for each pair it checks min/max against `<` computed on
      the same operands, in both operand orders, so it cannot pass by agreeing with a wrong
      expectation. Covers int64 across 2^53, small rationals, bignums, bignum-backed
      rationals, mixed exactness, and R7RS 6.2.6 inexactness contagion. Also added to the
      compilation-axis differential corpus as 50_numeric_tower_tail.esk.
    revert_validated: >-
      Forcing the rational and int64 tiers off in emitExactFirstOrderingI1 reproduces the
      native symptom exactly (max …376/3, min …993); removing the both-exact guard from VM
      natives 33/34 reproduces the VM symptom. Both confirmed by rebuild and re-run.
    caught_by: [direct-measurement, sw-18-adjacent-probe]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
  - id: SW-33
    bucket: SILENT-WRONG
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/native-rest-capture-and-do-loop"
    title: "NATIVE: a mutated + captured REST parameter does not write back; the closure mutates a private copy"
    repro: "(define (f . rest) ((lambda () (set! rest (cons 99 rest)))) (car rest)) (display (f 1 2 3))"
    observed: "native 1 — exit 0, no diagnostic, on every native axis"
    correct: "99"
    cross_engine: >-
      the VM is wrong the same way at this SHA (also 1) and is fixed on the
      SW-25 branch fix/vm-region-and-upvalue, measured with that branch's build:
      VM 99. So the two halves of one class are closed by two PRs; neither
      engine is the oracle for the other here, which is why this entry's gates
      are the four NATIVE axes and an absolute expected value, not a parity
      comparison.
    discovered_by: >-
      recorded as adjacent finding (1) in SW-25's notes while class-killing the
      VM half. Measured rather than rediscovered.
    root_cause: >-
      ASSIGNMENT CONVERSION (ESH-0074) boxes a set!-mutated parameter into an
      alloca so that (a) codegenSet has a storage location and (b) every closure
      capturing it shares ONE cell — codegenLambda's capture emission then
      pointer-passes that alloca instead of copying its value. Both boxing loops
      iterated only the FIXED parameters: lib/backend/llvm_codegen.cpp:12692
      (codegenFunctionDefinition, `for i < op->define_op.num_params`) and
      lib/backend/llvm_codegen.cpp:29678 (codegenLambda, same shape). The REST
      parameter is the LLVM argument that FOLLOWS the fixed ones — the
      symbol-table loops twenty lines above each site walk exactly that order —
      so it never got a box, stayed a by-value Argument, and the closure copied
      the list VALUE into its environment slot. The inner set! then mutated a
      private copy discarded on return, while the outer read still read the raw
      Argument. Confirmed in IR: `define @f(%eshkol_tagged_value %rest)` with
      `store %rest, ptr %<env slot>` and `(car rest)` reading `%rest` directly,
      versus the boxed `%n = alloca` a fixed parameter gets.
      The outer guards also required `op->define_op.parameters` /
      `op->lambda_op.parameters` to be non-null, so a rest-ONLY signature could
      not have been reached even if the loop had run.
    fix: >-
      Both sites now box the rest parameter on the same terms as a fixed one —
      `astSetsVar(body, rest_param)` decides, the box is the alloca that the
      iterator already points at after the fixed loop, and the outer guard no
      longer requires a non-empty fixed parameter list. No new mechanism, no ABI
      change: the existing capture machinery pointer-passes the box because it
      is an alloca like any other.
    evidence: >-
      tests/integration/rest_capture_and_do_closure_test.esk, 23/23 checks on
      all four native axes (ctest lanes rest_capture_and_do_closure_{smoke,
      nocache_smoke,aot_o0_smoke,aot_o2_smoke}); the rest-parameter half covers
      depths 1-3, immediately-invoked AND stored closures, a closure that
      outlives the frame that bound the rest parameter, two closures sharing one
      cell, two instantiations NOT sharing one, `lambda` as well as `define`
      rest parameters, a rest parameter after two fixed parameters, and the two
      controls (mutated-but-uncaptured, captured-but-unmutated).
      tests/differential/corpus/48_rest_capture_and_do_closure.esk covers the
      native axes.
      Revert-validated against a build of the same tree without the codegen
      change (worktree eshkol-wt-vmmem, whose diff touches no native codegen):
      it answers 1 for the reproducer and cannot compile the class-kill test at
      all, refusing with "set!: variable 'xs' is not mutable (not an alloca,
      global, or capture pointer)".
    caught_by: [direct-measurement, sw-25-adjacent-finding]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      Same FAMILY as SW-25 — a binding is not honoured across a closure boundary
      because there is no shared CELL — but the opposite engine and a different
      omission: the VM's parameter loop never boxed ANY parameter, native's
      boxed every parameter except the one the loop bound could not reach.
      A control worth keeping: `(define (r . xs) (set! xs (cons 3 xs)) (car xs))`
      — mutated but NOT captured — was a LOUD refusal before this change
      ("variable 'xs' is not mutable"), not a wrong answer, and now answers 3.
  - id: SW-34
    bucket: SILENT-WRONG
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/vm-do-loop-capture"
    title: "A `do` loop variable captured and mutated by a body closure loses the mutation inside a procedure"
    repro: "(define (f n) (do ((i 0 (+ i 1)) (a 0)) ((= i n) a) ((lambda () (set! a (+ a 1)))))) (display (f 5))"
    observed: "VM 0"
    correct: "5 — native answers 5"
    cross_engine: >-
      the nested-loop form
      (do ((i 0 (+ i 1)) (t 0)) ((= i 3) t) (do ((j 0 (+ j 1))) ((= j 2)) ((lambda () (set! t (+ t 1))))))
      was VM 2, native 6. The same loop at TOP LEVEL was already correct on the
      VM (3), which is the tell: only the root chunk has the open-slot relay.
    observed_after: "VM 5 and VM 6, byte-identical to native across 19 shapes"
    root_cause: >-
      lib/backend/vm_compiler.c::compile_form_do() bound its loop variables
      with a bare add_local(). compile_form_let() has always run needs_boxing()
      (lib/backend/vm_parser.c) over its bindings, so a `let` variable that is
      both set!-mutated and captured by a nested lambda lives in a shared
      1-element vector; a `do` variable never got that treatment, so OP_CLOSURE
      copied its VALUE into the closure's upvalue array and the inner set!
      mutated a private copy discarded at the end of the iteration. The
      top-level case was correct only because the root chunk aliases an
      absolute VM stack slot through the open-slot relay (native calls
      151/252), which is deliberately restricted to the root chunk because a
      function's frame dies on return.
    fix: >-
      compile_form_do() boxes every loop variable needs_boxing() reports as
      mutated-and-captured, scanning the test, the results, the body AND every
      step expression, since a do variable is in scope for all four. A boxed
      variable's step store goes through VEC_SET into the same cell. The step
      values are held in anonymous locals first so that parallel update (R7RS
      4.2.4 — every step sees the pre-step values) is preserved while still
      giving VEC_SET its box and index UNDER the value.
    residue_found_and_fixed: >-
      Boxing a `do` variable exposed a PRE-EXISTING defect in
      compile_form_set(): both of its boxed paths (local and upvalue) left TWO
      values on the operand stack, because OP_VEC_SET pushes NIL and the shared
      tail pushes the NIL that `set!` evaluates to, while every caller pops
      one. Inside a frame about to RETURN the surplus was absorbed and
      invisible, which is why it had never been seen; in a `do` body — inline
      statements each followed by exactly one OP_POP — it accumulated once per
      iteration until the operand stack overflowed (STACK OVERFLOW, fatal).
      Fixed at the root by discarding VEC_SET's NIL in both paths.
    evidence: >-
      tests/vm_parity/corpus/61_do_loop_variable_binding.esk and
      tests/differential/corpus/49_do_loop_variable_binding.esk.
      Revert-validated: restoring lib/backend/vm_compiler.c reproduces VM 0 for
      the filed reproducer and VM 2 for the nested form.
    caught_by: [pr-437-class-kill]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      The fourth binding form of the SW-25 family (parameters, let*, letrec,
      letrec* were closed by PR #435; `do` is closed here), and the same root
      cause: a binding that is mutated across a closure boundary needs a shared
      CELL, and only `let` ever had one.
      FOUR native-side `do` shapes were held out of the corpus while this fix
      was written, because the NATIVE engine was wrong or failed on them at the
      pre-#437 base — capture in a STEP (native 0, VM 8), capture in a RESULT
      (native: LLVM module verification failed, VM 10), a step that must see a
      body closure's mutation (native 30, VM 33), and a read-only capture
      (native: no output, VM 6). PR #437 landed on master and fixed the native
      side of all four; on the rebased tree the two engines AGREE on every one,
      at exactly the values the VM already produced, and all four are now
      asserted in both corpus files. The exclusion list is empty — which is the
      point of having written the measured pairs down rather than only naming
      the shapes.

