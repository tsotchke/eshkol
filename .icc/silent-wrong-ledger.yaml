  - id: LE-09
    bucket: LOUD-ERROR
    subtag: codegen
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/native-rest-capture-and-do-loop"
    title: "NATIVE: a `do` loop whose body creates a closure over a loop variable never terminates and is SIGKILLed (exit 137)"
    repro: "(display (do ((i 0 (+ i 1)) (acc 0)) ((= i 3) acc) ((lambda () (set! acc (+ acc i))))))"
    observed: >-
      killed by SIGKILL, exit 137, under the default `-r` and under
      ESHKOL_JIT_CACHE=0. Under an explicit CPU limit the same run exits 152
      (SIGXCPU) with no output, which is what identifies it as a runaway loop
      rather than an allocator fault.
    correct: "3 — the VM answers 3"
    affected_measured:
      - "mutating capture: ((lambda () (set! acc (+ acc i)))) -> runaway"
      - "READ-ONLY capture: (set! s (+ s ((lambda () i)))) -> runaway; mutation is not required"
      - "let-bound body closure -> LLVM verification failure, \"Instruction does not dominate all uses\" on the arena_allocate, i.e. the compile is rejected rather than run"
      - "named let in the body capturing the loop variables -> same verification failure"
    unaffected_measured:
      - "a `do` body with no closure at all"
      - "a body lambda whose PARAMETER shadows the loop variable, so nothing is captured"
    root_cause: >-
      lib/backend/llvm_codegen.cpp, codegenDo (var_allocas at ~24282, step store
      at ~24371 before this change). A `do` variable is READ from three places
      emitted at three different times — the header test first, the body second,
      the step expressions third — but codegenDo wrote the step result to the
      stack alloca it had cached in var_allocas, while every read went through
      symbol_table. codegenLambda's capture emission ("CLOSURE ESCAPE FIX",
      ~30036) REBINDS a captured stack alloca to fresh arena storage mid-body
      and repoints symbol_table at it, seeding the new cell ONCE in the
      pre-header. The variable therefore split in two: the step read the arena
      cell and wrote the stack alloca that the header test had already been
      compiled against. IR at the defect:
        do_loop_step: %i.load68 = load ptr %8        ; arena cell, never advanced
                      %99 = add %i.load68, 1
                      store %99, ptr %i_do           ; stack alloca
        do_loop_header: %i.load = load ptr %i_do     ; reads 1 forever
      `(= i 3)` never became true, and each iteration allocated a fresh closure
      in the arena, so the loop consumed memory without bound until the OS
      killed it. The same rebinding, when it happened inside the loop body
      rather than the pre-header, produced an arena_allocate that did not
      dominate its uses — invalid IR, which is the AOT-side symptom.
    fix: >-
      The storage class is now decided BEFORE the loop is emitted, mirroring
      codegenNamedLet, which has always arena-moved its captured cells up front.
      doFormCapturesVar() asks whether any lambda or named let in the bindings,
      test, results or body captures the variable; if so the loop variable's
      cell is arena storage from the start, which is what the capture machinery
      would have converged on anyway — and being an already-pointer-typed
      CallInst it takes codegenLambda's "existing arena storage" branch, which
      pointer-passes WITHOUT rebinding anything. Otherwise the variable keeps
      its stack alloca and stays promotable, so closure-free `do` loops are
      byte-identical to before. The predicate reuses astSetsVar's traversal
      rather than a second copy of it: that walk is now astScanVar(ast, var,
      VarScanMode), with SetTarget and ClosureCapture node tests over one
      shared, already-proven-complete recursion.
      An INVARIANT backs it up at the end of codegenDo: if any loop variable was
      arena-moved anyway, the capture analysis missed a form, and codegen now
      FAILS LOUDLY with a diagnostic instead of emitting a loop that cannot
      terminate. That guard is what caught the two design corrections below
      during class-kill.
    evidence: >-
      tests/integration/rest_capture_and_do_closure_test.esk, 23/23 checks on
      all four native axes (ctest lanes rest_capture_and_do_closure_*): mutating
      and read-only captures, an immediately-invoked closure and a let-bound
      one, a named let in the body, a nested `do` closing over the OUTER
      variable, a loop inside a procedure with a runtime trip count, closures
      stored out of the loop and called after it finished, and the two controls.
      tests/differential/corpus/48_rest_capture_and_do_closure.esk on the native
      axes; tests/vm_parity/corpus/60_do_loop_closure_capture.esk pins the
      reproducer VM-vs-native.
      Revert-validated against a build of the same tree without the codegen
      change (worktree eshkol-wt-vmmem): the reproducer runs until the CPU limit
      fires, and the let-bound and named-let shapes fail LLVM verification.
    caught_by: [direct-measurement, sw-25-adjacent-finding]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      Two design corrections were forced by the codegenDo invariant during
      class-kill, and both are recorded because they are the non-obvious part.
      (1) An internal `(define (bump) …)` in the body is NOT a ClosureCapture
      site: codegenFunctionDefinition captures through module-level storage
      (`<fn>_nested_N_capture_<var>`) re-seeded from the enclosing binding on
      every execution, which does not split the loop — forcing arena storage for
      it turned a correct 3 into a type error, measured. `(define bump (lambda …))`
      is a different shape and IS caught, by the LAMBDA_OP case.
      (2) The invariant is narrowed to the arena-move signature (a pointer-typed
      CallInst) for the same reason, so the legitimate module-storage rebinding
      is not flagged.

  - id: LE-10
    bucket: LOUD-ERROR
    subtag: cheap-fix
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/vm-do-loop-capture"
    title: "A `do` loop poisons a LATER `do` in the same program (VM heap object limit / calling non-function / hang)"
    repro: "(display (do ((i 0 (+ i 1)) (a 0)) ((= i 3) a) ((lambda () (set! a (+ a 1)))))) (display (do ((k 0 (+ k 1)) (b 0)) ((= k 4) b) (set! b (+ b 10))))"
    observed: >-
      as filed: "ERROR: VM heap object limit reached
      (ESHKOL_VM_HEAP_MAX_SIZE=16777216 objects)", exit 1, after the first loop
      printed its correct answer; a let-bound body closure additionally gave
      "ERROR: calling non-function" whenever a top-level form preceded the
      loop, and longer sequences hung. Each shape was correct ALONE, which is
      what identified it as sequence-dependent.
    measured: >-
      RE-MEASURED at 2ae3787f and found WIDER, and partly SILENT, than filed.
      The reproducer above answers 3 then 13 on the VM where native answers 3
      then 40 — a wrong VALUE with exit 0 and no diagnostic, not a loud error.
      It also needs NEITHER a closure NOR a capture: two ordinary sequential
      `do` loops diverge the same way, and the minimal case is a `do` followed
      by a `define`:
        (do ((i 0 (+ i 1))) ((= i 2)) 1) (define q 42) (display q)
      which is 2 on the VM and 42 natively. The loud shapes this entry was
      filed for are the same corruption landing on a slot whose stranded junk
      happens to be a loop counter or a callee.
    root_cause: >-
      lib/backend/vm_compiler.c::compile_form_do() never popped its loop
      variables. compile_form_let() ends with OP_POPN; compile_form_do() ended
      by decrementing the compiler's own c->n_locals — a COMPILE-TIME
      bookkeeping change with no runtime effect — so every `do` form stranded
      one operand-stack value per loop variable. Top-level bindings live in
      stack slots handed out by counting (add_local), and the top-level driver
      emits exactly one OP_POP per expression that grew no local, so the
      stranded values shift every later slot. This is the SAME slot-shift
      corruption already documented on compile_form_require() and
      compile_form_with_region() in that file, reached a third way.
    fix: >-
      compile_form_do() emits OP_POPN for its loop variables at the loop exit,
      keeping the result on top, exactly as compile_form_let() does; the result
      expressions are compiled out of tail position when there are locals to
      pop, because a TAIL_CALL would skip the OP_POPN. The same rewrite removed
      a second latent hazard: the function used to emit a complete first
      version of the loop and then "discard" it with `c->code_len = loop_top`,
      leftover debugging scaffolding that compiled the body and steps TWICE.
      Rewinding code_len un-emits code and none of the constant-pool, upvalue,
      closure-PC or global repatch-array side effects the discarded pass had
      already caused.
    evidence: >-
      tests/vm_parity/corpus/61_do_loop_variable_binding.esk (VM-vs-native on
      the native, vm-src and vm-eskb axes) and
      tests/differential/corpus/49_do_loop_variable_binding.esk.
      Revert-validated: with lib/backend/vm_compiler.c restored, the corpus
      file HANGS on the VM (killed at 25s) and the individual shapes answer 2,
      00, 2 and 0 where the fixed VM and native both answer 42, 50, 6 and 4.
    filed_shapes_measured: >-
      The two shapes PR #437 filed this entry against, carried over from its
      wording so the union loses no evidence, and re-run on the fixed VM:
        (display (do ((i 0 (+ i 1)) (s 0)) ((= i 4) s) (set! s (+ s ((lambda () i))))))
        (display (do ((i 0 (+ i 1))) ((= i 3) i) ((lambda (i) i) 99)))
      filed as "heap object limit reached" then a fatal error, exit 1, after
      the first loop had printed its correct answer; correct is 6 then 3, which
      native prints. Also filed: a let-bound (not immediately invoked) body
      closure gave "ERROR: calling non-function" whenever any top-level form
      preceded the loop, and longer sequences hung.
    caught_by: [pr-437-class-kill, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus]
    notes: >-
      Filed as LOUD-ERROR by PR #437's class-kill, on the shapes it happened to
      hit. Re-measurement found the same root cause also produces SILENT wrong
      values, so the entry was closed on the wider evidence rather than on the
      loud shapes alone. Had it been closed only against the filed reproducer,
      the `do`-then-`define` case would still be shipping.


  - id: LE-11
    bucket: LOUD-ERROR
    subtag: structural
    status: closed
    closed_at: "fix/native-hash-popcount-guards"
    closed_by: "branch fix/native-hash-popcount-guards"
    title: "(hash-keys x) / (hash-values x) SIGSEGV native when x is not a hash table"
    repro: "(hash-keys 42)"
    observed: >-
      Native eshkol-run (both AOT and `-r` JIT) SIGSEGVs, exit 139, no diagnostic reaches
      the process — `guard` cannot catch a crash. Reproduced for all four documented
      spellings: hash-keys, hash-values, hash-table-keys, hash-table-values (the last two
      are aliases of the first two, sharing the same codegen and the same VM opcode).
    correct: >-
      a catchable type-error exception, matching the existing contract for other
      type-confused accessors in this file (car/cdr on non-pairs, arithmetic on non-numbers).
    cross_engine: >-
      the hosted VM did NOT crash, but silently returned '() instead of erroring — a
      different but also-wrong outcome (dispatch table lookup falls through to a
      hard-coded NIL_VAL fallback when the operand fails `is_heap_type(..., HEAP_HASH)`),
      so this was two divergent flaws on the two engines, not one shared root cause.
    root_cause: >-
      HashCodegen::hashKeys / HashCodegen::hashValues (lib/backend/hash_codegen.cpp) called
      TaggedValueCodegen::unpackPtr directly on the tagged operand with no type/subtype
      check, then passed the resulting garbage pointer straight to the runtime's
      hash_table_keys/hash_table_values helper, which dereferences it as a VmHashTable*
      (well, the AOT/JIT arena_hash_table struct). The sibling predicate
      HashCodegen::isHashTable already carried the correct check (legacy HASH_PTR tag OR
      consolidated HEAP_PTR tag with a HEAP_SUBTYPE_HASH object-header byte); hashKeys/
      hashValues just never called anything equivalent before dereferencing. On the VM,
      case 665/666 in lib/backend/vm_native.c correctly gated the fast path on
      is_heap_type(vm, ht_val, HEAP_HASH) but silently fell through to NIL_VAL on failure
      instead of raising.
    fix: >-
      Native: HashCodegen::requireHashTable() (lib/backend/hash_codegen.cpp), mirroring
      isHashTable's tag/subtype check, calls into the arithmetic codegen's existing
      ArithmeticCodegen::emitTypeError() idiom (the same one call_apply_codegen.cpp uses
      for `(apply min '())`) to raise a catchable exception with an `unreachable`
      terminator when the operand is not a hash table; wired into both hashKeys and
      hashValues before they touch the pointer. VM: cases 665/666 in vm_native.c now call
      vm_raise_error_msg() (the same catchable-error idiom used throughout this file for
      out-of-range accessors) instead of falling through to NIL_VAL.
    evidence: >-
      tests/v1_2_edge_cases/type_safety_test.esk — 5 new `guard`-wrapped checks for
      (hash-keys 42), (hash-values 42), (hash-table-keys 42), (hash-table-values 42), plus
      confirmation that real hash tables still round-trip through hash-keys/hash-values.
      Manually verified at the branch head, both AOT-compiled and `-r` JIT, and on the VM
      (eshkol-run --profile hosted-vm --emit-eskb + eshkol-vm-standalone-test): all four
      probes now print ERR under `guard` and exit 0 on both engines, where native previously
      SIGSEGVed (rc=139) and the VM previously exited 0 with a wrong '() answer.
      tests/escape_matrix/arity_parity_baseline.json's hash-keys::wtype /
      hash-table-keys::wtype / hash-values::wtype / hash-table-values::wtype
      native-vs-VM divergences are resolved (both engines now agree: ERR).
    caught_by: [direct-measurement, arity-probes]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, p8-arity-sweep]
    notes: >-
      Classified LOUD-ERROR (native side) rather than SILENT-WRONG because the pre-fix
      native failure mode was a crash (loud, if uncatchable) not a wrong answer with exit 0;
