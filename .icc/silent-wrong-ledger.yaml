      tangent dimension, and its result is promoted back to a tower of the outer
      epoch. Note the closure was never the defect — `(derivative df 2.0)`
      answered 48 correctly before and after; only the crossing into the tower
      was broken.
    fixed_by: "ESH-0402 — same change as SW-03 (see that entry for the sites)."
    evidence: >-
      tests/ad/ad_carrier_nesting_test.esk rows `tower-over-jet-1/2/3`,
      `tower-over-closure-1/2`, `jet-over-closure` and `closure-value`, on both
      ctest lanes; the ad_oracle `carrier` section's `overclosure` and
      `toweroverjet` probes on both lanes. Revert-validated with SW-03.
    caught_by: [KNOWN_ISSUES, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ad_oracle]

  - id: SW-05
    bucket: LOUD-ERROR
    subtag: structural
    status: fixed
    reclassified_from: SILENT-WRONG
    closed_at: "5886b91e"
    closed_by: "PR fix(ad): the nesting cluster (branch fix/ad-nesting-cluster)"
    title: "Curried gradient-of-gradient now raises instead of answering a zero matrix (ESH-0096)"
    repro: "(define (f v) (* (vector-ref v 0) (vector-ref v 0) (vector-ref v 0))) (define g (gradient f)) (display (jacobian g (vector 2.0)))"
    observed_before: "#((0)), exit 0 — where (hessian f (vector 2.0)) returns #((12)) on the same build"
    observed_after: >-
      a catchable error: "unsupported nested differentiation: a first-class
      `gradient` closure differentiated again by an enclosing reverse-mode
      pass". ROOT CAUSE, measured: this is NOT the SW-03/SW-04 carrier defect
      and NOT the deferred dense-tape-spine rework. `jacobian` is reverse mode —
      it packs one `ad_node_t*` per input component into the point tensor's
      element array and publishes the active column as the reverse seed. The
      vector arm of AutodiffCodegen::emitRuntimeClosureGradient() then reads
      those components with a raw `CreateBitCast(elem_bits, double)`, so a heap
      pointer became a subnormal ~1e-310: the inner gradient was evaluated at ~0
      AND its result carried no edge back to the outer tape. For f(v) = v0*v0
      the same bogus bits were classified as a pointer and dereferenced, so the
      route also SIGBUSed. The element load is now residency-probed
      (eshkol_ad_node_probe, which never dereferences a non-resident candidate)
      and raises rather than differentiating garbage.
    fixed_by: >-
      ESH-0402 — eshkol_ad_curried_gradient_unsupported() in
      lib/core/runtime_taylor.c, called from the AD-node probe guarding the
      element bitcast in emitRuntimeClosureGradient()'s reverse-tensor arm
      (lib/backend/autodiff_codegen.cpp).
    evidence: >-
      tests/ad/ad_curried_gradient_nested_loud_test.esk on the
      ad_curried_gradient_nested_loud_runtime_smoke and _aot_smoke ctest lanes.
      It pins BOTH halves: the supported spellings still answer ((g (vector 2.0))
      => #(12), (gradient f (vector 2.0)) => #(12), (hessian f (vector 2.0)) =>
      #((12))), and the composed one is caught by `guard`, so a regression to
      the silent zero — or back to the memory-unsafe read — fails the lane.
    caught_by: [KNOWN_ISSUES, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, pr-record-416]
    notes: >-
      PR #416 measured ESH-0096 as CLOSED and proposed deleting the KNOWN_ISSUES
      entry. Direct measurement at 9f2da2ab and again at 2ae3787f contradicts
      that for the curried jacobian route. Do not accept #416's close of
      ESH-0096; the KNOWN_ISSUES entry stays, restated as a loud limitation.
      NEEDS-DECISION: the exact fix is forward-over-reverse — evaluate the inner
      gradient with 8-jets whose ep slot carries eshkol_ad_seed_flag of each
      incoming tape node, and let popAndExtractForward's existing
      eshkol_ad_mixed_record hook write the composition back onto the outer tape
      (the identical machinery the direct `hessian` already uses, and the
      identical machinery `jacobian` already installs at its call site for the
      forward-over-reverse case). That is a new emission path inside
      emitRuntimeClosureGradient's vector arm, estimated 3-5 days with the AD
      oracle as the acceptance gate. It is NOT blocked on the dense resident
      tape spine: no second reverse tape is required, because the inner pass
      becomes forward.

