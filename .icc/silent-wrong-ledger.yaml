  - id: SW-53
    bucket: SILENT-WRONG
    status: closed
    closed_at: "feat/linearity-complete"
    closed_by: "branch feat/linearity-complete"
    renumbered_from: >-
      SW-46 (collision). Filed as SW-46 on branch feat/linearity-complete
      (PR #471), independently of the SW-47 entry's note recording that id
      as reserved for the in-flight AD carrier-wave lane
      (feat/ad-structural-gate, PR #487). Both #471 and #487 landed on
      master claiming SW-46, invisible to review since a textual merge does
      not conflict on two branches picking the same next-free id. Moves to
      SW-53, the next id free across the whole ledger (highest prior id in
      use was SW-58, this branch's own guard/handler-chain entry): #487's
      entry keeps SW-46, being the rightful holder per SW-47's own
      reservation note and carrying three external cross-references
      (.icc/architecture-model.yaml, .icc/completion-oracles.yaml,
      tests/ad/ad_vm_exactness_gate.sh) this entry has none of.
    family: engine-parity/type-system
    title: "The bytecode VM enforced NO linear (no-cloning) typing at all: it ran a qubit clone to completion with exit 0 and no diagnostic, and --emit-eskb wrote the bytecode for it"
    repro: >-
      Any program with a linear annotation that clones the value, e.g.
      tests/typesystem/qubit_no_cloning_default_test.esk —
      `(define (bad-clone (q : Qubit)) (cons q q))`. Run it two ways:
      `build/eshkol-vm-standalone-test <file>` (VM source execution) and
      `build/eshkol-run <file> --profile hosted-vm --emit-eskb <out.eskb>`.
      The SAME binary refuses the SAME program on the LLVM path (exit 1, no
      artifact).
    observed: >-
      pre-fix (measured at 15f9b42a, the head of PR #471): the VM standalone
      compiled the program, executed it, printed its output and exited 0, with
      no linearity diagnostic of any kind on stdout or stderr; --emit-eskb
      wrote a complete .eskb and exited 0. Meanwhile the native path exited 1
      and wrote nothing for the identical source. So the answer to "does this
      program type-check" depended on which engine you asked, and the VM's
      answer was silent.
    correct: >-
      A linear (no-cloning) violation is a compile-time type error, and a type
      error is a property of the PROGRAM, not of the engine that happens to be
      compiling it. Both engines must refuse the program, neither may write an
      artifact for it, and both must say why.
    root_cause: >-
      The linear judgment lives in the HoTT type checker
      (lib/types/type_checker.cpp), which is constructed only inside
      llvm_codegen.cpp's generation path. The VM reaches its compiler through
      lib/backend/eshkol_vm.c -> lib/backend/vm_compiler.c, which has its own
      independent S-expression reader producing `Node*` — a different AST from
      `eshkol_ast_t` entirely — and never constructs a TypeChecker at all.
      There was no place on the VM route where the rule could have been
      consulted, so it was not a check that failed; it was a check that did not
      exist on that engine.
    fix: >-
      The rule was NOT reimplemented over `Node*`, which would have produced
      two judgments that drift. lib/types/linear_check_bridge.cpp exposes
      eshkol_linear_check_source(), which drives the REAL front end — the same
      parser, the same macro expander, the same TypeChecker — over the same
      source text and returns the real verdict. eshkol_vm.c calls it before
      compiling, at both chokepoints (compile_and_run and
      emit_eskb_with_options), and refuses the program when it reports a
      violation. It is reached through an installable hook
      (eshkol_vm_install_linear_check, inc/eshkol/backend/vm.h) rather than a
      direct call because eshkol_vm.c ships inside libeshkol-runtime.a, which
      is linked into every program the compiler emits and must not drag in the
      C++ type checker; the drivers that have the front end linked install it.
      A build with nothing installed REFUSES any source carrying a linear
      annotation rather than accepting it unchecked. The probe is gated on the
      source actually carrying a linear annotation, so programs that do not opt
      into linear types are untouched.
    evidence: >-
      tests/typesystem/qubit_linearity_engine_parity_gate.sh, wired into ctest
      as `qubit_linearity_engine_parity_gate`. It pins all four corners, not
      just the rejection: VM source execution rejects a clone (nonzero exit, a
      linearity diagnostic, and the program body never runs) AND accepts a
      correct linear program (exit 0, its output present); --emit-eskb rejects
      a clone (nonzero exit AND no .eskb written) AND accepts a correct program
      (exit 0 AND a .eskb written). Pinning acceptance is what stops a "fix"
      that simply refuses every qubit program from passing.
    caught_by: [pr-471-vm-parity-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, run_typesystem_tests]
    note: >-
      Originally filed as SW-46, independently of the SW-47 entry's note below
      recording that id as reserved for the in-flight AD carrier-wave lane
      (feat/ad-structural-gate, PR #487). Both #471 and #487 landed on master
      claiming SW-46, invisible to review since a textual merge does not
      conflict on two branches picking the same next-free id. Renumbered to
      SW-53 (next free after SW-52) on rebase, since #487's entry carries three
      external cross-references (.icc/architecture-model.yaml,
      .icc/completion-oracles.yaml, tests/ad/ad_vm_exactness_gate.sh) and this
      one has none.
    notes: >-
      Filed by PR #471 as build item BI-5 after measuring it on both VM entry
      points. It is the same class the project refuses elsewhere — a guarantee
      that holds on one engine and silently does not on the other — so it was
      fixed rather than documented.

  - id: SW-63
    bucket: LOUD-ERROR
    subtag: cheap-fix
    status: closed
    closed_at: "feat/noesis-blockers"
    closed_by: "branch feat/noesis-blockers"
    family: type-system/stdlib
    title: "core.memory's memory-fold-lww rejected under --strict-types: a named-let accumulator seeded #f then reassigned to an lww-register Vector, a genuine Boolean/Vector unification conflict HoTT was right to refuse"
    repro: >-
      (require core.memory) (define log (make-memory-log 'x))
      (memory-append! log 'value (cons 'answer 42))
      (display (memory-fold-lww log 'answer)) — compiled with
      --strict-types --emit-object. Also filed by a downstream consumer as
      bug-UU (core.memory strict-lww-register), independently reproduced
      this session.
    observed: >-
      pre-fix (measured at afbaaf5b, current master before this branch):
      `eshkol-run --strict-types --emit-object` on the repro above exits 1
      with `[ERROR] Type error: argument 3 of 'loop': expected Boolean, got
      Vector (line 126:24)` then `HoTT: 1 type errors detected (strict
      mode)`. Under gradual typing (no --strict-types) the same program ran
      correctly and printed 42 — so the checker's rejection was not
      protecting against a real defect, and a strict-mode consumer had no
      way to get the correct, already-working behavior gradual typing gave
      everyone else.
    correct: >-
      The program computes the right answer (42) either way; --strict-types
      should accept it, not merely fail loudly at a program that was never
      wrong.
    root_cause: >-
      lib/core/memory.esk's memory-fold-lww used one named-let loop with a
      single accumulator `reg`, seeded `#f` (Boolean) and reassigned on the
      first matching event to `(make-lww-register ...)` (a Vector). HoTT
      unifies a tail-recursive loop parameter's type across every one of its
      call sites within the loop, so a parameter that is genuinely Boolean
      on the seed call and Vector on every subsequent call is a real
      Boolean/Vector conflict as written — not a checker false positive.
      The loud rejection was doing its job on the source AS WRITTEN; the
      source's own shape was the defect.
    fix: >-
      Split the fold into two functions so each named-let's accumulator has
      ONE fixed shape for its entire lifetime: memory-lww-key-present? is
      Boolean-only (never touches a register, so nothing to conflict), and
      memory-fold-lww-vector is called only once a match is already known to
      exist, seeding its accumulator with a real (harmless,
      immediately-overwritten) lww-register instead of #f so it stays
      Vector-shaped throughout. memory-fold-lww composes the two: check
      presence, then fold only if present, else #f.
    evidence: >-
      tests/typesystem/memory_fold_lww_accumulator_test.esk (EXPECT-MODE
      strict-types, EXPECT-COMPILE ok), wired into
      scripts/run_typesystem_tests.sh's existing tests/typesystem/*.esk
      sweep. Verified directly across engines: native AOT
      (--strict-types --emit-object), native JIT (--strict-types -r), and
      VM bytecode emission (--strict-types --profile hosted-vm --emit-eskb)
      all compile clean with no HoTT diagnostics; default gradual mode is
      unchanged (still prints 42).
    caught_by: [downstream-consumer-audit-2026-08-26]
    missed_by: [icc-smoke, icc-readiness, ctest, run_typesystem_tests]
    notes: >-
      A WIP fix for this existed unmerged on an old-master-based branch
      (codex/memory-fold-lww-strict); this entry's fix re-derives the same
      structural split, verified against current master and re-tested
      end-to-end rather than rebase-inherited.

  - id: SW-64
    bucket: LOUD-ERROR
    subtag: structural
    family: packaging/build-integration
    status: closed
    closed_at: "feat/noesis-packaging"
    closed_by: "branch feat/noesis-packaging"
    title: "Eshkol shipped no find_package(Eshkol) discovery contract: a consumer's own Find module had to guess library names and could resolve the compiler/tool aggregate instead of the runtime, and every compiled program silently needs stdlib.o that nothing said to link"
    repro: >-
      Stage a homebrew-shaped install (bin/eshkol-run, lib/eshkol/{libeshkol-runtime.a,
      libeshkol-static.a,stdlib.o}, share/eshkol/lib/*.esk — packaging/homebrew/eshkol.rb's
      real install list) from a fresh default build. Compile a bare-top-level-expression
      program (no explicit `(define (main) ...)`) with `eshkol-run --emit-object`, then link
      the resulting .o against ONLY the runtime archive with the platform C++ compiler
      directly (the operation a downstream find_package(Eshkol)-based CMake project performs).
    observed: >-
      A find_library(NAMES eshkol eshkol-static libeshkol libeshkol-static) style guess (the
      shape a downstream Find module reasonably writes with no shipped contract to read)
      resolves libeshkol-static.a — the ~30k-symbol compiler/tool aggregate, not
      libeshkol-runtime.a (~8.8k symbols) that a compiled PROGRAM needs — on a build where
      both archives are staged. Independently, linking the compiled program's .o against
      ONLY the (correct) runtime archive fails with `Undefined symbols ... "___eshkol_lib_init__"`:
      codegen calls that symbol from a program's synthesized entry point whenever the source
      has no explicit `(define (main) ...)`, and only ever DEFINES it inside stdlib.o — nothing
      in the packaged install or its documentation said a downstream link line needed stdlib.o
      at all, so the failure was loud but only ever surfaced once a consumer's program happened
      to take that shape.
    correct: >-
      A packaged install ships one canonical, unambiguous discovery contract; a downstream
      project can call find_package(Eshkol) and get a complete, working link line without
      writing its own library-name guesses or knowing about __eshkol_lib_init__/stdlib.o at all.
    root_cause: >-
      cmake/EshkolCompile.cmake (the documented "canonical CMake integration",
      docs/BUILD_INTEGRATION.md) referenced find_package(Eshkol) as one way to resolve
      Eshkol_COMPILER, but this repo never shipped the Find/Config module that call requires —
      neither in the source tree nor in either packaging pipeline (homebrew formula, GitHub
      release tarball). Every downstream consumer was necessarily writing its own guess against
      an undocumented, ambiguous install surface (two similarly-named static archives; a
      link-time symbol dependency that is conditional on codegen shape and undocumented).
    fix: >-
      cmake/FindEshkol.cmake ships as this repo's ONE canonical Find module, resolving
      Eshkol_COMPILER/Eshkol_LIBRARY (eshkol-runtime, specifically, never eshkol-static)/
      Eshkol_STDLIB_OBJECT/Eshkol_STDLIB_MODULE_DIR against the real installed layout, and
      producing an Eshkol::eshkol imported target whose INTERFACE_LINK_LIBRARIES
      unconditionally includes stdlib.o (harmless for programs that do not need it, verified) plus,
      on Apple, the system frameworks the runtime needs. packaging/homebrew/eshkol.rb and both
      of release.yml's "Package Release Asset" steps install this module and
      cmake/EshkolCompile.cmake to share/eshkol/cmake/.
    evidence: >-
      tests/integration/system_package/ (a from-scratch consumer CMake project, deliberately in
      the bare-top-level-expression style so it exercises the stdlib.o requirement) driven by
      scripts/run_system_package_integration_test.sh — verified end to end (find_package(Eshkol)
      -> include(EshkolCompile) -> eshkol_compile_executable() -> link -> run) against a
      homebrew-shaped staged prefix. Wired as .icc/package-manifest.yaml's `cmake_integration`
      (file presence) and `integration_contract` (executes the script, requires exit 0) entries,
      checked by scripts/check_package_manifest.py --verify-integration-contract; and as a new
      step in the packaging-homebrew job of .github/workflows/adversarial-nightly.yml, run
      against a real `brew install --build-from-source` result.
    caught_by: [downstream-consumer-audit-2026-08-26]
    missed_by: [icc-smoke, icc-readiness, ctest, packaging-homebrew-nightly-lane-pre-fix]
    notes: >-
      Scoped to macOS/Linux: the verified link recipe (system frameworks, stdlib.o placement)
      has not been established for the Windows/MSVC toolchain, so
      cmake/FindEshkol.cmake's INTERFACE_LINK_LIBRARIES on Windows carries only bcrypt/ws2_32
      (mirroring the runtime's own known Windows link deps) without the same end-to-end
      verification this entry's evidence covers for macOS/Linux.

