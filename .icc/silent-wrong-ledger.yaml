  - id: SW-10
    bucket: SILENT-WRONG
    status: closed
    closed_at: "45877dde"
    closed_by: "PR (branch fix/resource-limits-and-ascription)"
    title: "Seven documented resource-limit environment variables are accepted and never enforced"
    repro: "ESHKOL_MAX_HEAP=1 ESHKOL_ENFORCE_LIMITS=1 eshkol-run -r a-20M-iteration-loop.esk"
    observed: >-
      Runs to completion, prints 199999990000000, exit 0. ESHKOL_TIMEOUT_MS=500 prints
      'ERROR: Execution timeout: 500ms limit exceeded' and then runs to completion and exits 0.
    correct: "The documented limit is applied, or the variable is documented as inert"
    variables: [ESHKOL_MAX_HEAP, ESHKOL_TIMEOUT_MS, ESHKOL_MAX_STACK, ESHKOL_MAX_TENSOR_ELEMS, ESHKOL_MAX_STRING_LEN, ESHKOL_ENFORCE_LIMITS, ESHKOL_LIMIT_WARNINGS]
    evidence: >-
      lib/core/resource_limits.cpp parses into g_limits and nothing consults it.
      Exhaustive grep over lib/, inc/ and exe/ for eshkol_check_tensor_size,
      eshkol_check_string_length, eshkol_is_timed_out and eshkol_track_allocation returns
      15 hits: 11 declarations in inc/eshkol/core/resource_limits.h and 4 definitions in
      lib/core/resource_limits.cpp. ZERO call sites anywhere else — the enforcement
      functions are written, compiled, and never invoked. Documented as controls at docs/breakdown/RUNTIME_CONFIGURATION.md:27-33,
      docs/reference/runtime/environment-variables.md:65-73, docs/API_REFERENCE.md:4396-4402.
    caught_by: [pr-record-416, direct-measurement, doc-source-crosscheck]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, KNOWN_ISSUES]
    notes: >-
      A consumer setting a heap ceiling to contain untrusted code gets no containment
      and no warning. #416 adds honest 'Accepted, not enforced in v1.3.4' status columns
      but #416 is UNMERGED, so the cut still documents them as controls.
    fix: >-
      Each ceiling is applied at the one site every path to it converges on, so no
      call site can be added later that escapes it, and no fast path pays for it:
      ESHKOL_MAX_HEAP at lib/core/runtime_arena_core.cpp create_arena_block() (the
      arena's only OS-request site — once per block, bump-pointer path untouched);
      ESHKOL_MAX_STRING_LEN at lib/core/runtime_object_alloc.cpp
      arena_allocate_string_with_header(); ESHKOL_MAX_TENSOR_ELEMS at
      lib/core/runtime_tensor_alloc.cpp arena_allocate_tensor_full() plus
      lib/backend/tensor_creation_codegen.cpp emitTensorElementLimitCheck(), because
      native codegen assembles tensors from three separate allocations and never calls
      that helper; ESHKOL_TIMEOUT_MS as a cooperative poll emitted at the tail-call
      back-edge in lib/backend/llvm_codegen.cpp codegenTailCallFromContext() and run at
      every guarded function entry in lib/core/runtime_list_helpers.cpp
      eshkol_check_recursion_depth(); ESHKOL_MAX_STACK by making that same guard read
      eshkol_get_limits()->max_stack_depth instead of a hard-coded 100000 (there were
      two stack-depth mechanisms with the same default and no wire between them);
      ESHKOL_VM_MAX_INSN in both lib/backend/vm_run.c dispatch paths.
      ESHKOL_ENFORCE_LIMITS and ESHKOL_LIMIT_WARNINGS select terminate-vs-advisory and
      soft-limit warnings at the single decision point eshkol_limit_enforce().
    measured_after: >-
      ESHKOL_MAX_HEAP=1 on the 20M-iteration loop: 'eshkol: fatal: Heap hard limit
      exceeded (limit 1 bytes, set by ESHKOL_MAX_HEAP): arena block', exit 120 (was
      199999990000000, exit 0). ESHKOL_TIMEOUT_MS=500 on the same program: 'eshkol:
      fatal: Execution timeout exceeded (limit 500ms, set by ESHKOL_TIMEOUT_MS)', exit
      124 (was the same message followed by the answer and exit 0). MAX_STRING_LEN=100
      exit 123, MAX_TENSOR_ELEMS=100 exit 122, MAX_STACK=100 exit 121,
      VM_MAX_INSN=100000 exit 125. Under-limit controls all still exit 0 with identical
      output, and ESHKOL_ENFORCE_LIMITS=false downgrades every case to a warning and
      exit 0. All 13 cases green in tests/limits/resource_limits_enforcement_gate.sh,
      registered as the ctest gate resource_limits_enforcement_gate.
    residual: >-
      ESHKOL_MAX_STACK binds the recursion the depth guard observes; codegen does not
      yet emit that guard at the entry of every top-level `define`d function. That gap
      is ESH-0101 (tests/stress/found/deep_recursion_270k_no_diagnostic.esk) and is
      deliberately not closed here — tests/stress/rec_deep_nontco_250k.esk pins plain
      non-tail recursion working to 250000 frames, which the documented 100000 default
      would break. Recorded in docs/reference/runtime/environment-variables.md.
      RULED (maintainer, 2026-08-13): ESH-0101 stack-guard COVERAGE stays open as a
      ledgered v1.3.5 item. Wiring the variable where guards already exist — which is
      what this entry does — is the correct and complete v1.3.4 scope. Not a blocker
      for the v1.3.4 tag.
      Second residual, and the important one: every ceiling is OPT-IN. A limit
      binds a run only when that run sets its variable (or sets the matching
      ESHKOL_LIMIT_ACTIVE_* bit before eshkol_set_limits()); the documented
      defaults are the values a limit takes when turned on, not ceilings every
      program is held to. This was learned the hard way inside this PR: the
      first cut enforced the documented defaults unconditionally and killed
      tests/features/blc_test.esk, which allocates past the 1 GiB heap default
      and had run fine for years, with 'Heap hard limit exceeded' and exit 120.
      The VM's computed-goto dispatch likewise never had an instruction guard,
      so applying the 10M default there had the same character. The defect this
      entry records is that ESHKOL_MAX_HEAP=1 did nothing; fixing that does not
      require imposing a ceiling on every program that sets nothing.
      Whether the defaults should ALSO bind an unconfigured run is a release
      decision about defaults, not a bug fix.
      RULED (maintainer, 2026-08-13): ceilings stay OPT-IN for v1.3.4. Shipping
      behaviour is unchanged for every existing program — a run that sets nothing is
      bounded by nothing, exactly as before. Whether the documented defaults should
      also bind an unconfigured run is deferred as a v1.3.5 policy question, not a
      v1.3.4 defect. Documented at docs/reference/runtime/environment-variables.md
      ("Limits are opt-in") and pinned by a dedicated case in
      tests/limits/resource_limits_enforcement_gate.sh.

  - id: SW-11
    bucket: SILENT-WRONG
    status: closed
    closed_at: "45877dde"
    closed_by: "PR (branch fix/resource-limits-and-ascription)"
    title: "(the <type> expr) is a runtime no-op, so a false ascription is never caught"
    repro: "(display (the string (+ 1 2)))"
    observed: "3, exit 0"
    correct: "a type error, or a doc that does not call it an assertion"
    evidence: ".scratch/flaw-ledger/repro/sw_the.esk; docs/FEATURE_MATRIX.md:72,804"
    caught_by: [direct-measurement, doc-source-crosscheck]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness]
    notes: "Documented as a 'trusted assertion to the checker; runtime no-op (byte-identical IR)'. Documented-by-design, but the word 'assertion' is the lie."
    fix: >-
      Closed on the 'a type error' arm of `correct`, not the 'document it differently'
      arm, and at compile time rather than at run time. lib/types/type_checker.cpp
      ESHKOL_THE_OP was already synthesizing the wrapped expression and then throwing
      the resulting type away; it now compares that type against the ascribed one via
      the new TypeChecker::ascriptionIsBelievable() and reports a provable
      contradiction through reportTypeIssue(), the same enforcement point every other
      type issue uses — a warning under gradual typing, fatal under --strict-types.
      The predicate rejects only the impossible: widening, narrowing (the reason the
      form exists), anything touching the dynamic Value root or an unresolved type, and
      numeric-tower-to-numeric-tower are all accepted, the last because this type graph
      keeps Integer/Rational/Real/Complex as siblings under Number rather than a chain,
      so `(the real 1)` has no subtyping relation in either direction.
      DELIBERATELY NOT a runtime check: COMPLETE_LANGUAGE_SPECIFICATION.md 3.6.6
      guarantees the emitted IR is byte-identical to the wrapped expression with no
      runtime tag check and no cost, and docs/FEATURE_MATRIX.md:804 justifies the VM
      parity gap ON that guarantee. A compile-time diagnostic makes the word 'checked'
      true without walking either claim back; both were re-worded to say so.
    measured_after: >-
      `(display (the string (+ 1 2)))` now prints '[WARN] Type warning: ascription
      (the String ...) contradicts the inferred type Int64; no value can satisfy it
      (line 1:11)' and, under gradual typing, still evaluates to 3 and exits 0 as the
      documented gradual-typing model requires; under --strict-types it is fatal —
      'Refusing to generate code for a program with type errors', exit 1, no artifact.
      Class-kill matrix all reported: (the vector (+ 1 2)), (the procedure "x"),
      (the string (vector 1 2)), (the integer "s"), (the boolean 5). Correct
      ascriptions unaffected across the numeric tower and strings:
      (the number (+ 1 2)), (the real 1), (the integer 5), (the string "hi") are
      silent and evaluate identically. tests/typesystem/checked_cast_the_test.esk
      compiles clean under --strict-types with 0 diagnostics, and the
      registry-derived coverage cell in scripts/run_typesystem_tests.sh is unaffected
      because its operand is dynamic.
    residual: >-
      The diagnostic is native-only, because the bytecode VM has no `the` surface and
      does not run the HoTT checker. That is unchanged from before this fix and remains
      native-only-justified in docs/VM_PARITY.md: the form emits no code on either
      engine, so what the two engines COMPUTE is still identical.

  - id: SW-12
    bucket: SILENT-WRONG
    status: closed
    closed_at: "1b2682f6"
    title: "Six tensor ops carry two independent backward implementations with no differential test between them"
    ops: [matmul, layernorm, transpose, sum, embedding, attention]
    evidence: >-
      lib/backend/tensor_backward.cpp defines eshkol_backward_{matmul,layernorm,transpose,sum,embedding,attention};
      lib/bridge/tensor_backward.cpp defines tensor_{matmul,layernorm,transpose,sum,embedding,attention}_backward.
      tests/bridge/qllm_bridge_gradcheck_test.cpp gradchecks the BRIDGE half against finite
      differences for matmul/gelu/softmax/layernorm/rmsnorm/silu/cross-entropy and explicitly
      EXCLUDES attention and embedding. No test compares the two implementations on the same input.
    caught_by: [direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, duplicate-implementations-detector]
    notes: >-
      ICC's duplicate-implementations detector did not flag this pair: the two files are
      not textually similar, so a lexical clone detector cannot see a semantic duplicate.
      That is a concrete ICC detector gap, not a scoping choice. The correctness chain's
      other half, `contradictions`, returned 30 findings at this SHA and every one is a
      constant_disagreement or env_default_disagreement on a build/tuning symbol — it
      compares symbol VALUES, never behaviour, docs or test-harness metadata.
    measured: >-
      Direct differential built on branch fix/vector-ref-tensor-and-backward-diff (commit f55e0336)
      (tests/backend/tensor_backward_dual_impl_gradcheck_test.cpp, new; plus one added check in
      tests/backend/tensor_embedding_backward_gradcheck_test.cpp): identical inputs and an
      identical upstream cotangent fed to BOTH implementations, diffed directly against each
      other, with central finite differences of a THIRD, independently-written forward as the
      tie-breaking oracle per the task ruling ("finite differences arbitrate").

      5 of 6 ops AGREE, to machine precision or exactly:
        matmul     max|native-bridge| = 0.0 (both operands), FD max diff 1.8e-10 / 9.6e-11
        layernorm  max|native-bridge| = 6.9e-17 (dx) / 0.0 (dgamma), FD max diff 2.9e-10 / 1.9e-10
        transpose  max|native-bridge| = 0.0, FD max diff 5.1e-11
        sum        max|native-bridge| = 0.0, FD max diff 9.2e-12
        embedding  max|native-bridge| = 0.0 (exact scatter-add on both sides; already had
                   independent FD/closed-form coverage in ESH-0230's test, this adds the direct
                   bridge-vs-native diff on the identical fixture)
      transpose and sum have no AD_NODE_TENSOR_{TRANSPOSE,SUM} forward producer anywhere in the
      tree (same situation embedding was in before PR #392 / ESH-0230), so their bridge side was
      exercised by hand-building the node per tensor_{transpose,sum}_backward's documented
      contract, the same technique tests/backend/tensor_embedding_backward_gradcheck_test.cpp
      already used for embedding.

      attention was, at that SHA, NOT a numeric disagreement: eshkol_backward_attention (native)
      was exact and FD-validated (max diff 2.3e-11 / 6.5e-11 / 4.2e-11 across dQ/dK/dV) while
      tensor_attention_backward (bridge) unconditionally called eshkol_fatal(), because
      ad_tensor_attention's forward (lib/bridge/qllm_bridge.cpp) retained neither the `causal`
      flag nor the softmax attention weights an exact adjoint needs. That was a forward-plumbing
      gap, not a wrong formula — recorded as NEEDS-DECISION and referred to the maintainer.
    resolution: >-
      Maintainer ruling: FIX IT — no refusal path ships. Implemented on branch
      fix/bridge-attention-backward (stacked on fix/vector-ref-tensor-and-backward-diff).

      FORWARD (lib/bridge/qllm_bridge.cpp, ad_tensor_attention) now retains what the adjoint
      needs, in the mechanism the node struct already provides for exactly this and that the
      native AD_NODE_ATTENTION arm already uses (saved_tensors):
        node->saved_tensors[0]  dense [batch, num_heads, seq, seq] softmax weight matrix,
                                masked entries left at EXACTLY zero
        node->num_saved         1
        node->params as int64[6]  [num_heads, head_dim, causal, scale_bits, 0, 0]
                                (scale bit-cast from double, the "scale_bits" convention already
                                used by the AD_NODE_ATTENTION params and the Frechet rule;
                                slots [0]/[1] deliberately coincide with the named
                                attention_params fields so both spellings read the same slots)
      Forward VALUES are unchanged — the retained row is the same softmax row the forward already
      computed, hoisted out of the inner product loop.

      BACKWARD (lib/bridge/tensor_backward.cpp, tensor_attention_backward) is now the exact
      adjoint, per (batch, head) column slice of the [batch, seq, dim] operands:
        dV[j] = sum_i A[i][j] dO[i]
        dA[i][j] = <dO[i], V[j]>
        dS[i][j] = A[i][j] (dA[i][j] - sum_k A[i][k] dA[i][k]) * scale     (softmax Jacobian
                   diag(y) - y y^T applied row-wise, one row dot product per row: O(seq^2))
        dQ[i] = sum_j dS[i][j] K[j]      dK[j] = sum_i dS[i][j] Q[i]
      Causal masking is carried by the retained zeros — every term above has a factor A[i][j], so
      masked positions contribute exactly zero with no mask test, and the summations still run
      over the full [0, seq) range. That keeps the accumulation ORDER identical between the causal
      and non-causal cases and identical to the native kernel's loop nest, which is what the
      no-fast-math / deterministic-gradient rule requires. The rule is written independently of
      eshkol_backward_attention rather than delegating to it, so the differential below compares
      two implementations and not a thing to itself. The eshkol_fatal refusal is retained ONLY
      for contract violations (no retained weights, missing operand, params that do not partition
      dim, unusable scale, or a recorded `causal` flag that disagrees with the retained weights —
      an exact-equality cross-check, since masked entries are exactly zero).

      MEASURED, ctest -R tensor_backward_dual_impl_gradcheck (21 checks, 21 pass), both masking
      modes at two shapes, native-vs-bridge max abs diff across dQ/dK/dV:
        small [batch 1, heads 1, seq 3, head_dim 4] noncausal  1.4e-17 / 1.4e-17 / 5.6e-17
        small                                       causal     2.8e-17 / 1.4e-17 / 0.0
        moderate [batch 2, heads 3, seq 5, head_dim 4] noncausal 5.6e-17 / 5.6e-17 / 1.1e-16
        moderate                                      causal    4.2e-17 / 3.8e-17 / 2.2e-16
      i.e. at or below the 1e-16 machine-epsilon floor, far inside the 1e-9 bar the other five ops
      are held to (the residual is BLAS-vs-scalar summation order: the native kernel is
      cblas_dgemm-backed, the bridge rule is plain loops). FD is the third oracle: bridge-vs-FD and
      native-vs-FD max diff 1.0e-10 .. 1.4e-09 on the moderate shapes, bar 1e-6 — and the two
      grads' FD residuals are identical to every printed digit, which is the same statement as the
      1e-17 agreement. The bridge FORWARD is also diffed against the reference forward (0.0).
    ops_status:
      matmul: agree
      layernorm: agree
      transpose: agree
      sum: agree
      embedding: agree
      attention: agree
    status_rationale: >-
      Ledger ruling: SW-12 closes only if all six ops are verified agreeing or fixed. All six are
      now verified agreeing on identical inputs, five to machine precision or exactly and
      attention to <= 2.2e-16 across four shape/masking cells, with finite differences of an
      independently-written third forward arbitrating in every case. The attention NEEDS-DECISION
      was resolved by the maintainer as FIX IT and the fix is in this branch; no refusal path
      remains for a well-formed node. Closing.
    evidence_new: >-
      lib/bridge/qllm_bridge.cpp (ad_tensor_attention retains the attention weights and the causal
      flag); lib/bridge/tensor_backward.cpp (tensor_attention_backward, exact adjoint replacing the
      unconditional refusal);
      tests/backend/tensor_backward_dual_impl_gradcheck_test.cpp (matmul/layernorm/transpose/sum
      direct diff + FD; attention direct diff + FD at two shapes x causal/non-causal through the
      REAL producer ad_tensor_attention and the real dispatch path, plus a fork death test that the
      rule still refuses a node with no retained weights);
      tests/backend/tensor_embedding_backward_gradcheck_test.cpp check 10 (direct bridge-vs-native
      diff, added to the existing ESH-0230 coverage);
      tests/bridge/qllm_bridge_gradcheck_test.cpp (attention and causal-attention pipelines added —
      no op is excluded from that suite any more; embedding remains gradchecked in its own file
      because it takes an index tensor, not that file's x/w pipeline shape);
      docs/breakdown/AUTODIFF.md (the "attention backward is a v1.2 value-passthrough stub" section
      replaced with the shipped exact rule on both paths).

  - id: SW-13
    bucket: SILENT-WRONG
    status: closed
    closed_at: "46a3069c"
    closed_by: "branch fix/wasm-macro-batch-and-bignum-exactness (PR #432)"
    title: "WASM batch compile mis-evaluates the first macro when a program has two or more define-syntax forms"
    observed: "(dbl 21) => (* 2 21) prints a garbage bignum, value varies per build"
    correct: "42"
    evidence: "tests/wasm_diff/EXCLUSIONS.tsv (XFAIL row, 16_define_syntax.esk); reaffirmed in PR #413 and #418"
    caught_by: [parity-baselines, pr-record-413, pr-record-418]
    missed_by: [icc-correctness-chain, icc-readiness]
    root_cause: >-
      NOT a wasm bug and NOT in the macro expander's ordering: a TYPE-PUNNING heap
      over-read that is undefined behaviour on every platform and only became VISIBLE in
      wasm32. vm_macro.c casts between `MacroNode*` and the hub's `Node*`, and the two
      structs were separate declarations that merely CLAIMED to be layout-compatible
      (lib/backend/vm_parser.c:27-40 pre-fix). They were not: the VM hub's Node carries
      four trailing fields MacroNode did not — is_char/is_inexact/is_int/ival at offsets
      156/160/164/168, sizeof 176 — while MacroNode was 160 bytes with `_cap` sitting
      exactly on top of `is_char`. Every macro-expanded node is
      calloc(sizeof(MacroNode))'d in macro_node_deep_copy (vm_macro.c:81) and read back
      through Node* by the compiler, so `is_char` aliased the children-array CAPACITY and
      `is_inexact`/`is_int`/`ival` were read 0..16 bytes PAST the allocation. The exact-
      integer constant folder in compile_expr_impl (lib/backend/vm_compiler.c:3108) reads
      `is_int` and `ival` to decide whether to fold exactly; on wasm32 those out-of-bounds
      bytes are nonzero, so the first macro's (* 2 21) folded from heap garbage and printed
      a garbage bignum. On 64-bit hosts the bytes past a 160-byte chunk happened to read
      zero, which is why the defect was invisible natively while shipping wrong answers in
      the browser build. A second define-syntax merely perturbs the malloc layout, which is
      why "two or more" and "value varies per build".
