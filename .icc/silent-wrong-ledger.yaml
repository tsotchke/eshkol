      macOS/arm64 given a matching pre-built runtime archive — verified by
      running it byte-for-byte against a fresh `ninja eshkol-runtime` output
      — but it is a frozen, platform-specific guess at eshkol-static's link
      requirements with no automated way to know its own precondition (a
      pre-existing, matching `build/` tree) is met, and no portable form for
      Linux CI or for configurations where the real link surface differs
      (BLAS/GPU backend choice, -DESHKOL_QUANTUM_ENABLED,
      -DESHKOL_TENSORCORE_ENABLED). Its predecessor — still visible, until
