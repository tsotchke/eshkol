  - id: LE-09
    bucket: LOUD-ERROR
    subtag: codegen
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/native-rest-capture-and-do-loop"
    title: "NATIVE: a `do` loop whose body creates a closure over a loop variable never terminates and is SIGKILLed (exit 137)"
    repro: "(display (do ((i 0 (+ i 1)) (acc 0)) ((= i 3) acc) ((lambda () (set! acc (+ acc i))))))"
    observed: >-
      killed by SIGKILL, exit 137, under the default `-r` and under
      ESHKOL_JIT_CACHE=0. Under an explicit CPU limit the same run exits 152
      (SIGXCPU) with no output, which is what identifies it as a runaway loop
      rather than an allocator fault.
    correct: "3 — the VM answers 3"
    affected_measured:
      - "mutating capture: ((lambda () (set! acc (+ acc i)))) -> runaway"
      - "READ-ONLY capture: (set! s (+ s ((lambda () i)))) -> runaway; mutation is not required"
      - "let-bound body closure -> LLVM verification failure, \"Instruction does not dominate all uses\" on the arena_allocate, i.e. the compile is rejected rather than run"
      - "named let in the body capturing the loop variables -> same verification failure"
    unaffected_measured:
      - "a `do` body with no closure at all"
      - "a body lambda whose PARAMETER shadows the loop variable, so nothing is captured"
    root_cause: >-
      lib/backend/llvm_codegen.cpp, codegenDo (var_allocas at ~24282, step store
      at ~24371 before this change). A `do` variable is READ from three places
      emitted at three different times — the header test first, the body second,
      the step expressions third — but codegenDo wrote the step result to the
      stack alloca it had cached in var_allocas, while every read went through
      symbol_table. codegenLambda's capture emission ("CLOSURE ESCAPE FIX",
      ~30036) REBINDS a captured stack alloca to fresh arena storage mid-body
      and repoints symbol_table at it, seeding the new cell ONCE in the
      pre-header. The variable therefore split in two: the step read the arena
      cell and wrote the stack alloca that the header test had already been
      compiled against. IR at the defect:
        do_loop_step: %i.load68 = load ptr %8        ; arena cell, never advanced
                      %99 = add %i.load68, 1
                      store %99, ptr %i_do           ; stack alloca
        do_loop_header: %i.load = load ptr %i_do     ; reads 1 forever
      `(= i 3)` never became true, and each iteration allocated a fresh closure
      in the arena, so the loop consumed memory without bound until the OS
      killed it. The same rebinding, when it happened inside the loop body
      rather than the pre-header, produced an arena_allocate that did not
      dominate its uses — invalid IR, which is the AOT-side symptom.
    fix: >-
      The storage class is now decided BEFORE the loop is emitted, mirroring
      codegenNamedLet, which has always arena-moved its captured cells up front.
      doFormCapturesVar() asks whether any lambda or named let in the bindings,
      test, results or body captures the variable; if so the loop variable's
      cell is arena storage from the start, which is what the capture machinery
      would have converged on anyway — and being an already-pointer-typed
      CallInst it takes codegenLambda's "existing arena storage" branch, which
      pointer-passes WITHOUT rebinding anything. Otherwise the variable keeps
      its stack alloca and stays promotable, so closure-free `do` loops are
      byte-identical to before. The predicate reuses astSetsVar's traversal
      rather than a second copy of it: that walk is now astScanVar(ast, var,
      VarScanMode), with SetTarget and ClosureCapture node tests over one
      shared, already-proven-complete recursion.
      An INVARIANT backs it up at the end of codegenDo: if any loop variable was
      arena-moved anyway, the capture analysis missed a form, and codegen now
      FAILS LOUDLY with a diagnostic instead of emitting a loop that cannot
      terminate. That guard is what caught the two design corrections below
      during class-kill.
    evidence: >-
      tests/integration/rest_capture_and_do_closure_test.esk, 23/23 checks on
      all four native axes (ctest lanes rest_capture_and_do_closure_*): mutating
      and read-only captures, an immediately-invoked closure and a let-bound
      one, a named let in the body, a nested `do` closing over the OUTER
      variable, a loop inside a procedure with a runtime trip count, closures
      stored out of the loop and called after it finished, and the two controls.
      tests/differential/corpus/48_rest_capture_and_do_closure.esk on the native
      axes; tests/vm_parity/corpus/60_do_loop_closure_capture.esk pins the
      reproducer VM-vs-native.
      Revert-validated against a build of the same tree without the codegen
      change (worktree eshkol-wt-vmmem): the reproducer runs until the CPU limit
      fires, and the let-bound and named-let shapes fail LLVM verification.
    caught_by: [direct-measurement, sw-25-adjacent-finding]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      Two design corrections were forced by the codegenDo invariant during
      class-kill, and both are recorded because they are the non-obvious part.
      (1) An internal `(define (bump) …)` in the body is NOT a ClosureCapture
      site: codegenFunctionDefinition captures through module-level storage
      (`<fn>_nested_N_capture_<var>`) re-seeded from the enclosing binding on
      every execution, which does not split the loop — forcing arena storage for
      it turned a correct 3 into a type error, measured. `(define bump (lambda …))`
      is a different shape and IS caught, by the LAMBDA_OP case.
      (2) The invariant is narrowed to the arena-move signature (a pointer-typed
      CallInst) for the same reason, so the legitimate module-storage rebinding
      is not flagged.

  - id: LE-10
    bucket: LOUD-ERROR
    subtag: cheap-fix
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/vm-do-loop-capture"
    title: "A `do` loop poisons a LATER `do` in the same program (VM heap object limit / calling non-function / hang)"
    repro: "(display (do ((i 0 (+ i 1)) (a 0)) ((= i 3) a) ((lambda () (set! a (+ a 1)))))) (display (do ((k 0 (+ k 1)) (b 0)) ((= k 4) b) (set! b (+ b 10))))"
    observed: >-
      as filed: "ERROR: VM heap object limit reached
      (ESHKOL_VM_HEAP_MAX_SIZE=16777216 objects)", exit 1, after the first loop
      printed its correct answer; a let-bound body closure additionally gave
      "ERROR: calling non-function" whenever a top-level form preceded the
      loop, and longer sequences hung. Each shape was correct ALONE, which is
      what identified it as sequence-dependent.
    measured: >-
      RE-MEASURED at 2ae3787f and found WIDER, and partly SILENT, than filed.
      The reproducer above answers 3 then 13 on the VM where native answers 3
      then 40 — a wrong VALUE with exit 0 and no diagnostic, not a loud error.
      It also needs NEITHER a closure NOR a capture: two ordinary sequential
      `do` loops diverge the same way, and the minimal case is a `do` followed
      by a `define`:
        (do ((i 0 (+ i 1))) ((= i 2)) 1) (define q 42) (display q)
      which is 2 on the VM and 42 natively. The loud shapes this entry was
      filed for are the same corruption landing on a slot whose stranded junk
      happens to be a loop counter or a callee.
    root_cause: >-
      lib/backend/vm_compiler.c::compile_form_do() never popped its loop
      variables. compile_form_let() ends with OP_POPN; compile_form_do() ended
      by decrementing the compiler's own c->n_locals — a COMPILE-TIME
      bookkeeping change with no runtime effect — so every `do` form stranded
      one operand-stack value per loop variable. Top-level bindings live in
      stack slots handed out by counting (add_local), and the top-level driver
      emits exactly one OP_POP per expression that grew no local, so the
      stranded values shift every later slot. This is the SAME slot-shift
      corruption already documented on compile_form_require() and
      compile_form_with_region() in that file, reached a third way.
    fix: >-
      compile_form_do() emits OP_POPN for its loop variables at the loop exit,
      keeping the result on top, exactly as compile_form_let() does; the result
      expressions are compiled out of tail position when there are locals to
      pop, because a TAIL_CALL would skip the OP_POPN. The same rewrite removed
      a second latent hazard: the function used to emit a complete first
      version of the loop and then "discard" it with `c->code_len = loop_top`,
      leftover debugging scaffolding that compiled the body and steps TWICE.
      Rewinding code_len un-emits code and none of the constant-pool, upvalue,
      closure-PC or global repatch-array side effects the discarded pass had
      already caused.
    evidence: >-
      tests/vm_parity/corpus/61_do_loop_variable_binding.esk (VM-vs-native on
      the native, vm-src and vm-eskb axes) and
      tests/differential/corpus/49_do_loop_variable_binding.esk.
      Revert-validated: with lib/backend/vm_compiler.c restored, the corpus
      file HANGS on the VM (killed at 25s) and the individual shapes answer 2,
      00, 2 and 0 where the fixed VM and native both answer 42, 50, 6 and 4.
    filed_shapes_measured: >-
      The two shapes PR #437 filed this entry against, carried over from its
      wording so the union loses no evidence, and re-run on the fixed VM:
        (display (do ((i 0 (+ i 1)) (s 0)) ((= i 4) s) (set! s (+ s ((lambda () i))))))
        (display (do ((i 0 (+ i 1))) ((= i 3) i) ((lambda (i) i) 99)))
      filed as "heap object limit reached" then a fatal error, exit 1, after
      the first loop had printed its correct answer; correct is 6 then 3, which
      native prints. Also filed: a let-bound (not immediately invoked) body
      closure gave "ERROR: calling non-function" whenever any top-level form
      preceded the loop, and longer sequences hung.
    caught_by: [pr-437-class-kill, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus]
    notes: >-
      Filed as LOUD-ERROR by PR #437's class-kill, on the shapes it happened to
      hit. Re-measurement found the same root cause also produces SILENT wrong
      values, so the entry was closed on the wider evidence rather than on the
      loud shapes alone. Had it been closed only against the filed reproducer,
      the `do`-then-`define` case would still be shipping.


  - id: LE-11
    bucket: LOUD-ERROR
    subtag: structural
    status: closed
    closed_at: "fix/native-hash-popcount-guards"
    closed_by: "branch fix/native-hash-popcount-guards"
    title: "(hash-keys x) / (hash-values x) SIGSEGV native when x is not a hash table"
    repro: "(hash-keys 42)"
    observed: >-
      Native eshkol-run (both AOT and `-r` JIT) SIGSEGVs, exit 139, no diagnostic reaches
      the process — `guard` cannot catch a crash. Reproduced for all four documented
      spellings: hash-keys, hash-values, hash-table-keys, hash-table-values (the last two
      are aliases of the first two, sharing the same codegen and the same VM opcode).
    correct: >-
      a catchable type-error exception, matching the existing contract for other
      type-confused accessors in this file (car/cdr on non-pairs, arithmetic on non-numbers).
    cross_engine: >-
      the hosted VM did NOT crash, but silently returned '() instead of erroring — a
      different but also-wrong outcome (dispatch table lookup falls through to a
      hard-coded NIL_VAL fallback when the operand fails `is_heap_type(..., HEAP_HASH)`),
      so this was two divergent flaws on the two engines, not one shared root cause.
    root_cause: >-
      HashCodegen::hashKeys / HashCodegen::hashValues (lib/backend/hash_codegen.cpp) called
      TaggedValueCodegen::unpackPtr directly on the tagged operand with no type/subtype
      check, then passed the resulting garbage pointer straight to the runtime's
      hash_table_keys/hash_table_values helper, which dereferences it as a VmHashTable*
      (well, the AOT/JIT arena_hash_table struct). The sibling predicate
      HashCodegen::isHashTable already carried the correct check (legacy HASH_PTR tag OR
      consolidated HEAP_PTR tag with a HEAP_SUBTYPE_HASH object-header byte); hashKeys/
      hashValues just never called anything equivalent before dereferencing. On the VM,
      case 665/666 in lib/backend/vm_native.c correctly gated the fast path on
      is_heap_type(vm, ht_val, HEAP_HASH) but silently fell through to NIL_VAL on failure
      instead of raising.
    fix: >-
      Native: HashCodegen::requireHashTable() (lib/backend/hash_codegen.cpp), mirroring
      isHashTable's tag/subtype check, calls into the arithmetic codegen's existing
      ArithmeticCodegen::emitTypeError() idiom (the same one call_apply_codegen.cpp uses
      for `(apply min '())`) to raise a catchable exception with an `unreachable`
      terminator when the operand is not a hash table; wired into both hashKeys and
      hashValues before they touch the pointer. VM: cases 665/666 in vm_native.c now call
      vm_raise_error_msg() (the same catchable-error idiom used throughout this file for
      out-of-range accessors) instead of falling through to NIL_VAL.
    evidence: >-
      tests/v1_2_edge_cases/type_safety_test.esk — 5 new `guard`-wrapped checks for
      (hash-keys 42), (hash-values 42), (hash-table-keys 42), (hash-table-values 42), plus
      confirmation that real hash tables still round-trip through hash-keys/hash-values.
      Manually verified at the branch head, both AOT-compiled and `-r` JIT, and on the VM
      (eshkol-run --profile hosted-vm --emit-eskb + eshkol-vm-standalone-test): all four
      probes now print ERR under `guard` and exit 0 on both engines, where native previously
      SIGSEGVed (rc=139) and the VM previously exited 0 with a wrong '() answer.
      tests/escape_matrix/arity_parity_baseline.json's hash-keys::wtype /
      hash-table-keys::wtype / hash-values::wtype / hash-table-values::wtype
      native-vs-VM divergences are resolved (both engines now agree: ERR).
    caught_by: [direct-measurement, arity-probes]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, p8-arity-sweep]
    notes: >-
      Classified LOUD-ERROR (native side) rather than SILENT-WRONG because the pre-fix
      native failure mode was a crash (loud, if uncatchable) not a wrong answer with exit 0;
      the VM side of the SAME defect (silent '() instead of erroring) would independently
      qualify as SILENT-WRONG, which is why both engines are fixed together here rather
      than treating the VM half as out of scope.

  - id: SW-43
    bucket: SILENT-WRONG
    status: closed
    closed_at: "fix/native-hash-popcount-guards"
    closed_by: "branch fix/native-hash-popcount-guards"
    renumbered_from: >-
      SW-42 (collision with the open documented-limitation entry; see its renumbered_from
      for the recurring pattern). Filed as SW-42 on branch fix/native-hash-popcount-guards
      (PR #452), which already had an open DOCUMENTED-LIMITATION entry at that id (the
      referential-transparency / syntax-rules hygiene entry). Renumbered to SW-43, the next
      free id, once the collision was caught.
    title: "(popcount x) on a non-integer silently reinterprets the operand's tagged bits instead of erroring"
    repro: "(popcount \"notanumber\")"
    observed: "native: 14, exit 0, no diagnostic. VM: 0, exit 0, no diagnostic."
    correct: "a catchable type-error exception; popcount is documented (docs/tutorials/20_BITWISE_AND_SYSTEM.md, docs/API_REFERENCE.md) only for exact integers (fixnum and bignum)."
    root_cause: >-
      Native: EshkolLLVMCodeGen::codegenPopcount (lib/backend/llvm_codegen.cpp) branched
      only on `isHeapSubtype(n, HEAP_SUBTYPE_BIGNUM)`; anything not a bignum fell
      unconditionally into the int64 fast path, which unpacks the tagged value's raw i64
      payload and runs llvm.ctpop on it — for a string, that payload is the heap pointer,
      so popcount silently counted the pointer's set bits (14, an address-dependent number
      that happened to reproduce at this measurement). VM: case 2202 in
      lib/backend/vm_native.c dispatched non-bignum operands through as_number(), which
      returns 0.0 for any Value whose type is not VAL_INT/VAL_FLOAT/VAL_CHAR — so a string
      silently popcounted as if it were the exact integer 0.
    fix: >-
      Native: codegenPopcount now also computes `is_int64_pc` (base type == ESHKOL_VALUE_INT64)
      and routes to arith_->emitTypeError("popcount: expected an integer") — the same
      ArithmeticCodegen::emitTypeError() idiom used throughout this file and in
      call_apply_codegen.cpp — whenever the operand is neither that nor a bignum, before
      either path touches the operand's bits. VM: case 2202 now requires `a.type == VAL_INT`
      for the int64 fast path (bignum keeps its existing dedicated branch) and calls
      vm_raise_error_msg(vm, "popcount: expected an integer") otherwise.
    evidence: >-
      tests/v1_2_edge_cases/type_safety_test.esk — `guard`-wrapped check for
      (popcount "notanumber"), plus a regression check that (popcount 255) still answers 8.
      Manually verified at the branch head: AOT, `-r` JIT, and the VM
      (eshkol-vm-standalone-test on an emit-eskb of the same probe) all now print ERR under
      `guard` and exit 0, where they previously printed a wrong numeric answer with exit 0.
      tests/escape_matrix/arity_parity_baseline.json's popcount::wtype native-vs-VM
      divergence is resolved (both engines now agree: ERR); popcount::warity is a
      pre-existing, unrelated divergence (native hard-refuses at compile time on wrong
      arity, the VM does not) confirmed present on an unmodified master control build
      and left untouched by this fix.
    caught_by: [direct-measurement, arity-probes]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, p8-arity-sweep]
    notes: >-
      Textbook SILENT-WRONG: zero exit status, no diagnostic, a plausible-looking integer
      answer on the native side that differs by input (pointer-address-dependent), and a
      different but equally wrong answer (0) on the VM.

  - id: SW-44
    bucket: SILENT-WRONG
    status: closed
    closed_at: "fix/pybind-capsule-lifetime"
    closed_by: "branch fix/pybind-capsule-lifetime"
    family: interop/lifetime
    title: "Python bindings: a NumPy array from a tensor eval keeps no claim on the FFI context, so deleting the Context while the array is still live lets shutdown corrupt its backing memory (audit H1)"
    repro: >-
      tests/bindings/python_capsule_lifetime_test.py — construct eshkol.Context(),
      evaluate a tensor literal to get a zero-copy NumPy array, register a shutdown
      hook through the public eshkol_register_shutdown_hook() C API (the same
      documented mechanism a real embedder uses to free its own arena-backed state on
      shutdown — demonstrated in-tree by
      tests/core/runtime_shutdown_teardown_race_test.cpp) that overwrites the array's
      backing bytes, `del` the Context while the array is still referenced, then read
      the array.
    observed: >-
      pre-fix (bindings/python/eshkol_module.cpp before this branch, with the two
      enabling fixes below already applied so the module runs at all): `del ctx` calls
      eshkol_ffi_shutdown() unconditionally and immediately, synchronously running
      every registered shutdown hook before the array's own reference is ever
      released. The array's bytes are silently overwritten (0xEF fill). Exit 0, no
      diagnostic, no exception, no crash — the array just reads the wrong values.
    correct: >-
      the original tensor values ([1.0, 2.0, 3.0, 4.0] in the repro). Shutdown must be
      deferred until every NumPy array (or view/slice/reshape derived from one)
      exported from the context has been released — not merely until the Python
      `Context` wrapper object itself is deleted.
    root_cause: >-
      bindings/python/eshkol_module.cpp's ffi_value_to_python() built each tensor's
      NumPy array with a `base` capsule whose deleter was a stateless no-op ("arena
      managed") and which held no reference back to the owning eshkol_ffi_context_t.
      EshkolContext::~EshkolContext() called eshkol_ffi_shutdown() on the raw context
      pointer unconditionally, with nothing to stop that call from running while an
      exported array was still alive and referencing arena memory that a shutdown hook
      (or a future teardown path) is free to reclaim or overwrite. The comment marked
      "Zero-copy caveat (audit H1)" documented the hazard in the source but did not
      close it.
    fix: >-
      bindings/python/eshkol_module.cpp: EshkolContext now holds the context as
      EshkolCtxHandle (std::shared_ptr<eshkol_ffi_context_t> with eshkol_ffi_shutdown
      as its deleter) instead of a raw pointer. ffi_value_to_python() threads that
      shared handle through, and for every tensor it exports attaches a second,
      independent copy of the shared_ptr to the returned array's `base` capsule
      (heap-allocated, freed by the capsule's own destructor). NumPy keeps `base` alive
      for as long as the array — or any view/slice/reshape derived from it — is alive,
      so eshkol_ffi_shutdown() (the shared_ptr's deleter) only actually runs once every
      holder, including every live array's capsule, has released its reference.
      Deleting the Python Context object no longer invalidates arrays it already
      produced. Two further, narrower fixes were required to make this defect (and its
      fix) reachable and testable at all — both pre-existing, both unrelated to the
      capsule logic itself, both necessary enabling plumbing rather than new
      capability: (1) CMakeLists.txt's ESHKOL_PYTHON_BINDINGS block force-loaded only
      eshkol-static, not eshkol-repl-lib, so the eval-bridge's static-constructor
      registrar (BridgeRegistrar, lib/repl/eval_bridge_impl.cpp) was always linked out
      and eshkol_ffi_init() always failed with "JIT runtime is not linked" — the
      module never actually initialized under this build option before now; (2)
      eshkol_ffi_eval() (lib/ffi/eshkol_ffi.cpp) wrapped its result-carrying AST in a
      synthetic `(define __eshkol_ffi_result_N__ ...)` and tried to read the value
      back via lookupSymbol(), a mechanism that predates and is defeated by
      ReplJITContext::executeTagged()'s newer thread-local "last value" capture (which
      does not fire for a top-level DEFINE) — ctx->execute()'s already-correctly
      captured return value was being discarded, so every eval() unconditionally
      returned null/None regardless of the source expression. Neither (1) nor (2) is
      specific to tensors; fixing them is what let this ledger entry's repro (and the
      pre-existing tests/v1_2_edge_cases/python_ffi_test.py, 19/19 passing at this SHA
      for the first time) exercise the actual capsule code path at all.
    evidence: >-
      tests/bindings/python_capsule_lifetime_test.py, wired into ctest as
      python_bindings_capsule_lifetime (ESHKOL_PYTHON_BINDINGS=ON). Red/green
      demonstrated by hand at branch head: reverting only
      bindings/python/eshkol_module.cpp to its pre-fix content (keeping the two
      enabling fixes) reproduces the exact failure — "shutdown hook did NOT fire while
      the array was still live" and "array values are intact after del(ctx)" both
      FAIL, exit 1; restoring the fix, both PASS, exit 0. Full ctest suite 185/185 and
      tests/v1_2_edge_cases/python_ffi_test.py 19/19 pass at the same SHA (RelWithDebInfo,
      LLVM 21, arm64-apple-darwin24.1.0). Also run green under
      -DESHKOL_ENABLE_ASAN=ON -DESHKOL_ENABLE_UBSAN=ON (ASAN_OPTIONS=detect_leaks=0)
      to confirm the shared_ptr/capsule mechanism itself introduces no memory error;
      ASan does not additionally flag the repro's own poison step because it
      overwrites still-allocated memory (this ledger entry's shape is a wrong VALUE at
      exit 0, which is what SILENT-WRONG requires — a sanitizer-caught crash would be
      a LOUD-ERROR, a different bucket).
    caught_by: [maintainer-ratified-plan, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness]
    notes: >-
      The arena the tensor's data lives in is process-lifetime in the current hosted
      runtime, and no production code registers a shutdown hook against it today — so
      this was a latent hazard rather than a crash-on-every-run, and the repro
      registers its own hook through the same public, documented mechanism
      (eshkol_register_shutdown_hook) any embedder is free to use for exactly that
      purpose, which is the scenario the pre-fix "audit H1" comment warned about.
      Before this branch, ctest carried zero binding-level tests for
      bindings/python/eshkol_module.cpp — python_bindings_capsule_lifetime is the
      first. Scope: this closes only the capsule lifetime hazard. The separate
      double*-demotion / exactness-across-the-FFI-boundary issue is an explicitly
      different, still-open v1.4.0 lane and is not touched here.

  - id: SW-45
    bucket: SILENT-WRONG
    status: closed
    closed_at: "fix/vm-large-proc-define"
    closed_by: "branch fix/vm-large-proc-define"
    note: >-
      SW-44 was reserved by PR #458 (pybind capsule-lifetime fix) at the time
      this entry was first filed on the pre-#458 base; it was renumbered to
      SW-45 then, and confirmed still the next free id after rebasing onto
      origin/master with #458 merged and SW-44 present (verified via `grep -o
      'id: SW-[0-9]*b*' .icc/silent-wrong-ledger.yaml | sort -V | uniq -d`
      returning empty).
    title: "A VM procedure referencing more than 16 distinct top-level procedures silently corrupts the next top-level define"
    repro: >-
      A single bytecode-VM procedure that calls 17 or more DISTINCT other
      top-level procedures (each such call resolves as a free-variable
      reference through the same upvalue-capture machinery as any other
      captured name, so the procedure's own closure must relay one upvalue
      per distinct name) compiled and ran fine — the corruption showed up in
      the TOP-LEVEL DEFINE COMPILED RIGHT AFTER IT. Minimal form: 17
      `(define (helperK x) ...)` procedures, one `(define (big i) (+ i
      (helper0 i) ... (helper16 i)))`, then `(define (probe x) (+ x 1))`;
      calling `(probe 41)` failed. Discovered via
      tests/memory/vm_region_evac_subtype_coverage_test.esk on
      feat/vm-region-evacuator, whose phase-2 fixture originally called ~20
      distinct constructor procedures (make-fact, make-kb, make-workspace,
      tensor, ...) from one procedure; its header documents the same defect
      and the two-procedure split used as a workaround, which this fix makes
      unnecessary (verified: tests/vm/closure_upvalue_capacity_surface_regression.esk's
      case C re-merges that exact shape into one procedure and passes).
    observed: >-
      Calling the procedure defined immediately after the big one raised
      "ERROR: calling non-function at pc=... argc=... type=0" (VAL_NIL in the
      minimal repro; a stray leaked upvalue Value in general — the original
      report's "reads back as an integer" is a different manifestation of the
      identical leak: which stray operand-stack value lands in the corrupted
      slot depends on what else was on the stack at the time). Exit path was
      always through a hard runtime error in every reproduction attempted, but
      the value corruption itself carried NO diagnostic and would have exited
      0 (a `define` bound to a non-closure value only fails when something
      tries to CALL it; a define whose corrupted value happens to go unused
      would silently carry the wrong value with exit 0). Preceded by "UPVALUE
      INDEX OUT OF BOUNDS" on stderr from an unrelated GET_UPVALUE access,
      itself a symptom of the same stack desync.
    correct: >-
      The procedure compiled right after a large procedure must always read
      back as its own closure, regardless of how many distinct top-level
      procedures the large procedure calls, up to the documented capacity;
      beyond that capacity the compiler must refuse to compile at all rather
      than emit a program that runs with a missing capture.
    root_cause: >-
      Two independent limits on the same quantity, never kept in sync. The
      compiler's per-scope upvalue cap (MAX_UPVALUES, lib/backend/vm_parser.c)
      was 32, enforced when registering a new upvalue in the free-variable
      resolution walk (lib/backend/vm_compiler.c, both the plain-reference
      path in compile_expr_impl and the compile_form_set_bang path). The
      RUNTIME closure representation (HeapObject.closure.upvalues[16] /
      open_slots[16] in lib/backend/vm_core.c) was fixed at HALF that, 16, and
      nothing enforced parity between the two. A closure needing 17-32
      upvalues compiled cleanly under the 32 cap: the compiler emitted exactly
      that many upvalue-capture push instructions (OP_GET_LOCAL/OP_GET_UPVALUE)
      followed by one OP_CLOSURE encoding the true count in its operand. At
      runtime, OP_CLOSURE (lib/backend/vm_run.c, both the computed-goto
      dispatch's lbl_CLOSURE and the switch dispatch's case OP_CLOSURE)
      silently clamped that count to 16 (`if (n_upvalues > 16) n_upvalues =
      16;`) and then only popped the CLAMPED count of values off the operand
      stack (`for (int i = n_upvalues - 1; i >= 0; i--) { ...upvalues[i] =
      vm_pop(vm); }`) — leaving the excess (count - 16) values the compiler
      had already pushed permanently stranded on the stack. Every stack-slot
      offset the compiler had computed at compile time for the rest of the
      program (every subsequent top-level define's binding slot, every local
      variable's frame offset) assumed those values would be consumed; from
      that point on the runtime stack held (count - 16) more live values than
      the compiler's bookkeeping expected, so the next top-level `define`'s
      OP_SET_LOCAL/local-slot bookkeeping landed on a slot that actually held
      one of the stranded values instead of the newly constructed closure.
    fix: >-
      inc/eshkol/backend/vm_limits.h now defines
      ESHKOL_VM_MAX_CLOSURE_UPVALUES=32 as the single shared constant: it is
      aliased to MAX_UPVALUES for the compiler (lib/backend/vm_parser.c) and
      used directly to size HeapObject.closure.upvalues[]/open_slots[] in
      lib/backend/vm_core.c, so the two limits cannot diverge again (a
      `#error` guards it against ever exceeding the CLOSURE instruction's
      8-bit upvalue-count operand field). lib/backend/vm_run.c's two
      OP_CLOSURE handlers no longer clamp: if the encoded count ever exceeds
      the shared capacity (only reachable via a corrupted or
      build-mismatched .eskb, since the compiler now enforces the identical
      bound) they report a fatal runtime error and refuse to run rather than
      silently popping fewer values than were pushed. lib/backend/vm_native.c's
      upvalue-closing loop (native 252, letrec-style leaked-closure handling)
      had the same hardcoded 16 and is fixed the same way. Symmetrically,
      lib/backend/vm_compiler.c's two upvalue-registration sites (the
      plain-reference read path and the `set!` path) now call
      vm_compile_error() and fail the whole compilation — via the existing
      fail-closed g_vm_compile_failed flag both compile drivers already
      checked (eshkol_vm.c's JIT-run and ESKB-emit paths) — when a scope
      would need MORE than the shared capacity, instead of leaving that
      upvalue's index at -1 and continuing.
    evidence: >-
      tests/vm/closure_upvalue_capacity_surface_regression.esk (wired into
      scripts/run_vm_surface_tests.sh's existing *_surface_regression.esk
      glob, no script change needed): case A pins the historical minimum (17,
      one past the old 16-slot capacity), case B pins the full new capacity
      (32) as a margin so the fix is not merely correct at the boundary, and
      case C re-merges the original evacuator-fixture shape (20 distinct
      `vector-set!` constructor calls in one procedure) into a single
      procedure and checks the define compiled right after it. All three
      check BOTH the big procedure's own return value and that the following
      define is callable and correct.
