  - id: SW-05
    bucket: SILENT-WRONG
    status: closed
    reclassified_from: LOUD-ERROR
    closed_at: "128b86be"
    closed_by: "PR fix(ad): curried gradient-of-gradient via forward-over-reverse (branch fix/sw-05)"
    title: "Curried gradient-of-gradient answered a zero matrix (ESH-0096)"
    repro: "(define (f v) (* (vector-ref v 0) (vector-ref v 0) (vector-ref v 0))) (define g (gradient f)) (display (jacobian g (vector 2.0)))"
    observed: "#((0)), exit 0 — where (hessian f (vector 2.0)) returns #((12)) on the same build"
    correct: "#((12)) — identical to (hessian f (vector 2.0))"
    observed_after: >-
      #((12)), exactly, on the JIT and the AOT lane, and identical to
      (hessian f (vector 2.0)) entry-for-entry including a 2-D field's
      off-diagonals. HISTORY, in three measured steps: (1) at 9f2da2ab and
      2ae3787f the composed route answered `#((0))` silently, and for
      f(v) = v0*v0 the same route SIGBUSed; (2) at 5886b91e it was reclassified
      LOUD-ERROR/structural and made to RAISE, an honest interim guard, not a
      fix; (3) at 128b86be it answers exactly. ROOT CAUSE, measured: this was
      never the SW-03/SW-04 carrier defect and never the deferred dense-tape-
      spine rework. `jacobian` is reverse mode — it packs one `ad_node_t*` per
      input component into the point tensor's element array and publishes the
      active column as the reverse seed. The reverse-tensor arm of
      AutodiffCodegen::emitRuntimeClosureGradient() then read those components
      with a raw `CreateBitCast(elem_bits, double)`, so a heap pointer became a
      subnormal ~1e-310: the inner gradient was evaluated at ~0 AND its result
      carried no edge back to the outer tape. For f(v) = v0*v0 the same bogus
      bits were classified as a pointer and dereferenced, so the route also
      SIGBUSed.
    fixed_by: >-
      ESH-0096 — reverse-over-reverse is not representable on this tape
      (`ad_node_t::value` is one double), so the inner pass now runs FORWARD:
      the same forward-over-reverse composition the direct `hessian` performs.
      ONE residency-probe pass over the point (eshkol_ad_node_probe, which never
      dereferences a non-resident candidate) reads two facts — is any component
      a live tape node, and is any of those the enclosing pass's published
      active seed (eshkol_ad_seed_flag). When both hold, the new `rvt_fov` arm
      in lib/backend/autodiff_codegen.cpp evaluates f once per output component
      i on a Scheme vector of 8-jets x_k = value_k + [k==i]·e1 + [k is seed]·ep,
      so the returned jet's e1 coefficient (field 1) is grad_i and the surviving
      e1·ep coefficient (field 5) is d(grad_i)/d(seed) = H[i][seed] — the same
      two fields popAndExtractForwardCore reads at level 0, handed to the same
      hook. eshkol_ad_mixed_record (lib/core/runtime_autodiff.cpp) writes the
      exact local linearization onto the OUTER tape and returns the node the
      enclosing backward pass traverses. The inner evaluation runs with the
      reverse tape nulled and the AD-mode flag cleared, both restored before the
      record. No finite differences, no second reverse tape — this did NOT
      require the dense resident tape spine, exactly as the earlier
      NEEDS-DECISION note predicted. Cost is n forward evaluations of f per
      enclosing pass, matching the direct Hessian's forward-over-forward sweep.
    residual: >-
      One shape stays LOUD by design: a point COMPUTED from the enclosing pass's
      variables, e.g. (jacobian (lambda (v) (g (vector (* 2.0 (vector-ref v 0)))))
      point). No component of the inner point IS the published seed there, so no
      edge can be threaded back, and answering would be a disconnected zero.
      MEASURED: which guard speaks depends on how the derived point is spelled.
      The `(vector …)` spelling above never reaches the tensor arm at all — its
      elements are tagged AD-node CALLABLEs, and the point coercion rejects them
      first: "gradient: evaluation point is not a number (tagged type 9)". A
      derived point that arrives as a TENSOR of non-seed nodes reaches the new
      pre-scan, which finds nodes but no active seed and calls
      eshkol_ad_curried_gradient_unsupported() (lib/core/runtime_taylor.c),
      whose diagnostic is narrowed to exactly that case. Both are loud; the test
      pins the raise, not the wording.
    evidence: >-
      tests/ad/ad_curried_gradient_nested_test.esk (renamed from
      ..._loud_test.esk) on the ad_curried_gradient_nested_runtime_smoke and
      _aot_smoke ctest lanes. It asserts the 1-D cubic (6·v0 at TWO points, so a
      constant cannot pass), the f(v) = v0*v0 shape that used to SIGBUS, and a
      2-D non-separable field f(v) = v0²·v1 at (2,3) whose Hessian [[6,4],[4,0]]
      is checked entry-by-entry — the off-diagonal 4 and the exactly-zero (1,1)
      entry are both finite-difference-free witnesses. Every entry is also
      cross-checked for EXACT equality against (hessian f point) on the same
      build, the unnested curried gradient is re-asserted afterwards so the
      single-pass reverse arm is shown undisturbed, and the residual derived-
      point shape is asserted to raise. 23/23 checks ok on both lanes. Whole-
      suite regression check at this SHA: ctest 217/218 (the one failure,
      first_class_builtins_vm_smoke — `char-alphabetic?` / `char-numeric?` on
      the VM — reproduces identically with the eshkol-vm-standalone-test binaries
      of three unrelated branches on the same host, so it is pre-existing and
      untouched by this change); the 20 AD/autodiff/forward-over-reverse/
      exact-point lanes are 20/20.
    vm_parity: >-
      MEASURED on the same build (eshkol-vm-standalone-test, vm-src axis): the
      VM does NOT silently answer zeros for this composition — it raises
      `*: expected numeric operands`. So closing the native side introduces no
      new silent divergence; it is a native-only capability, already covered by
      the existing op:GRADIENT row in tests/vm_parity/PARITY.tsv ("higher-order
      nesting stays native-only") and by op:JACOBIAN/op:HESSIAN, both already
      recorded as gaps. No PARITY.tsv change needed, and none made.
    caught_by: [KNOWN_ISSUES, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, pr-record-416]
    notes: >-
      PR #416 measured ESH-0096 as CLOSED and proposed deleting the KNOWN_ISSUES
      entry. Direct measurement at 9f2da2ab and again at 2ae3787f contradicted
      that for the curried jacobian route, which is why the entry survived. It
      is now closed by measurement rather than by assertion, and the
      KNOWN_ISSUES entry is restated as fixed, with the derived-point residual
      named.

