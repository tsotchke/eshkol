    caught_by: [parity-baselines, direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, KNOWN_ISSUES]
    notes: >-
      THE SAME ROOT CLASS AS SW-01 AND SW-02. Name resolution does not respect shadowing,
      and it surfaces on both engines in different subsystems: native ignores the shadowing
      binding in AD (SW-01) and in map (SW-02); the VM ignores it in arithmetic opcode
      dispatch (this entry). Treat the three as one defect family with one root cause, not
      as three unrelated tickets. A user who redefines + gets a wrong number and no
      diagnostic — the most basic Scheme capability there is. All three closed together
      by PR #429. The VM's OTHER manifestation of the family — the upvalue search
      walking the enclosing-scope chain outermost-first — was fixed separately by
      PR #428 (tests/vm_parity/corpus/56_lexical_shadow_nearest_binding.esk); the two
      changes touch different functions in vm_compiler.c and are independent.

  - id: SW-26
    bucket: SILENT-WRONG
    status: closed
    closed_at: "b6b2d32f"
    closed_by: "branch fix/vector-ref-tensor-and-backward-diff, commit b6b2d32f"
    title: "vector-ref into an fg-marginal result answers empty on the VM"
    repro: "(define fg (make-factor-graph 2 2)) (define m (fg-marginal fg 0)) (display (vector-ref m 0))"
    observed: "VM ()"
    correct: "0.5 — native answers 0.5"
    cross_engine: >-
      native prints 0.5 under both default and ESHKOL_JIT_CACHE=0 JIT. Displaying the whole
      marginal, `(display m)`, prints #(0.5 0.5) correctly on BOTH engines (the SW-07 fix from
      PR #424 holds) — only indexing into the result with vector-ref diverged on the VM.
    root_cause: >-
      fg-marginal returns a HEAP_TENSOR (VAL_TENSOR) value, not a HEAP_VECTOR. Every VM
      vector-ref call site — the threaded-dispatch fast path (lbl_VEC_REF), the switch-dispatch
      fallback (OP_VEC_REF), and the indirect/higher-order native call (vm_native.c case 219) —
      matched only `vec_val.type == VAL_VECTOR` and fell through to a fabricated NIL_VAL for
      anything else, including VAL_TENSOR, with no diagnostic. `vector-set!` (case 220,
      OP_VEC_SET, lbl_VEC_SET) and `vector-length` (case 221, OP_VEC_LEN, lbl_VEC_LEN) had the
      identical gap — silently a no-op and 0 respectively. Native's collection codegen
      (CollectionCodegen::vectorRef/vectorSet/vectorLength, lib/backend/collection_codegen.cpp)
      already dispatches on the heap-object header subtype and has always had a tensor arm,
      which is why native was correct and only the VM diverged.
    fixed_by: >-
      lib/backend/vm_native.c: added a VAL_TENSOR arm to native calls 219 (vector-ref), 220
      (vector-set!) and 221 (vector-length), backed by three new static helpers
      (vm_vecref_tensor_path, vm_vecset_tensor_path, vm_veclen_tensor_path) that mirror
      CollectionCodegen's native semantics exactly: vector-ref on a rank<=1 tensor returns the
      flat-indexed scalar element (bounds-checked against total element count); on a rank>1
      tensor it returns a row VIEW of rank n_dims-1 via the existing vm_tensor_slice() (no
      copy), bounds-checked against shape[0]; vector-set! always bounds-checks against the flat
      total (native does not special-case N-D row addressing for the mutating op either);
      vector-length answers the flat total element count. lib/backend/vm_run.c: added the same
      VAL_TENSOR arm to both interpreter loops (lbl_VEC_REF/lbl_VEC_SET/lbl_VEC_LEN and
      OP_VEC_REF/OP_VEC_SET/OP_VEC_LEN), calling the shared helpers so the two dispatch
      implementations cannot re-diverge.
    evidence: >-
      tests/vm_parity/corpus/59_vector_ref_tensor_indexed_access.esk (both engines: vector-ref
      and vector-length on the fg-marginal 1-D tensor, vector-set!+vector-ref round-trip on an
      independent tensor, vector-ref row-view on a rank-2 tensor, and a catchable out-of-range
      vector-ref); tests/differential/corpus/47_vector_ref_tensor_indexed_access.esk (native
      JIT/AOT axes). Revert-validated: reverting the vm_native.c/vm_run.c hunks alone reproduces
      the VM FAIL on all vector-ref/vector-length assertions in the corpus file with the fix
      applied everywhere else; reapplying restores 0 FAIL.
    caught_by: [direct-measurement]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, KNOWN_ISSUES]
    notes: >-
      Found by #424's author during the correctness wave, filed here after independent
      re-measurement. Distinct from SW-07/SW-08 (both closed): this is a residual found after
      those closures, on the same builtin family — the SW-07 fix corrected fg-marginal's VALUE
      but not every VM consumer of it. Maintainer ruling 2026-08-13 reversed the earlier
      waive-to-v1.3.5 default for this entry: fixed before tag, no waiver.

  - id: SW-27
    bucket: SILENT-WRONG
    status: closed
    closed_at: "256c31a8"
    closed_by: "PR #427 (branch fix/first-class-builtins)"
    title: "A REST-ARG procedure referenced as a VALUE loses its variadic shape; the rest parameter receives a bare argument instead of a list"
    repro: "(define (h f a b) (f a b)) (display (h append (list 1) (list 2)))"
    observed: "1 — the FIRST ARGUMENT, exit 0, no diagnostic"
    correct: "(1 2), which the same call in call position returns"
    affected_measured:
      - "append -> silently returns the first argument"
      - "make-list -> raises 'cdr: argument is not a pair'"
      - "iota with a rest argument -> the rest argument is ignored, (iota 3 10) as a value gives (0 1 2)"
      - "string-copy -> SIGSEGV under AOT; wrong answer under JIT"
      - "partial, json-get -> raise 'car: argument is not a pair'"
      - "every user (define (f a . rest) …) referenced as a value, at any fixed-parameter count"
    discovered_by: >-
      Found while closing LE-01, as the residue that the LE-01 fix deliberately did NOT
      absorb: `append` and `string-copy` are not inline builtins but rest-arg Scheme
      procedures (lib/core/list/transform.esk, lib/core/strings.esk), so they never reached
      LE-01's wrapper path and stayed broken after it. Reported as a finding rather than
      folded in, then ruled in scope as the same mechanism family.
    root_cause: >-
      A rest-arg procedure is called through a DIFFERENT ABI from a fixed-arity one: the
      closure dispatcher (codegenClosureCall) conses the caller's surplus arguments into a
      list and passes fixed_params values plus that list. It selects that path from the
      closure metadata — bit 63 of packed_info, which the allocator turns into
      CLOSURE_FLAG_VARIADIC, and, for the capture-less case where env is null, the
      input_arity byte, which it reads back as fixed_params. Every function-as-value site
      (emitFunctionAsCallableValue in lib/backend/llvm_codegen.cpp, the function_table
      branch of codegenVariable, and the REPL hot-reload branch) packed a plain arity and
      no variadic bit, so the dispatcher called a rest-arg procedure as if fixed-arity.
      The ABI itself was never wrong; only the VALUE representation lied about the
      procedure's shape. Call position was always correct, which is why no gate saw it.
    fix: >-
      The reference paths now resolve the rest-arg shape from the same two registries the
      call path consults (variadic_function_info, g_repl_variadic_functions) via a shared
      lookupVariadicProcedure helper, and pack the variadic bit plus the FIXED parameter
      count. NO ABI CHANGE was required — the dispatcher already implemented the rest-arg
      calling convention and already read these fields; the value side simply never set
      them. Note the asymmetry the fix has to respect: for a fixed-arity closure the arity
      field is the parameter count, but for a variadic one the dispatcher reads it as the
      FIXED count, so a 1-fixed rest-arg procedure stores 1, not 2.
    verified_at: >-
      tests/integration/first_class_variadics_test.esk, gated on JIT (cache on and off) and
      both AOT levels, plus first_class_variadics_vm_test.esk on the VM. The oracle is
      DIFFERENTIAL by construction: each check compares the value obtained through a
      higher-order function against the identical call in call position, in the same
      program, so it cannot pass by agreeing with a wrong expectation. Covers stdlib
      rest-arg procedures at 0, 1 and 2 fixed parameters (append, make-list, iota,
      string-copy, partial, json-get), user rest-arg procedures at each fixed count with
      both empty and non-empty rest, and the builtin variadics (list, +, string-append)
      as a non-regression check. Revert-validated: with the fix disabled all four native
      gates go red and the VM gate stays green.
    vm_status: >-
      NOT AFFECTED, verified rather than assumed. The VM's closures carry their rest-arg
      shape natively and its CALL opcode consumes it; pinned by
      tests/integration/first_class_variadics_vm_test.esk.
    caught_by: [direct-measurement, le-01-residue-analysis]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      The `missed_by` list is the interesting part. Every gate we own was green while
      `(h append '(1) '(2))` returned 1: the differential corpus compares AXES against each
      other and all four axes were wrong identically; vm-parity excuses native-only
      programs; and no test passed a rest-arg procedure as a value at all. A defect that is
      wrong the same way everywhere is invisible to differential testing by construction —
      the escape analysis for this one is "add a value-position axis to the HOF sweep", not
      "add a corpus program". Adjacent and still OPEN, found by the same sweep and NOT this
      defect: (zset-union …) in core.dbsp SIGSEGVs in CALL POSITION too, so it is a
      different bug and this entry's oracle can say nothing about it.

  - id: SW-33
    bucket: SILENT-WRONG
    status: closed
    closed_at: "2ae3787f"
    closed_by: "branch fix/native-rest-capture-and-do-loop"
    title: "NATIVE: a mutated + captured REST parameter does not write back; the closure mutates a private copy"
    repro: "(define (f . rest) ((lambda () (set! rest (cons 99 rest)))) (car rest)) (display (f 1 2 3))"
    observed: "native 1 — exit 0, no diagnostic, on every native axis"
    correct: "99"
    cross_engine: >-
      the VM is wrong the same way at this SHA (also 1) and is fixed on the
      SW-25 branch fix/vm-region-and-upvalue, measured with that branch's build:
      VM 99. So the two halves of one class are closed by two PRs; neither
      engine is the oracle for the other here, which is why this entry's gates
      are the four NATIVE axes and an absolute expected value, not a parity
      comparison.
    discovered_by: >-
      recorded as adjacent finding (1) in SW-25's notes while class-killing the
      VM half. Measured rather than rediscovered.
    root_cause: >-
      ASSIGNMENT CONVERSION (ESH-0074) boxes a set!-mutated parameter into an
      alloca so that (a) codegenSet has a storage location and (b) every closure
      capturing it shares ONE cell — codegenLambda's capture emission then
      pointer-passes that alloca instead of copying its value. Both boxing loops
      iterated only the FIXED parameters: lib/backend/llvm_codegen.cpp:12692
      (codegenFunctionDefinition, `for i < op->define_op.num_params`) and
      lib/backend/llvm_codegen.cpp:29678 (codegenLambda, same shape). The REST
      parameter is the LLVM argument that FOLLOWS the fixed ones — the
      symbol-table loops twenty lines above each site walk exactly that order —
      so it never got a box, stayed a by-value Argument, and the closure copied
      the list VALUE into its environment slot. The inner set! then mutated a
      private copy discarded on return, while the outer read still read the raw
      Argument. Confirmed in IR: `define @f(%eshkol_tagged_value %rest)` with
      `store %rest, ptr %<env slot>` and `(car rest)` reading `%rest` directly,
      versus the boxed `%n = alloca` a fixed parameter gets.
      The outer guards also required `op->define_op.parameters` /
      `op->lambda_op.parameters` to be non-null, so a rest-ONLY signature could
      not have been reached even if the loop had run.
    fix: >-
      Both sites now box the rest parameter on the same terms as a fixed one —
      `astSetsVar(body, rest_param)` decides, the box is the alloca that the
      iterator already points at after the fixed loop, and the outer guard no
      longer requires a non-empty fixed parameter list. No new mechanism, no ABI
      change: the existing capture machinery pointer-passes the box because it
      is an alloca like any other.
    evidence: >-
      tests/integration/rest_capture_and_do_closure_test.esk, 23/23 checks on
      all four native axes (ctest lanes rest_capture_and_do_closure_{smoke,
      nocache_smoke,aot_o0_smoke,aot_o2_smoke}); the rest-parameter half covers
      depths 1-3, immediately-invoked AND stored closures, a closure that
      outlives the frame that bound the rest parameter, two closures sharing one
      cell, two instantiations NOT sharing one, `lambda` as well as `define`
      rest parameters, a rest parameter after two fixed parameters, and the two
      controls (mutated-but-uncaptured, captured-but-unmutated).
      tests/differential/corpus/48_rest_capture_and_do_closure.esk covers the
      native axes.
      Revert-validated against a build of the same tree without the codegen
      change (worktree eshkol-wt-vmmem, whose diff touches no native codegen):
      it answers 1 for the reproducer and cannot compile the class-kill test at
      all, refusing with "set!: variable 'xs' is not mutable (not an alloca,
      global, or capture pointer)".
    caught_by: [direct-measurement, sw-25-adjacent-finding]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, ctest, vm-parity, differential-corpus, KNOWN_ISSUES]
    notes: >-
      Same FAMILY as SW-25 — a binding is not honoured across a closure boundary
      because there is no shared CELL — but the opposite engine and a different
      omission: the VM's parameter loop never boxed ANY parameter, native's
      boxed every parameter except the one the loop bound could not reach.
      A control worth keeping: `(define (r . xs) (set! xs (cons 3 xs)) (car xs))`
      — mutated but NOT captured — was a LOUD refusal before this change
      ("variable 'xs' is not mutable"), not a wrong answer, and now answers 3.

