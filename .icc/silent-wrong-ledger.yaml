  - id: SW-71
    bucket: VACUOUS-ASSURANCE
    status: closed
    closed_at: "fix/gpu-correctness-gate-vacuous"
    closed_by: "branch fix/gpu-correctness-gate-vacuous"
    title: "Windows judge: ^-anchored FAIL: marker regexes matched only line 1 of captured output; markers after a banner line were invisible on every Windows suite; discovered when the GPU gate canary was judged NO FAIL MARKER"
    repro: >-
      On windows-x64-cuda, tests/gpu/gate_canary_must_fail.esk (SW-67's
      deliberate, permanent-failure canary) exits nonzero and prints a
      banner line first, then its marker on the SECOND line:
        === GPU Gate Canary (this test MUST fail) ===
        FAIL: gate_canary_must_fail (deliberate: expected C[0,0]=999.0, got 19) - this failure is EXPECTED
      scripts/run_all_tests.ps1's Invoke-SimpleCompileRunSuite grades the
      canary path with `$FailRegex -and -not ($run.Output -match
      $FailRegex)` for suites configured with an anchored FailRegex such as
      "^FAIL:|Failed:\s+[1-9]" (gpu, and the same ^-anchored shape on the
      bignum/rational/parallel/signal/error_handling/macros/io/benchmark/
      migration/codegen/numeric suites; Invoke-TimedCompileRunSuite's
      ASSERTION FAIL check and Invoke-XlaSuite's inline `$run.Output -match
      "^FAIL:"` share the same construction). PowerShell's bare -match
      calls .NET regex without RegexOptions::Multiline, so a bare `^`
      anchors to the START OF THE WHOLE STRING, not each line: because the
      banner line comes first, `^FAIL:` never matches, and the judge
      reports "CANARY FAILED WITH NO FAIL MARKER" even though the marker
      is right there on line 2. windows-x64-cuda failed three consecutive
      PR #501 runs on this false negative before the anchoring defect
      itself was identified as the root cause.
    observed: >-
      The canary's own FAIL: marker, present verbatim in stdout, was
      reported as absent - "gate_canary_must_fail.esk (must-fail canary
      exited nonzero but printed no FAIL: marker)" - purely because it was
      not the first line of the captured output. The defect is not scoped
      to the canary: the identical `$run.Output -match $FailRegex`
      evaluation is also the ASSERTION FAIL path for every ordinary test in
      every Windows suite listed above, so a genuine `FAIL:` marker printed
      after any banner, header or diagnostic line was silently invisible to
      the judge in the OTHER direction too - a real regression whose
      marker isn't on line 1 would have been graded PASS, not FAIL.
      -RequirePassMarker's unanchored "PASS" check and the
      RuntimeErrorRegex "error:" checks carry no `^`/`$` anchor and were
      not affected by this half of the defect.
    correct: >-
      A `^`-anchored marker regex passed to a Windows suite runner means "a
      line that starts with this marker" - the same semantics the bash
      judge gets for free from grep's line-by-line matching
      (scripts/run_gpu_tests.sh, scripts/lib/test_isolation.sh) - not "the
      first line of the entire captured stream is this marker." Every site
      that evaluates a FailRegex/RuntimeErrorRegex/RequirePassMarker or ad
      hoc marker regex against a test process's captured output must apply
      RegexOptions.Multiline (or equivalent line-splitting) so that `^`/`$`
      bind per line, defined in exactly one place so the semantics cannot
      drift back out of sync at a future call site.
    observed_after: >-
      Added `Test-OutputMatches -Output $Output -Regex $Regex` (wraps
      [regex]::IsMatch with RegexOptions.Multiline) as the single choke
      point for marker-regex evaluation in scripts/run_all_tests.ps1, and
      routed every FailRegex/RuntimeErrorRegex/RequirePassMarker check in
      Invoke-SimpleCompileRunSuite and Invoke-TimedCompileRunSuite, plus
      Invoke-XlaSuite's inline `^FAIL:`/`PASS`/`error:` checks, through it
      - six call sites total; none of the suites' own FailRegex/
      RuntimeErrorRegex string literals changed. Verified on a real
      Windows 10 / PowerShell 5.1 host on the mesh with a
      csc.exe-built stub eshkol-run.exe standing in for the compiler: (a)
      the real canary fixture (banner line, then a FAIL: marker on line 2,
      exit 1) -> PASS (must-fail canary correctly failed) with 0 failed;
      (b) an ordinary fixture (a couple of lines, exit 0) -> PASS; (c) the
      canary forced to exit 0 -> FAIL "did not fail - verdict pipeline is
      broken"; (d) an ordinary fixture that exits 0 but prints a `FAIL:`
      marker on line 2 -> now correctly graded FAIL, proving marker
      detection is live again for normal tests, not just the canary; (e)
      `[System.Management.Automation.Language.Parser]::ParseFile` reports
      no syntax errors under PowerShell 5.1.19041.
    fixed_by: >-
      branch fix/gpu-correctness-gate-vacuous - Test-OutputMatches helper
      in scripts/run_all_tests.ps1, applied at every FailRegex/
      RuntimeErrorRegex/RequirePassMarker/inline-marker evaluation site.
    evidence: >-
      scripts/run_all_tests.ps1 (Test-OutputMatches,
      Invoke-SimpleCompileRunSuite, Invoke-TimedCompileRunSuite,
      Invoke-XlaSuite) - real-host run on a Windows PowerShell 5.1 host on
      the mesh (Windows 10, PowerShell 5.1.19041) against a csc.exe-built stub compiler plus two
      fixture executables, results (a)-(e) above; local `pwsh -NoProfile`
      parse check; python3 scripts/check_ps1_encoding.py PASS (the file
      stays pure ASCII).
    caught_by: [windows-x64-cuda-ci, direct-measurement]
    missed_by: [run_all_tests.ps1 (pre-fix), icc-smoke, icc-readiness]
    notes: >-
      Discovered while fixing SW-67's own must-fail canary contract on
      Windows (commit 0b4ce1ce): the canary went red for the right reason
      (the must-fail file did fail) but the judge's *reason* for choosing
      the FAIL branch it took was already wrong, one layer down. A judge
      that cannot see a marker that IS there is the same shape of defect
      as a gate that cannot go red at all (SW-67's VACUOUS-ASSURANCE
      finding) - one degree closer to the reporting layer instead of the
      test-content layer. Scope is the Windows PowerShell judge only;
      scripts/run_gpu_tests.sh and scripts/lib/test_isolation.sh's
      bash-side grep-based marker matching already operate line-by-line
      and are unaffected.

  - id: SW-72
    bucket: SILENT-WRONG
    subtag: numeric
    family: vm-geometric/manifold-dim
    status: closed
    closed_at: "fix/audit-manifold-dim-install"
    closed_by: "branch fix/audit-manifold-dim-install"
    title: "vm_geometric_manifold_dim returned 0 unconditionally in the ESHKOL_GEOMETRIC_ENABLED configuration, regardless of the manifold's real dimension"
    repro: >-
      lib/backend/vm_geometric.c:340-348 (pre-fix): under
      `#if defined(ESHKOL_GEOMETRIC_ENABLED)` the function ignored both of
      its arguments (`(void)vm; (void)mv;`) and unconditionally `return 0;`,
      with a doc comment admitting "returns 0 when ESHKOL_GEOMETRIC_ENABLED,
      per the inline TODO." `vm_geometric_manifold_dim` backs VM native id
      858 (`manifold-dim`/`manifold-dimension`) and is also called
      internally by `manifold-metric-tensor` (case 829) and
      `manifold-christoffel-tensor` (case 830) to size their output tensors,
      so every consumer of a manifold's dimension in that build
      configuration would have silently received 0 (and downstream
      christoffel/metric tensors would have silently degenerated to
      `dim<=0` NIL results) rather than the manifold's actual dimension.
      Filed as docs/KNOWN_ISSUES.md prose only, with no ledger row, so
      `scripts/gate_no_silent_wrong.py` reported PASS despite the defect
      (v1.3.5 docs audit, section 3 BI-4).
    observed: >-
      `(manifold-dim (make-hyperbolic-manifold n c))` (or any manifold
      constructor) would return `0` instead of `n` whenever the compiler
      was built with `-DESHKOL_GEOMETRIC_ENABLED` linking the
      semiclassical_qllm manifold backend — a plausible-looking wrong
      answer (a valid dimension value, just always the same wrong one), not
      a loud error.
    correct: >-
      `manifold-dim`/`manifold-dimension` must return the manifold's actual
      dimension on every engine and every build configuration: the VM's
      portable fallback (`VmFallbackManifold.dim`, already correct), the
      VM's qLLM-linked configuration (`qllm_manifold_get_dim`, the sibling
      accessor `vm_geometric_manifold_curvature` already forwards to
      `qllm_manifold_get_curvature` the same way), and the native/AOT path
      (`lib/core/manifold.esk`'s `manifold-dimension`, `(vector-ref m 1)` on
      its `#(type dim)` representation) — all three must agree for
      equivalent manifolds.
    root_cause: >-
      `ESHKOL_GEOMETRIC_ENABLED` is not wired to any CMake option in this
      tree (`ESHKOL_QLLM_ENABLED` only controls the separate
      `eshkol-qllm-run` demo executable's `USE_QLLM` matmul backend, a
      different macro), so the enabled branch of vm_geometric.c has never
      been compiled by any build this repository can produce — the
      curvature getter was written correctly against the real qLLM header
      (`qllm_manifold_get_curvature`) but the dimension getter was left as
      an unimplemented stub, and with the branch permanently dead at
      compile time no test, sanitizer or differential run could ever have
      caught the stub returning the wrong thing.
    fix: >-
      lib/backend/vm_geometric.c: `vm_geometric_manifold_dim`'s
      `ESHKOL_GEOMETRIC_ENABLED` branch now guards on
      `vm_manifold_has_value` (matching `vm_geometric_manifold_curvature`'s
      null-handle guard) and returns
      `(int)qllm_manifold_get_dim((qllm_manifold_t*)vm->heap.objects[mv.as.ptr]->opaque.ptr)`
      instead of the unconditional stub `0`; the portable fallback branch
      (`VmFallbackManifold.dim`) was already correct and is unchanged. Added
      VM-parity coverage for two manifolds' dimensions: the VM side
      (tests/vm/geometric_fallback_numeric_regression.esk, exercising native
      id 858 via `manifold-dim` on a hyperbolic/Poincaré-ball handle and a
      newly added Euclidean handle of a different dimension) and the
      native/AOT side (tests/manifold/manifold_test.esk, exercising
      `core.manifold`'s `manifold-dimension` on the module's existing
      Poincaré-ball and Euclidean manifolds) — both engines now assert the
      constructor's dimension is what comes back.
    evidence: >-
      tests/manifold/manifold_test.esk "manifold-dimension Poincare ball"
      and "manifold-dimension Euclidean" checks, run via
      scripts/run_manifold_tests.sh (native `eshkol-run`); 
      tests/vm/geometric_fallback_numeric_regression.esk "manifold dim
      euclidean" check (alongside the pre-existing hyperbolic "manifold
      dim" check), run via scripts/run_vm_surface_tests.sh (compiled
      `--profile hosted-vm --emit-eskb` and executed on
      eshkol-vm-standalone-test) — both green. The
      ESHKOL_GEOMETRIC_ENABLED branch itself remains uncompiled by any
      build this repository's CMakeLists.txt can produce (tracked, not
      newly introduced by this fix); the code now matches the same qLLM
      C-API pattern already proven live for `manifold-curvature`.
    caught_by: [v135-docs-audit-2026-08-28]
    missed_by: [gate_no_silent_wrong.py (pre-ledger-entry), ctest, icc-smoke, icc-readiness]
    notes: >-
      Companion accessor to SW-65 (fix/geometric-bridge-backwards, the qLLM
      geometric bridge's backward rules) and SW-70/SW-71 — same
      vm_geometric.c/semiclassical_qllm neighborhood, unrelated defect
      shape (unimplemented stub vs. wrong sign/direction). The
      ESHKOL_GEOMETRIC_ENABLED code path stays untested by CI until a
      CMake option actually wires it to a discoverable
      libsemiclassical_qllm the way ESHKOL_QLLM_ENABLED does for
      eshkol-qllm-run; that wiring is out of scope here (BI-4 only asked
      for the accessor to be correct and ledgered).
