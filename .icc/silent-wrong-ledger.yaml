    caught_by: [branch fix/ad-guarantees-real]
    missed_by: [ci, ctest, vm-parity, wasm-execute-diff, icc-readiness]
    notes: >-
      Found while checking whether adding one builtin
      ((ad-note-finite-difference!), SW-47) required regenerating the cache. It
