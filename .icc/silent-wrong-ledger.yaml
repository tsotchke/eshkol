      (multi-shot) continuations" example from
      docs/reference/language/continuations.md, run on the bytecode VM.
      Also tests/continuations/generator_coroutine.esk on the VM (a
      call/cc-based generator/coroutine).
    observed: >-
      doc_example_multishot.esk on the VM: prints "1" once, then an
      unbounded stream of "2" — never reaches "3" or "done". Left running
      60s (~8.8 million lines of "2" printed) without the VM's own runaway-
      instruction guard (ESHKOL_VM_MAX_INSN, default 10,000,000,
      lib/backend/vm_run.c vm_limits_checkpoint) ever firing, because the
      guard's instruction counter is a local variable
      (`vm_insns_executed`) reinitialised to 0 every time control re-enters
      the dispatch loop via a continuation invoke's
      vm_escape_native_control()/longjmp, so it never accumulates far
      enough to trip — an unconditional, silent hang with no built-in
      escape valve. generator_coroutine.esk on the VM: does not hang, exits
      0, prints no diagnostic, but the transcript is wrong — instead of
      "gen1: 1 / gen2: 2 / gen3: 3 / gen4: done" it prints a garbled
      replay (gen1:1, gen2:2, gen2:3, gen2:done, gen2:1, gen3:2, gen3:3,
      gen3:done, gen3:1, gen4:2, gen4:3, gen4:done, gen4:1, done) —
      OP_INVOKE_CC's full operand-stack/call-frame restore
      (lib/backend/vm_run.c lbl_INVOKE_CC, ~line 1133) rewinds execution to
      a point that then falls through the outer top-level-form driver and
      re-executes later top-level forms a second (and third, and fourth)
      time instead of resuming exactly at the consumer's `(next!)` call
      site.
    correct: >-
      doc_example_multishot.esk should print "1" "2" "3" "done" and exit 0
      (matches native JIT/AOT, which get this specific shape right — see
      SW-60's notes on why). generator_coroutine.esk should print
      "gen1: 1", "gen2: 2", "gen3: 3", "gen4: done".
    cross_engine: >-
      Native JIT/AOT get doc_example_multishot.esk's exact shape right
      (same top-level frame, jmp_buf never invalidated) but SIGILL/SIGSEGV
      on the other two fixtures (SW-60) — the two engines fail on
      overlapping but non-identical re-entry shapes; neither delivers
      general multi-shot re-entrant continuations.
    root_cause: >-
      The VM captures a continuation by snapshotting its own operand stack
      and call-frame array (lib/backend/vm_run.c lbl_CALLCC, ~line 1069),
      which is architecturally capable of real re-entry (unlike native's
      setjmp/longjmp), but nothing in the restore path distinguishes "the
      point the *consumer* is conceptually resuming at" from "replay the
      rest of the top-level program from here" — every top-level form
      after the resume point re-runs, including forms whose side effects
      (mutating resume-k/return-k, printing labels) were already correct
      the first time. Fixing this is part of the same BUILD ITEM as SW-60
      (a real multi-shot design needs a coherent model of "the rest of the
      program" that both engines implement the same way), not a
      standalone bug in the VM's snapshot/restore mechanics.
    caught_by: [direct-measurement, docs/reference/language/continuations.md audit]
    missed_by: [icc-correctness-chain, icc-smoke, icc-readiness, tests/control_flow/*, tests/vm_parity/*]
    resolution: >-
      FIXED. The root cause was not "replays later top-level forms" but a
      store/control confusion: the VM binds every top-level definition to an
      operand-stack slot, and a continuation snapshotted and restored
      stack[0..sp) wholesale, so re-entry rolled the STORE back along with the
      control state. R7RS `call/cc` captures control state only. A continuation
      now snapshots and restores only the control region above an explicit
      STORE/CONTROL boundary (OP_GLOBAL_MARK raises vm->global_top; see
      vm_capture_continuation_stack / vm_restore_continuation_stack in
      lib/backend/vm_run.c), so `set!` and `define` effects survive re-entry.
      The one shape this single-array representation cannot express — a
      top-level binding slot above a continuation's saved stack top — now fails
      LOUDLY with a diagnostic naming the cause and the workaround, rather than
      resuming onto a corrupted store.
      Two further defects found while measuring this and fixed with it: a
      one-armed `(if test conseq)` left nothing on its false path while every
      consumer emits an unconditional OP_POP, silently overwriting the
      top-level binding just above sp (reproducible with no call/cc at all);
      and the runaway-instruction budget was a vm_run() local, so it reset to
      zero on every continuation invoke and never tripped — it now lives on the
      VM and accumulates, so an unbounded continuation loop fails loudly
      instead of hanging silently.
      `dynamic-wind` was additionally only ever unwound, never rerooted, on
      BOTH engines: re-entering a continuation captured inside a
      `dynamic-wind` whose extent had been left did not re-run that extent's
      `before` thunk, so the body resumed with its setup undone. Both engines
      now split at the common ancestor and run `after` outward then `before`
      inward; the VM's wind entries record the before-closure, which
      OP_WIND_PUSH previously discarded as NIL.
    measured: >-
      Re-measured at closure SHA on the bytecode VM:
      tests/continuations/doc_example_multishot.esk now terminates with the
      documented 1/2/3/done (was an unbounded stream of "2"). A store-mutation
      probe that previously reported x=0 forever now matches the native JIT and
      AOT oracles exactly (x=0,1,2,3 then final=4).
      tests/continuations/generator_coroutine.esk exits 0 with output
      byte-identical to native JIT and AOT — and that cross-engine agreement
      also corrects this entry's own "correct" expectation: the transcript
      gen1:1/gen2:2/gen3:3/gen4:done is NOT right for that program, which
      captures return-k once inside the producer so every yield returns into
      the first consumer's extent. tests/continuations/generator_multishot.esk
      is the correctly structured generator and reports ALL PASS on all three
      engines. scripts/run_vm_tests.sh 73/73, scripts/run_vm_parity.sh 188/188,
      ctest 191/191.
    closed_at: "dc28d1208a07d3995f695c8fef35b559886c4d6a"
    closed_by: "branch feat/multishot-continuations"

  - id: SW-62
    renumbered_from: >-
      SW-53. Filed as SW-53 on branch feat/multishot-continuations before
      rebase/merge with origin/master. feat/linearity-complete landed its own, unrelated SW-53 ("linear
      Qubit violations") on master first. Verified
      SW-62 free against master and the other three in-flight branches
      claiming ids in this range (fix/v135-correctness-debt: SW-54..56,
      fix/resident-rss-longrun: SW-57, feat/tail-transfer-complete: SW-58)
      before assigning it here.
    bucket: SILENT-WRONG
    status: open
    title: "re-entering a continuation rolls back a mutated local that is neither a top-level binding nor closure-captured (native and bytecode VM)"
    repro: >-
      (define k #f)
      (define n 0)
      (define (f)
        (let ((x 0))
          (call/cc (lambda (c) (set! k c)))
          (set! x (+ x 1))
          x))
      (display "f=") (display (f)) (newline)
      (set! n (+ n 1))
      (if (< n 3) (k 'again))
      (display "done") (newline)
    observed: >-
      native JIT, native AOT and the bytecode VM all print f=1 then 1 then 1
      then done, exit 0, no diagnostic. `x` is restored to its capture-time
      value on every re-entry.
    correct: >-
      f=1 then 2 then 3 then done. `let` creates one location for `x` per
      invocation of `f`; R7RS `call/cc` captures the control state, not the
      store, so re-entering the continuation resumes with that location
      holding whatever the last `set!` put there.
    root_cause: >-
      Neither engine performs assignment conversion. A `set!`-assigned local
      that no closure captures lives directly in the frame — an LLVM alloca on
      native, an operand-stack slot on the VM — rather than in a heap cell, so
      it is inside the region a continuation snapshots and is restored with it.
      Closure-captured mutable variables are already boxed on both engines and
      are therefore correct; top-level bindings are correct on both engines
      too (native keeps them outside the stack, and the VM excludes them from
      the snapshot via the STORE/CONTROL boundary added in SW-61's fix).
      The sound fix is assignment conversion: box every `set!`-assigned local
      so the frame holds only immutable values and restoring it cannot roll a
      location back.
    notes: >-
      Pre-existing in the sense that no engine ever handled it, but only
      reachable now that re-entry into a returned frame works at all — on
      native it previously crashed (SW-60) and on the VM this exact program
      looped forever (SW-61), so this is a strictly narrower residual of two
      defects that were both worse. Documented under "Limits" in
      docs/reference/language/continuations.md rather than left implicit.
      Not made LOUD because detecting it needs the same whole-function
      assignment analysis that would fix it outright; the analysis is the fix,
      so the next step on this entry is to implement it rather than to add a
      diagnostic.
    caught_by: [direct-measurement, branch feat/multishot-continuations]
    missed_by: [tests/continuations/*, tests/vm_parity/*, ctest]
    waiver:
      owner: tsotchke
      reason: >-
        FLAGGED FOR AN EXPLICIT RULING, not routine. This is the one shape
        where making re-entry work moved behaviour from a loud failure to a
        silently wrong value: on the pre-change build this exact program
        SIGSEGV'd on native (SW-60) and looped forever on the VM (SW-61); it
        now returns 1 three times where R7RS says 1, 2, 3. Every other shape
        the change touches moved from crash/hang to correct.
        It is waived rather than made loud because neither available way of
        making it loud is honest. A compile-time rule precise enough to catch
        it — "an escaping call/cc anywhere plus a set! to a non-boxed local
        anywhere" — is sound only within one compilation unit and would reject
        correct programs that never re-enter a frame holding a mutated local,
        including ordinary uses of the separately compiled stdlib. A narrower
        rule covering only the capturing function would miss the caller-frame
        case (a mutated local in a frame BELOW the capture is restored too),
        which is precisely the partial-detector-presented-as-a-gate pattern
        this project is eliminating.
        The sound fix is assignment conversion — box every `set!`-assigned
        local so a frame holds only immutable values and restoring it cannot
        roll a location back. That is a self-contained follow-up on both
        engines and is the recommended next step on this entry; the analysis
        needed to detect the defect IS the fix, so building the diagnostic
        first would be wasted work.
      expires: "2026-12-31"

  - id: SW-59
    bucket: SILENT-WRONG
    status: fixed
    renumbered_from: >-
      SW-54. Filed as SW-54 on branch feat/multishot-continuations before
      rebase; by the time this entry closed, SW-54..56 had been claimed by
      PR #466 (fix/v135-correctness-debt) and SW-57/SW-58 by #473
      (fix/resident-rss-longrun) and #483 (feat/tail-transfer-complete)
      respectively, all landing on master ahead of this branch (merged into it
      via `git merge origin/master` rather than a linear rebase, once a
      SW-51/52/53 id collision with master surfaced independently — see
      SW-60..62 below). Verified
      SW-59 free against master and all three of those branches at merge
      time (`git show <branch>:.icc/silent-wrong-ledger.yaml | grep 'id: SW-'`)
      before assigning it here.
    title: "native: a continuation captured inside with-region dangles into the region's freed arena on resume (JIT and AOT)"
    repro: >-
      tests/continuations/region_capture_resume.esk, run with
      ESHKOL_ARENA_POISON=1 set:
        ./build/eshkol-run -r tests/continuations/region_capture_resume.esk
        ./build/eshkol-run tests/continuations/region_capture_resume.esk -o /tmp-out && ESHKOL_ARENA_POISON=1 /tmp-out
      (bytecode VM is unaffected: eshkol-vm-standalone-test on the same
      fixture prints ALL PASS under the same env var, and emits its
      pin-promotion note on stderr.)
    observed: >-
      Both native JIT and native AOT print the first "captured=(11 22 33 44
      55)" line and then crash — SIGSEGV at address 0xcbcbcbcbcbcbcbcb, the
      0xCB arena-poison fill byte repeated across a pointer-width read — on
      the very first re-invocation of the continuation captured inside the
      exited `with-region`. Reproduced 3/3 runs, both on the commit
      aabc0b58 baseline and with the uncommitted lib/backend/llvm_codegen.cpp
      + lib/repl/repl_jit.cpp change on branch feat/multishot-continuations
      that redirects an escaping call/cc's own state+closure allocation to
      get_global_arena_shared() (identical crash, same address, same line,
      in both). WITHOUT ESHKOL_ARENA_POISON the fixture prints the fully
      correct transcript and exits 0 on every engine — this is a real
      use-after-free that the non-poisoned test oracle cannot see, not a
      poisoning false positive: an escape-only control (with-region that
      escapes a value via `set!` to a global, then 20000 iterations of
      unrelated churn allocation, no call/cc at all) survives
      ESHKOL_ARENA_POISON=1 cleanly on the same build.
    correct: >-
      captured=(11 22 33 44 55) printed three times, then
      "final captured=(11 22 33 44 55)" / ALL PASS, matching
      tests/continuations/expected/region_capture_resume.txt, with no crash
      under any memory-diagnostic build.
    root_cause: >-
      `eshkol_continuation_capture_stack()` (lib/core/runtime_continuations.cpp)
      copies the ENTIRE live C stack from the capturing frame up to the
      thread's stack base into an arena-owned buffer, and
      `resume_trampoline()` copies those bytes back to the SAME addresses
      verbatim before longjmp'ing. That is sound for the bytes themselves,
      but the snapshot is not sanitised: it includes whatever the
      with-region body's own frame held on the C stack at capture time,
      which is legitimately live at capture (the region's arena is still
      open) but not evacuated the way ESH-0214c evacuates a `set!`-to-global
      target. The dirty-file fix under review only re-homes the
      continuation's OWN eshkol_continuation_state_t / closure / stack-image
      buffer onto get_global_arena_shared() when the capture is classified
      as escaping; it does not, and by construction cannot, walk the opaque
      byte blob it captures for embedded pointers into the (about to be
      freed) region arena. `region_destroy()` -> `arena_destroy()` runs
      unconditionally at region_pop regardless of whether a continuation was
      captured inside the region, so those interior pointers dangle the
      moment the region's owning `with-region` form returns.
      tests/continuations/region_capture_resume.esk's own header comment
      ("native keeps the region alive for the same reason [as the VM]") is
      not accurate for the code as it stands: grep confirms no
      region_pin/pin_all analogue exists in lib/core/runtime_regions.cpp;
      only the bytecode VM has one (heap_region_pin_all(), vm_run.c:171,
      called from vm_capture_continuation_dynamic_state() whenever a
      continuation is captured with vm->heap.regions.depth > 0). The
      generic region-escape evacuator (runtime_regions.cpp evac_kind_for())
      independently confirms it does not deep-walk continuation closures
      either: CALLABLE_SUBTYPE_CONTINUATION is explicitly EVAC_LEAF,
      documented as "their interior reference graph is not confidently
      traversable here."
    notes: >-
      Found during verification of branch feat/multishot-continuations
      (commits aabc0b58..7bd85799) prior to rebase/push — not previously
      ledgered. The other 5 of 6 committed fixtures
      (doc_example_multishot, generator_coroutine, generator_multishot,
      amb_backtracking, reentry_after_function_return) all survive
      ESHKOL_ARENA_POISON=1 cleanly on native JIT and AOT and on the VM;
      this was isolated to the one shape where a continuation both escapes
      its capturing frame AND was captured lexically inside a `with-region`
      whose extent has since closed.
    caught_by: [direct-measurement, branch feat/multishot-continuations]
    resolution: >-
      FIXED by giving native regions the same pin the bytecode VM already had.
      `struct eshkol_region` (lib/core/arena_memory.h) gained a `pinned` int,
      and a new `eshkol_region_pin_all()` (lib/core/runtime_regions.cpp) walks
      the thread-local `__region_stack` and sets it on every currently-open
      region — the exact semantics of `heap_region_pin_all()`
      (lib/backend/vm_core.c:594), called under the exact same guard the VM
      uses: `eshkol_make_continuation_state()` (lib/core/runtime_continuations.cpp)
      calls it whenever `eshkol_region_mark() > 0` at capture time, mirroring
      `vm->heap.regions.depth > 0` at lib/backend/vm_run.c:170-171. `region_destroy()`
      now checks the flag before its `arena_destroy()` call: a pinned region's
      arena is deliberately leaked (never freed for the remainder of the
      process) rather than freed out from under a continuation whose raw
      C-stack snapshot may hold interior pointers into it that no evacuator
      can see or walk — the identical "leak, never dangle" failure direction
      `vm_region_evacuate_pop()`'s promote-wholesale path (lib/backend/vm_region_evac.c:1106-1117)
      already commits to when the VM's own evacuator cannot prove a region
      safe to reclaim. Like the VM's pin, this one is never lifted: neither
      substrate has an unpin path, because continuations carry no refcount to
      unpin against — a Stage-1 policy documented as such in both
      `struct eshkol_region`'s comment and
      docs/reference/language/continuations.md. `eshkol_region_unwind_to()`
      (runtime_regions.cpp:1971), the single teardown path every region
      exit funnels through (lexical `with-region` exit, `region-close`, a
      `raise` crossing the region, and a `call/cc` escape — see ADR-0011
      section 6.1), needed no changes itself: the pin check lives entirely
      inside `region_destroy()`, so all four teardown callers get the fix
      for free and none of the three non-capturing paths change behavior.
      `ESHKOL_OBJ_FLAG_PINNED` (inc/eshkol/eshkol.h:482-483) was considered
      and not used: it is a per-object flag reserved by ADR-0011 for a guest
      collector's objects under a moving collector (see that ADR section 6.2),
      a different granularity than the region-arena-lifetime problem here,
      where the hazard is an opaque stack-snapshot blob with no per-object
      addressability at all.
    measured: >-
      tests/continuations/region_capture_resume.esk: 3/3 clean under
      ESHKOL_ARENA_POISON=1 on native JIT, native AOT and the VM (was SIGSEGV
      at 0xcbcbcbcbcbcbcbcb on JIT/AOT on the very first re-invocation).
      scripts/run_continuation_tests.sh: 18/18 (6 fixtures x 3 engines) PASSED
      both with and without ESHKOL_ARENA_POISON=1, repeated 3x under poison
      with identical results. Escape-only regressions unaffected: dynamic_wind_test,
      callcc_dynamic_wind_test, guard_advanced_test, guard_edge_test and
      rec_dynamic_wind_10k all pass under poison unchanged (no with-region
      involved, so no region is ever pinned on these paths). Flat-RSS
      non-regression proven with no continuation ever captured:
      tests/memory/region_mutating_loop_flat_rss_test.sh PASS (peak 83MB,
      ceiling 300MB), tests/memory/define_loop_flat_rss_aot_test.sh PASS
      (peak 8MB, ceiling 200MB), tests/memory/vm_region_flat_rss_test.sh
      PASS (6/6, peak 28MB, ceiling 120MB) — confirming pinning triggers
      only on an actual capture and a program that never calls call/cc shows
      zero behavior change. ctest: 191/191. scripts/run_vm_parity.sh: 188/188.
    closed_at: "4ed8c6894ddd77c30a88cf360c9f8de65b821210"
    closed_by: "branch feat/multishot-continuations"

  # ───────────────────── VACUOUS-ASSURANCE ─────────────────────

  - id: SW-47
    bucket: VACUOUS-ASSURANCE
    status: closed
    closed_at: "fix/ad-guarantees-real"
    closed_by: "branch fix/ad-guarantees-real"
    family: ad/instrumentation
    note: >-
      SW-46 is deliberately NOT used here: it is reserved for the in-flight
      correctness lane that was open when this entry was filed. SW-45 was
      already taken by #463 (merged as 8f1ce3e4). Next free id at filing time
      was verified with `grep -o 'id: SW-[0-9]*b*' .icc/silent-wrong-ledger.yaml
      | sort -V | tail -3`, which returned SW-43/SW-44/SW-45.
    title: "The no-finite-differences guarantee was enforced by a counter nothing could increment, so `finite_difference_evals == 0` was true by construction"
    repro: >-
      On the pre-fix tree: `grep -rn eshkol_ad_count_fd lib/ inc/ exe/ tests/
      scripts/` returns exactly two lines — the definition at
      lib/core/runtime_autodiff.cpp:51 and the declaration at
      lib/core/arena_memory.h:396. Zero call sites. Then run
      tests/ad/one_pass_gradient_test.esk, whose line 89 asserts
      `(= (ad-finite-difference-evals) 0)`, and it passes.
    observed: >-
      The assertion passed, and could not have done otherwise.
      __eshkol_ad_counters.finite_difference_evals has exactly one writer,
      eshkol_ad_count_fd(), and that function had no callers anywhere in the
      native compiler, its runtime, or emitted IR — so on the native back end
      the field was pinned at 0 for the lifetime of every process. The
      executable form of the public claim "exact gradients … no
      finite-difference fallback anywhere in the gradient path" was therefore a
      tautology: it would have stayed green if a finite-difference fallback had
      been added to the gradient path the next day. Demonstrated directly on
      this branch: with the counter deliberately unwired again, the pre-existing
      positive gate (scripts/run_one_pass_gradient_gate.sh) still reports
      "JIT PASS (26 checks) … PASS", while the new negative control fails —
      evidence at
      .worktrees/v135/evidence/ad-real/logs/gate-with-counter-unwired.log.
      Compounding it, the ONE real finite-difference site reachable from a
      compiled Eshkol program — `record-fd-op!` in lib/core/ad/tape.esk, central
      differences at eps=1e-6, named by ADR-0002 as a site that must increment
      the counter — reported nothing on either engine, so a program that
      genuinely did finite differences still read `(ad-finite-difference-evals)`
      as 0. The counter under-reported real FD work AND could not over-report.
    correct: >-
      The counter must be a live instrument: capable of reading nonzero, reading
      nonzero exactly when finite differences actually run, and returning 0 when
      they do not. `(= (ad-finite-difference-evals) 0)` must be a measurement of
      the run, not a property of the build.
    root_cause: >-
      The read end shipped without the write end. ADR-0002's migration plan
      ("add a finite_difference_evals counter incremented at every FD site")
      was implemented as far as the reader builtins
      ((ad-finite-difference-evals), (ad-counters)) and the reset, and stopped
      before any site called eshkol_ad_count_fd(). The three native FD sites the
      ADR named (autodiff_codegen.cpp gradientHigherOrder / vector-tensor
      Hessian) were subsequently converted to exact forward-over-forward AD —
      genuinely good work — which removed the callers-to-be and left the counter
      looking finished. The fourth named site, tape.esk's `record-fd-op!`, was
      never wired at all. Nothing failed, because nothing could.
    fix: >-
      Added `(ad-note-finite-difference!)` (native fid 2088, arity 0) as the
      write end of the counter, implemented on BOTH engines — native via
      eshkol_builtin_ad_note_finite_difference -> eshkol_ad_count_fd()
      (lib/core/system_builtins.c, lib/backend/system_codegen.cpp,
      lib/backend/llvm_codegen.cpp), bytecode VM via case 2088 incrementing
      vm->ad_finite_difference_evals (lib/backend/vm_native.c,
      lib/backend/eshkol_vm.c). `record-fd-op!` (lib/core/ad/tape.esk) now
      reports one evaluation per perturbation, so its count equals the extra
      primal evaluations the backward actually paid for. eshkol_ad_count_fd()
      thereby acquires its first caller. A stale comment in
      lib/core/runtime_list_helpers.cpp that described the (now exact)
      multi-parameter hessian/laplacian/directional-derivative paths as
      "finite-difference" was corrected in the same pass, so no reader is left
      believing an FD fallback still exists there.
    evidence: >-
      tests/ad/fd_counter_negative_test.esk — 12 checks, the negative control:
      the counter moves 0 -> 1 -> 3 on explicit reports; a real central-
      difference backward through `record-fd-op!` over 2 inputs reads back
      exactly 4 (2 inputs x 2 perturbations) while the gradients it produces are
      right (d/dx = 3x^2 = 12, d/dy = 2); the shipped assertion form
      `(= (ad-finite-difference-evals) 0)` evaluates #f in that state; and an
      exact tape gradient over the same function leaves the counter at 0, so the
      instrument is not merely always-nonzero. Green on native JIT (12/12),
      native AOT (12/12) and the bytecode VM. Run by
      scripts/run_ad_exactness_gate.sh, which pairs it with the positive gate.
    close_condition_met: >-
      The check has been demonstrated to go RED under the condition it exists to
      detect. Removing the two `(ad-note-finite-difference!)` calls from
      `record-fd-op!` and rebuilding stdlib turns
      scripts/run_ad_exactness_gate.sh from PASS to FAIL on both engines
      ("fd-counter JIT FAIL", "fd-counter VM FAIL", "AD exactness gate: FAIL"),
      while the pre-existing positive-only gate stays green — which is precisely
      the vacuity this entry records. Log:
      .worktrees/v135/evidence/ad-real/logs/gate-with-counter-unwired.log.
    caught_by: [architecture-audit-2026-08-25, icc-find-dead-code]
    missed_by: [icc-readiness, icc-smoke, ad-adversarial, vm-parity, ctest]
    notes: >-
      The bytecode VM's separate counter (vm->ad_finite_difference_evals) WAS
      wired before this change, at the two VM finite-difference operators
      (vm_native.c `divergence` on a tensor-returning field, and `curl`, both
      central differences at h=1e-7). That asymmetry is why the defect survived:
      the same Scheme name reads two different backing stores, one live and one
      dead, and no gate compared them. The gate added here runs the negative
      control on BOTH engines for exactly that reason. The VM's two FD operators
      are a separate, still-open divergence from the documented "reverse mode"
      status of divergence/curl and are NOT closed by this entry.

  # ───────────────────── DOC-DEBT (AD architecture) ─────────────────────

  - id: SW-48
    bucket: DOC-DEBT
    status: open
    family: ad/architecture
    title: "ADR-0002's dense tensor AD node has never executed: the guard admitting it is unsatisfiable, and the node it would build is routed to the scalar backward and crashes"
    bucket_justification: >-
      Not SILENT-WRONG: measured on this branch, every matmul gradient is exact
      today (2x2/3x3/4x4 checked against closed form to 1e-9, one primal call,
      one reverse pass, zero finite differences). Not VACUOUS-ASSURANCE: there
      was no green check here proving nothing, because ADR-0000's Stage-7 gate
      (`scalar_ad_nodes_from_matmul == 0`) was never implemented at all — nothing
      counted the nodes. What diverges is the ARCHITECTURE from the ADRs that
      schedule it, which is what DOC-DEBT declares ("documentation claim versus
      measured reality"), read the direction the maintainer requires: the
      documents are the blueprint and the code has to rise to them.
    repro: >-
      Read lib/backend/llvm_codegen.cpp in the matmul lowering. On the pre-fix
      tree the AD-record block is guarded by
      `if (autodiff_ && ad_mode && !after_matmul_compute)`, while
      `after_matmul_compute` is assigned non-null a few lines above under
      exactly `if (autodiff_) { if (ad_mode) {`. The conjunction is
      unsatisfiable, so `recordADNodeTensor` — the only producer of a dense
      AD_NODE_MATMUL — has zero live callers in the compiler. To see what
      happens if it is reached, change the guard to `if (autodiff_ && ad_mode)`,
      rebuild, and run
      `(gradient (lambda (x) (tensor-sum (matmul x c))) (tensor 2 2 ...))`.
    observed: >-
      Unreachable in the shipped compiler. When the guard is flipped so it IS
      reached, the program SIGSEGVs at address 0x8 on the first matmul gradient,
      identically under `-r` and AOT (backtrace: fault in generated code,
      `ldp d0, d1, [x19, #0x8]` with x19 = 0 — loading `value` out of a null AD
      input node). It does not produce a different gradient or a slower correct
      one; it does not run. Meanwhile every matmul under autodiff records a tape
      node per scalar multiply-accumulate: measured 33 nodes for 2x2, 100 for
      3x3, 225 for 4x4, i.e. growth with M*N*K, which is exactly what ADR-0002
      exists to remove.
    correct: >-
      One dense AD node per tensor operation (ADR-0002 §3.1), so tape size
      scales with the number of tensor ops rather than with scalar element
      count, and the dense backward kernels in lib/backend/tensor_backward.cpp
      carry the work.
    root_cause: >-
      Three unfinished things, of which the guard is only the most visible.
      (1) The guard: `!after_matmul_compute` reads as a fallback for "the
      scalarizing path did not install" but is never true, so the deadness was
      accidental rather than declared and every reviewer read it as a switch
      awaiting a flip. (2) recordADNodeTensor stores NULL into AD-node field 7
      (`tensor_gradient`), commented "allocated during backward" — but the
      reverse pass SELECTS the tensor backward by testing that same field
      non-null (autodiff_codegen.cpp, "TENSOR GRADIENT FAST PATH"). Constructor
      and consumer each wait for the other, so a node this function builds falls
      through to the SCALAR dispatch for op 24 and dereferences its null
      input1/input2. That is the crash. Nothing on the compiled path ever sets
      tensor_gradient; the only writers are the qLLM bridge C entry points
      (lib/bridge/qllm_bridge.cpp) and the backward rules themselves, so
      eshkol_tensor_backward_dispatch is likewise unreachable from compiled
      Eshkol. (3) Even with those fixed, the dense node produced is dropped —
      the block computes it, sets its params, and then returns a plain HEAP_PTR
      tensor — and under AD the scalarizing path leaves AD-node POINTERS in the
      result tensor's elements, which is what tensor-sum and friends consume, so
      a dense matmul writing plain doubles there would sever the chain at the
      next tensor op.
    interim: >-
      The deadness is now DECLARED rather than accidental: the block is gated on
      a named `constexpr bool kDenseTensorADNodesEnabled = false` with the three
      blockers and the crash evidence recorded beside it, and stays compiled and
      type-checked so it cannot bit-rot. The divergence is now MEASURED:
      tests/ad/matmul_tape_node_count_test.esk records today's scalar node
      counts as a shrink-only ratchet (33 / 100 / 225 for 2x2 / 3x3 / 4x4)
      alongside exactness of the gradients, so the day the dense path lands the
      drop is provable and a regression that inflates the tape is caught. Run by
      scripts/run_ad_exactness_gate.sh.
    close_condition: >-
      recordADNodeTensor allocates tensor_gradient so its nodes reach the tensor
      backward; the dense node is returned as an AD-node-tagged tensor value and
      consumed by the downstream tensor ops; matmul under AD records ONE node;
      the ratchet ceilings in tests/ad/matmul_tape_node_count_test.esk drop to
      O(1) per matmul with the gradients unchanged. That is ADR-0002 Position A
      ("dense resident tape"), scheduled for v1.6 and unstarted.
    caught_by: [architecture-audit-2026-08-25]
    missed_by: [icc-readiness, icc-smoke, ad-adversarial, ctest, vm-parity]
    notes: >-
      Checked for the same dead-guard SHAPE elsewhere: `!after_*_compute`
      appears exactly once in the tree. conv2d, batch-norm, layer-norm,
      attention, elementwise tensor arithmetic and the reductions do not carry a
      dead dense block — they have no dense block at all, scalarizing through
      recordADNodeBinary/recordADNodeUnary in live loops. So the count of this
      bug shape is ONE; the count of tensor ops still scalarizing is all of them.

