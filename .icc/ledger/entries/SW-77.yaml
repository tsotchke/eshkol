  at 1e-9 from the boundary, and it is a hundred million times better than the floored answer.
fixed_by: 'branch feat/vm-geometry-complete, in inc/eshkol/backend/riemannian_core.h.

  eshkol_rm_gyration computes gyr[a,b]w in its LINEAR closed form w + 2(Aa + Cb)/D, whose only denominator
  is the Mobius denominator of the two validated POINTS. Transport is (lambda_x/lambda_y) gyr[y,-x]v through
  it, and nothing feeds a tangent vector into point addition any more.

  eshkol_rm_mobius_den evaluates the denominator as (1 + B<x,y>)^2 + B^2(|x|^2|y|^2 - <x,y>^2): the first
  term is a subtraction of two nearby numbers and so is exact in f64, and the second is a sum of squares
  by LAGRANGE''S IDENTITY and so has no cancellation. Lagrange is O(n^2), so it is unconditional up to
  dimension 32 and above that is reached only when the denominator is small enough to need it. The floor
  is deleted.

  eshkol_rm_dot_dd accumulates dot products in double-double and closes with a fused multiply-add, giving
  1 - B|x|^2 and 1 + B<x,y> to full RELATIVE precision -- the two quantities the ball chart destroys near
  the boundary, and the two everything else is built from. The Mobius numerator then comes from the exact
  identity num_x = den + B|y|^2 (1 - B|x|^2) and is summed with exact products, so it does not lose the
  cancellation either.

  eshkol_rm_require_interior is checked on the way out of exp, mobius-add and mobius-scalar-mul, and names
  the representability limit instead of returning the boundary.

  The distance is 2 sqrt(R) psi(B R) with psi(w) = asinh(sqrt w)/sqrt w, evaluated by series below w =
  1e-2 and in closed form above. This is the same number as the arccosh form -- arccosh(1 + 2z^2) = 2
  asinh(z) -- and is stable where that is not. The spherical branch moves from acos(<x,y>/R^2) to atan2
  for the same reason.

  log_x(y) takes its DIRECTION from the Mobius numerator alone, never divided by the near-zero denominator,
  and its MAGNITUDE from the stable distance as d/lambda_x. It no longer refuses any interior pair.'
evidence: 'tests/vm/geometric_riemannian_surface_regression.esk -- new sections "Near-coincident and near-boundary",
  "The excluded boundary", "Parallel transport on a tangent vector OUTSIDE the ball" and "Spherical tangency",
  each asserting the correct value above AND `far?` from the observed one where the old body produced
  a specific number. The near-coincident distance is checked with a RELATIVE comparator, because an absolute
  1e-9 tolerance accepts zero for a distance of 2e-9 -- which is precisely the defect.

  The two core headers are additionally exercised as C, outside the VM, against hand-derived values and
  against central differences.'
