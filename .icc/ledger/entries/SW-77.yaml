notes: 'Found by an adversarial audit of PR #516 (the branch that introduced these formulas), not by a
  gate. That is the honest attribution and it is the reason the regression grew the sections it did: SW-73''s
  own suite asserted transport only for a tangent vector INSIDE the ball, distances only for well-separated
  points, and every curved case at |K| = 1, where every sqrt(c) factor is 1. Those three blind spots are
  each closed by name.

  No builtin names, ids or arities change. What changes is the numbers four ops return in their extreme
  ranges, and two new refusals (a boundary result from exp/mobius-scalar, a non-tangent vector on the
  sphere).'
