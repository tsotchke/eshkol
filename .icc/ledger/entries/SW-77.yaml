title: 'the Poincare ball''s arithmetic returned plausible wrong numbers wherever the chart is tight:
  parallel transport of a tangent vector larger than the ball collapsed it, a near-boundary Mobius sum
  came back two orders of magnitude wrong, exp and Mobius scalar multiplication returned the EXCLUDED
  boundary, and a 2e-9 geodesic distance came back as exactly zero'
mechanism: 'Four defects with one shape: the ball chart''s formulas were transcribed in the algebraically-correct-but-numerically-wrong
  grouping, and a floor was added to hide the symptom rather than the cause. All four are in inc/eshkol/backend/riemannian_core.h
  as SW-73 wrote it.

  (1) PARALLEL TRANSPORT (812/843), and the moment transport inside Riemannian Adam. gyr[a,b]w was expanded
  as -(a (+) b) (+) (a (+) (b (+) w)), which feeds the TANGENT VECTOR w into Mobius POINT addition. A
  tangent vector is not constrained to the ball, so an intermediate denominator can vanish -- even though
  the gyration is a globally defined linear isometry with no singularity there at all.

  (2) THE MOBIUS DENOMINATOR FLOOR. eshkol_rm_mobius_add clamped |den| up to 1e-15 WITHOUT scaling the
  numerator. For two validated interior points the denominator is bounded below by (1 - sqrt(B)|x| sqrt(B)|y|)^2
  > 0 and never needs a floor; what it needs is to be EVALUATED accurately, because the direct sum 1 +
  2B<x,y> + B^2|x|^2|y|^2 computes a value of 9e-18 as a difference of terms of size 1 and loses every
  digit.

  (3) tanh SATURATION. exp''s coefficient is tanh(...)/... and Mobius scalar multiplication''s is tanh(r
  artanh(...)); tanh rounds to exactly 1.0 for arguments beyond about 19, so both could return a point
  ON the ball boundary. That is not a point of the open ball -- it is a value outside the op''s own codomain,
  at which lambda is infinite and every subsequent log degenerates to zero.

  (4) arccosh(1 + eps) CANCELLATION. The distance was arccosh(1 + 2B|x-y|^2/P)/sqrt(B). For a small separation
  the argument rounds to exactly 1 and the distance comes back as exactly 0.

  Related and NOT a silent wrong, so recorded here rather than as its own entry: log_x(y) REFUSED whenever
  sqrt(B)|(-x) (+) y| rounded to 1, on the stated grounds that no finite log existed. Every pair of strictly
  interior ball points has a unique finite log; the rounding was a numerical failure of the artanh route.
  A false refusal is loud, so it never had this defect''s character -- but it had the same cause, and
  it is fixed with them.'
