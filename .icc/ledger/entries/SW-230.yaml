id: SW-230
bucket: SILENT-WRONG
subtag: numeric
family: builtins/first-class-parity
status: fixed
closed_at: "7c9ceca04"
title: "atan2 was not a first-class value natively (raw libm function); first-class atan and round dropped a second argument"
repro: >-
  (define f atan2) (f 1.0 2.0); (apply atan2 (list 1.0 2.0));
  ((lambda (f) (f 1.0 2.0)) atan); (map atan ys xs)
observed: >-
  SIGSEGV (the raw double(double,double) C function called through the
  tagged closure ABI); invalid IR under apply; atan(1.0) = 0.785 instead of
  atan2(1, 2) = 0.4636. value_position_axis_sweep: builtins/atan2::passed|
  stored|returned::jit.
correct: >-
  0.4636476090008061 on every path.
root_cause: >-
  Two hand-kept name sets decided which math builtins got a first-class
  wrapper; atan2 was in neither and fell to the function_table's raw libm
  declaration, and apply called any same-named module function. atan and
  round materialised at a fixed arity 1.
fix: >-
  isFirstClassMathBuiltin (the math dispatch's Taylor table plus a first-class
  table row) replaces both sets in codegenVariable and resolveLambdaFunction;
  the table gains the math rows, with atan and round as VariadicRest::ByCount
  (a variadic closure dispatching on the argument count to the wrapper at that
  arity, an arity error otherwise). apply evaluates a name whose module
  function is a raw C declaration as a value. The type checker types the
  same names as procedures.
evidence: >-
  tests/ad/first_class_math_builtins_test.esk (133 checks, every math builtin
  passed, mapped, applied and differentiated through a value; atan2 passed,
  stored, returned, mapped, applied; atan and round with two arguments; the
  arity error) passes on JIT and AOT; value_position_axis_sweep passes with
  its baseline untouched.
caught_by: [value_position_axis_sweep, vm-taylor-lane-mirror]
missed_by: [builtins_first_class_audit]
