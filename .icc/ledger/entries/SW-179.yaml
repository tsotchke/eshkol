id: SW-179
bucket: SILENT-WRONG
family: native/vector-set-numeric-store
status: fixed
closed_at: "0da5a050"
title: "native: vector-set! of an exact integer into a `#(...)` literal stores the integer's bit pattern as a double, and reading the slot back with vector-ref crashes"
repro: >-
  (1) (define v #(10 20 30))
      (vector-set! v 0 99)
      (display v)
  (2) (define z #(1.5 2.5))
      (vector-set! z 1 7)
      (display (vector-ref z 1))
observed: >-
  (1) prints `#(4.9e-322 20 30)` under `eshkol-run -r` and from an AOT binary,
  exit 0, no diagnostic. 4.9e-322 is the 64-bit integer 99 read as an IEEE
  double. (2) prints nothing and dies with "fatal signal: SIGSEGV
  (segmentation fault) at address 0xffffffffffffffff" on both native engines.
  Storing an inexact value is correct: `(vector-set! w 0 99.0)` prints
  `#(99 20 30)`. A vector built with `(vector 10 20 30)` is correct for both.
  The bytecode VM prints `#(99 20 30)` for (1).
correct: >-
  `#(99 20 30)` and `7`. docs/tutorials/11_TENSORS_AND_LINEAR_ALGEBRA.md,
  "Element Access and Mutation", documents exactly program (1) with the result
  `#(99 20 30 40 50)`, and R7RS vector-set! stores the object it is given.
evidence: >-
  Measured on a Release build of the v1.3.5 release-cut branch (base 8bc74d7d),
  arm64 macOS, JIT and AOT, by scripts/doc_audit/check_doc_examples.py: the
  tutorial example fails with MISMATCH expected '#(99 20 30 40 50)' got
  '#(4.9e-322 20 30 40 50)' on both engines.
root_cause: >-
  A numeric `#(...)` literal is a tensor (f64 slots in a separate element
  buffer). CollectionCodegen::vectorSet dispatched on the heap subtype but
  stored `unpackDouble(value)`, which bit-casts the tagged payload: an exact
  integer, a string pointer or a boolean was written as if it were a double.
  vectorRef then decoded a small integer payload as a differentiation-node
  pointer, which is the crash in program (2). The defect was one instance of
  a missing facility: every mutator carried its own copy of the store.
  vector-fill! had no tensor path and read the tensor descriptor as a length
  (SIGSEGV even for a double); tensor-set! converted numbers but stored 0 for
  a non-number and, taking its operand in coercing mode, updated a throwaway
  copy of a Scheme vector; vector-copy!'s conversion did not know exact
  rationals or bignums; the VM's vector-set! tensor path stored 0 for an exact
  rational and every VM tensor writer stored 0 for a non-number.
fix: >-
  ADR-0020, one store boundary. Invariant: a value stored into a container
  slot is a value of the slot's declared representation. encode_tensor_slot()
  in lib/core/runtime_vector_mutation.cpp is the only code that writes a
  Scheme value into a tensor slot: a real number of any exactness becomes the
  dtype-reduced f64, a differentiation node keeps its in-tensor carrier, and
  any other value is refused with a catchable error before the destination is
  modified. vector-set!, vector-fill!, vector-copy! and tensor-set! lower
  through three CodegenContext emitters and one failure block; tensor-set!
  takes its operand in RequireTensor mode; the VM's writers share
  vm_tensor_slot_value(). The literal stays a tensor, as the language
  specification defines it.
evidence: >-
  tests/core/container_slot_store_test.esk stores every value kind through
  every mutator on both representations: 90 checks, 0 failures on the cached
  run path, the in-process JIT and AOT (ctest container_slot_store_
  {runtime,jit,aot}_smoke); the base build crashes in it.
  tests/vm/tensor_slot_store_test.esk: 23 checks on the VM (14 fail on the
  base build). tests/vm_parity/corpus/85_container_slot_store.esk agrees
  across native and VM. The tutorial example runs unmarked in
  scripts/doc_audit/check_doc_examples.py.
caught_by: [doc-example-gate]
missed_by: [run_all_tests, vm_parity, doc_audit]
notes: >-
  Found by executing the tutorials. Storing a value with no real-number
  representation into a tensor-backed literal is a catchable error natively;
  the VM materialises `#(...)` as a Scheme vector and accepts it. That is the
  literal-representation difference already recorded in
  tests/vm_parity/found/tensor_predicate_on_literal.esk, and it is loud.
