notes: >-
  Found while establishing a cross-engine baseline for SW-46, and it was the
  reason no such baseline existed: op:CURL could not be measured on native
  at all. Two lessons worth keeping.

  First, the vm-parity differential was structurally unable to report any of
  this. A `gap` row EXCLUDES an op from comparison, so the row that recorded
  "we cannot compare these" was also the thing preventing the comparison
  that would have found defects (3) and (4). Defect (4) in particular is a
  silent wrong answer that sat under an operator whose row said it was
  exact.

  Second, this entry booked the crash and the arity split as "two separable
  defects" and that framing was right but incomplete: both are the same
  function reading a shape it was never taught, and once the operator was
  actually exercised over its documented domain rather than its 3-D
  vector-returning interior, two more of exactly that kind fell out. The
  generalization worth carrying is that a two-way dispatch on a THREE-valued
  space (vector / tensor / cons) is the recurring defect shape in this file —
  ESH-0360/#343 on the point side, this entry on the output side — and the
  remaining unaudited copies of the pattern should be read as latent rather
  than absent.
