id: SW-237
bucket: SILENT-WRONG
subtag: numeric
family: apply/arithmetic-reduction
status: fixed
closed_at: "dd2ed8f3e"
title: "(apply - '(5)) answered 5 and (apply / '(2)) answered 2; (apply - '()) answered 0"
repro: >-
  (apply - (list 5)); (apply / (list 2)); (apply - '())
observed: >-
  5, 2 and 0.
correct: >-
  -5, 1/2 and an error: R7RS 6.2.6, one argument to - or / is its inverse and
  - and / need at least one argument.
root_cause: >-
  CallApplyCodegen::applyReduction folded from the first element for - and /
  and gave them identities 0 and 1.
fix: >-
  A single element is inverted (0 - x, 1 / x); only + and * have identities; -
  and / of an empty list raise. The first-class + - * / values are variadic
  closures over the same reduction.
evidence: >-
  tests/core/first_class_builtin_arity_test.esk on JIT, AOT, VM and VM ESKB.
caught_by: [release-dry-run]
missed_by: [vm_parity]
