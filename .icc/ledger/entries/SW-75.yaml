id: SW-75
bucket: SILENT-WRONG
status: closed
closed_at: feat/vm-geometry-complete
closed_by: branch feat/vm-geometry-complete
title: "the VM's three curvature-adaptation builtins reported numbers that were not derivatives of anything:\
  \ curvature-gradient returned the SUM of its argument's elements, curvature-hessian the constant 0.0,\
  \ and adaptive-curvature-step moved K by a fixed 0.01 times that sum \u2014 and spherical-project returned\
  \ the zero vector, which is not a point of the sphere"
mechanism: "lib/backend/vm_geometric.c, ids 852, 855 and 856. Their names and their documented types say\
  \ derivative: curvature-gradient and curvature-hessian both return a float, adaptive-curvature-step\
  \ mutates the manifold's curvature. What they computed:\n\n  curvature-gradient (852)\n      sum of\
  \ the second argument's elements. A reduction, not a\n      derivative of any objective with respect\
  \ to K. It has the type and\n      the magnitude a gradient would have and nothing in the returned\n\
  \      float distinguishes it from one.\n  curvature-hessian (855)\n      0.0, for every manifold and\
  \ every second argument, which was popped\n      and discarded. A second derivative that is identically\
  \ zero is the\n      assertion that the objective is AFFINE IN K \u2014 a statement about an\n     \
  \ objective, made without examining one, and false for the geodesic\n      distance at every curvature.\n\
  \  adaptive-curvature-step (856)\n      K <- K - 0.01 * sum(grad). A fixed rate applied to a quantity\
  \ that\n      was not a gradient, under a name that says the step adapts.\n\nThis is the same class\
  \ SW-73 records for the surrounding geometry, in its second form. SW-73's ops accepted a curvature argument\
  \ and DISCARDED it; these accept a tensor and REDUCE it, and in both cases the output is a plausible\
  \ number that carries no trace of what was thrown away. SW-73's own PR body listed all three as \"not\
  \ measurements either\" and left them out of that defect's class on the grounds that they do not drop\
  \ a curvature argument. They are the same defect measured on the other axis, and this entry records\
  \ them as such.\nIndependently, spherical-project (823) returned an L2-normalised copy of its argument\
  \ and left a ZERO-NORM input unchanged. The zero vector is not a point of the unit sphere, so the op\
  \ returned a value outside its own codomain \u2014 for the one input where no answer exists \u2014 with\
  \ no diagnostic and exit 0.\nTwo further names, exterior-derivative (835) and hodge-star (836), were\
  \ the STRAIGHTFORWARD form of this defect before SW-73 (zeros of the input's shape, and the argument\
  \ unchanged: \"every form is closed\" and \"the star is trivial\", both asserted without examining the\
  \ argument). SW-73 replaced them with a refusal, which was honest, so they are not re-opened here. They\
  \ are closed as implementations by the same branch and are listed under fixed_by."
repro: "tests/vm/geometric_riemannian_surface_regression.esk, run by scripts/run_vm_surface_tests.sh (the\
  \ *_surface_regression glob picks it up automatically). The pair is the origin and (0.5, 0.0) on the\
  \ Poincare ball of sectional curvature K = -1, packed as the 4-element batch [0 0 | 0.5 0]:\n\n  (define\
  \ hm (make-hyperbolic-manifold 2 -1.0))\n  (define one-pair (fill! (make-tensor '(4) 0.0) '(0.0 0.0\
  \ 0.5 0.0)))\n  (curvature-gradient hm one-pair)\n  (curvature-hessian  hm one-pair)\n  (adaptive-curvature-step\
  \ hm one-pair)\n  (spherical-project (make-tensor '(3) 0.0))"
observed: "curvature-gradient returned 0.5 \u2014 the sum of the batch's elements, which is a property\
  \ of the coordinates and not of the geometry: it is unchanged by the manifold's curvature, and changes\
  \ if the same two points are written in a different order.\ncurvature-hessian returned 0.0.\nadaptive-curvature-step\
  \ moved K from -1.0 to -1.005, i.e. by 0.01 * 0.5, in a direction and by an amount that no objective\
  \ chose.\nspherical-project on the zero vector returned the zero vector."
correct: "The exact derivatives of a NAMED objective with respect to the sectional curvature: L(K) = sum_p\
  \ d_K(x_p, y_p), the total geodesic distance over the supplied point pairs. For the repro's single pair\
  \ on the ball, d(c) = 2 artanh(sqrt(c) t)/sqrt(c) with t = 1/2 and c = -K, so\n\n  L'(-1)  = -(2/3 -\
  \ artanh(1/2)) = -0.1173605223326118\n  L''(-1) =  0.0461814387233047\n\nBoth are closed forms, not\
  \ difference quotients. The adaptive step is a backtracked damped Newton step on the same L: the full\
  \ Newton step here lands at K = +1.5412920337059086, which would change WHICH GEOMETRY the manifold\
  \ is rather than how curved it is, so it is rejected along with the half step, and t = 1/4 gives K =\
  \ -0.36467699157352285 with the objective falling from 1.0986122886681098 to 1.032168667276747.\nspherical-project\
  \ must refuse the origin: every point of the sphere is equidistant from it, so no projection is determined."
observed_after: "curvature-gradient  -> -0.1173605223326118 curvature-hessian   ->  0.0461814387233047\
  \ adaptive-curvature-step -> K = -0.36467699157352285, objective 1.032... spherical-project on the origin\
  \ -> a catchable condition naming the op.\nK = 0 now raises for all three derivative ops, with its reason:\
  \ the Poincare ball's conformal factor is lambda_x = 2/(1 - c|x|^2), so the ball branch tends to 2|x-y|\
  \ as K -> 0- while eshkol_rm_distance's flat branch returns |x-y|, and the spherical branch diverges\
  \ as K -> 0+. The metric family is genuinely discontinuous at K = 0, so no number is the derivative\
  \ there \u2014 and this is exactly the case where returning one would be a new instance of this defect."
fixed_by: "branch feat/vm-geometry-complete.\ninc/eshkol/backend/riemannian_core.h gains eshkol_rm_distance_dK:\
  \ the geodesic distance and its first two exact derivatives in K, on the ball (the chain rule on d =\
  \ arccosh(1 + 2D c/((1-ca)(1-cb)))/sqrt(c)) and on the sphere (theta K^-1/2 at fixed angular position,\
  \ since a point of the sphere of radius 1/sqrt(K) is not a point of a sphere of another radius). Coincident\
  \ points are exact, not a limit: D = 0 makes d identically zero in c, so both derivatives are exactly\
  \ 0.\nlib/backend/vm_geometric.c reads its second argument as a batch of point pairs of the manifold's\
  \ dimension, refuses a length that is not a whole number of pairs with () rather than dropping a partial\
  \ pair, and raises on every domain failure. spherical-project routes through eshkol_rm_project, which\
  \ already refused the origin for the other spherical ops.\nIn the same branch, inc/eshkol/backend/differential_form_core.h\
  \ implements exterior-derivative (835) and hodge-star (836) \u2014 SW-73 left both raising \"not implemented\
  \ on the VM engine\" as build items. A form is now [k, n, r, coefficient jets...]: d is a first-order\
  \ operator, so the 1-jet of the coefficients is exactly the input that determines it, and the degree\
  \ the star needs is carried rather than guessed (C(n,k) = C(n,n-k) makes it unrecoverable from a flat\
  \ array). d is exact, consumes one jet order, and d(d(w)) is BIT-EQUAL zero because the mixed partials\
  \ that cancel are the same stored double.\nThe ESHKOL_GEOMETRIC_ENABLED body and its ESHKOL_GEOMETRIC_QLLM\
  \ CMake option are deleted in the same branch: 19 compile errors against the current libsemiclassical_qllm\
  \ ABI, fp32 throughout, and manifold-dim returning 0 unconditionally (the branch SW-72 patched). An\
  \ unreachable body that does not compile is not a second implementation held in reserve. lib/bridge/qllm_bridge.cpp,\
  \ the live differentiable integration, is untouched."
evidence: "tests/vm/geometric_riemannian_surface_regression.esk \u2014 the file SW-73 created, extended\
  \ from 42 to 98 assertions. The new ones pin every value above against its closed form and, where the\
  \ old body produced a specific number, assert `far?` from that number as well: curvature-gradient is\
  \ checked to be far from 0.5, curvature-hessian far from 0.0, adaptive-curvature-step far from -1.005,\
  \ the Hodge star far from the identity map on the n = 4 k = 1 case where ** = -1. d(d(f)) is checked\
  \ with `=`, not a tolerance. Run by scripts/run_vm_surface_tests.sh.\ninc/eshkol/backend/differential_form_core.h\
  \ and inc/eshkol/backend/riemannian_core.h are additionally checked as C, out of the VM, against hand-derived\
  \ analytic values and against central differences of eshkol_rm_distance \u2014 the two agree to 1e-9\
  \ on the first derivative and 1e-4 on the second, which is the accuracy the difference quotient has,\
  \ not the accuracy the closed form has."
