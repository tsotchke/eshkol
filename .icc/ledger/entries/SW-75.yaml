notes: "SW-73's PR body listed items 1, 2, 5 and 6 of its \"build items (not fixed here)\" section: exterior-derivative,\
  \ hodge-star, spherical-project's zero vector, and the three curvature heuristics. All four are closed\
  \ here. Item 3, the stale ESHKOL_GEOMETRIC_ENABLED body, is deleted here. Item 4, ad_poincare_log_map's\
  \ clamp in lib/bridge/qllm_bridge.cpp, is NOT touched: it is on the AD surface and belongs to that lane.\
  \ Item 7, tests/vm_parity/corpus/42_iota_srfi1.esk, is a native `iota` defect on master and is untouched.\n\
  Nothing here changes the VM parity manifest. All 62 geometric names are on the VM surface only \u2014\
  \ absent from lib/backend/llvm_codegen.cpp and from lib/backend/eshkol_compiler.c's native builtin table,\
  \ and recorded \"backends\": [\"vm\"] in tests/coverage/language_surface.json \u2014 so tests/vm_parity/PARITY.tsv,\
  \ whose contract is \"every symbol on the NATIVE codegen surface must be present on the VM surface or\
  \ carry a row here\", governs none of them and needs no row. The gate that had to catch this is the\
  \ self-checking one: a probe asserting against mathematics inside a single run, which is what run_vm_surface_tests.sh's\
  \ own header calls out and what the extended regression is.\nNo builtin names, ids or arities changed,\
  \ so tests/coverage/language_surface.json's builtins_total stays 1042. What changed is what two of the\
  \ arguments MEAN \u2014 exterior-derivative and hodge-star take a form value rather than a flat coefficient\
  \ array, and the three curvature ops take a batch of point pairs rather than a gradient tensor \u2014\
  \ and both are stated in docs/reference/stdlib/geometry.md, which is the contract this branch was written\
  \ against."
