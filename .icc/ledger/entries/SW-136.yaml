closed_at: "171928a019a41f5668b9cab9de439936c32a7f6e"
title: "Reverse-mode gradient over a vector containing exact rationals reinterpreted tagged values as doubles"
repro: >-
  `.scratch/jac2.esk`: `(detJ (vector 1 -3/2 13/2))`, where `detJ`
  computes three named-function gradients and their determinant. The
  affected path read an exact rational vector element's HEAP_PTR payload
  as an f64 seed.
observed: "-8.57076e+44 instead of -2, exit 0, with no diagnostic"
correct: "The exact vector point is differentiated by value and det(J) is -2, matching the corresponding double vector"
root_cause: >-
  Exact rationals are HEAP_PTR-tagged objects while the jet and tape
  carriers store raw doubles. The old vector seed path classified or
  unpacked elements by assumed representation, so a rational pointer was
  treated as numeric bits. This was a representation-boundary error, not a
  Keller-map formula error.
fix: >-
  The existing tag-aware AD boundary asks `eshkol_ad_point_to_double` to
  convert each exact element by its runtime tag, and the scalar/collection
  predicates use the same runtime authority. This is the already-landed
  exact-input architecture; the separate exact-coefficient branch was not
  duplicated. The Keller-map fixture adds the missing vector regression.
evidence: >-
  `tests/ad/jacobian_counterexample_test.esk` compares named and
  closure-factory determinants for `(vector 1 -3/2 13/2)` and
  `(vector 1.0 -1.5 6.5)`. Required Linux JIT, AOT, VM source, and VM ESKB
  runs all completed with exit 0 and determinant -2; the original
  `.scratch/jac2.esk` also printed `exact: det Jac at (1,-3/2,13/2) = -2`.
caught_by: [direct-measurement, ad-jacobian-counterexample-regression]
missed_by: [pre-existing-exact-point-regression]
notes: >-
  Vector points intentionally remain on the inexact jet/tape carrier; the
  correctness contract is value equality with the corresponding inexact
  coordinates. Exact scalar points use the exact Taylor tier where the
  carrier can preserve exact coefficients.
