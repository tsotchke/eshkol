title: "square, exact->inexact/inexact and magnitude of a real carrier dropped the derivative; square of a rational or complex printed pointer bits"
repro: >-
  (derivative (lambda (x) (square x)) 1.3); (derivative-n (lambda (x)
  (square x)) 1.3 2); (derivative (lambda (x) (inexact x)) 1.3);
  (derivative magnitude -1.3); (square 1/2); (square (make-rectangular 1.0 2.0))
observed: >-
  0, 0, 0, 0, 4657922831851813440 and 2379617646309622784 on native JIT.
correct: >-
  2.6, 2, 1, -1, 1/4 and -3+4i.
root_cause: >-
  square multiplied the payload bits inline on a flonum or fixnum arm, so a
  jet, a tower, a rational and a complex were multiplied as pointers.
  exact->inexact read any non-flonum as a double. ArithmeticCodegen::abs,
  which magnitude uses for a real carrier, had no jet or tower arm.
fix: >-
  square is the polymorphic product arith->mul(x, x) below its tape
  dispatch; inexact of a carrier or a complex is its product with an inexact
  1, so each carrier applies its own contagion; ArithmeticCodegen::abs sends a
  jet or a tower to the kernel's abs rule, and the kernel's unary entry takes a
  lone jet through its 8-jet algebra.
evidence: >-
  tests/ad/unary_numeric_builtin_carriers_test.esk: 24 checks (jet, tower,
  level, nested jets, gradient, exact tower, rational, bignum and complex
  operands). ctest unary_numeric_builtin_carriers_jit and _aot pass; the
  pre-fix binary fails 22 of 24.
