notes: 'Filed while building the ESH-0101 guard coverage gate. Claim (2) is the instructive one: it is
  a limitation notice that reality OVERTOOK, and nothing in the assurance stack notices when a documented
  gap quietly closes - only when a documented capability breaks. The VM half of the same claim is genuinely
  open and stays open, tracked at tests/vm_parity/found/error_object_irritants_empty.esk and waived per-axis
  in tests/error_handling/guard_coverage/ENGINES.tsv rather than deleted. Separately: scripts/gen_language_surface.py
  categorises "raise-continuable" as control_flow even though no extraction source contains it, so the
  name is carried in the generator''s category map while never appearing in the emitted surface - harmless
  today, but the shape of a vacuous surface entry if an extraction source ever picks the name up from
  a blacklist. Originally numbered SW-80 on the guard-coverage branch; renamed on integration to preserve
  the existing unrelated ledger identity.'
