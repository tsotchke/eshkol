notes: >-
  Filed LOUD-ERROR by the SW-63 and LE-25 precedent: a type-checker verdict on
  stderr, never a wrong value. Found while closing LE-25, which recorded it as
  an open finding. Findings recorded, not fixed here:
  (1) synthesizeIfTask() prefers the concrete branch when the other is Value
  and returns the then-branch type when the join fails, which claims more than
  the branches show; the new multi-branch rules use the plain join, so `if`
  and an equivalent cond can differ in result type.
  (2) A function signature type is not a node in the supertype graph, so
  isSubtype(signature, Function) is false and such a type prints as "unknown";
  only the ascription rule is corrected here.
  (3) A define's return-annotation check reports a body of type Value against
  the annotation (gradient_callable_arity_test.esk:67), where gradual typing
  would accept it.
