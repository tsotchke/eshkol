title: "type checker: the subexpressions of cond, case, match, when, unless, do, guard, and/or, set!, quasiquote, dynamic-wind, call/cc, values, call-with-values, let-values, raise, with-region and every non-final begin expression were never synthesized, so a wrong argument there was silent although the same call warned at top level"
repro: >-
  `(define (area (w : number) (h : number)) (* w h))` then
  `(define (f flag) (cond (flag (area "wide" 3)) (else 0)))`, compiled with
  `eshkol-run --emit-object`. At top level `(area "wide" 3)` reports
  "argument 1 of 'area': expected Number, got String"; inside the cond clause
  it reported nothing. The same holds for a clause test, a case key, a match
  scrutinee or pattern predicate, a when/unless test or body, a do init, test,
  body, step or result, a guard body or handler, an and/or operand, a set!
  value, a quasiquote escape, the before/thunk/after of dynamic-wind (and so a
  parameterize body), a call/cc procedure, a values operand, a
  call-with-values producer or consumer, a let-values producer or body, a
  raise operand, a with-region body, a computed callee, a tensor element, a
  calculus operator's point, and every expression but the last of a begin or
  a multi-expression body.
observed_before: >-
  43 probe programs, one call per position, compiled against the unmodified
  base (5e190db8): 30 printed no warning. The warning appeared only for top
  level and for positions inside if, let, let*, lambda, case-lambda, delay,
  the, with-exception-handler and a vector call. Named-let widening (LE-25)
  never saw a recursive call sitting in a cond clause, so it neither widened
  nor checked it.
correct: >-
  Every evaluated subexpression is checked in the scope it runs in, and a
  wrong argument reports the same message wherever it sits.
root_cause: >-
  TypeChecker::synthesizeOperationTask() in lib/types/type_checker.cpp
  returned a fixed builtin type for these forms without synthesizing any
  operand (Value for the control, continuation, multiple-values, quoting and
  region forms; Boolean for and/or; Null for set!), and the sequence rule
  synthesized only the last expression. A computed callee other than an
  inline lambda was never synthesized either.
fix: >-
  Every form whose subexpressions are evaluated synthesizes them with the
  typing rule of the form. Clause tests are expressions; each branch body runs
  in its own scope, so backward inference inside one branch cannot narrow an
  enclosing function's parameter, and cond/when/and bodies see their test's
  predicate refinements; linear-usage counters take the maximum over exclusive
  branches. A multi-branch form's result is the join of its branch types plus
  the value it yields when no branch runs (Boolean for cond, case, when and
  unless; nothing for match, which raises, and guard, which re-raises). A
  failing branch contributes Value instead of failing the form. Match pattern
  variables are the scrutinee's type at top level, the proven type under a
  narrowing predicate, and Value inside cons/list/or patterns; a guard
  condition variable is Value; let-values variables are Value. A do loop
  variable is the fixpoint join of its init and step, checked speculatively
  with the LE-25 rollback; unlike a named let it adopts a Value join, because
  a step is not itself an argument check. and yields the join of Boolean with
  its last operand, or the join of all operands. dynamic-wind and
  call-with-values yield their thunk's or consumer's codomain; with-region and
  borrow yield their body's type.
  Descending exposed four checker imprecisions, fixed at the rule:
  (1) a calculus operator given an evaluation point was typed Function, so
  (approx= (derivative f 2.0) 12.0 1e-6) warned "expected Number, got ->";
  it is now Value with a point and Function without;
  (2) cdr of an argument not known to be a pair or list was typed List, so a
  parser's (value . next-index) tail warned "expected Number, got List" in
  lib/core/memory_store.esk:200 and :207; it is now Value;
  (3) ascriptionIsBelievable() judged a function signature and the procedure
  or Closure type disjoint, so ((the procedure f) 7) warned; callable types
  are now mutually believable;
  (4) LE-25's named-let widening refused every join that reaches Value, so a
  `#f` "nothing yet" accumulator fed a number, (let loop-j ((best #f)) ...
  (loop-j (+ j 1) a i j)), warned "expected Boolean, got Number" in 19
  examples/mathematics programs and one tests/math_acceptance program; a
  Boolean slot now adopts the Value join, while Int64 or Pair fed a String is
  still reported.
observed_after: >-
  All 43 probes print exactly the top-level message. Standard-library compile
  (`eshkol-run --shared-lib -c lib/stdlib.esk`): 0 [WARN] before, 0 after.
  run_typesystem_tests.sh: 62/62 on the base tree; the base compiler on the
  new tree fails 27/114 (the 26 new reject fixtures, and
  control_branch_join_ok_test.esk, whose `(label (or "a" "b"))` the base typed
  Boolean); the fixed compiler passes 114/114.
