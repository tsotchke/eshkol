notes: 'The old riemannian_adam_state_regression.esk had no assertion that could have caught any of the
  three: it checked one component of one step against a number computed from the same coordinate-wise
  formula, and the curved case only that the result differed from the ambient sum and stayed in the ball.
  Both of those pass for a construction that is not intrinsic.

  840 refusing is a deliberate REMOVAL of a documented behaviour, recorded here so it is not mistaken
  for an oversight. The alternative was to keep shipping an optimizer whose two callers silently interfere.'
