id: SW-139
bucket: PARITY-RATCHET
status: closed
closed_at: "worktree-rb-567"
title: "The documented exit procedure had no VM binding"
repro: >-
  A portable VM source containing `(display "before") (exit 1)
  (display "after")` exercises the documented termination form.
observed: >-
  Native LLVM lowers `(exit code)` to a noreturn libc call, but the VM had
  no `exit` name in `BUILTINS[]`. The VM compiler warned that `exit` was
  undefined, so a VM program that reached an error branch using `exit`
  failed as "calling non-function" instead of terminating with the
  requested status. The rebased terminal status fixture also uses
  `agent.terminal` FFI, which is documented as native-only and is not a VM
  reproducer for the binding gap.
correct: >-
  The VM resolves `exit` as a first-class one-argument procedure and
  terminates with the same documented status behavior as native: inexact
  codes clamp to [0, 255], exact codes truncate to i32, and registered VM
  `at-exit` handlers drain before termination.
observed_after: >-
  The VM `BUILTINS[]` table binds `exit` to native id 2097 and the VM
  dispatcher performs the parity-preserving termination. The terminal
  status fixture no longer reports an undefined `exit` or calling error on
  the native agent-FFI path; the standalone VM direct exit probe terminates
  with the requested status and does not execute later forms.
fixed_by: >-
  `lib/backend/eshkol_vm.c` builtin binding and `lib/backend/vm_native.c`
  dispatch case 2097; `tests/vm_parity/PARITY.tsv` now marks the construct
  `vm-supported`.
evidence: >-
  Remote old-donkey terminal, process, and FFI suite runs on native and VM;
  the explicit VM exit-status probe verifies status 7 and no output after
  the call.
caught_by: [direct-measurement, vm-parity-surface-audit]
missed_by: [icc-readiness, prior-terminal-surface-test]
