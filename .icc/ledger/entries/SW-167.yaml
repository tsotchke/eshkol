id: SW-167
bucket: SILENT-WRONG
status: closed
closed_at: "fix/exact-sqrt-and-tensor-of-rationals"
title: "sqrt of a perfect square and expt with an exact rational exponent lost exactness"
repro: >-
  `.scratch/math-stream-repros/q03c_sqrt2.esk` (`(sqrt 16)`, `(exact? (sqrt
  16))`) and `q15_tensor.esk` (`(expt 4 1/2)`, `(exact? (expt 4 1/2))`), on
  native -r/-o and the bytecode VM.
observed: >-
  `(sqrt 16)` returned the inexact `4.0` (`(exact? (sqrt 16))` => `#f`);
  `(sqrt 1/4)` returned the inexact `0.5`; `(expt 4 1/2)` returned the
  inexact `2.0`. Root cause: neither `sqrt`'s codegen
  (`lib/backend/llvm_codegen.cpp`) nor `expt`'s
  (`lib/backend/arithmetic_codegen.cpp`, `ArithmeticCodegen::pow`) ever
  attempted an exact root for an exact operand. `sqrt` always called libm
  `sqrt()` on the extracted double once the pre-existing negative-exact-
  promotes-to-complex case was ruled out; `expt`'s only exact path was an
  exact INTEGER exponent (`eshkol_bignum_pow_tagged` /
  `eshkol_rational_pow_tagged`, SW-152) — a fractional exact rational
  exponent fell straight through to double `pow()`. The VM's native call
  id 25 (sqrt) and id 32 (expt/pow) in `lib/backend/vm_native.c` had the
  identical gap. Fixing this exposed a SECOND, more severe pre-existing
  defect directly adjacent: the VM's sqrt/log fallback for a non-promoted
  operand called the heap-blind `as_number()` rather than the heap-aware
  `as_number_vm()`, so `(sqrt 1/2)` (no exact root exists) read
  `as_number()`'s silent `0.0` default and returned `sqrt(0.0) = 0`
  instead of `0.7071067811865476` — caught by this fix's own VM test lane,
  not by the original ticket.
correct: >-
  R7RS 6.2.6: `sqrt` of an exact number whose square root is exact must
  return the exact result (extended to rationals: exact when numerator and
  denominator are both perfect squares), inexact otherwise; `expt` with an
  exact rational exponent returns exact when the exact root exists (e.g.
  `(expt 4 1/2)` = `2`, `(expt 8 2/3)` = `4`, `(expt 1/27 1/3)` = `1/3`),
  inexact otherwise. A negative exact base is NOT promoted to an exact
  result: sqrt/log already promote a negative exact real to a (necessarily
  inexact — `docs/breakdown/EXACT_ARITHMETIC.md` sec 1, complex is "always
  inexact") complex value, unchanged by this fix; `expt` keeps ordinary
  IEEE `pow()` semantics for a negative base with a fractional exponent,
  since Eshkol's `expt` has never promoted to complex the way sqrt/log do
  and R7RS does not require it to.
observed_after: >-
  `(sqrt 16)` = `4`, exact; `(sqrt 1/4)` = `1/2`, exact; `(expt 4 1/2)` =
  `2`, exact — on native -r/-o and the VM, byte-identical (verified via
  tests/vm_parity/corpus/80_exact_sqrt_and_expt.esk). `(sqrt 15)`,
  `(sqrt 1/2)`, `(expt 2 1/2)`, `(expt 4 1/3)`, `(expt -8 1/3)` all remain
  correctly inexact with the correct numeric value (negative controls).
  `(sqrt (* (expt 10 20) (expt 10 20)))` = `(expt 10 20)`, exact, exercises
  the bignum path. tests/core/exact_roots_test.esk: 47/47 PASS on native
  JIT, AOT, and the VM (all three engines, unlike the SW-152/SW-153
  precedent tests, which carry unrelated VM gaps).
fixed_by: >-
  `lib/core/bignum.cpp` (new `eshkol_bignum_iroot(arena, a, n, *out_exact)`
  — exact/floor n-th integer root via Newton's method, seeded from a
  bit-length estimate, verified by re-raising to the n-th power);
  `lib/core/rational.cpp` (new `eshkol_exact_sqrt_tagged` and
  `eshkol_exact_rational_pow_tagged`, both built on `eshkol_bignum_iroot`,
  taking numerator/denominator roots independently and falling back to the
  caller-supplied double only when the exact root does not exist);
  `lib/backend/llvm_codegen.cpp` (sqrt's real-domain branch) and
  `lib/backend/arithmetic_codegen.cpp` (`ArithmeticCodegen::pow`, new
  `pow_check_rational_exp`/`pow_rational_exp` blocks) call the new native
  entry points. `lib/backend/vm_bignum.c` mirrors `bignum_iroot` at the
  VM's own base-2^32 bignum representation; `lib/backend/vm_native.c` adds
  `vm_exact_sqrt`/`vm_exact_rational_pow` (native ids 25 and 32) and fixes
  the adjacent as_number()-vs-as_number_vm() defect in both sqrt (id 25)
  and log (id 24, same architectural family, same bug shape, fixed
  alongside it).
evidence: >-
  tests/core/exact_roots_test.esk via CTest (exact_roots_jit_smoke,
  exact_roots_aot_smoke, exact_roots_vm_smoke — 47/47 PASS on all three);
  tests/vm_parity/corpus/80_exact_sqrt_and_expt.esk run directly through
  native -r and eshkol-vm-standalone-test with output compared line-for-
  line (13/13 match); .scratch/math-stream-repros/q03c_sqrt2.esk and
  q15_tensor.esk (the task repros) run on native -r, -o, and the VM.
caught_by: [direct-measurement, task-assigned-repro, math-stream-campaign]
missed_by: [icc-readiness, sw-152-fix-scope]
