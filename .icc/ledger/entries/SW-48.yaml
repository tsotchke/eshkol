notes: 'Checked for the same dead-guard SHAPE elsewhere: `!after_*_compute` appears exactly once in the
  tree. conv2d, batch-norm, layer-norm and attention do not carry a dead dense block; they remain scalarizing
  until their own exact VJPs are routed. The dense path now covers the ADR-0002 matmul, reduction and
  elementwise scope. So the count of this specific dead-guard shape is ONE.'
