title: "VM tensor-sum without an axis returns a one-element tensor, or per-row partial results, instead of a number"
repro: >-
  (display (tensor-sum (tensor 0.5 0.25))),
  (display (number? (tensor-sum (tensor 0.5 0.25)))) and
  (display (tensor-sum (reshape (tensor 1.0 2.0 3.0 4.0) 2 2))) on the bytecode
  VM (eshkol-vm-standalone-test) and the browser VM, against the native JIT.
observed: >-
  The VM printed #(0.75), #f and #(3 7); native prints 0.75, #t and 10.
  Arithmetic on the VM result, (+ 1 (tensor-sum (tensor 0.5 0.25))), was a
  fatal runtime error. The prelude passed -1 for "no axis", and -1 also names
  the last axis. (gpu-reduce + M) lowered the same way.
correct: >-
  A full reduction (no axis) returns the scalar on every engine, as native
  does; an explicit axis, negative ones counted from the last, reduces that
  axis.
evidence: >-
  Fixed by the VM Taylor lane in 7c036631d: the prelude passes #f for "no
  axis" and the dispatcher treats a non-number axis as a full reduction.
  gpu-reduce, which lowered with -1 as well, was fixed on master in 72a41917f
  and arrives here with the master sync. Gate:
  tests/tensor/tensor_full_reduction_test.esk on the native JIT, the bytecode
  VM and the browser VM bundle (ctest tensor_full_reduction_{jit,vm,browser_vm}).
