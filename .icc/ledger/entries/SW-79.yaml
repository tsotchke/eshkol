notes: 'Recorded as a SILENT-WRONG rather than a design note because a caller annealing curvature toward
  zero -- which is what the three curvature-adaptation ops exist to do -- crosses the discontinuity and
  gets a factor-of-2 jump in the objective with nothing in the output to show it. The waiver is on the
  RULING, not on the symptom: the derivative ops already refuse at K = 0 rather than reporting a number
  there.'
