title: "VM (make-rectangular 1/2 1/3) printed +0i: exact rational parts of a complex were read as 0"
repro: >-
  (display (make-rectangular 1/2 1/3)) on eshkol-vm-standalone-test; also
  (atan 1/2 1), (asin 1/2), (make-polar 2 1/2).
observed_before: >-
  +0i with exit status 0; native prints 0.5+0.3333333333333333i. Every real
  function sharing the real/complex boundary saw 0 for a rational argument.
observed_after: >-
  0.5+0.3333333333333333i, and the rational arguments read correctly, on the
  VM, the browser VM and native.
root_cause: >-
  lib/backend/vm_native.c vm_real_with_tangent read a non-dual part with
  as_number(), which knows only the immediate tags, instead of the heap-aware
  as_number_vm().
fixed_by: "vm_real_with_tangent uses as_number_vm; carriers pass the boundary whole (ADR-0027)"
evidence: >-
  tests/complex/complex_exact_parts_test.esk (ctest complex_exact_parts_vm,
  complex_exact_parts_browser_vm, complex_exact_parts_jit).
