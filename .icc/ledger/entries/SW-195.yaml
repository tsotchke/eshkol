id: SW-195
bucket: SILENT-WRONG
family: conditions/error-irritants
status: fixed
closed_at: "a4279eb76"
needs_decision: false
title: "VM error objects drop their irritant list"
repro: >-
  (display (guard (e (#t (error-object-irritants e))) (error "boom" 1 2)))
observed: >-
  The public browser VM prints () without diagnostics instead of (1 2).
correct: >-
  Preserve and return the supplied Scheme values in order, including after
  region escape, first-class error calls, and re-raising.
evidence: >-
  Published-site browser audit on 2026-09-20; uninstrumented direct probe
  confirmed the loss. Local source VM and new ESKB regressions pass after
  storing a typed Value-compatible head and tracing/cloning its graph.
  Private native 2231 carries the packed list; legacy native 237 retains its
  original single-argument ABI. An older ESKB fixture retains its original
  message/stack behavior, rather than consuming unrelated stack values.
caught_by: [published-site-browser-oracle-audit]
missed_by: [site_smoke, doc_audit]
notes: >-
  Source is not yet committed/integrated or deployed. Lifetime and callback
  tests exposed SW-196, which is separately tracked. No waiver or refusal
  counts as a fix.
fix: >-
  The source VM already stored a typed Value-compatible irritant head
  (9d47e16a4). The browser VM does not compile the builtin preamble: it boots
  from the checked-in bytecode image lib/backend/vm_prelude_cache.h, which
  predated the packed-tail error ABI, so its `error` closure still called the
  legacy single-argument native 237 and every caught error object answered
  (). The image is regenerated from current sources (a4279eb76); the existing
  vm_prelude_cache_is_current gate, which was failing on the base, passes.
remeasured: >-
  At a4279eb76 (fix/v135f-vmrt): a native REPL-session driver over the same
  bootstrap as the browser printed () before regeneration and (1 2) after.
  scripts/build-wasm-repl.sh bundle driven through scripts/lib/wasm_repl_runner.js:
  (guard (e (#t (error-object-irritants e))) (error "boom" 1 2)) -> (1 2);
  error-object-message -> boom. scripts/run_wasm_differential.sh: 176 passed,
  0 failed (transcript rows added for SW-195/196). run_vm_parity.sh: 373
  passed, 0 failed, including error_object_irritants_roundtrip and
  error_irritants_lifetime on native, VM source and ESKB. ctest
  vm_error_irritants_lifetime and vm_parallel_callbacks_repeat50 pass; 50
  consecutive runs of the lifetime programs under an ASan+UBSan VM report no
  finding. The published site bundle (site/static/eshkol-vm.*) is a release
  artifact regenerated at the source freeze.
