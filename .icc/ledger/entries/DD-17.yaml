id: DD-17
bucket: DOC-DEBT
status: open
title: "lib/backend/llvm_codegen.cpp is large enough that its sanitizer compile's memory is a CI-capacity risk: at full DWARF it did not fit a 16 GiB runner at any parallelism"
evidence: >-
  lib/backend/llvm_codegen.cpp is 46,973 lines / 2.53 MB on the v1.3.5 candidate
  (42,912 lines / 2.27 MB on master at 66d37878 -- a 9.5% source growth). It is
  the repo's largest translation unit by a wide margin. Under the
  linux-x64-asan-ubsan lane's flags (Release, so -O3, plus -fsanitize=address
  -fsanitize=undefined and the -g the sanitizer blocks in CMakeLists.txt add),
  its compile's peak memory is not merely large, it is discontinuous in the
  source size: master's version compiles on the hosted runner alongside five
  other concurrent compiles, and the candidate's could not be compiled on
  runner-shaped hardware at all. The lane's Build step died with exit 143 and
  GitHub's "the hosted runner lost communication with the server" annotation at
  ninja edge 449 of 693, with this object still in flight after 13+ minutes and
  never completing, on every run of the candidate.
measured: >-
  Measured on a container pinned to the hosted ubuntu-22.04 runner's shape
  (4 CPUs, 16 GiB memory, 4 GiB swap) and to its toolchain (Ubuntu 22.04,
  gcc 11.4.0, LLVM 21 from apt.llvm.org, CMake 3.31.6), configured from the
  candidate head 0f33675a with the lane's own cmake arguments, compiling this
  one object with nothing else running (`/usr/bin/time -v ninja -j 1 <object>`):
  at -O3 -g, peak RSS 16,691,212 kB = 15.92 GiB, 11m30s wall, FAILED -- the
  cgroup OOM killer terminated the assembler (`c++: fatal error: Killed signal
  terminated program as`, and the cgroup's memory.events recorded oom_kill 1).
  At -O3 -g1, peak RSS 4,117,200 kB = 3.93 GiB, 5m24s wall, succeeded. The
  second-largest backend translation unit, autodiff_codegen.cpp (15,316 lines),
  peaks at 1,974,216 kB = 1.88 GiB at -g. So full DWARF on this one file
  accounted for a 4.1x multiple on peak memory and a 2.1x multiple on wall time,
  and was the entire difference between "builds" and "cannot be built here".
resolution: >-
  Mitigated, not resolved. The v1.3.5 CI change lowers the sanitizer builds'
  debug level from -g to -g1 in the ASan and UBSan blocks of CMakeLists.txt --
  which keeps everything a sanitizer report actually reads (symbol names, which
  is what .icc/lsan-suppressions.txt's `leak:<function>` rules match on, and
  line tables for file:line) and drops the local-variable and type DWARF that no
  sanitizer stack trace consults -- and bounds the lane's build parallelism to 2
  via a new `build_jobs` matrix field, because `--parallel` with no count lets
  Ninja pick cores + 2 (6 on a 4-core runner) and six sanitizer compiles do not
  fit 16 GiB either.
  That buys back a 4x margin, and it does not change the fact that a single
  translation unit in this repo can consume most of a CI runner. The margin will
  be spent again: the file grew 9.5% between master and this candidate and the
  memory cost did not grow 9.5%. Closes when llvm_codegen.cpp is split into
  translation units whose individual sanitizer compiles are bounded and
  measured, with the peak-RSS figures above re-measured at a named SHA and the
  -g1 mitigation reconsidered on the result. Until then, treat a rise in this
  file's size as a CI-capacity change and re-measure.
caught_by: [direct-measurement, ci-lane-repair-20260911]
notes: >-
  Filed separately from DD-16 because they share only a symptom. DD-16 is a
  per-test-program cost in the test harness that scales with the stdlib object;
  this is a single compile of a single source file in the build itself, and the
  two have different owners and different fixes. Filed as DOC-DEBT for the same
  reason as DD-16: nothing computes a wrong answer -- the build fails loudly --
  but the mitigation is otherwise indistinguishable from a considered choice,
  and the next person to read `-g1` in the sanitizer block should be able to
  find out that it is load-bearing and why. Worth noting for whoever picks this
  up: the memory is spent in the ASSEMBLER, not the compiler proper (`as` peaked
  around 15.5 GiB while cc1plus peaked around 14.2 GiB on the failing run),
  which is why the debug level rather than the optimisation level is the
  effective lever.
