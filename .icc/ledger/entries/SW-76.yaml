notes: "Found while reviewing PR #516 (SW-73), whose riemannian_core.h header calls the bridge clamp out\
  \ by name as \"ONE DELIBERATE DIVERGENCE FROM THE BRIDGE ... a separate defect on a separate surface\
  \ [left] for\" a later lane. This is that lane.\nTWO ADJACENT FINDINGS, deliberately NOT fixed here,\
  \ both reported rather than folded in:\n(1) lib/backend/autodiff_codegen.cpp emits SCALAR backward blocks\
  \ for node types 33-38 (poincare_exp_block ~:13129, poincare_log_block ~:13159) that apply an approximate\
  \ conformal-factor gradient with a `1e-7` safe_denom clamp \u2014 the same clamp family. They are UNREACHABLE:\
  \ every producer of ids 33/34/35/37 is qllm_bridge.cpp's make_node, which calls ensure_grad() so tensor_gradient\
  \ is always non-NULL, and AutodiffCodegen::propagateGradient branches on exactly that field at :11822\
  \ to eshkol_tensor_backward_dispatch before the type chain is reached; ids 36 and 38 have no producer\
  \ at all. So this is shadow code, not a live silent-wrong \u2014 but it is a second, divergent, approximate\
  \ derivation of rules that lib/bridge/tensor_backward.cpp derives exactly, sitting unguarded on the\
  \ live `(gradient ...)` path and keyed only on an integer compare. A future scalar-mode geometric producer\
  \ would silently inherit it instead of the registry's UNREGISTERED abort. Belongs to the dead-code wire-or-delete\
  \ sweep or the geometry-completion lane.\n(2) The AD bridge ops have no Eshkol-source binding; the VM\
  \ geometric opcodes and the bridge remain distinct surfaces. Their shared riemannian_core.h implementation\
  \ now gives geodesic attention identical Euclidean, hyperbolic, and spherical distance behavior, and\
  \ the bridge test compares its output with that shared VM reference. The VM raises a catchable condition\
  \ via vm_raise_error_msg, while a C++ bridge forward reports eshkol_error and returns NULL; both refuse\
  \ invalid input before recording or scoring it."
