title: "AD geometric bridge answered from the wrong manifold and past its own domain: `c = (curvature\
  \ == 0.0) ? 1.0 : fabs(curvature)` sent K = 0 (Euclidean) and K > 0 (sphere) to the hyperbolic ball,\
  \ ad_poincare_log_map clamped artanh's argument to 1-1e-12, ad_poincare_exp_map never checked its base\
  \ point, and ad_geodesic_attention scored an off-manifold head-slice as HUGE_VAL and dropped it from\
  \ the softmax \u2014 every one returned a finite, plausible answer with exit 0, and the reverse sweep\
  \ then differentiated it"
repro: "Three entry points in lib/bridge/qllm_bridge.cpp, all reachable from tests/bridge/qllm_bridge_geometric_gradcheck_test.cpp:\n\
  (1) ad_poincare_log_map. The forward computed t = sqrt(c)|(-x) (+)_c y| and then executed, verbatim,\
  \ `if (t >= 1.0) t = 1.0 - 1e-12;` before calling atanh. artanh has no finite value at t = 1: log_x(y)\
  \ does not exist there. The clamp returned atanh(1 - 1e-12) = 14.221528..., scaled by the conformal\
  \ factor \u2014 a specific finite tangent vector, with no diagnostic and exit 0. Reachable from two\
  \ points EACH STRICTLY INSIDE the ball, because u = (-x) (+)_c y is formed by cancellation: x and y\
  \ antipodal at |x| = |y| = 1 - 1e-9 are about 43 units apart in hyperbolic distance, and tanh(21.4)\
  \ rounds to exactly 1.0 in binary64.\n(2) ad_poincare_exp_map. No check on the base point x at all.\
  \ The map uses lam = 2.0 / (1.0 - c * norm_sq(X, n)). At sqrt(c)|x| = 1 that denominator is 0, lam is\
  \ +inf, tanh saturates to 1, and mobius_add returns a finite point. At sqrt(c)|x| > 1 the denominator\
  \ is NEGATIVE, so lam < 0 and the map runs BACKWARDS along the geodesic. Both return a point that is\
  \ not exp_x(v) of anything, silently.\n(0) THE CURVATURE SIGN, all four entry points. Each opened with\
  \ `double c = (curvature == 0.0) ? 1.0 : std::fabs(curvature);`. The parameter is the SECTIONAL CURVATURE\
  \ K, whose sign names the manifold: K < 0 is the Poincare ball of radius 1/sqrt(-K), K = 0 is Euclidean\
  \ space, K > 0 is the sphere of radius 1/sqrt(K). That line mapped K = 0 to c = 1 \u2014 the UNIT HYPERBOLIC\
  \ BALL \u2014 and K > 0 to c = |K|, also a hyperbolic ball, silently, for ops that implement the K <\
  \ 0 branch and only that branch.\n(3) ad_geodesic_attention. Inside the score loop: `if (dxq <= 0.0\
  \ || dxk <= 0.0) { dist = HUGE_VAL; }` commented \"outside the ball: unreachable\". An off-manifold\
  \ Q or K head-slice scored as infinitely distant gets softmax weight exactly 0, so the op returned a\
  \ complete, finite attention output with that key silently deleted from the average, recorded an AD\
  \ node for it, and the backward produced gradients for that arrangement. (If EVERY key in a row was\
  \ off-manifold, mx stayed -HUGE_VAL and the row went NaN through the `if (sum <= 0.0) sum = 1.0;` guard\
  \ \u2014 NaN <= 0 is false \u2014 and the op recorded and returned a node full of NaNs.)"
observed: "With K = 0 (Euclidean), d((0,0,0), (0.5,0,0)) returned 1.0986122886681098 = 2*artanh(0.5),\
  \ the HYPERBOLIC distance, where flat space says 0.5; exp_0(0.5) returned 0.46211715726000974 and log_0(0.5)\
  \ returned 0.5493061443340549, both hyperbolic. With K > 0 the same ops answered from a hyperbolic ball\
  \ on inputs for which the VM's geometry opcodes select a sphere \u2014 two surfaces of one engine answering\
  \ the same question from different manifolds, neither saying so.\nlog_x(y) at |x| = |y| = 1 - 1e-9 antipodal\
  \ (c = 1, both strictly inside): a finite tangent vector of magnitude 2*atanh(1-1e-12)/lam, where no\
  \ finite log exists. exp_x(v) at sqrt(c)|x| = 1.5: a finite interior point produced with a negative\
  \ conformal factor. geodesic-attention with one K head-slice at |k| = 1.2728: a full attention output,\
  \ numerically indistinguishable from a valid one, in which that key contributed nothing. In all three\
  \ cases stderr was empty and the exit status 0."
correct: "The sign of K names the manifold and the three signs are three different geometries. The Poincare-only\
  \ bridge ops map c = -K for K < 0 and refuse K >= 0 and NaN. Geodesic attention is different: it selects\
  \ the shared Euclidean, Poincare, or spherical distance branch and its reverse rule selects the same\
  \ branch, so flat and spherical attention are supported rather than answered from a hyperbolic ball.\n\
  A point of the Poincare ball of curvature -c satisfies sqrt(c)|p| < 1 STRICTLY. On the boundary the\
  \ conformal factor diverges: there is no tangent space, no finite log map, and no derivative \u2014\
  \ so there is no value to return and none to record. Outside it, the argument is not a point of the\
  \ manifold at all. Every geometric entry point must therefore (a) compute EXACTLY for valid inputs,\
  \ including arbitrarily close to the Poincare boundary, and (b) refuse, with a diagnostic naming the\
  \ op and the measured norm, for invalid inputs \u2014 never substitute, never clamp, and never project.\
  \ Projection onto the ball is a DIFFERENT operation with a documented radius (`manifold-project`, (1/sqrt(-K))*(1\
  \ - 1e-12)); a caller who wants it asks for it. This is already the settled convention everywhere else\
  \ in the codebase: eshkol_frechet_log_map (inc/eshkol/backend/frechet_mean_core.h:117-135, whose comment\
  \ records that clamping sr to 1 - 1e-15 is what it \"used to do\"), FrechetGeometry::log_map_with_jacobians\
  \ (lib/bridge/tensor_backward.cpp:915), and eshkol_rm_log_map (inc/eshkol/backend/riemannian_core.h,\
  \ PR #516/SW-73, which names the bridge's clamp as a separate defect on a separate surface and leaves\
  \ it for this lane). docs/reference/stdlib/geometry.md states the contract: \"every other op in this\
  \ group refuses an off-manifold argument rather than projecting silently.\""
observed_after: 'Imported inc/eshkol/backend/riemannian_core.h from feat/vm-geometry-complete and made
  the VM and bridge use the same stable asinh distance and exact Mobius-numerator log/exp forms. The conformal
  factor remains unchanged and is defined by eshkol_rm_lambda in that shared header. Poincare-only bridge
  ops use c = -K for K < 0 and explicitly refuse K >= 0 and NaN. Geodesic attention validates every Q
  and K head-slice before scoring, refuses the first invalid row, and supports K < 0, K = 0, and K > 0
  with matching Euclidean, hyperbolic, and spherical reverse branches. No off-manifold row reaches softmax,
  and no NaN row is created. The old 1e-12 log clamp and the bridge-local Mobius denominator floor are
  gone. Near-antipodal interior logs now use the shared stable numerator and distance and return the finite
  mathematical log instead of refusing a rounded intermediate argument.

  Measured on a Linux CI worker (Linux x86_64, LLVM 21, RelWithDebInfo, ci.yml linux-x64-lite flags), ctest qllm_bridge_geometric_gradcheck,
  40 passed / 0 failed: evidence is recorded in the completion report for this lane.'
fixed_by: "branch fix/ad-bridge-boundary-refusal \u2014 shared riemannian_core.h plus the four call sites\
  \ in lib/bridge/qllm_bridge.cpp; the domain and curvature contracts documented on all four entry points\
  \ in inc/eshkol/bridge/qllm_bridge.h (and the generated docs/api/bridge/qllm_bridge.md); the now-stale\
  \ \"the forward clamps there\" comment and refusal message in lib/bridge/tensor_backward.cpp corrected."
evidence: "tests/bridge/qllm_bridge_geometric_gradcheck_test.cpp \u2014 boundary checks, stable near-antipodal\
  \ log coverage, Euclidean and spherical attention gradchecks, and a shared-VM-reference agreement check;\
  \ CMakeLists.txt's PASS_REGULAR_EXPRESSION is pinned to 40 passed. Near-boundary EXACTNESS at |x| =\
  \ 1 - 1e-6 (c = 1, lambda_x ~ 1e6): the conformal-factor identity |grad_x d| = lambda_x, central differences\
  \ with the step scaled to the gap to the boundary (h = 1e-3 * (1 - c|x|^2), since a fixed 1e-6 step\
  \ is larger than the whole remaining gap), and J_log * J_exp = I. The artanh argument driven to t =\
  \ 1 - 1e-6 with both points valid (x at |x| = 1 - 1e-6, y at the origin), checked against lambda_x |log_x(y)|\
  \ = d(x,y) \u2014 a fact about the manifold, not about either implementation. REFUSAL at sqrt(c)|x|\
  \ = 1 exactly and at 1.5, for distance / exp / log and for log's second argument; stable finite output\
  \ for the rounded near-antipodal pair where BOTH inputs pass the membership test; for a NaN coordinate;\
  \ and for an off-manifold key slice and an on-boundary query slice in geodesic attention, with an all-interior\
  \ control asserting the op still computes. Golden vectors in tests/qllm_oracle/golden/ are unchanged\
  \ and were NOT regenerated \u2014 they are produced by Eshkol-side .esk transcriptions (tests/qllm_oracle/*.esk),\
  \ not by this C surface, and every input POINT in them is strictly inside the ball."
