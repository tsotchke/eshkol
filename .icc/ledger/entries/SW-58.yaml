notes: 'Filed as SW-58: SW-46..SW-50 are taken or reserved by #466 / #473 / #474 and the S4 lane, and
  SW-51 / SW-52 are taken by in-flight #480. Verified next-free with `grep -o ''id: SW-[0-9]*b*'' .icc/silent-wrong-ledger.yaml
  | sort -V | tail -3` plus that PR''s body. recursion-depth-parametric is in missed_by for the same reason
  it was in SW-50''s: its `guard` kind measures how DEEP a guard can nest, not which handler answers.
  A depth sweep cannot see a semantic defect that costs no stack.'
closure_note: 'The waiver this entry carried (expiring 2027-12-31, owner tsotchke, on the grounds that
  the fix was a trajectory item rather than a patch) is RETIRED, not expired: the defect is fixed and
  measured, so there is nothing left to waive. Its reasoning is preserved here because it was the right
  call at the time and the thing that changed is not the risk appetite but the analysis — the mutual and
  self cases were being treated as one problem, and only the mutual one destroys the guard''s landing
  pad. recursion-depth-parametric remains in missed_by: its `guard` kind measures how DEEP a guard can
  nest, not which handler answers, and a depth sweep still cannot see a semantic defect that costs no
  stack. What can see it is the value-level engine differential this fix wires in.'
