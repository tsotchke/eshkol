id: LE-30
bucket: LOUD-ERROR
subtag: wrong-diagnostic-on-legal-code
status: open
title: "set! of a procedure bound by the (define (f ...) ...) shorthand is rejected as an undefined variable on the JIT and AOT"
repro: >-
  (define (f x) x)
  (set! f (lambda (x) (* 2 x)))
  (display (f 21))
  compiled with `eshkol-run -r` or `eshkol-run file.esk -o bin`.
observed: >-
  Both engines refuse to compile: "ERROR: set!: undefined variable 'f'"
  followed by "compilation reported 1 error(s); no artifact was written".
  The same program with `(define f (lambda (x) x))` compiles and prints 42.
correct: >-
  R7RS 5.3: `(define (f x) ...)` binds the variable f exactly as
  `(define f (lambda (x) ...))` does, and `set!` may assign any bound
  variable. The program prints 42. ADR-0015 (static callee binding identity)
  already specifies how a reassigned procedure binding is called.
root_cause: >-
  Not yet diagnosed. The set! lowering does not find a storage location for
  a top-level binding introduced by the procedure-define shorthand, which
  codegen emits as a function rather than as a variable holding a closure.
impact: >-
  A legal program is refused at compile time. No wrong value is produced.
  Found while documenting ADR-0015's reassignment rule for v1.3.5; the
  documentation examples use the lambda spelling.
fix_requires: >-
  A procedure-define shorthand gets the same assignable global storage as a
  lambda-valued define when the lexical mutation analysis reports a set! of
  it, so ADR-0015's binding facts apply unchanged.
evidence: >-
  Reproduced on the v1.3.5 release cut d1295a42 with the JIT and AOT
  drivers, 2026-09-17.
caught_by: [direct-measurement]
missed_by: [ctest]
notes: >-
  Recorded only; no fix in this change.
