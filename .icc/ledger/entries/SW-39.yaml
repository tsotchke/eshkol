title: VM string-length / string-ref / vref work as first-class values
repro: (define (h1 f a) (f a)) (display (h1 string-length "hello"))
observed: The VM terminates with a fatal runtime error and produces no output for the probe; call position
  (string-length "hello") answers 5 on the same engine.
correct: 5 — what call position returns
measured: Three value-position routes on the VM (passed, stored, returned) abort; string-ref and vref
  behave the same way. All four NATIVE axes are correct. Reproduced by scripts/run_value_position_sweep.py
  --axis vm.
discovered_by: The value-position sweep's VM axis, first full run
fixed_by: The supplied VM prelude-cache regeneration binds string-length, string-ref, and vref from the
  live BUILTINS[] table. Direct call syntax retains its inline opcode fast path, while source and cached
  preambles expose the same names as first-class closures.
evidence: tests/integration/vm_first_class_builtin_families_test.esk covers each accessor passed, stored,
  and returned; source and ESKB VM lanes run the fixture through vm_first_class_builtin_families_smoke
  and run_vm_parity.sh.
