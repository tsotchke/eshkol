build_item: >-
  OPEN, and deliberately NOT a weakening of the flat-memory claim. With this
  entry closed, the only remaining growth in a resident loop is bytes the
  program deliberately PUBLISHES: a tick that allocates a fresh heap object
  and stores it into a persistent slot retains that object (48 bytes/cons,
  144 bytes for an 8-element vector), because the value it supersedes is
  dead the instant it is overwritten but nothing can prove it unshared. A
  second, smaller instance of the same shape was measured while closing this
  entry and is documented rather than hidden: each `raise` allocates a
  condition object from the global arena and never gets it back, at exactly
  71.996 bytes per raise (200k vs 1.6M raises), so a resident loop whose
  error boundary FIRES every tick grows even though one whose boundary
  merely STANDS every tick is now exactly flat. It is not folded into the
  fix above because a condition object is user-reachable — for `(error ...)`
  it is what the handler's variable binds to — so recycling it needs the
  same liveness proof as row three, and guessing at one here is precisely
  the silent-wrong risk this ledger exists to prevent. The
  claim's conditions are now stated exactly — see
  docs/reference/runtime/memory-model.md "What is flat, and what is not",
  which gives the three-row matrix, names the workload class that is flat
  (zero bytes/tick, gated) and the class that is not, and shows how to write
  a genuinely flat resident loop. Removing the boundary itself needs either
  a store barrier that can retire a persistent slot's previous occupant when
  an ownership/uniqueness result proves it unshared (the OALR ownership
  layer is the natural home), or a compacting pass over persistent slots.
  Until then the third row is a documented design boundary with a measured
  rate, not an unquantified caveat.
notes: >-
  The finding as originally reported ("flat at the published 100k point,
  119 MB by 400k") was TRUE as stated and as originally measured — no
  published number was false, and the 34 MB figure reproduces. What did not
  hold was the INTENT behind it. Splitting the measured slope into its two
  causes is what made the difference actionable: 48 bytes/tick was a genuine
  leak with no legitimate owner and is now zero, while 240 bytes/tick is the
  program's own publishing and is now documented with its exact rate rather
  than implied away.
