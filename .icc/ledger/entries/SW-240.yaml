id: SW-240
bucket: SILENT-WRONG
subtag: vm-scope
family: vm/with-region-body-scope
status: fixed
closed_at: '15d760034bb6d86858104405d39dbb32cac81b00'
title: "VM: a top-level with-region or begin body popped the slot its definition had bound; the name then read another value"
repro: >-
  (with-region 'r (define tt 5) 1) (display tt), and (begin (define tt 5) 1)
  (display tt), on eshkol-vm-standalone-test.
observed_before: >-
  1 (and nothing at all for (with-region 'r (define tt 5) (display tt))
  followed by (display tt)), exit 0; native prints 5.
observed_after: >-
  5 on the VM and the browser VM; native JIT agrees for with-region.
root_cause: >-
  the top-level body compile popped every non-last form, definitions
  included, and a top-level definition's value IS its slot.
fixed_by: >-
  vm_compile_toplevel_sequence / vm_end_toplevel_sequence in
  lib/backend/vm_compiler.c, the one top-level body rule for with-region and
  begin.
evidence: >-
  tests/memory/with_region_toplevel_define_test.esk (ctest
  with_region_toplevel_define_{vm,browser_vm,jit}) and
  tests/vm/toplevel_begin_define_test.esk (ctest toplevel_begin_define_vm).
caught_by: [v135f-gates-lane]
missed_by: [run_vm_parity]
