id: SW-123
bucket: SILENT-WRONG
status: closed
closed_at: "agent-strings@171928a0"
title: "Long and embedded-NUL string literals lost payload bytes"
repro: "(string-append \"echo\" (string (integer->char 0)) \"evil\")"
observed: "echoevil or a long literal length/content differing between native and VM"
correct: "The value contains echo, one NUL byte, and evil; the long literal length is 300"
root_cause: >-
  Length-carrying native paths were not used by every representation
  boundary: VM source literals were stored in a fixed 128-byte field and
  packed-string construction rejected lengths at or above 256; AST copies
  and runtime S-expression conversion also used strlen/strdup.
fix: >-
  VM N_STRING nodes now own a length-delimited buffer, packed construction
  allocates and copies the complete payload, AST conversion/copying keeps
  the recorded size, and native search and literal interning use explicit
  lengths. Hosted and VM runtime readers also grow their literal buffers
  while preserving embedded NUL bytes.
evidence: >-
  tests/stress/found/string_nul_long_literal.esk now passes the existing
  expected OK 300 stress assertion without an XKNOWN exemption.
  tests/v1_2_edge_cases/string_semantics_regression_test.esk checks the
  exact echo/NUL/evil bytes, and tests/vm_parity/corpus/73_string_escape_nul_search.esk
  checks the same value on native and VM paths.
caught_by: [ESH-0099, consumer-reduction, direct-measurement]
missed_by: [icc-smoke, icc-readiness, pre-fix-stress-row]
