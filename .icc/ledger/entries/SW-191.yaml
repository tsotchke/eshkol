id: SW-191
bucket: LOUD-LIMITATION
family: ad/complex-carrier
status: fixed
closed_at: "aaf90512e"
needs_decision: false
title: "derivative at a complex evaluation point is refused on both engines; docs/tutorials/06_EXACT_ARITHMETIC.md describes differentiating functions of complex arguments"
repro: >-
  (display (derivative (lambda (z) (* z z)) (make-rectangular 1.0 1.0)))
observed: >-
  Native: "derivative: evaluation point is not a number (tagged type 7)".
  VM: "derivative: evaluation point is not a real number (a complex point)".
  Before this change the VM answered 0 with exit status 0.
correct: >-
  2+2i: for a holomorphic function the complex derivative, which forward mode
  computes by seeding the point with a complex tangent of 1 and reading the
  complex tangent of the result. For a non-holomorphic function the answer
  is not a single complex number (the Wirtinger pair), so the operator has to
  state what it returns.
evidence: >-
  Measured on fix/v135-ad-complex-and-dense-identity while closing SW-180,
  Release build, arm64 macOS. The complex carrier (ADR-0025) already
  propagates a complex tangent on both engines; what was missing was seeding a
  complex point and returning a complex derivative. Fixed at aaf90512e: native
  and VM seed dz=1 and return the holomorphic complex tangent; JIT, uncached JIT,
  AOT, and VM pass z*z, exp, sin, and identity cases (8/8 each).
caught_by: [coordinator-sweep]
missed_by: [run_ad_oracle, doc_audit]
notes: >-
  The contract is the holomorphic complex derivative (dz=1); non-holomorphic
  functions do not have a single complex derivative and are outside this
  operator's contract.
