id: SW-271
bucket: SILENT-WRONG
subtag: vm
family: numeric/inexact-tensor-division
status: fixed
title: "VM tensor division and native broadcasting returned zero for zero denominators"
repro: >-
  Divide inexact tensors containing 1.0 and 0.0 by tensors containing
  positive or negative zero, with and without WebGPU dispatch.
observed: >-
  The unattached browser VM returned zero for 1.0/0.0 and 0.0/0.0;
  native broadcasting also returned zero, while WebGPU and native same-shape
  codegen returned positive infinity and NaN.
correct: >-
  Inexact division returns signed infinity for a nonzero numerator over
  signed zero and NaN for zero over zero; exact rational division by exact
  zero continues to raise.
root_cause: >-
  vm_op_div and the native broadcast helper replaced every zero-denominator
  result with 0.0, unlike native fdiv and WebGPU sf64 division.
fix: >-
  vm_op_div and the native broadcast helper perform ordinary floating-point
  division for every tensor element.
evidence: >-
  tests/numeric/tensor_division_parity_test.py on native and VM, and
  tests/webgpu/division_parity_test.mjs on CPU and WebGPU browser VMs
  across dispatch thresholds.
caught_by: [hardware-reproduction]
missed_by: [webgpu_vm_test]
