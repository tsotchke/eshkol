
id: SW-131
bucket: SILENT-WRONG
status: fixed
title: "SQLite text binding truncated embedded NUL bytes and could not prove NULL versus empty TEXT"
repro: >-
  agent.sqlite bound text with sqlite3_bind_text(..., -1, ...), so an
  embedded NUL terminated the stored value early. The reader's fixed-size
  predecessor also truncated large TEXT, and its empty-string result was
  indistinguishable from SQL NULL without checking the storage type.
observed: >-
  Large payloads could be shortened, and a value containing left NUL right
  could come back as left. SQL NULL and empty TEXT both came back as the
  empty string through sqlite-column-text.
correct: >-
  Binding uses the Eshkol string's exact byte length; reading sizes from
  sqlite3_column_bytes and preserves embedded NUL bytes. sqlite-column-type
  remains the discriminator: SQLITE_NULL is 5 and SQLITE_TEXT is 3.
fixed_by: >-
  length-aware binding in lib/agent/c/agent_sqlite.c, exact-size reading in
  lib/agent/sqlite.esk, and the focused round-trip in
  tests/v1_2_edge_cases/sqlite_column_roundtrip_test.esk.
evidence: >-
  tests/ffi/sqlite_column_roundtrip_test.c passed verbatim as
  `sqlite-column-roundtrip: PASS` with `sqlite_harness_rc=0`. The same
  tests/v1_2_edge_cases/sqlite_column_roundtrip_test.esk passed all 16
  checks under native JIT and native AOT using a lane-local agent archive;
  it covers 20,000-byte TEXT, empty TEXT, SQL NULL, and a ten-byte TEXT
  value with an embedded NUL, including the type discriminator and suffix.
caught_by: [direct-measurement]
missed_by: [consumer-session-tests, icc-readiness]
