evidence: >-
  lib/backend/vm_tests.c source_test_expect "i128-add-raises" (VM
  standalone self-test, 73/73 passing). Revert-validated: reverting the
  guard reproduces the original "no" (silent 0, uncaught) output on the
  pre-fix VM binary.
