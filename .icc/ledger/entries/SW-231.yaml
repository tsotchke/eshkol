id: SW-231
bucket: SILENT-WRONG
subtag: codegen
family: first-class-builtins/apply-arity
status: fixed
closed_at: "dd2ed8f3e"
title: "a builtin used as a value declared an arity it does not have, so a list apply through a variable refused or mis-called it"
repro: >-
  (define g +) (apply g (list 1 2 3)); (define (partial f . a) (lambda b
  (apply f (append a b)))) ((partial + 1 2 3) 4 5); (for-each display '(a b
  c)); (apply display (list 'x))
observed: >-
  'Type error in apply: expected fixed-arity procedure, got procedure' for
  each (sweep_a_regressions_test, pointer_consolidation_comprehensive_test,
  first_class_io_test on every lite release lane). + - * / values were 2-ary
  closures whose surplus arguments only the direct-call dispatcher recovered
  by a function-pointer compare; display/write/newline values had arity 0.
correct: >-
  6, 15, abc, x: a builtin value accepts the argument counts its call form
  accepts (R7RS 6.2.6, 6.13.3).
root_cause: >-
  9d47e16a4 made the list apply trust a closure's declared arity (fixed-arity
  overflow check in codegenClosureListCall); the hand-built builtin value
  closures declared arities that were not the procedures' own.
fix: >-
  The arithmetic operators are variadic closures (kept on the integration
  route, makeVariadicOperatorClosureValue, SW-241); display, write and newline
  are ByCount rows of the first-class builtin table with their optional port
  (dd2ed8f3e, merged onto SW-230's ByCount); every port argument is checked by
  StringIOCodegen::portFile.
evidence: >-
  tests/core/first_class_builtin_arity_test.esk on JIT, AOT, VM and VM ESKB
  (ctest first_class_builtin_arity_*); the three lite-lane programs pass.
caught_by: [release-dry-run]
missed_by: [vm_parity]
