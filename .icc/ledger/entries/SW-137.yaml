id: SW-137
bucket: SILENT-WRONG
status: guarded
title: "Vector capacity boundary was accepted before the uint32_t header check"
repro: >-
  Construct a vector with capacity 268435456 (2^28), the first capacity
  at the shared vector limit. Before the strict guard, native, VM, hosted,
  and WASM paths accepted it and could allocate about 4.2 GiB before the
  header representation check.
observed: >-
  The first over-limit capacity was accepted because the limit predicate
  was inclusive. The resulting allocation request exceeded the intended
  vector boundary and could exhaust memory before a useful diagnostic.
correct: >-
  Every native, VM, hosted, and WASM vector path shares one `2^28` capacity
  constant and strict predicate: `2^28 - 1` is accepted by the predicate,
  while `2^28` and `2^28 + 1` are rejected before allocation. Header-aware
  allocations still reject payloads above UINT32_MAX and never store a
  truncated payload size.
root_cause: >-
  The vector capacity checks were derived independently in the native
  allocator and code generators, and used an inclusive representability
  boundary. The VM native-call path had no equivalent capacity check before
  converting the request and allocating its element array.
fix: >-
  The shared vector-capacity predicate is checked by the native vector
  allocator, the native LLVM codegen guard, and the VM native-call path
  used by the VM and WASM engines. The native regression checks the
  predicate at limit-1, limit, and limit+1 and invokes the allocator only
  at the two rejected capacities; the parity corpus drives the rejected
  boundary values through native, VM, and WASM error paths.
guarded_by: tests/core/runtime_object_alloc_test.cpp; tests/vm_parity/corpus/vector_payload_limit.esk
evidence: >-
  Post-fix allocation-limit regression: the shared predicate returns true
  only for capacity 268435455, and both 268435456 and 268435457 return
  NULL before allocation. The parity corpus prints `#t` for both rejected
  make-vector requests on native, VM, and WASM.
