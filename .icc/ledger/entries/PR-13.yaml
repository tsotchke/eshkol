id: PR-13
bucket: PARITY-RATCHET
status: open
title: "high_risk_differential_floor in ENGINE_PARITY_BASELINE.json was a hardcoded 1.0 literal that has never been measured and cannot be reached"
measured: >-
  tests/vm_parity/ENGINE_PARITY_BASELINE.json recorded "high_risk_differential_floor":
  1.0, written by scripts/run_engine_parity_coverage.py --update-baseline as a literal
  (the old line unconditionally wrote 1.0 regardless of what the run measured), not
  read from any run's own output. On integration/astra-v135 the measured high-risk
  differential coverage is 152/473 (32.35%), and the corpus's own achievability
  ceiling -- the fraction of high-risk constructs any corpus program mentions under
  native at all, computed by unioning every program's native construct trace
  regardless of engine agreement -- is 171/473 (36.15%). A construct no corpus
  program exercises under native can never earn differential credit on either engine,
  so 100% was unreachable by construction from the moment this baseline was written:
  scripts/check_engine_parity_threshold.py has graded `engine_semantic_parity_threshold`
  FAIL on every run since, and no code change to either engine could turn it green.
evidence: >-
  scripts/icc_traces/engine_parity_coverage.jsonl and
  scripts/icc_traces/engine_semantic_parity_threshold.jsonl at the SHA this branch was
  measured on; docs/VM_PARITY.md's "The high-risk floor is not yet attainable" note
  (added independently, before this fix, from the same measurement).
root_cause: >-
  scripts/run_engine_parity_coverage.py:493 (pre-fix) wrote
  `"high_risk_differential_floor": 1.0` unconditionally inside the --update-baseline
  branch, instead of the measured `high_risk_fraction` the same run had just computed
  and already printed to stdout two lines above. differential_floor, immediately
  above it, was correctly written as `round(fraction, 4)` -- the sibling field's
  hardcoded literal is the only place the ratchet discipline was not applied.
fix: >-
  scripts/run_engine_parity_coverage.py --update-baseline now writes
  `round(high_risk_fraction, 4)` for high_risk_differential_floor, the same measured
  ratchet discipline differential_floor already had. The script also now computes and
  emits an achievability ceiling per axis (constructs any corpus program's native run
  ever touches, regardless of VM agreement) and refuses to GRADE (not update) a
  baseline whose recorded floor exceeds its own run's ceiling, with a clear
  "baseline is malformed" message naming both numbers.
  scripts/check_engine_parity_threshold.py's grade() independently rejects the same
  condition from the emitted event's threshold payload (high_risk_minimum_
  differential_fraction > high_risk_ceiling_fraction), so the lightweight CI gate
  catches a malformed baseline even without rerunning the full corpus. Both are
  proved by `scripts/check_engine_parity_threshold.py --self-test`, which now checks:
  a floor above the corpus ceiling is rejected as malformed; a run below the recorded
  floor fails; a run at or above the recorded floor passes.
caught_by: [direct-measurement]
missed_by: [icc-correctness-chain, icc-readiness]
opened_at: "prepared on fix/parity-floor-measured-ratchet against integration/astra-v135; not yet merged"
notes: >-
  This entry stays OPEN, not closed, because the fix is a MECHANISM change awaiting
  the maintainer's ruling on policy: whether 32.35% is an acceptable interim floor, or
  whether the release should be blocked until more of the uncovered high-risk surface
  gets differential corpus programs (190 tensor_ad, 55 geometry, 36 numeric, 10
  consciousness, 6 memory_region, 3 macro_syntax, 2 control_flow -- see docs/VM_PARITY.md
  and DOC-DEBT entry DD-15). Close this entry with the SHA the ruling's merge lands on,
  citing whichever it decides.
