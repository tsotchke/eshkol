id: SW-154
bucket: SILENT-WRONG
subtag: autodiff
family: runtime-taylor/perturbation-nesting
status: open
title: "Two enclosing differentiation levels over an order-2 inner pass answered 0 silently, and both-passes-order->=2 raised, because the carrier had room for exactly one first-order companion"
repro: >-
  .scratch/nested_ad_repro2.esk, and the full sweep in
  tests/ad/nested_towers_matrix_test.esk.
  `./build/eshkol-run -r .scratch/nested_ad_repro2.esk -L build`:
    (define (h r) (* r r r r))
    (define (g t1 t2) (derivative-n h (+ 1 t1 t2) 2))
    (derivative-n (lambda (t1) (derivative-n (lambda (t2) (g t1 t2)) 0 1)) 0 1)
  and, for the raising half of the same ceiling,
  `./build/eshkol-run -r .scratch/nested_ad_repro.esk -L build`:
    (taylor (lambda (t) (* t (derivative-n h (+ 1 t) 2))) 0 2)
observed: >-
  The first printed 0, with no diagnostic and exit 0. The second raised
  "unsupported nested differentiation (both passes order >= 2)"; an order-1 pass
  over an order-2 inner pass reached through a captured carrier raised
  "unsupported nested differentiation through a captured carrier". So the same
  mathematics was, depending only on which spelling was used, either correct, a
  loud refusal, or a silent zero.
correct: >-
  24. g(t1,t2) = d^2/dr^2 [r^4] at r = 1+t1+t2 = 12(1+t1+t2)^2, so
  d/dt1 d/dt2 g at 0 = 24. The `taylor` case is (0 12 24): g(t) = 12t(1+t)^2.
  docs/design/AD_TAYLOR_TOWER.md and docs/guide/AUTOMATIC_DIFFERENTIATION.md
  section 11 both state that nested differentiation is safe at any depth.
root_cause: >-
  lib/core/runtime_taylor.c. SW-150 (ESH-0412) made nesting work by adding ONE
  first-order companion series (ESH_TAYLOR_TANGENT_FLAG plus
  esh_taylor_t.carry_epoch) alongside the value series, which is exactly enough
  for one enclosing level at first order. Everything beyond that had nowhere to
  go: `eshkol_ad_nested_seed`'s CARRY_TWR branch built the inner tower's
  companion from `nest_coeff(outer, 1)` and DROPPED the outer tower's own
  companion and carry_epoch (the second enclosing level) without a word --
  lib/core/runtime_taylor.c:1818-1830 on fix/ad-exact-rational-and-nesting, the
  silent 0; and `foreign_first_order()` raised as soon as a foreign level carried
  any coefficient above index 1, which is the both-passes-order->=2 refusal.
  The ceiling was the REPRESENTATION, not the mathematics.
fix: >-
  ADR-0027 (docs/design/adr/0027-recursive-taylor-level-carrier.md). A pass
  opened inside another live pass runs as a LEVEL: a truncated series in its
  own perturbation whose coefficients are any numbers of the enclosing levels
  (scalars, 8-jets, classic towers, or level carriers of smaller epochs;
  ESH_TAYLOR_COEFF_CARRIER). Arithmetic takes the largest epoch as the active
  level and reads every other operand whole as a constant of it; each
  coefficient operation recurses through the same arithmetic
  (lib/core/runtime_taylor.c, level_binary/level_unary and the 8-jet
  coefficient algebra). eshkol_ad_nested_seed decides the level from the
  forward level, the open tower depth and the point; eshkol_ad_nested_extract
  reads k!*c[k] / the taylor list / a vector elementwise.
  lib/backend/autodiff_codegen.cpp keys each seed site's route by its level
  value (a nested pass emitted inside the body used to overwrite the enclosing
  pass's route) and routes the exact scalar gradient through the same
  protocol. The companion-lane special cases (carry_epoch, the hyper-dual
  second companion, the RIDE/CARRY routes, the epoch projections) are retired.
  Native: 1dad8eff6 (level carrier), a506faeb1 (retirement), 592cf7f9f (docs,
  ns-residual any-order tau-series).
evidence: >-
  Native JIT and AOT, re-measured on fix/v135f-taylor at 592cf7f9f:
  tests/ad/nested_towers_matrix_test.esk 165/165 checks
  (nested_towers_matrix_runtime_smoke, nested_towers_matrix_aot_smoke, now
  registered), tests/ad/nested_operator_matrix_test.esk including the
  both-passes-order->=2 cells (nested_operator_matrix_runtime_smoke/_aot_smoke).
  The repro now prints 24; `(taylor (lambda (t) (* t (derivative-n h (+ 1 t) 2))) 0 2)`
  prints (0 12 24). Every native AD ctest is green;
  tests/stdlib/ns_residual_test.esk 24/24 with exact order-2 and order-3
  tau-series.
caught_by: [examples/mathematics_navier_stokes_* authoring, 2026-09-09]
missed_by: [ctest, icc-smoke, icc-readiness, gate_no_silent_wrong.py]
notes: >-
  Native half fixed (JIT and AOT). The bytecode VM and the browser VM (the same
  VM compiled to WebAssembly) implement the same level carrier per ADR-0027
  section 6; that half is owned by the v135f VM lane, which closes this entry
  after `ESHKOL_VM_NO_DISASM=1 build/eshkol-vm-standalone-test
  tests/ad/nested_towers_matrix_test.esk` passes. Direct successor of SW-150.
