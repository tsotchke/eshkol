id: SW-154
bucket: SILENT-WRONG
subtag: autodiff
family: runtime-taylor/perturbation-nesting
status: guarded
guarded_by: "the exact tier refuses nested differentiation through a captured carrier with a diagnostic (unsupported nested differentiation ... through a captured carrier); pinned repro tests/ad/nested_towers_matrix_test.esk, kept unregistered until the carrier rewrite lands"
guarded_at: "v1.3.5 candidate (integration/astra-v135)"
full_fix_branch: "fix/ad-nested-taylor-towers (ESH-0413 jet-over-jet carrier), targeted v1.4: it replaces the carrier the exact-coefficient sidecar shipped in v1.3.5 is built on, so the two cannot both be in force"
title: "Two enclosing differentiation levels over an order-2 inner pass answered 0 silently, and both-passes-order->=2 raised, because the carrier had room for exactly one first-order companion"
repro: >-
  .scratch/nested_ad_repro2.esk, and the full sweep in
  tests/ad/nested_towers_matrix_test.esk.
  `./build/eshkol-run -r .scratch/nested_ad_repro2.esk -L build`:
    (define (h r) (* r r r r))
    (define (g t1 t2) (derivative-n h (+ 1 t1 t2) 2))
    (derivative-n (lambda (t1) (derivative-n (lambda (t2) (g t1 t2)) 0 1)) 0 1)
  and, for the raising half of the same ceiling,
  `./build/eshkol-run -r .scratch/nested_ad_repro.esk -L build`:
    (taylor (lambda (t) (* t (derivative-n h (+ 1 t) 2))) 0 2)
observed: >-
  The first printed 0, with no diagnostic and exit 0. The second raised
  "unsupported nested differentiation (both passes order >= 2)"; an order-1 pass
  over an order-2 inner pass reached through a captured carrier raised
  "unsupported nested differentiation through a captured carrier". So the same
  mathematics was, depending only on which spelling was used, either correct, a
  loud refusal, or a silent zero.
correct: >-
  24. g(t1,t2) = d^2/dr^2 [r^4] at r = 1+t1+t2 = 12(1+t1+t2)^2, so
  d/dt1 d/dt2 g at 0 = 24. The `taylor` case is (0 12 24): g(t) = 12t(1+t)^2.
  docs/design/AD_TAYLOR_TOWER.md and docs/guide/AUTOMATIC_DIFFERENTIATION.md
  section 11 both state that nested differentiation is safe at any depth.
root_cause: >-
  lib/core/runtime_taylor.c. SW-150 (ESH-0412) made nesting work by adding ONE
  first-order companion series (ESH_TAYLOR_TANGENT_FLAG plus
  esh_taylor_t.carry_epoch) alongside the value series, which is exactly enough
  for one enclosing level at first order. Everything beyond that had nowhere to
  go: `eshkol_ad_nested_seed`'s CARRY_TWR branch built the inner tower's
  companion from `nest_coeff(outer, 1)` and DROPPED the outer tower's own
  companion and carry_epoch (the second enclosing level) without a word --
  lib/core/runtime_taylor.c:1818-1830 on fix/ad-exact-rational-and-nesting, the
  silent 0; and `foreign_first_order()` raised as soon as a foreign level carried
  any coefficient above index 1, which is the both-passes-order->=2 refusal.
  The ceiling was the REPRESENTATION, not the mathematics.
fix: >-
  Give every differentiation pass a LEVEL and let a level's coefficients be
  carriers of the enclosing levels -- the "jet over jet" the design always named
  (docs/design/AD_TAYLOR_TOWER.md section 5c):
  (1) inc/eshkol/eshkol.h adds ESH_TAYLOR_COEFF_CARRIER: a tower whose c[] is
  eshkol_tagged_value_t, each entry any tagged number INCLUDING another tower
  whose epoch names a strictly enclosing level.
  (2) lib/core/runtime_taylor.c adds the level-polymorphic coefficient algebra
  (coeff_add/sub/mul/div/unary/pow, which recurse into the tower kernel when a
  coefficient is itself a carrier) and the trc_* recurrences -- the same algebra
  as the tr_* kernels, written over "whatever the coefficients are".
  (3) `normalise_operand_carrier` makes a foreign level a COEFFICIENT-VALUED
  CONSTANT of the active level: the whole tower, structure and level tag intact,
  in c[0]. Nothing is flattened, so nothing is lost, so nothing has to raise.
  (4) `eshkol_taylor_seed_tagged` opens a level over whatever the point already
  is, and `eshkol_taylor_extract_tagged`/`eshkol_taylor_coeffs_list` return
  k!*c[k] as a tagged value -- a carrier of the enclosing level.
  (5) `eshkol_ad_nested_seed` keeps one job: a pass that would seed an 8-jet but
  meets a tower level runs as an order-1 level instead. A SINGLE enclosing 8-jet
  direction still rides the ESH-0412 first-order companion (that is exactly what
  one companion holds, and it allocates nothing per coefficient operation);
  TWO enclosing directions -- where a companion runs out -- become levels of
  their own through pseudo-epochs registered by the outermost tower pass, whose
  extraction restates the answer as an 8-jet.
  (6) lib/backend/autodiff_codegen.cpp mirrors the tower-context depth into the
  runtime (eshkol_ad_tower_enter/leave -- its own __ad_tower_active has INTERNAL
  linkage in the AOT build, so the runtime could never read it) and passes
  whether a reverse tape is live, so the ESH-0093 mixed-mode protocol keeps the
  jet slots it owns.
  esh_taylor_t.carry_epoch, eshkol_ad_tower_carry_result and
  eshkol_ad_nested_capture_unsupported are retired: with levels there is no
  companion to carry and no shape to refuse.
evidence: >-
  tests/ad/nested_towers_matrix_test.esk -- 155 checks: the depth-2 operator x
  order matrix (`derivative`/`derivative-n`/`taylor` as outer and inner, orders
  1..3 on each side), the depth-3 operator cube, the full 1..3 order sweep with
  three live levels, nesting through the evaluation point, exact seeds, and the
  Siskind-Pearlmutter perturbation-confusion negative controls (which answer 1,
  not 2). tests/ad/nested_operator_matrix_test.esk extended with the
  both-passes-order->=2 cells that used to raise. JIT and AOT lanes
  (nested_towers_matrix_runtime_smoke, nested_towers_matrix_aot_smoke).
  tests/ad/ad_carrier_nesting_test.esk, tests/ad/reverse_over_taylor_test.esk and
  tests/ad/taylor_tower_test.esk all still green, which is what pins that the
  level discipline REPLACED the companion rather than disturbing the P5
  reverse-over-Taylor channel that still uses it.
caught_by: [examples/mathematics_navier_stokes_* authoring, 2026-09-09]
missed_by: [ctest, icc-smoke, icc-readiness, gate_no_silent_wrong.py]
notes: >-
  The bytecode VM has no tower at all and already RAISES on a nested `derivative`
  (lib/backend/vm_native.c case 393, ESH-0369), so this defect has no VM twin and
  the VM's documented raise is unchanged. Direct successor of SW-150, which
  closed the one-companion half of the same family.
