notes: Invisible to every differential harness in the repo because native and both bytecode routes were
  wrong in DIFFERENT but equally wrong ways, and no fixture anywhere used the form. tests/error_handling/*.esk
  are the `guard` tests and scripts/run_error_handling_tests.sh only ever compiles them AOT, so no guard
  program had ever run under -r or on the VM either.
