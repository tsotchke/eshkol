title: "VM derivative-n and hessian through a complex intermediate returned the wrong derivative order"
repro: >-
  (derivative-n (lambda (x) (real-part (* x x x (make-rectangular 1 2)))) 1/3 2)
  and (hessian (lambda (x) (imag-part (* x x (make-rectangular 1 2)))) x0).
observed_before: >-
  0.333 on the VM where native answers 2; the hessian answered 12 where native
  answers 4. Exit status 0.
observed_after: >-
  2 and 4 on the VM and the browser VM, matching native; higher orders, taylor
  coefficients, make-rectangular/make-polar of carriers and magnitude/angle of
  a complex intermediate carry every order.
root_cause: >-
  real-part and imag-part returned the part's first-order (value, tangent)
  pair and dropped the Taylor tower the part carried; make-rectangular and
  make-polar flattened carrier arguments the same way.
fixed_by: "complex parts are carriers of any kind and are returned whole (ADR-0025, ADR-0027)"
evidence: >-
  tests/ad/vm_complex_intermediate_taylor_test.esk (ctest
  vm_complex_intermediate_taylor_vm, vm_complex_intermediate_taylor_browser_vm).
  Native answers the SW-200 cells correctly; native second derivatives of
  angle answer 0 and are reported to the native lane.
