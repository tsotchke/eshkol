id: SW-200
bucket: SILENT-WRONG
family: vm/taylor-through-complex
status: open
needs_decision: false
title: "VM higher-order derivatives through a complex intermediate answer the wrong order"
repro: >-
  (display (derivative-n (lambda (x) (real-part (* x x x (make-rectangular 1 2)))) 1/3 2))
  (display (hessian (lambda (x) (imag-part (* x x (make-rectangular 1 2)))) 3))
  (display (hessian (lambda (x) (real-part (* x x (make-rectangular 1 2)))) 3))
observed: >-
  VM: 0.3333333333333333, 12, 6. Native: 2, 4, 2. Exit 0, no diagnostic.
  The VM result is off by the point x for the Hessians and returns a
  lower-order coefficient for derivative-n; first derivatives through the
  same functions agree with native.
correct: >-
  2, 4, 2 (the second derivatives of x^3, 2x^2 and x^2).
evidence: >-
  Found by the v135f-vmrt lane on 2026-09-22 at base 62c5b1b32. Independent
  of parallel-map: the serial forms above reproduce it.
caught_by: [v135f-vmrt-probe]
missed_by: [vm_parity]
notes: >-
  Same family as SW-193 (nested holomorphic derivatives). Lives in the VM
  Taylor/complex carrier (vm_dual.c, vm_complex.c), owned by the Taylor
  carrier lane; handed over on the ICC bus.
