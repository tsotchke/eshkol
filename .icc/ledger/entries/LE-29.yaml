notes: >-
  Filed LOUD-ERROR by the SW-63, LE-25 and LE-26 precedent: type-checker
  verdicts on stderr and a compile-time arity refusal, never a wrong value.
  These are LE-26's four open findings. Making if join like cond removed the
  diagnostic for `(label (count-up 3))` over
  `(let loop ((i 0)) (if (< i n) (loop (+ i 1)) i))`, which the if rule had
  reported by accident; the recursion result fixpoint restores it and
  extends it to the cond form, which LE-26 had already left silent. The
  The original native compile exit for json_surface_regression.esk did not
  represent a failed VM-runner case: the fixture uses json-merge and
  json-stringify-pretty, which exist only on the VM. run_vm_surface_tests.sh
  compiles that fixture with --profile hosted-vm and checks the compile exit;
  both json_surface_regression and json_get_in_default_surface_regression
  passed on that runner. run_typesystem_tests.sh checks EXPECT-COMPILE plus
  diagnostic patterns; its later full rerun passed all 126 fixtures. The C++
  runner had declared a TypeRelation test path but omitted executing it; this
  change adds that execution, and the relation contract passed. The prior
  standalone native error therefore came from invoking the wrong substrate,
  not a swallowed failing test.
