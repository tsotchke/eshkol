id: SW-186
bucket: SILENT-WRONG
family: vm/operand-stack-tracking
status: fixed
closed_at: "90f0b37c"
title: "VM: a let (or any binder) as an operand of list, vector or apply evaluated to (), because the binder's locals were allocated over the operands already pushed"
repro: >-
  (display (list 'a (let ((v (vector 1 2))) (vector-set! v 0 9) v)))
  (display (list 'a (let ((v 5)) v)))
  (display (vector 'a (let ((v 5)) v)))
  (display (apply + (list 1 (let ((v 2)) v))))
observed_before: >-
  On eshkol-vm-standalone-test: (a ()), (a ()), #(a a), and "+: expected
  numeric operands"; exit 0 and no diagnostic for the first three. Natively
  (a #(9 2)), (a 5), #(a 5), 3. The mutation was a red herring: (list 'a
  (let ((v 5)) v)) fails the same way.
correct: >-
  The native answers.
root_cause: >-
  The VM compiler tracks compile-time stack depth in c->n_locals, and a
  binder allocates its variables at that depth. Every operand pushed and held
  on the stack while another operand compiles must therefore be registered as
  a local (the __operand__ slots compile_operands_tracked() creates).
  `list` built its result as a running cons chain whose accumulator was never
  registered; `vector` pushed its elements unregistered; `apply` pushed the
  procedure unregistered; twelve more native-call lowerings pushed runs of
  operands the same way. A let inside such an operand allocated its variable
  over the pushed value: the accumulator became the let's local, so the list
  came back as (), and a vector's earlier element was replaced by the later
  binder's value.
fix: >-
  One rule applied at every site: the list accumulator occupies a tracked
  slot, `vector` uses compile_operands_tracked(), and every run of
  consecutive operand pushes in vm_compiler.c registers each pushed operand
  before compiling the next (apply, tensor-ref, tensor-set!, reshape,
  arange, bytevector-copy!, string->utf8, make-tensor, display to a port,
  write-char, call-with-values, exact-rational, make-parameter, gpu ops).
evidence: >-
  tests/vm_parity/corpus/86_binder_in_operand_and_void.esk: native and VM
  agree on a binder in every operand position (list, vector, apply, a user
  call, string-append, nested list/vector, named let, letrec, do, let*, case,
  cond, and, if) and on a vector escaping a let through list, cons, return,
  a nested let, vector-set! into another vector and closure capture.
caught_by: [engine-differential-review]
missed_by: [vm_parity corpus as it stood, run_all_tests]
notes: >-
  hash-table-ref and three-argument apply are recorded VM gaps and are kept
  out of the corpus program.
