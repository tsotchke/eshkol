notes: >-
  PR #420 describes this as 'Undefined variable'. At 9f2da2ab it is a SIGSEGV, which is
  strictly worse, and it is a FAMILY of at least 11 builtins, not one. Note the honest
  detector working: readiness is red BECAUSE this is real. 37_sort.esk was NOT
  baselined, excluded or weakened — it is green because the compiler is fixed.
  #420 is NOT the cause: its object-cache/AD-capture defect is unrelated to this one,
  and the cached-vs-nocache split here is the addModule teardown-order bug above.
  Two ADJACENT defects found while closing this and deliberately left open, since they
  live in a different lowering path: a REST-ARG stdlib procedure referenced as a value
  loses its variadic flag (`(h append '(1) '(2))` -> 1; `(h string-copy "abc")` SIGSEGV
  under AOT), and the VM's builtin surface is narrower than native for `string>?`,
  `string<=?`, `string>=?`, `string-length`, `string-ref`, `symbol=?`, `square`,
  `boolean=?` in CALL POSITION too (parity-ratchet PR-02 class).
