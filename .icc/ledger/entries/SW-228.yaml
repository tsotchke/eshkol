title: "native square printed pointer bits for complex and rational arguments on value paths"
repro: >-
  (map square (list 1/2 (make-rectangular 1.0 2.0))); (apply square (list
  1/3)); ((lambda (f) (f 2/3)) square); square in AOT.
observed: >-
  Pointer bits such as 4657922831851813440 for a rational and
  2379617646309622784 for a complex, as the VM Taylor lane measured it.
correct: >-
  1/4, -3+4i, 1/9, 4/9.
root_cause: >-
  square multiplied payload bits inline on a flonum or fixnum arm, in the one
  lowering every route shares.
fix: >-
  edf532399 (SW-214) makes square the polymorphic product at that one
  lowering; the first-class wrappers are generated from it, and 7c9ceca04 routes
  every value position through the generic wrapper. On 1e468f279 every path
  measured correct on JIT and AOT.
evidence: >-
  tests/ad/unary_numeric_builtin_carriers_test.esk section SW-227/SW-228:
  square passed, stored, applied, mapped and vector-mapped over rationals and
  complex numbers, and under derivative and a complex carrier; JIT and AOT;
  tests/ad/first_class_math_builtins_test.esk covers square among every math
  builtin.
