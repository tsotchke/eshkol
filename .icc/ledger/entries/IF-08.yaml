title: HEAP_SUBTYPE_PARAMETER is deep-walked by the native region evacuator
observed: 'Fixing INV-oalr-interior-pointer-deepwalk (B5/N3, 2026-08-26 audit) to derive its heap-subtype-enum
  side from source-verified per-member [DEEPWALK]/[LEAF] tags (inc/eshkol/eshkol.h) required classifying
  every member against evac_kind_for''s actual case list (lib/core/runtime_regions.cpp). Fourteen members
  have an explicit deep -walk case; ten more are documented, reviewed EVAC_LEAF exemptions (PORT/PRNG/DNC/SDNC/TAYLOR/STRING/SYMBOL/BIGNUM/BYTEVECTOR/I128).
  HEAP_SUBTYPE_PARAMETER falls to evac_kind_for''s `default: return EVAC_LEAF;` with NO comment anywhere
  in that file naming it a reviewed exemption — unlike every other LEAF member. eshkol_param_t (lib/core/runtime_parameters_hosted.cpp)
  holds a `converter` eshkol_tagged_value_t (Scheme code, may be a heap-allocated closure/procedure) and
  a malloc''d `stack` array of eshkol_tagged_value_t (the parameterize dynamic-binding stack, whose entries
  may themselves be heap pointers) — both are exactly the interior-tagged-value shape ESH-0214d fixed
  for KB/FACT/SUBSTITUTION/WORKSPACE. Independent corroboration: the bytecode VM''s own Stage-1 region
  evacuator (lib/backend/vm_region_evac.c) already classifies `[HEAP_PARAMETER] = { ..., VM_EVAC_WALK,
  "current_value, converter, save_stack[0..stack_depth)" }` — the VM engine already treats this exact
  shape as needing a deep walk; the native engine does not.'
repro: tests/memory/region_evac_parameter_test.esk
correct: A parameter object that escapes a region remains callable and preserves its default/current value
  and converter after the region is popped.
fix: HEAP_SUBTYPE_PARAMETER is tagged [DEEPWALK] and evac_kind_for dispatches it to EVAC_PARAMETER. A
  runtime-owned visitor walks the converter and every current/dynamic stack value, applying evac_value
  forwarding while keeping the private eshkol_param_t layout in its owning translation unit.
fix_lane: native parameter evacuation deep-walk
evidence: tests/memory/region_evac_parameter_test.esk exercises an escaped default closure, converter,
  and parameterize stack binding under ESHKOL_ARENA_POISON=1 in native JIT and AOT CTest lanes.
