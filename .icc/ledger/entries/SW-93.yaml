closed_at: '2026-08-28'
title: Resident native reverse-mode passes retained every operator tape allocation
repro: A resident loop repeatedly invokes gradient/jacobian over a reverse-mode collection path without
  with-region.
observed_before: Each pass allocated a fresh tape in the owning arena and only reset its node count; tape
  storage accumulated until an enclosing region ended.
observed_after: 'Native reverse-mode gradient, jacobian, and runtime-closure collection paths allocate
  tape headers, node arrays, nodes, and private scratch in a dedicated child arena, then release that
  child after copying all gradients into parent-owned results. Release cannot rewind user-visible parent
  allocations and is refused during an active reverse pass. The bytecode VM disposition is documented:
  its operator tape remains owned by VmRegionStack and is reclaimed by an enclosing VM region.'
root_cause: arena_allocate_tape placed tape storage in the caller's bump interval and arena_tape_reset
  only cleared node state. Releasing that interval could reclaim user values allocated after the tape.
  The native runtime now creates a tape-only child arena and arena_tape_release destroys it after the
  result is no longer tape-backed.
evidence: tests/core/ad_tape_region_growth_test.cpp Parts 1-3; tests/core/ad_tape_escape_test.cpp; tests/ad/tape_release_escape_test.esk;
  docs/reference/ad/tape.md; docs/KNOWN_ISSUES.md
