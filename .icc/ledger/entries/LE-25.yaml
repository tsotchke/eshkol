notes: >-
  Filed LOUD-ERROR by the SW-63 precedent: a type-checker verdict printed on
  stderr, never a wrong value. Two findings recorded, not fixed here.
  (1) Gradual consistency: the call-site check uses strict subtyping and only
  skips when either side is exactly Value; it is not componentwise. Under
  consistency all five would also have been accepted (Pair<Value, Value> is
  consistent with Pair<Number, Number>; bare Pair with any Pair<A,B>), but that
  is not the root: the argument really is wider than the seed. The lattice
  gap underneath is that bare Pair and Pair<Value, Value> are distinct nominal
  ids with only Pair<Value, Value> <: Pair, and tracked pairs are not
  covariant. (2) cond, case, match, when, unless, do and guard return Value
  without synthesizing their bodies, so an application argument inside them
  is never checked: a named-let fed a string from a cond clause is silent
  before and after this change.
  The numeric-tower exception is subsumed for inferred named-let
  accumulators (removing it changed no fixture, no suite result and no
  stdlib warning) but still carries declared numeric parameters of ordinary
  functions, so it stays, with its comment corrected and
  declared_numeric_param_join_test.esk pinning it.
