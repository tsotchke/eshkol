title: "native derivative loses exactness when a scalar body uses collection intermediates"
repro: >-
  Differentiate a scalar fold over map or parallel-map at 1/3, for example
  d/dx fold-left(+, 0, map(y -> y*y, [x x x x])).
observed: >-
  Native JIT and AOT return the inexact double 2.6666666666666665 with exit 0
  instead of exact 8/3; a sufficiently tiny exact input underflows and fails
  equality with the analytic exact derivative. Direct scalar arithmetic and
  derivative-n remain exact.
correct: >-
  An exact point stays on the exact Taylor tier when the differentiand's final
  value is numeric, even if list/vector values are built and consumed only as
  intermediate operands. A genuinely collection-valued result retains the
  existing R-to-R^n derivative semantics.
evidence: >-
  .scratch/NATIVE-PARALLEL-AD-EXACTNESS.md and the isolation logs reproduce
  the loss in both serial and parallel collection paths. The local fix makes
  the safety scan follow value-producing positions instead of every operand.
  Four exact-point/exact-rational native CTests and the four-engine
  parallel_ad_carrier_lifetime corpus case pass.
caught_by: [release-ad-carrier-audit]
missed_by: [vm_parity, exact_rational_derivative_runtime_smoke]
notes: >-
  The list/vector/map/fold/parallel-map half closed with the value-producing
  eligibility scan (9d47e16a4). Re-measured at cc978a57a on the native JIT, an
  AOT binary, the VM from source and the VM from ESKB: every list, vector and
  map/fold case is exact (d/dx fold-left(+, 0, map(sq, [x x x x])) at 1/3 is
  8/3; the 2^-2000 rational agrees exactly). The residual was TENSOR
  intermediates: the native exact tier stored its Taylor tower in a tensor
  literal as 0, the jet tier refused a dual, and the VM kept only the primal.
  cc978a57a routes every tensor construction path through the ADR-0020 slot
  store boundary (amendment 2): a forward carrier widens the tensor to a jet
  tensor and tensor-ref reads it back whole, so d/dx tensor-ref(tensor(x, x*x), 1)
  at 1/3 is exact 2/3 on all four routes. A body that applies a tensor kernel
  answers inexactly by design (a tensor holds doubles). Gate:
  tests/ad/exact_collection_intermediates_test.esk (CTest
  exact_collection_intermediates_{runtime,aot,vm,vm_eskb}_smoke) and parity
  corpus 94_derivative_through_tensor_carrier.esk.
