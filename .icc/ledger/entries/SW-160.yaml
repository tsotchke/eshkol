title: "The exact tier stayed exact for an inline literal constant but demoted the identical arithmetic when the constant was a top-level `define` reference"
repro: >-
  .scratch/ns_derivative_topvar_vs_literal_repro.esk.
  `./build/eshkol-run -r .scratch/ns_derivative_topvar_vs_literal_repro.esk -L build`:
    (define (g x) (- 4 x))
    (define K 3)
    (define (h-literal x) (/ (g x) 3))   ; literal divisor
    (define (h-topvar x)  (/ (g x) K))   ; identical arithmetic, named divisor
    (derivative h-literal 1/2)  vs.  (derivative h-topvar 1/2)
  Found mechanizing examples/mathematics_navier_stokes_stress_cone.esk section
  4.3: F-of divided `(phi X)` by a top-level `C-norm`; switching that one
  divisor to the literal `3` was, on its own, enough to keep
  `(derivative F-of X)` exact at an exact rational X.
observed: >-
  `(derivative h-literal 1/2)` => `-1/3` exact. `(derivative h-topvar 1/2)` =>
  the SAME value `-1/3` but with `(exact? …)` => `#f` — a wrong `exact?` tag on
  an otherwise identical computation, distinguished only by whether the divisor
  was spelled as a literal or a name.
correct: >-
  Both exact. A top-level `define`d constant is exactly as much a fixed exact
  number as the literal that names the same value; the two are observably
  identical at every point where they differ only in spelling.
root_cause: >-
  Same static whitelist as SW-159 (`towerSafeExpr`, lib/backend/
  autodiff_codegen.cpp), a DIFFERENT rejection path within it: the body
  whitelist accepted a VAR node only when it was the differentiand's OWN
  parameter (`only_vars->count(id)`), rejecting every other variable reference
  outright — including a reference to a top-level numeric constant, which is
  neither a capture that might not be a number (the concern the whitelist was
  actually defending against — see the SW-159 fix's removed comment) nor
  anything else unsafe. `K` in `h-topvar`'s body failed this check and the
  whole differentiand fell back to the inexact jet path, even though `K`'s
  runtime value is a plain exact int64 the tower's arithmetic handles exactly
  like the literal `3` would.
fix: >-
  Same fix as SW-159: `towerSafeExpr`'s body whitelist is removed entirely.
  `adExactTowerEligible` no longer inspects the body's variable references at
  all; a captured non-number value (the ORIGINAL concern the whitelist
  partially addressed, e.g. `(define v (vector 1.0 2.0)) (derivative (lambda
  (x) (* x v)) 1/2)`) is instead ruled out by the narrower, targeted
  `adBodyMayEscapeNumber` check added for SW-159/exact_point_ad_test.esk's
  R -> R^n regression, which flags a body that can construct a
  vector/list/tensor/string/hash rather than blanket-rejecting every non-
  parameter variable.
evidence: >-
  tests/ad/exactness_runtime_property_test.esk section 2 (the exact repro
  shape, plus constants reached through `let`, `letrec`, and a
  `make-parameter` object); JIT and AOT
  (exactness_runtime_property_runtime_smoke, exactness_runtime_property_aot_smoke).
