id: SW-130
bucket: SILENT-WRONG
status: fixed
title: "Filesystem metadata and atomic publication could report a usable result for the wrong filesystem state"
repro: >-
  Native file-stat returned only a size integer while the VM returned a
  three-field metadata list, and both omitted sub-second mtime and stable
  identity. In the consumer atomic-write path, a failed rename to an
  existing directory could be followed by a successful mv into that
  directory, allowing an Ok result without publishing the requested file.
observed: >-
  Native and VM disagreed on file-stat's value shape; filesystem consumers
  could collapse distinct updates within one second. The atomic negative
  reduction could return success while the requested destination remained
  a directory rather than the new file.
correct: >-
  Both engines return (size mtime-seconds type mtime-nanoseconds device
  inode), preserving the historical prefix and exposing a stable identity.
  Atomic publication returns failure when final rename does not publish the
  requested destination, while compiler-object publication remains an
  atomic temporary-file rename with a regular-file verification.
fixed_by: >-
  file-stat contract in lib/core/system_builtins.c and
  lib/backend/vm_native.c; extended platform ABI in
  lib/agent/c/agent_platform.c; negative publication regression in
  tests/stdlib/atomic_file_test.esk.
evidence: >-
  Remote old-donkey runs of tests/stdlib/filesystem_metadata_test.esk
  passed 8/8 under AOT and 8/8 under JIT; the standalone VM run of
  tests/vm/filesystem_metadata_surface_regression.esk passed T1, T2, and
  T3. tests/stdlib/atomic_file_test.esk passed 10/10, including the
  failed-final-rename case. The compiler cache publication path in
  exe/eshkol-run.cpp was retained and remains guarded by regular-file
  verification.
caught_by: [direct-measurement]
missed_by: [consumer-platform-fs-tests, icc-readiness]
