version: 1
name: eshkol-compiler
repo: eshkol
description: >
  Machine-checked architecture model of the Eshkol compiler — a compiled
  R7RS Scheme frontend, an LLVM AOT/JIT backend, a bytecode VM, an OALR region
  memory manager, an automatic-differentiation tower, an exact numeric tower,
  an opt-in Moonlab quantum backend, and a WASM emission path with browser glue.  Components, dataflows,
  capabilities, and first-class INVARIANTS that encode the incident classes the
  adversarial campaign surfaced (VM-parity gaps, FFI/link-registration drift,
  language-surface under-exercise, WASM import/glue drift, OALR interior-pointer
  leaf-copy, AD finite-difference regression, TCO tail-position coverage).
  Verified by `icc architecture-verify --repo eshkol --model
  .icc/architecture-model.yaml`.

  Ground truth: tests/coverage/language_surface.json (1,108 constructs including
  22 opt-in Agent FFI quantum APIs, 116 special forms, 113 AST ops) and
  scripts/language_coverage.py (dynamic exposure-engine coverage tracker). 1,108
  is the enforced floor in tests/coverage/coverage_policy.json (baseline_surface_total),
  confirmed by a fresh run of scripts/run_language_coverage.sh at commit afbaaf5b
  on 2026-08-26; the surface was re-baselined up from 1,056 when the i128 tower,
  linear-solve, and the string/pointer conversions landed, and has grown further
  since. scripts/check_surface_counts.py fails CI if this file drifts from the
  manifest again.

  FIDELITY HONESTY: ICC's C symbol index does not AST-resolve C/C++ the way it
  resolves Python, so every invariant whose sites are .c/.cpp/.h/.js files is
  GREP fidelity (honest regex over source text, no name resolution) even where
  the generic checker's per-kind default label reads "ast".  Each invariant
  below carries an explicit `fidelity:` field stating the TRUE fidelity.

# --------------------------------------------------------------------------
# COMPONENTS — module/file groups with roles
# --------------------------------------------------------------------------
components:
  - id: frontend-reader
    role: frontend
    description: S-expression reader, parser, and macro expander (special-form dispatch).
    modules:
      - lib/frontend/parser.cpp
      - lib/frontend/macro_expander.cpp
    entry_points:
      - {path: lib/frontend/parser.cpp}

  - id: llvm-codegen
    role: backend
    description: >
      LLVM AOT/JIT code generation — the func_name dispatch spine plus the
      per-domain *_codegen.cpp family (binding, control-flow, call/apply,
      collections, strings, hash, memory, tail-calls, system FFI).
    modules:
      - lib/backend/llvm_codegen.cpp
      - lib/backend/binding_codegen.cpp
      - lib/backend/control_flow_codegen.cpp
      - lib/backend/call_apply_codegen.cpp
      - lib/backend/collection_codegen.cpp
      - lib/backend/string_io_codegen.cpp
      - lib/backend/hash_codegen.cpp
      - lib/backend/tail_call_codegen.cpp
      - lib/backend/system_codegen.cpp
    entry_points:
      - {path: lib/backend/eshkol_compiler.c}

  - id: bytecode-vm
    role: backend
    description: >
      Bytecode VM — the second backend.  eshkol_vm.c holds the VM BUILTINS
      dispatch table; the vm_*.c family implements each op domain.  The
      interpreter itself is split by responsibility: vm_run.c is the dispatch
      loop only, and the opcode bodies it routes to live in vm_ops.c (value
      opcodes), vm_frame.c (frames, closures, upvalues) and vm_control.c
      (continuations, dynamic wind, handler stack), with vm_limits.c owning
      execution-limit enforcement and vm_lifecycle.c the VM instance entry
      points. Builtin trampolines remain in vm_native.c, error objects in
      vm_error.c, and coverage/ESKB entry points remain in eshkol_vm.c.
    modules:
      - lib/backend/eshkol_vm.c
      - lib/backend/vm_core.c
      - lib/backend/vm_run.c
      - lib/backend/vm_ops.c
      - lib/backend/vm_frame.c
      - lib/backend/vm_control.c
      - lib/backend/vm_limits.c
      - lib/backend/vm_lifecycle.c
      - lib/backend/vm_error.c
      - lib/backend/vm_native.c
      - lib/backend/vm_autodiff.c
      - lib/backend/vm_tensor.c
    entry_points:
      - {path: lib/backend/eshkol_vm.c}

  - id: oalr-memory
    role: runtime
    description: >
      OALR region memory — arena allocation and region evacuation.  The
      evacuator must deep-walk every interior-pointer heap subtype (ESH-0214d).
    modules:
      - lib/core/runtime_regions.cpp
      - lib/core/arena_memory.h
    entry_points:
      - {path: lib/core/runtime_regions.cpp}

  - id: ad-tower
    role: backend
    description: >
      Automatic-differentiation tower — forward dual/jet + reverse tape codegen,
      and the tensor AD codegen family.  The default gradient path is exact
      (jet arithmetic), never finite differences.
    modules:
      - lib/backend/autodiff_codegen.cpp
      - lib/backend/tensor_arith_codegen.cpp
      - lib/backend/tensor_training_codegen.cpp
    entry_points:
      - {path: lib/backend/autodiff_codegen.cpp}

  - id: numeric-tower
    role: runtime
    description: Exact numeric tower — bignum, rational, and arithmetic codegen dispatch.
    modules:
      - lib/core/bignum.cpp
      - lib/core/rational.cpp
      - lib/backend/arithmetic_codegen.cpp
    entry_points:
      - {path: lib/backend/arithmetic_codegen.cpp}

  - id: quantum-backend
    role: backend
    description: >
      Opt-in Moonlab quantum integration: Agent FFI state-vector and CHSH
      shims, VQE/custom-VJP surface, FIPS 203 ML-KEM bindings, and the core
      QRNG wrapper. Native builds with ESHKOL_QUANTUM_ENABLED route quantum
      entropy to Moonlab; default and browser builds retain an explicitly
      labelled classical fallback.
    modules:
      - lib/agent/quantum.esk
      - lib/agent/c/agent_quantum.c
      - lib/agent/pqc.esk
      - lib/agent/c/agent_pqc.c
      - lib/quantum/quantum_rng_wrapper.c
      - lib/quantum/quantum_rng_wrapper.h
      - lib/repl/repl_jit.cpp
    entry_points:
      - {path: lib/agent/c/agent_quantum.c, symbol: eshkol_quantum_bell_chsh}

  - id: exposure-engines
    role: analysis
    description: >
      Adversarial exposure engines + the language-surface coverage tracker that
      diffs what the engines exercise against language_surface.json.
    modules:
      - scripts/run_generative_differential.py
      - scripts/gen_generative_corpus.py
      - scripts/run_ad_adversarial.sh
      - scripts/language_coverage.py
    entry_points:
      - {path: scripts/language_coverage.py, symbol: main}

  - id: wasm-path
    role: backend
    description: >
      WASM emission (--wasm in llvm_codegen.cpp) plus the browser glue that must
      provide an env import stub for every runtime helper the WASM asks for.
    modules:
      - lib/backend/llvm_codegen.cpp
      - site/static/eshkol-runtime.js
      - web/eshkol-repl.js
      - scripts/check_wasm_imports.py
    entry_points:
      - {path: scripts/check_wasm_imports.py, symbol: parse_env_imports}

# --------------------------------------------------------------------------
# DATAFLOWS — producer/consumer edges with KEY-SPACE annotations
# --------------------------------------------------------------------------
dataflows:
  - id: reader_to_backends
    producer: frontend-reader
    consumer: llvm-codegen
    produces: [ast, special_form_dispatch]
    consumes: [ast]
    key_space: {kind: builtin_name, identifier: "builtin/special-form head symbol"}
    description: >
      The reader lowers source to AST + a special-form/builtin head-symbol
      space; every backend (native LLVM, VM, WASM) must dispatch the same space.

  - id: codegen_to_vm
    producer: llvm-codegen
    consumer: bytecode-vm
    produces: [builtin_dispatch]
    consumes: [builtin_dispatch]
    key_space: {kind: builtin_name, identifier: "BUILTINS[] table entry name"}
    description: >
      Native closure table (eshkol_compiler.c BUILTINS[]) and the VM table
      (eshkol_vm.c BUILTINS[]) index the same builtin-name space; a name present
      in one but absent in the other is a VM-parity gap.

  - id: ad_graph
    producer: ad-tower
    consumer: ad-tower
    produces: [dual_jet_tangent]
    consumes: [dual_jet_tangent]
    key_space: {kind: perturbation_slot, identifier: "dual/jet tangent field"}
    description: >
      The derivative/gradient codegen seeds and propagates exact dual/jet
      tangents; the default path must never fall back to finite differences.

  - id: exposure_trace_flow
    producer: exposure-engines
    consumer: exposure-engines
    produces: [language_surface_coverage]
    consumes: [language_surface_coverage]
    key_space: {kind: runtime_event, identifier: language_surface_coverage}
    description: >
      The coverage tracker emits a language_surface_coverage runtime_event whose
      covered_fraction feeds the readiness oracle; a fresh coverage trace is the
      evidence that the exposure engines were run.

  - id: wasm_import_glue
    producer: wasm-path
    consumer: wasm-path
    produces: [env_import]
    consumes: [env_import_stub]
    key_space: {kind: env_import_name, identifier: "env.<runtime_helper>"}
    description: >
      Every runtime helper the WASM imports as env.<name> must have a matching
      JS glue stub in BOTH glue files (site/static/eshkol-runtime.js and
      web/eshkol-repl.js); a stub added to one but not the other is the drift
      that took the live site down.

# --------------------------------------------------------------------------
# CAPABILITIES — feature -> entry points -> arming -> dependencies
# --------------------------------------------------------------------------
capabilities:
  - id: exact_ad_default_gradient
    feature: Exact dual/jet automatic differentiation on the default gradient path
    entry_points:
      - {path: lib/backend/autodiff_codegen.cpp}
    arming:
      kind: ast_op
      path: lib/backend/autodiff_codegen.cpp
      pattern: ESHKOL_DERIVATIVE_OP
    dependencies: [ad-tower]
    dependency_constructor: "createDualNumber|makeDual8|makeDual4|seedForwardAndPush"
    dependency_paths: [lib/backend/autodiff_codegen.cpp]

  - id: base64_ffi_builtin
    feature: base64/base64url string FFI builtins (incident #250)
    entry_points:
      - {path: lib/backend/system_codegen.cpp, symbol: base64EncodeString}
    arming:
      kind: macro_decl
      path: lib/backend/system_codegen.cpp
      pattern: 'ONE_ARG_BUILTIN\(base64EncodeString'
    dependencies: [llvm-codegen]
    dependency_constructor: "eshkol_builtin_base64_encode_string"
    dependency_paths: [lib/core/system_builtins.c]

  - id: language_surface_exercise
    feature: Exposure engines exercise the full language surface
    entry_points:
      - {path: scripts/language_coverage.py, symbol: main}
    arming:
      kind: runtime_event
      path: scripts/language_coverage.py
    pattern: language_surface_coverage

  - id: quantum_qrng_route
    feature: Moonlab Bell-verified QRNG route for quantum-random on opt-in native builds
    entry_points:
      - {path: lib/quantum/quantum_rng_wrapper.c, symbol: eshkol_qrng_uint64}
      - {path: lib/quantum/quantum_rng_wrapper.c, symbol: eshkol_qrng_source_label}
    arming:
      kind: compile_definition
      path: lib/quantum/quantum_rng_wrapper.c
      pattern: ESHKOL_MOONLAB_QRNG_ENABLED
    dependencies: [quantum-backend]
    dependency_constructor: "moonlab_qrng_bytes|moonlab-qrng"
    dependency_paths: [lib/quantum/quantum_rng_wrapper.c]

  # ── ADR-0010 assurance-gap closures (A10/A11/A12) ─────────────────────
  - id: package_surface_manifest
    feature: >
      Declared package_surface manifest (ADR-0010 gap A10) is the single
      source of truth for what a release archive must contain, checked
      against a staged package directory before it is tar'd/zipped.
    entry_points:
      - {path: scripts/check_package_manifest.py, symbol: evaluate}
    arming:
      kind: runtime_event
      path: scripts/check_package_manifest.py
    pattern: package_manifest_complete

  - id: diagnostic_golden_corpus
    feature: >
      Diagnostic golden-corpus (ADR-0010 gap A11, type_diagnostic category):
      input program -> expected diagnostic message/code/span, graded per
      case with drift on either axis failing the gate.
    entry_points:
      - {path: scripts/check_diagnostic_corpus.py, symbol: evaluate_case}
    arming:
      kind: runtime_event
      path: scripts/check_diagnostic_corpus.py
    pattern: diagnostic_corpus_clean
    dependencies: [frontend-reader]
    dependency_constructor: "tests/diagnostics"
    dependency_paths: [tests/diagnostics]

  - id: leak_audit_clean
    feature: >
      The audit behind the armed detector: the compiler was built with
      ASan+LSan (Homebrew llvm@21 — Apple's system clang has no working
      detect_leaks) and every real workload run under it (AOT compile, AOT
      run, -r JIT, --vm, REPL, agent-FFI), producing 17 distinct allocation
      sites which were triaged one at a time. Two structural defects made
      the lane unable to fail before this: exe/eshkol-run.cpp's
      __lsan_default_options() returned exitcode=0, so a hello-world compile
      leaking 248 387 bytes still exited 0; and exe/eshkol-repl.cpp ends via
      std::_Exit(), which skips LSan's atexit check, so the one long-lived
      process this project ships was invisible to leak detection entirely.
      Both are fixed, the driver's own mixed-ownership strdup()s are given a
      real owner, and tests/memory/leak_audit_gate.sh now fails the lane on
      any leak the justified suppression file does not name.
    entry_points:
      - {path: exe/eshkol-run.cpp, symbol: __lsan_default_options}
      - {path: exe/eshkol-repl.cpp, symbol: repl_clean_exit}
      - {path: exe/eshkol-run.cpp, symbol: intern_driver_string}
    arming:
      kind: runtime_event
      path: tests/memory/leak_audit_gate.sh
    pattern: leak_audit_gate
    dependencies: [oalr-memory]
    dependency_constructor: "LSAN_OPTIONS"
    dependency_paths: [.icc/lsan-suppressions.txt, exe/eshkol-run.cpp, exe/eshkol-repl.cpp]

  - id: leak_detection_armed
    feature: >
      ASan leak detection (ADR-0010 gap A12) is armed (detect_leaks=1) in
      the linux-x64-asan-ubsan CI lane with a checked-in, reasoned
      suppression file (.icc/lsan-suppressions.txt). ESHKOL_ARENA_POISON
      coverage extends to the full VM route: the region-evacuator
      (lib/backend/vm_region_evac.c, PR #461) already had it, and the
      lower-level VM arena primitives underneath it — lib/backend/
      vm_arena.h, which every non-evacuated VM path allocates through —
      gained it here (vm_arena_reset's block-recycle aliasing case,
      vm_arena_block_destroy, vm_region_pop/vm_region_stack_destroy).
    entry_points:
      - {path: lib/backend/vm_region_evac.c, symbol: vm_evac_poison}
      - {path: lib/backend/vm_arena.h, symbol: vm_arena_poison_range}
    arming:
      kind: runtime_event
      path: scripts/check_leak_detection_selftest.sh
    pattern: leak_detection_gate
    dependencies: [oalr-memory]
    dependency_constructor: "ESHKOL_ARENA_POISON"
    dependency_paths: [lib/backend/vm_region_evac.c, lib/core/runtime_arena_core.cpp]

# --------------------------------------------------------------------------
# INVARIANTS — one per incident class from the adversarial campaign
# --------------------------------------------------------------------------
invariants:

  # 1. Dispatch parity is a classified, executable contract.  Literal table
  #    equality is incorrect: each backend intentionally owns internal helpers
  #    and opt-in native-only intrinsics.  The ratchet requires every native
  #    surface symbol to be VM-supported or consciously justified, and the
  #    runtime gate differentially executes the shared subset three ways.
  - id: INV-dispatch-table-completeness
    kind: intended-invariant
    incident: vm-parity-gap
    severity: high
    description: >
      Every native codegen symbol is present in the VM surface or explicitly
      classified in PARITY.tsv.  CLASSIFICATION COMPLETENESS ONLY — this
      invariant's guard reads source text (names scraped from
      llvm_codegen.cpp, statuses hand-typed in PARITY.tsv) and cannot tell
      whether a `vm-supported` row is true of the running system.  The claim
      that the supported subset "produces identical output" was previously
      folded into this description while nothing checked it; it now lives in
      INV-engine-semantic-parity, which executes both engines.
    invariant_name: classified-native-vm-dispatch-parity
    impl: {path: scripts/vm_parity_audit.py, symbol: audit}
    reference: {path: scripts/vm_parity_audit.py, symbol: vm_surface}
    guard:
      path: scripts/vm_parity_audit.py
      symbol: audit
      pattern: 'unratcheted\s*=\s*sorted'
    evidence:
      trace_name_pattern: '^vm_parity_gate$'
      max_age_days: 45

  # 2. ffi-registration-completeness (incident #250), encoded as dependency-presence.
  #    A declared FFI/system builtin must have its runtime symbol DEFINED (the
  #    link registration).  Armed by the codegen declaration; dependency is the
  #    runtime definition site.  Expected PASS (the #250 fix is in tree).
  # 1b. engine-semantic-parity. The dangerous class: a construct that RUNS on
  #     both engines and returns a DIFFERENT VALUE. Name-resolution parity,
  #     ledger classification and one-engine coverage all pass through it —
  #     `(if '() 'T 'F)` was T natively and F on the VM with every gate green,
  #     as were kb-query's result shape, unify's argument order, logic-var?'s
  #     answer and kb-retract!'s matching rule. Evidence is EXECUTED: the
  #     corpus is run on both engines and stdout compared, with a VM failure
  #     on a previously-agreeing program treated as a regression rather than
  #     an out-of-subset reclassification. The generic ICC `exercise` kind
  #     records freshness only; it does not inspect numeric event payloads.
  #     The repository-owned threshold checker below is therefore a required
  #     companion and evaluates the allowed divergence count and coverage
  #     floor from the event's structured threshold payload.
  - id: INV-engine-semantic-parity
    kind: exercise
    incident: vm-parity-silent-wrong-answer
    severity: critical
    fidelity: runtime
    description: >
      Every corpus program must compute the SAME ANSWER under native LLVM and
      under the bytecode VM, and the differential construct-coverage fraction
      must hold its recorded floor.  Verified by executing both engines, not
      by reading source text.
    capability: engine_semantic_parity
    window_days: 30
    threshold:
      differential_fraction: minimum_differential_fraction
      new_divergent_programs: 0
      regressed_programs: 0
    threshold_checker: scripts/check_engine_parity_threshold.py
    impl: {path: scripts/run_engine_parity_coverage.py, symbol: main}
    evidence:
      trace_event_kind: runtime_event
      trace_name_pattern: engine_semantic_parity

  - id: INV-ffi-registration-completeness
    kind: dependency-presence
    incident: ffi-link-registration-missing
    severity: critical
    fidelity: grep
    description: >
      Every declared FFI/system builtin (base64 family here) that the codegen
      emits a call to must have a matching runtime symbol definition; a declared
      builtin with no link registration is the class that broke base64-string
      (#250) and the WASM glue.
    capability: base64_ffi_builtin

  # 3. quantum-random-routing: the opt-in source label and byte path must
  #    agree that quantum-random reaches Moonlab's Bell-verified QRNG. The
  #    default/WASM classical fallback is intentional and explicitly labelled;
  #    this invariant is specifically armed by ESHKOL_MOONLAB_QRNG_ENABLED.
  - id: INV-quantum-random-routes-to-moonlab-qrng
    kind: dependency-presence
    incident: quantum-entropy-placeholder
    severity: critical
    fidelity: grep
    description: >
      When the Moonlab QRNG compile definition is enabled, the core
      quantum-random wrapper must call moonlab_qrng_bytes and report the
      machine-readable source label moonlab-qrng. This prevents a regression
      to an unlabeled bare PRNG while preserving the explicit
      classical-fallback contract for default and WASM builds.
    capability: quantum_qrng_route

  # 4. language-surface-exercise, encoded as exercise (runtime-bound).  Binds to
  #    the language_surface_coverage runtime_event scripts/language_coverage.py
  #    emits.  The generic exercise kind is PRESENCE+RECENCY based: it FAILs when
  #    other traces exist but no coverage trace is fresh (engines not run), and
  #    PASSes when a fresh coverage trace is present.  The committed 76.6%
  #    covered_fraction floor is enforced by tests/coverage/coverage_policy.json
  #    and the total-language completion oracle; the generic checker does not
  #    interpret numeric event fields.  The dedicated completion oracle also
  #    requires zero uncovered high-risk constructs.
  - id: INV-language-surface-exercise
    kind: exercise
    incident: language-surface-under-exercised
    severity: high
    fidelity: runtime
    description: >
      The exposure engines must produce a fresh language_surface_coverage
      runtime_event (evidence the language surface is being exercised).  Bind
      the covered_fraction threshold in the readiness oracle and committed
      coverage policy, not here.
    capability: language_surface_coverage
    window_days: 30
    evidence:
      trace_event_kind: runtime_event
      trace_name_pattern: language_surface_coverage

  # 5. wasm-import-glue-equality, encoded as key-space-equality.  The env-import
  #    stub key space must be IDENTICAL across both JS glue files — any import a
  #    WASM needs must be provided by both.  Expected to FAIL right now: a live
  #    drift (eshkol_qrng_* present in web/ glue but not site/ glue, and
  #    init_global_arena/tagged_cons_set present in site/ glue but not web/).
  - id: INV-wasm-import-glue-equality
    kind: key-space-equality
    incident: wasm-import-glue-drift
    severity: critical
    fidelity: grep
    description: >
      The env-import stub key space (eshkol_*/region_* helpers) must be equal
      across site/static/eshkol-runtime.js and web/eshkol-repl.js; a stub in one
      glue file but not the other is exactly the drift that caused the live-site
      "function import requires a callable" outage.  scripts/check_wasm_imports.py
      is the runtime gate; this is its static twin.
    sites:
      - id: site-runtime-glue
        path: site/static/eshkol-runtime.js
        key_pattern: '(eshkol_[A-Za-z0-9_]+|region_[A-Za-z0-9_]+)\s*:'
      - id: web-repl-glue
        path: web/eshkol-repl.js
        key_pattern: '(eshkol_[A-Za-z0-9_]+|region_[A-Za-z0-9_]+)\s*:'

  # 6. OALR interior-pointer deep-walk (ESH-0214d), encoded as key-space-equality.
  #    Every interior-pointer heap subtype declared in the enum must have a case
  #    in the region evacuator; the pattern enumerates exactly the deep-walk set
  #    (leaf subtypes like STRING/SYMBOL/BIGNUM are intentionally excluded).
  #    Expected PASS (the ESH-0214d fix added the consciousness/logic cases).
  #
  #    2026-08-26 (SW-66): both sites used to be the SAME hand-typed 16-name
  #    alternation, so the comparison always matched itself regardless of the
  #    real source -- it silently included DNC/SDNC/TAYLOR (which had neither
  #    a case in evac_kind_for's switch nor any classification at all) and
  #    never encoded RATIONAL at all (added to evac_kind_for's real deep-walk
  #    switch, but invisible to this invariant because RATIONAL was never in
  #    either copy of the list), and would have stayed green even after
  #    TAYLOR's real fix (a `case HEAP_SUBTYPE_TAYLOR: return EVAC_TAYLOR;`
  #    arm) without anyone updating this file by hand. `icc architecture-verify
  #    --cxx-backend libclang` caught the gap because it resolves each site's
  #    identifier set from the real source, not the hand-typed pattern. Both
  #    sites are now GENERIC, self-updating patterns over real source: the
  #    enum side reads the [DEEPWALK]/[LEAF] classification tag
  #    inc/eshkol/eshkol.h's HEAP_SUBTYPE_* enum carries on every member, and
  #    the evacuator side reads every `case HEAP_SUBTYPE_X: return EVAC_...;`
  #    arm evac_kind_for actually has -- neither side is a maintained list any
  #    more. Retagging a member without also giving it a real case in that
  #    switch (or vice versa) is exactly the class of regression this
  #    invariant now catches.
  - id: INV-oalr-interior-pointer-deepwalk
    kind: key-space-equality
    incident: region-evac-leaf-copy
    severity: critical
    fidelity: grep
    description: >
      evac_kind_for must map every interior-pointer heap subtype to a deep-walk
      EvacKind; dropping a subtype to a shallow leaf copy leaves dangling
      interior pointers after region evacuation (KB/FACT/SUBSTITUTION/WORKSPACE
      were the ESH-0214d regression; DNC/SDNC/TAYLOR were the SW-66
      regression class -- never classified at all).  The subtype enum's own
      [DEEPWALK] tags and the evacuator switch's actual deep-walk case arms
      must resolve the identical subtype set.
    sites:
      - id: heap-subtype-enum
        path: inc/eshkol/eshkol.h
        key_pattern: 'HEAP_SUBTYPE_([A-Z0-9_]+)\s*=\s*\d+,\s*//.*\[DEEPWALK\]'
      - id: region-evacuator-switch
        path: lib/core/runtime_regions.cpp
        key_pattern: 'case\s+HEAP_SUBTYPE_(\w+)\s*:\s*return\s+EVAC_'

  # 6b. The SAME invariant for the bytecode VM's Stage-1 evacuator (SW-14).
  #     It matters MORE here than natively: a VM `Value` addresses the heap by a
  #     small integer, so a subtype whose interior references the walk misses
  #     cannot be recovered by any pointer scan — the object is freed while live
  #     and a later allocation aliases its index, which is a silently wrong
  #     VALUE rather than a crash. vm_region_evac.c therefore classifies the
  #     whole tag space with a row per subtype and a startup assertion; this
  #     invariant is the machine-checked half, requiring the HeapType enum and
  #     the coverage table to resolve the identical subtype set.
  # 2026-08-26 audit (B5/N3): both sites used to be the SAME 28-name
  # hand-typed alternation copied to both files, so this always matched
  # itself no matter what either file actually contained — a subtype that
  # exists in the real enum but was never added to either copy of the list
  # would be invisible on BOTH sides. Both patterns are now fully generic
  # over `HEAP_<name> = <n>,` declarations and `[HEAP_<name>] =` designated-
  # initializer rows respectively (a negative lookbehind excludes unrelated
  # `HEAP_BUDGET_*` env-var name mentions in nearby comments/strings, which
  # share the `HEAP_` prefix but never appear inside an enum declaration or a
  # table row) — neither side is a maintained list anymore; this currently
  # verifies at the real 28/28.
  - id: INV-vm-region-evac-subtype-total
    kind: key-space-equality
    incident: vm-region-evac-uncovered-subtype
    severity: critical
    fidelity: grep
    description: >
      Every HeapType the bytecode VM declares must have an explicit row in the
      Stage-1 region evacuator's coverage table. A subtype with no row would be
      zero-filled by the designated initializer and read as "walk this, I know
      how" — the one answer a forgotten subtype must never give. The enum and
      the table must resolve the identical subtype set.
    sites:
      - id: vm-heap-type-enum
        path: lib/backend/vm_core.c
        key_pattern: '(?<![A-Za-z0-9_])HEAP_([A-Z0-9_]+)\s*=\s*\d+,'
      - id: vm-region-evac-coverage-table
        path: lib/backend/vm_region_evac.c
        key_pattern: '(?<![A-Za-z0-9_])\[HEAP_(\w+)\]\s*='

  # 7. AD-exactness, encoded as dependency-presence.  The default derivative path
  #    must construct the exact dual/jet tangent, never a finite-difference
  #    approximation.  Armed by the derivative-op dispatch; dependency is the
  #    dual/jet constructor set.  Expected PASS.
  - id: INV-ad-exact-no-finite-differences
    kind: dependency-presence
    incident: ad-finite-difference-regression
    severity: high
    fidelity: grep
    description: >
      When the derivative/gradient codegen is armed (ESHKOL_DERIVATIVE_OP), the
      default path must construct an exact dual/jet tangent
      (createDualNumber/makeDual8/makeDual4/seedForwardAndPush) — a finite-
      difference fallback would silently degrade every default gradient.
      SCOPE: this is a presence check over the NATIVE codegen's exact-jet
      constructors. It answers "is the native default gradient still built on
      an exact jet", which it answers correctly. It does NOT observe the
      bytecode VM, and presence of an exact constructor does not exclude a
      finite difference elsewhere — both held at once while VM curl shipped a
      central difference at h = 1e-7 (ledger SW-46 / SW-51). Absence of a
      difference quotient on either engine is enforced by
      scripts/gate_ad_shared_node_model.py and the criterion below.
    capability: exact_ad_default_gradient

  # 7b. AD carrier declaration, encoded as key-space-equality. Every AD
  #     operator that carries a VM parity row must also carry a carrier
  #     declaration, so an op cannot be promoted to vm-supported without
  #     stating which differentiation carrier answers it on each substrate.
  #     The declaration itself is re-derived from source by the gate; this
  #     invariant guards the weaker but cheaper property that the two key
  #     spaces cannot drift apart. Expected PASS; adding an AD op to
  #     PARITY.tsv without a manifest row FAILs it.
  # 2026-08-26 audit (B5/N3): both sites used to be the SAME 10-name
  # hand-typed alternation, so a new AD op added to the manifest without
  # also editing this YAML (or vice versa) was invisible to both patterns.
  # The manifest side is now GENERIC: it reads every `"op:X"` string
  # literally appearing inside the manifest's own `parity_rows:` cross-
  # references (.icc/ad-carrier-manifest.yaml's own contract already
  # requires those to name real PARITY.tsv rows — see the file's header
  # comment), so adding a new `- op: foo` entry with `parity_rows:
  # ["op:FOO"]` is picked up automatically. tests/vm_parity/PARITY.tsv has
  # no equivalent structural marker distinguishing its ~10 AD-family rows
  # from its ~100 non-AD rows (arithmetic, special forms, etc.), so the
  # PARITY.tsv side remains the curated AD-operator category (mirroring
  # inc/eshkol/eshkol.h's own "Automatic differentiation operators" enum
  # block) rather than a full generic derivation — currently 10/10 against
  # the manifest's real content. scripts/gate_ad_shared_node_model.py (a
  # separate, fully source-derived Python gate already wired into
  # assurance-gates and this repo's completion oracles as
  # `ad_carrier_model_clean`) remains the authoritative, no-manual-list
  # check for this exact property; this invariant is a lighter parity-
  # availability cross-check, not a replacement for it.
  - id: INV-ad-carrier-declared-for-every-vm-op
    kind: key-space-equality
    incident: ad-carrier-fork-undeclared
    severity: high
    fidelity: grep
    description: >-
      Eshkol differentiates on two substrates with carriers that share no node
      vocabulary. Every AD operator named in the VM parity manifest must have a
      row in the AD carrier manifest naming its native carrier, its VM carrier
      and whether each is exact. op:GRADIENT was promoted from gap to
      vm-supported on an undeclared VM-private forward-dual carrier and no gate
      could see it, because the only cross-engine check compared program output
      and two independently correct implementations agree on output.
    sites:
      - id: vm-parity-ad-ops
        path: tests/vm_parity/PARITY.tsv
        key_pattern: '(op:(?:GRADIENT|JACOBIAN|HESSIAN|DIVERGENCE|CURL|LAPLACIAN|DERIVATIVE_N|DERIVATIVE|DIRECTIONAL_DERIV|DIFF))\b'
      - id: ad-carrier-manifest-ops
        path: .icc/ad-carrier-manifest.yaml
        key_pattern: '"(op:[A-Z_]+)"'

  # 8. TCO tail-position coverage, encoded as key-space-equality.  The core
  #    tail-transparent forms (if / let* family / sequence) must each be handled
  #    by isTailPosition; cond/case/when reach it desugared to these forms.
  #    Expected PASS; removing a case (a TCO regression) FAILs it.
  # 2026-08-26 audit (B5/N3): the 2026-08-26 audit's key-space gap census
  # measured this invariant grading only 6 of the 113 ESHKOL_*_OP members —
  # not itself a bug (most of the 113 are arithmetic/data ops that never
  # belong in a tail-position classifier, so comparing against the full op
  # registry would be the wrong comparison, not a stricter one), but it did
  # surface a real, previously-untracked gap while re-deriving this list
  # against TailCallCodegen::isOperationInTailPosition's actual case list
  # (lib/backend/tail_call_codegen.cpp): that switch also has an explicit
  # `case ESHKOL_LAMBDA_OP:` arm (a lambda body is in tail position) which
  # neither copy of the old 6-name list ever named, so a regression dropping
  # LAMBDA_OP handling could not have been caught. Both sites now name the
  # same 7 forms isOperationInTailPosition actually classifies. This remains
  # a curated list, not a fully generic derivation (unlike
  # INV-oalr-interior-pointer-deepwalk / INV-vm-region-evac-subtype-total
  # above): isOperationInTailPosition shares this file with a second,
  # unrelated switch (the mutual-tail-call-site walker, which legitimately
  # has its own direct cases for cond/when/unless/and/or/case/guard — see
  # #478's ADR-0000 Stage 4 mutual-tail-recursion fix) and a single grep
  # pattern cannot reliably scope to one function's case arms without also
  # picking up the other's, so an occurrence-based regression check (a case
  # removed from EITHER function is still caught, since its token then
  # disappears from that site's real match set) is the honest limit of this
  # invariant's fidelity here.
  - id: INV-tco-tail-position-coverage
    kind: key-space-equality
    incident: tco-tail-position-gap
    severity: medium
    fidelity: grep
    description: >
      The tail-call analysis (TailCallCodegen::isOperationInTailPosition) must
      treat every core tail-transparent form it actually classifies as
      tail-propagating so proper tail calls in if/let/let*/letrec/letrec*/
      lambda/begin (and cond/case/when after desugaring to these) are marked
      musttail; a dropped case reintroduces stack growth in tail loops.
    sites:
      - id: core-op-enum
        path: inc/eshkol/eshkol.h
        key_pattern: '(ESHKOL_(?:IF|LET|LET_STAR|LETREC|LETREC_STAR|LAMBDA|SEQUENCE)_OP)'
      - id: tail-position-analysis
        path: lib/backend/tail_call_codegen.cpp
        key_pattern: '(ESHKOL_(?:IF|LET|LET_STAR|LETREC|LETREC_STAR|LAMBDA|SEQUENCE)_OP)'

  # 9-11. ADR-0010 v1.4-connection gate: A10/A11/A12 were measured
  #       NOT IMPLEMENTED by the v1.4-connection oracle. Each of these three
  #       closes one gap with a real gate script (scripts/check_*.py) plus a
  #       --self-test fixture proving the gate can go RED, per this
  #       project's standing "a gate that cannot fail is not a gate" policy.
  #       The actual PASS/FAIL enforcement each gate's trace feeds is a
  #       runtime_event criterion in .icc/completion-oracles.yaml (the
  #       established home for check_*.py gates — see check_ledger_
  #       integrity.py / check_oracle_schema.py / gate_no_silent_wrong.py,
  #       none of which have an architecture-model.yaml invariant either);
  #       these three are dependency-presence invariants recording that each
  #       capability's declared source of truth exists on disk.
  - id: INV-package-manifest-enforced
    kind: dependency-presence
    incident: packaging-manifest-gap
    severity: high
    fidelity: grep
    description: >
      A release archive's staged contents (binaries, static libraries,
      stdlib artifacts, the full lib/**/*.esk source mirror, docs) are
      checked against a single declared manifest (.icc/package-manifest.yaml)
      before the archive is tar'd/zipped, so a packaging-step refactor that
      silently drops a required file fails CI instead of shipping. Actual
      PASS/FAIL is graded by the `package_manifest_complete` runtime_event
      criterion (.icc/completion-oracles.yaml).
    capability: package_surface_manifest

  - id: INV-diagnostic-corpus-no-drift
    kind: dependency-presence
    incident: diagnostic-quality-boolean-gap
    severity: medium
    fidelity: grep
    description: >
      Diagnostic quality is graded per-case against a golden corpus
      (tests/diagnostics/), not as a single pass/fail boolean: each case
      pins the diagnostic's message substring(s) and its reported
      file:line:col span, seeded from named historical incidents (ESH-0364
      wrong-file attribution, ESH-0365 closing-paren span, arity-fatal,
      type-ascription, linearity, and the guard-catchable runtime type
      errors from PRs #451/#452), so a diagnostic that silently changes
      text or drifts to the wrong span is caught. Actual PASS/FAIL is
      graded by the `diagnostic_corpus_clean` runtime_event criterion
      (.icc/completion-oracles.yaml).
    capability: diagnostic_golden_corpus

  - id: INV-leak-detection-armed
    kind: dependency-presence
    incident: leak-detection-off-gap
    severity: high
    fidelity: grep
    description: >
      The linux-x64-asan-ubsan CI lane runs with LSan leak detection ON
      (detect_leaks=1) against a checked-in, per-entry-reasoned suppression
      file (.icc/lsan-suppressions.txt) rather than blanket detect_leaks=0,
      and ESHKOL_ARENA_POISON validation now covers the full VM route —
      both the region-evacuator (lib/backend/vm_region_evac.c) and the VM
      arena primitives underneath it (lib/backend/vm_arena.h), tested by
      tests/core/vm_arena_poison_test.cpp's armed/disarmed ctest pair — so
      a real leak or a poisoned-block miss on either substrate is reported,
      not silently discarded. Actual PASS/FAIL is graded by the
      `leak_detection_gate` runtime_event criterion
      (.icc/completion-oracles.yaml).
    capability: leak_detection_armed

  # 12. Object-header layout dependence is ratcheted, not surveyed.  A heap
  #    object carries no discriminator for its own layout — `subtype` lives
  #    inside the header you need the layout to find — so a site missed by an
  #    ABI migration produces wrong data rather than an error.  The set of
  #    layout-dependent sites is therefore established by machine and
  #    re-established on every commit, and new sites are refused.
  #    Expected PASS; introducing a raw header offset outside the accessor FAILs.
  - id: INV-object-abi-site-ratchet
    kind: intended-invariant
    incident: object-abi-migration-blast-radius
    severity: critical
    description: >
      Every site that depends on the current object-header layout is enumerated
      by scripts/abi_header_inventory.py across fourteen detectors in three
      layers (lexical token matching, libclang semantic resolution, and the
      compiler's own emitted IR), baselined per class and file at
      .icc/abi-header-baseline.json, and refused when a commit adds one.  The
      classes a hand survey misses are the reason this is machined:  intra-header
      field offsets (-7/-6/-4) that a search for -8 cannot see, raw byte
      arithmetic that names neither the header type nor the accessor macro, and
      persistent cache keys that omit the object ABI — a detector for an absence.
      The tool also pins the layout it scans for against the declared struct, so
      a header change that outruns the tool is a hard failure rather than a
      silently narrowed scan.
    invariant_name: object-header-layout-dependence-ratchet
    impl: {path: scripts/abi_header_inventory.py, symbol: do_check}
    reference: {path: scripts/abi_header_inventory.py, symbol: verify_layout_pin}
    guard:
      path: scripts/abi_header_inventory.py
      symbol: do_check
      pattern: 'violations\.append'
    evidence:
      trace_name_pattern: '^abi_object_header_ratchet$'
      max_age_days: 45

  # 13. A mixed-ABI link must be impossible, not merely unlikely.  The object
  #     header's absence of a discriminator means a compiler and a runtime built
  #     against different layouts link cleanly and read each other's objects at
  #     the wrong offsets — silently.  The guard symbol's NAME encodes the
  #     layout, so disagreement becomes an undefined symbol at link time.
  #     Expected PASS; dropping either half of the pairing FAILs it.
  - id: INV-object-abi-mixed-link-refused
    kind: intended-invariant
    incident: object-abi-silent-mixed-link
    severity: critical
    description: >
      The runtime archive defines exactly one object-ABI guard symbol whose name
      is derived by token pasting from the layout numbers, and the code generator
      plants a reference to it in every emitted LLVM module as a data relocation
      held live by llvm.used.  Halves built against different layouts therefore
      name different symbols and the link fails, naming the layout the code
      expected, instead of producing a binary that returns wrong answers.  Both
      ends are required: a definition nothing references, or a reference nothing
      defines, restores the silent failure.  Deliberately not emitted for wasm32,
      which resolves the runtime surface through JS imports rather than this
      archive — see ADR-0012 Stage 2.
    invariant_name: object-abi-guard-symbol-pairing
    impl: {path: lib/backend/memory_codegen.cpp, symbol: emitObjectAbiGuard}
    reference: {path: lib/core/abi_fingerprint.c, symbol: eshkol_abi_fingerprint_name}
    guard:
      path: lib/backend/memory_codegen.cpp
      symbol: emitObjectAbiGuard
      pattern: 'appendToUsed'
    evidence:
      trace_name_pattern: '^abi_layout_pin$'
      max_age_days: 45

  # 14. Closed-enum dispatch exhaustiveness, encoded as intended-invariant with
  #    a source-derived guard.  THE CLASS: a dispatch switch over a closed enum
  #    whose `default:` encodes an ASSUMPTION instead of failing, in a language
  #    where the enum can grow without the switch ever knowing.  PR #498 found
  #    four tensor-valued AD node types falling into an early `default:` in
  #    eshkol_tensor_backward_dispatch that did nothing at all — gradients
  #    exactly 0.0, no diagnostic, exit 0 — behind a comment asserting the case
  #    was impossible, reasoned from a numeric band of enum values that those
  #    four node types had already left.  ESH-0214d is the same shape one
  #    subsystem over.  The primary enforcement is COMPILE-TIME
  #    (-Werror=switch-enum per translation unit, or
  #    ESHKOL_EXHAUSTIVE_SWITCH_BEGIN/_END per switch); this invariant is the
  #    source-derived second half, so the property is re-measured on lanes
  #    whose toolchain has no such diagnostic (MSVC) and so REMOVING the
  #    enforcement is itself caught.  Expected PASS; adding a `default:` to any
  #    registered site, or an enum member no site names, FAILs it.
  - id: INV-closed-enum-dispatch-exhaustive
    kind: intended-invariant
    incident: closed-enum-dispatch-default
    severity: critical
    description: >
      No dispatch switch over a CLOSED enum may carry a `default:`.  The gate
      re-derives each enum's members from its own DEFINITION (not from a
      hand-typed list that would drift in exactly the situation being guarded
      against) and requires every registered dispatch site to name all of them
      with no default, and to be armed — the translation unit listed in
      CMakeLists' eshkol_require_exhaustive_dispatch(), or the switch wrapped
      in ESHKOL_EXHAUSTIVE_SWITCH_BEGIN/_END.  It additionally requires that
      every ad_node_registry.def row declaring BRIDGE names a backward function
      that is DEFINED in lib/bridge/tensor_backward.cpp, and that the registry
      values are dense and equal to their ordinal, because the backward table
      is a flat array indexed by node type.

      SCOPE, stated so the invariant is not read as more than it is: this
      covers switches over values the PROGRAM ITSELF produces.  A switch over a
      value that arrives from outside — a bytecode opcode, a subtype byte read
      off a header or a file, an integer crossing an FFI boundary — dispatches
      over an OPEN set whatever the enum declares, keeps its `default:`, and
      the requirement there is that the default be a LOUD, value-naming abort.
      Demanding exhaustiveness of those would be enforcing a fiction.
    invariant_name: closed-enum-dispatch-carries-no-default
    impl: {path: scripts/gate_exhaustive_dispatch.py, symbol: grade}
    reference: {path: scripts/gate_exhaustive_dispatch.py, symbol: enum_members}
    guard:
      path: scripts/gate_exhaustive_dispatch.py
      symbol: grade_site
      # The finding string the check emits. Deliberately a literal rather than
      # a regex over source structure: this guard's job is to prove the check
      # itself is still present in grade_site, and a guard written as clever
      # pattern-matching is one more thing that can quietly stop matching.
      pattern: 'carries a .default:.'
    evidence:
      trace_name_pattern: '^closed_enum_dispatch_exhaustive$'
      max_age_days: 45

  # 14b. The AD node registry as key-space-equality — the cheap, grep-fidelity
  #     half of the same property.  A node type may not exist in the enum
  #     without a registry row declaring what its reverse pass does, because
  #     the enum IS generated from those rows.  This encodes the requirement so
  #     a future change that un-generates the enum (returning to a hand-written
  #     member list) is caught by the key spaces diverging rather than by
  #     someone noticing.
  - id: INV-ad-node-declared-in-registry
    kind: key-space-equality
    incident: ad-node-type-without-backward-disposition
    severity: critical
    fidelity: grep
    description: >
      Every AD node type is declared in inc/eshkol/ad_node_registry.def, which
      states its payload kind and what eshkol_tensor_backward_dispatch does for
      it — a registered backward, a registered refusal, or an explicit "its
      adjoint lives on the scalar sweep" — and the enum, the dispatch arms and
      the backward table are all generated from those rows.  The checkable
      equality is the one the generation cannot enforce on its own: every row
      that CLAIMS a bridge backward must name a function that is actually
      DEFINED, and every backward function that exists must be claimed by a
      row.  A row naming a missing function already fails to compile; this
      catches the other direction — a backward rule that exists, works, and is
      wired to nothing, which is how seven bridge ops sat with correct
      backwards registered while the dispatcher dropped their gradients.
    sites:
      - id: ad-node-registry-bridge-rows
        path: inc/eshkol/ad_node_registry.def
        key_pattern: '^ESHKOL_AD_NODE\([^)]*\bBRIDGE,\s*(\w+)\)'
      - id: bridge-backward-definitions
        path: lib/bridge/tensor_backward.cpp
        key_pattern: '^extern "C" void (tensor_\w+_backward)\(ad_node_t\*'
