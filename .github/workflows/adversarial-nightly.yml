name: Adversarial Nightly (P8 escape-closure)

# NEW workflow (does not touch ci.yml / release.yml / pages.yml). Runs the P8
# escape-closure pillar at full depth plus the heavy lanes that are too slow for
# the per-PR CI budget: the full native-vs-VM arity sweep, the TSan concurrency
# corpus, the packaging (Homebrew / install-script) lanes, and the
# large-single-file AOT compile-time shape (Axis 9b below).
#
# Nightly + manual only. The escape-matrix and TSan lanes are real gates; the
# packaging lane is advisory (continue-on-error) and only alerts; the
# large-single-file compile bench is a real gate at a deliberately generous
# ceiling (measuring the shape continuously, not fixing its cost).

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC nightly
  workflow_dispatch: {}

permissions:
  contents: read

env:
  LLVM_MAJOR: '21'

concurrency:
  group: adversarial-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Full P8 escape-closure pillar (JIT + AOT + VM lanes, full arity sweep).
  # ---------------------------------------------------------------------------
  escape-matrix:
    name: escape-matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm@${LLVM_MAJOR} cmake ninja readline pcre2 sqlite

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y cmake ninja-build \
            llvm-${LLVM_MAJOR} llvm-${LLVM_MAJOR}-dev lld-${LLVM_MAJOR} \
            libreadline-dev pkg-config libssl-dev libncurses-dev \
            libpcre2-dev libsqlite3-dev git python3

      - name: Configure & build
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            LLVM_CONFIG="$(brew --prefix llvm@${LLVM_MAJOR})/bin/llvm-config"
          else
            LLVM_CONFIG="/usr/bin/llvm-config-${LLVM_MAJOR}"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_CONFIG"
          cmake --build build --target eshkol-run eshkol-vm-standalone-test stdlib --parallel

      - name: Run P8 escape-closure pillar (full)
        shell: bash
        run: |
          set -uxo pipefail
          bash scripts/run_p8_escape.sh --full --build-dir build

      - name: Upload escape-matrix trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escape-matrix-trace-${{ matrix.os }}
          path: scripts/icc_traces/escape_matrix.jsonl
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # bench/pgo_corpus/ Stage-1 smoke consumer (ADR 0007). The corpus (5
  # programs) had zero callers anywhere before this: nothing compiled it,
  # nothing ran it. Full PGO wiring (eshkol-pgo-train/-merge/-verify driving
  # -fprofile-instr-generate/-use over this corpus) is a tracked BUILD ITEM
  # against ADR 0007, targeted v1.5.0 — real orchestration work, not a
  # one-line follow-up. Until that lands, this job is the floor: every
  # corpus program must still compile and run clean, under both JIT and
  # AOT, with identical output between the two. Cheap (no LLVM PGO
  # instrumentation, just a normal build), so nightly is generous headroom
  # rather than a runtime-cost necessity — kept out of the PR-blocking path
  # so a corpus-authoring PR doesn't need a second full build in ci.yml.
  # ---------------------------------------------------------------------------
  pgo-corpus-smoke:
    name: pgo-corpus-smoke (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain (macOS)
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm@${LLVM_MAJOR} cmake ninja readline pcre2 sqlite

      - name: Configure & build
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_PREFIX="$(brew --prefix llvm@${LLVM_MAJOR})"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_PREFIX/bin/llvm-config"
          cmake --build build --target eshkol-run stdlib --parallel

      - name: bench/pgo_corpus smoke (JIT + AOT + parity)
        shell: bash
        env:
          BUILD_DIR: build
        run: bash scripts/run_pgo_corpus_smoke.sh

  # ---------------------------------------------------------------------------
  # Axis 5 nightly: the concurrency corpus under ThreadSanitizer.
  # ---------------------------------------------------------------------------
  concurrency-tsan:
    name: concurrency-tsan (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain (Linux)
        shell: bash
        run: |
          set -euxo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y cmake ninja-build \
            llvm-${LLVM_MAJOR} llvm-${LLVM_MAJOR}-dev lld-${LLVM_MAJOR} clang-${LLVM_MAJOR} \
            libreadline-dev pkg-config libssl-dev libncurses-dev \
            libpcre2-dev libsqlite3-dev git python3

      - name: TSan build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="/usr/bin/llvm-config-${LLVM_MAJOR}" \
            -DCMAKE_C_COMPILER="clang-${LLVM_MAJOR}" \
            -DCMAKE_CXX_COMPILER="clang++-${LLVM_MAJOR}" \
            -DESHKOL_ENABLE_TSAN=ON
          cmake --build build-tsan --target eshkol-run stdlib --parallel

      - name: Concurrency corpus under TSan
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -uxo pipefail
          out=$(mktemp -d)
          python3 scripts/p8/gen_concurrency_fuzz.py --out "$out" --seed 8805 --repeats 20 --shapes 10
          rc=0
          for f in "$out"/*.esk; do
            ./build-tsan/eshkol-run -r "$f" || rc=1
          done
          rm -rf "$out"
          exit $rc

  # ---------------------------------------------------------------------------
  # Axis 9: packaging lanes (advisory — alert only).
  # ---------------------------------------------------------------------------
  packaging-homebrew:
    name: packaging-homebrew (macOS)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: brew install --build-from-source (in-repo formula)
        shell: bash
        run: |
          set -uxo pipefail
          # Build the in-repo formula from source (HEAD build), not the tap.
          brew install --build-from-source --HEAD ./packaging/homebrew/eshkol.rb || {
            echo "::warning::Homebrew build-from-source of packaging/homebrew/eshkol.rb failed"
            exit 1
          }
          eshkol-run --version || eshkol --version || true

  packaging-linux:
    name: packaging-linux (install-script smoke)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain (Linux)
        shell: bash
        run: |
          set -euxo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y cmake ninja-build \
            llvm-${LLVM_MAJOR} llvm-${LLVM_MAJOR}-dev lld-${LLVM_MAJOR} \
            libreadline-dev pkg-config libssl-dev libncurses-dev \
            libpcre2-dev libsqlite3-dev git python3
      - name: Build + install + smoke the installed binary
        shell: bash
        run: |
          set -uxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="/usr/bin/llvm-config-${LLVM_MAJOR}" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/eshkol-prefix" || { echo "::warning::configure failed"; exit 1; }
          cmake --build build --target eshkol-run --parallel || { echo "::warning::build failed"; exit 1; }
          cmake --install build || echo "::warning::cmake --install had no rules / failed"
          BIN="$RUNNER_TEMP/eshkol-prefix/bin/eshkol-run"
          [ -x "$BIN" ] || BIN="build/eshkol-run"
          echo '(display "packaging-smoke-ok")(newline)' > "$RUNNER_TEMP/smoke.esk"
          "$BIN" -r "$RUNNER_TEMP/smoke.esk" | grep -q packaging-smoke-ok

  # ---------------------------------------------------------------------------
  # Axis 9b: large-single-file AOT compile-time shape (measurement, not a fix).
  #
  # A 2026-08-26 downstream-consumer audit found a compile-time shape
  # Eshkol's own corpus never exercised: a single hand-written file with many
  # top-level `define`s took disproportionately (4x+) longer to
  # `--emit-object` than a multi-file bundle of comparable total code volume,
  # and never finished within that audit's time window. This job measures the
  # SAME shape continuously with a synthetic, generated fixture (never
  # derived from any external codebase — see bench/generate_large_single_file.py)
  # against a generous ceiling, so a regression here is caught rather than
  # shipping silently. Fixing the underlying compile-time cost is a v1.3.6+
  # item; this job's job is only to keep it measured.
  # ---------------------------------------------------------------------------
  large-single-file-compile-bench:
    name: large-single-file-compile-bench
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain (macOS)
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm@${LLVM_MAJOR} cmake ninja readline pcre2 sqlite

      - name: Configure & build
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_CONFIG="$(brew --prefix llvm@${LLVM_MAJOR})/bin/llvm-config"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_CONFIG"
          cmake --build build --target eshkol-run --parallel

      - name: Run the large-single-file compile-time bench
        shell: bash
        run: |
          set -uxo pipefail
          bash bench/large_single_file_compile_bench.sh build 1600 900

      - name: Upload phase-timing / compile logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: large-single-file-compile-bench-logs
          path: |
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
