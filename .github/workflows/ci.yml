name: CI

# ─────────────────────────────────────────────────────────────────────────
# MESH-AS-MERGE-GATE: NOT YET. MAINTAINER DECISION REQUIRED BEFORE THE FLIP.
#
# The maintainer's heterogeneous compute mesh (see PR #391 / the
# `mesh-gate-advisory` job below) can run the same lane batteries as
# unix-matrix/windows-matrix/wasm-execute-diff on real hardware — including
# real GPUs, unlike the hosted CUDA lanes — and produce one verdict via
# `mesh gates run --lane eshkol --ref <sha>`. The eventual intent is for
# that verdict to replace the equivalent hosted lanes as the actual merge
# gate.
#
# THAT HAS NOT HAPPENED, and must not happen implicitly. The mesh's own
# telemetry has been dark since at least 2026-08-17 — no fresh verdict, no
# status endpoint reachable from a hosted GitHub Actions runner. Until the
# mesh is observed live again AND a maintainer explicitly signs off, every
# hosted lane below stays exactly as it is today, and every context
# currently required by branch protection stays required. `mesh-gate-
# advisory` is advisory-only (continue-on-error, not a required context)
# and is presently a labeled no-op for exactly that reason — see its own
# header comment further down.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    # Integration branches ONLY. `feat/**` used to be listed here and must not
    # come back: every PR is opened from a topic branch, so a topic branch in
    # this list makes GitHub start TWO full runs of this workflow for the same
    # commit — one `push` run and one `pull_request` run — each spinning up the
    # whole 14-lane matrix. That is half the repo's runner capacity spent
    # producing a duplicate of a signal we already have.
    #
    # The duplicate is not merely wasteful, it is actively harmful. The two
    # runs land in DIFFERENT concurrency groups (a push run keys on
    # `refs/heads/<branch>`, a pull_request run on the PR number), so they
    # never dedupe against each other; but successive pushes to the topic
    # branch DO cancel the previous push run, and a cancelled run leaves
    # `cancelled` check-runs sitting on the branch head. Those cancelled
    # contexts share their names with the required contexts branch protection
    # is watching, so the merge button reports a required check in a
    # non-success state that no rerun of the PR run will ever clear.
    #
    # Topic branches lose nothing: the `pull_request` trigger below already
    # covers every one of them from the moment a PR exists, and a topic branch
    # with no PR open has nothing to gate.
    branches: [master, develop]
    # Docs/markdown-only changes cannot affect the build or tests, so they must
    # not spin up the full compile/test/wasm/asan matrix. Research ADRs and
    # documentation live under docs/ and **/*.md; skip CI when a change touches
    # only those. A change that also touches code still runs the full matrix.
    #
    # Kept here deliberately (unlike pull_request below): branch protection's
    # required contexts are read off the SHA that GitHub associates with the
    # PR, which the pull_request-triggered run always supplies once the
    # `changes` job exists; nothing here needs to gate a merge. A push run
    # that never starts because a commit was pure docs (e.g. a docs-only
    # branch pushed straight to master, or a squash-merge landing on
    # master/develop) is simply less CI to run, not a missing required
    # check on anyone's PR.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notes/**'
      - 'press/**'
      - '.swarm/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    # NOTE: deliberately NO paths-ignore here (see the `changes` job below).
    # A trigger-level paths-ignore on `pull_request` means GitHub never
    # starts this workflow at all for a docs-only PR, so none of its jobs —
    # including the ones branch protection has marked required — ever
    # report a status for that PR's head SHA. A required context that never
    # reports blocks the PR forever; branch protection has no timeout, only
    # "hasn't reported yet". A context that reports SKIPPED satisfies
    # branch protection. So the workflow now always starts on
    # pull_request, and the docs-only decision is pushed down to a fast
    # `changes` job whose `docs_only` output every heavy job's `if:` reads
    # — same path list as before, just evaluated after the workflow starts
    # instead of before.
  schedule:
    # Weekly touch of the Windows LLVM SDK caches so actions/cache's 7-day
    # idle-eviction can never strand a run on the cold download+extract path
    # (see llvm-sdk-cache-keepalive below). This trigger fires every job in
    # this workflow by default, so every job below carries
    # `if: github.event_name != 'schedule'` to stay off the cron path; only
    # llvm-sdk-cache-keepalive runs on it.
    - cron: '0 6 * * 1'

concurrency:
  # One group per pull request, or per branch for the push runs. Keying a PR
  # run on its NUMBER rather than on `github.ref` keeps the group stable across
  # a force-push and across a base-branch change, so a superseded run is always
  # the one that gets cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Master is the public release gate. Let those runs finish so we get a
  # complete matrix signal even while follow-up commits are landing.
  #
  # Everything else — every pull_request run above all — cancels in progress.
  # A push to a PR branch invalidates the run for the previous head SHA, and
  # holding runners for a result nobody will read is the single largest source
  # of queueing on this repo's matrix. Stated explicitly for `pull_request`
  # rather than left to the `github.ref != master` fallback, because a PR run's
  # `github.ref` is `refs/pull/N/merge` and the equivalence is not obvious to
  # the next person editing this block.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}

env:
  LLVM_MAJOR: '21'
  WINDOWS_LLVM_SDK_VERSION: '21.1.8'
  CUDA_VERSION: '12.4.1'
  CUDA_PACKAGE_SERIES: '12-4'

jobs:
  # Job-level replacement for the old trigger-level `paths-ignore` on
  # pull_request (see the comment on that trigger above). Computes the exact
  # same docs-only predicate — same path list, same "any non-matching file
  # makes it false" semantics — but as a job output every heavy job below can
  # gate on, so those jobs still get scheduled and can report a SKIPPED
  # status rather than never starting. Deliberately plain git + bash rather
  # than a vendored paths-filter action: this repo has no other third-party
  # filtering action in its supply chain, and the predicate is a single
  # `git diff --name-only` plus a case match.
  #
  # ── FAILURE MODE THIS JOB MUST NOT HAVE ──────────────────────────────
  # Every heavy job below carries `needs: changes`. That makes this job a
  # single point of failure for the whole run: when it exits non-zero,
  # nothing downstream is merely skipped, the entire matrix is blocked.
  #
  # The original implementation exited 128 whenever a PR branch was
  # force-pushed while its run was in flight. GitHub starts the run for a
  # specific head SHA; a force-push orphans that object, and
  # `git diff <base>...<orphaned head>` then dies with `fatal: bad object`.
  # Under `set -e` that killed the job and blocked the PR (measured on
  # PR #465). With several branches rebasing at once this is not an edge
  # case, it is the normal weather.
  #
  # Two rules follow, and both are load-bearing:
  #
  #   1. PREFER INPUTS THAT CANNOT DANGLE. The GitHub API answers
  #      "which files does this PR touch" with FILENAMES, never object
  #      ids, so a force-pushed-away head cannot make it fail. A
  #      three-dot diff against the live base branch is the git-side
  #      equivalent: it names a ref that still exists. The two-SHA form
  #      is kept only as a last resort, and only after `git cat-file -e`
  #      confirms both objects actually resolve.
  #
  #   2. FAIL SAFE, NOT LOUD. If no strategy can determine the answer,
  #      this job reports `docs_only=false` — the CONSERVATIVE answer,
  #      meaning "run the whole matrix" — and exits 0 with a warning.
  #      A gate that cannot compute its predicate must degrade toward
  #      MORE testing, never toward a blocked merge. "I could not run"
  #      is not the same verdict as "this failed", and this job is
  #      structurally incapable of confusing the two: the step never
  #      exits non-zero, which is why it deliberately does not use
  #      `set -e`.
  #
  # The third leg is the `concurrency` block at the top of this file. It
  # keys pull_request runs on the PR NUMBER with `cancel-in-progress`, so
  # a force-push supersedes the in-flight run rather than racing it: the
  # stale run is cancelled, and the fresh `synchronize` event starts a run
  # whose head SHA is by construction the one that now exists. The
  # hardening here is what keeps the *already-started* run from failing in
  # the window before that cancellation lands.
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    # Scoped to this job only; the rest of the workflow keeps the repository
    # default. `pull-requests: read` is what lets the API strategy below work.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine whether this change is docs-only
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # NOTE the missing `-e`. Intentional, and the whole point — see the
          # job comment. Nothing in this step may abort the job.
          set -uo pipefail

          changed_files=""
          source=""

          # Does this object still exist in this checkout?
          have_obj() { [[ -n "${1:-}" ]] && git cat-file -e "${1}^{commit}" 2>/dev/null; }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Strategy 1 — the API. Immune to a force-pushed-away head SHA,
            # because it never mentions one.
            if api_files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" \
                              --paginate --jq '.[].filename' 2>/dev/null)"; then
              changed_files="$api_files"
              source="GitHub API repos/$REPO/pulls/$PR_NUMBER/files"
            fi

            # Strategy 2 — three-dot diff against the live base branch. Names a
            # ref that cannot dangle, and on a pull_request run HEAD is the
            # merge commit, so `base...HEAD` is exactly the PR's own change set.
            if [[ -z "$source" ]]; then
              git fetch --no-tags --prune origin \
                "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" >/dev/null 2>&1 || true
              if git rev-parse --verify -q "refs/remotes/origin/${PR_BASE_REF}" >/dev/null 2>&1 \
                 && d="$(git diff --name-only "refs/remotes/origin/${PR_BASE_REF}...HEAD" 2>/dev/null)"; then
                changed_files="$d"
                source="git diff origin/${PR_BASE_REF}...HEAD"
              fi
            fi

            # Strategy 3 — the original two-SHA form, guarded. This is the one
            # that used to explode; it now runs only when both objects resolve.
            if [[ -z "$source" ]] && have_obj "$PR_BASE_SHA" && have_obj "$PR_HEAD_SHA"; then
              if d="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" 2>/dev/null)"; then
                changed_files="$d"
                source="git diff ${PR_BASE_SHA}...${PR_HEAD_SHA}"
              fi
            fi
          else
            # Push runs. `before` is absent on a branch's first push and can be
            # orphaned by a force-push to the branch, so it gets the same guard.
            if [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]] \
               && have_obj "$PUSH_BEFORE" && have_obj "$PUSH_SHA"; then
              if d="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA" 2>/dev/null)"; then
                changed_files="$d"
                source="git diff $PUSH_BEFORE $PUSH_SHA"
              fi
            fi
          fi

          if [[ -z "$source" ]]; then
            # Could not run — NOT a failure. Answer conservatively and let the
            # full matrix decide, which is the same outcome as a code change.
            echo "::warning title=changes: changed-file set could not be computed::Every strategy failed (most likely the head SHA this run started for was orphaned by a force-push). Reporting docs_only=false so the FULL matrix runs — the conservative answer. This is not a build failure and must never block the run."
            {
              echo "### changes"
              echo
              echo "Could not compute the changed-file set; assuming **not** docs-only and running the full matrix."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "docs_only=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files (via $source):"
          printf '%s\n' "$changed_files"

          # Exactly the path list the old trigger-level paths-ignore used:
          #   **/*.md, docs/**, notes/**, press/**, .swarm/**, LICENSE
          # A case pattern's `*` matches `/` too (that restriction is a
          # filename-globbing thing, not general shell pattern matching), so
          # `*.md` here already behaves like `**/*.md` and `docs/*` like
          # `docs/**`.
          docs_only=true
          if [[ -z "$changed_files" ]]; then
            # An empty set from a strategy that "succeeded" is not evidence of a
            # docs-only change; it is evidence something is off. Same
            # conservative answer.
            docs_only=false
          fi
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              *.md|docs/*|notes/*|press/*|.swarm/*|LICENSE) ;;
              *) docs_only=false ;;
            esac
          done <<< "$changed_files"

          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
          exit 0

  # ─────────────────────────────────────────────────────────────────────
  # ADVISORY mesh-gate placeholder (see the top-of-file comment above for
  # the full picture). This job never fails the build and its context must
  # never be added to branch protection's required list.
  #
  # `mesh gates run --lane eshkol --ref <sha>` is the maintainer's own
  # compute-mesh invocation, executed on a private, tailnet-only mesh — it
  # has no endpoint reachable from a hosted GitHub Actions runner, and there
  # is no vendored client/credential in this repository that could reach
  # one even if it existed. Wiring this job to report a real mesh verdict
  # therefore needs, at minimum: (1) the mesh's telemetry actually live
  # again (dark since at least 2026-08-17 as of this writing), and (2) some
  # CI-reachable way to ask it for a verdict (a public status endpoint, a
  # signed artifact it publishes somewhere GitHub Actions can fetch, or
  # similar) that does not yet exist. Until both are true this step is a
  # clearly-labeled no-op: it reports that mesh telemetry is unavailable
  # rather than fabricating a verdict or silently succeeding.
  # ─────────────────────────────────────────────────────────────────────
  mesh-gate-advisory:
    name: mesh-gate-advisory (advisory, no-op)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Report mesh verdict (placeholder)
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::mesh telemetry unavailable — the physical compute mesh has had no live, CI-reachable verdict endpoint since at least 2026-08-17. This job is an advisory placeholder: it does not run the mesh's lane batteries and its result does not gate this PR. Flipping any hosted lane's required status to the mesh is a maintainer decision, made only once the mesh is observed live again (see the comment at the top of this file)."
          echo "mesh-gate-advisory: mesh telemetry unavailable (placeholder, non-blocking)"

  # The language-surface manifest is the ground truth the execution-backed
  # coverage floor is measured against, so a stale manifest fails the coverage
  # gate. That gate lives in the quantum lane, which is both advisory and the
  # slowest lane to report — four separate changes have burned a full matrix
  # cycle discovering a one-second staleness error there. This job answers the
  # same question in well under a minute, on every pull request.
  #
  # The execution-backed coverage gate itself (scripts/language_coverage.py,
  # gated on tests/coverage/coverage_policy.json + execution_deficit.json) only
  # runs to completion inside quantum-macos, because computing FRESH runtime
  # evidence needs a full build (native + VM + the opt-in Moonlab/quantum
  # corpus). But a slice of that gate's assurance — the policy floor never
  # trailing the manifest, the deficit ratchet being monotonic, the gate
  # actually being able to go red — needs none of that: it is pure Python
  # driven by synthetic evidence plus the three committed JSON files already
  # checked out above. scripts/test_language_coverage_gate.py is exactly that
  # slice (see its module docstring: "Build-free regression guard"). Running
  # it here, in a required job, closes the gap where an advisory
  # continue-on-error lane was the ONLY place these guards could ever fail a
  # PR.
  surface-manifest:
    name: surface-manifest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Manifest matches the source-extracted surface
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gen_language_surface.py
          if ! git diff --quiet -- tests/coverage/language_surface.json; then
            echo "::error file=tests/coverage/language_surface.json::The language-surface manifest is stale. Regenerate it with 'python3 scripts/gen_language_surface.py' and commit the result — a new builtin, special form or AST op must be declared before the execution-backed coverage floor can measure it."
            git --no-pager diff -- tests/coverage/language_surface.json
            exit 1
          fi
          echo "manifest is current"

      # Build-free coverage-gate guards: policy floor never trails the live
      # manifest, the execution_deficit.json ratchet is monotonic (may shrink,
      # never grow), and — via TheGateCanActuallyFail — the real gate CLI
      # (scripts/language_coverage.py) is driven against the real committed
      # policy/ledger with synthetic full-surface and one-construct-missing
      # evidence, proving it reports 0 on a clean pass and nonzero (naming the
      # lost construct) on a regression. None of this needs a compiler, an
      # eshkol-run binary, or -DESHKOL_QUANTUM_ENABLED — it is pure Python
      # over the checked-out repo, so it belongs in the fast required job
      # rather than only inside the advisory quantum-macos lane.
      - name: Build-free coverage-gate guards (policy floor / deficit ratchet / manifest consistency)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_language_coverage_gate.py -v

  # v1.3.5 assurance wave 1: three release gates that used to be doctrine
  # living only in prose (a memory file, a script's docstring) rather than
  # something that could actually fail a PR. All three are pure Python over
  # committed YAML — no compiler, no eshkol-run binary — so, like
  # surface-manifest above, this belongs in a fast required job rather than
  # only inside the heavy matrix or (for gate_no_silent_wrong.py) nowhere at
  # all, which is where it lived before this job existed.
  #
  #   - gate_no_silent_wrong.py checks .icc/silent-wrong-ledger.yaml: no open,
  #     unwaived SILENT-WRONG flaw ships. It existed on master already but
  #     was never wired into any CI workflow — a gate nobody runs is not a
  #     gate.
  #   - check_ledger_integrity.py checks the SAME ledger for the structural
  #     defect gate_no_silent_wrong.py does not look for: duplicate ids
  #     across the whole file. A textual git merge does not conflict when two
  #     branches independently allocate the same next-free id, so this class
  #     of bug is invisible to code review. SW-33 collided three times this
  #     way, SW-35 twice and SW-42 twice, before being resolved by hand.
  #   - check_oracle_schema.py checks .icc/completion-oracles.yaml, the file
  #     `icc readiness` reads to grade this repo's release criteria. PR #429
  #     dropped a list-item opener while adding a criterion and broke the
  #     YAML parse; the sharper failure mode the gate is built for is the one
  #     where the file still parses but a criterion silently normalises to
  #     nothing (a `runtime_event` with no `event_kinds`, a duplicated
  #     criterion id) — readiness keeps running and prints a verdict computed
  #     over fewer criteria than the file's author wrote, with nothing in the
  #     output to say so.
  #
  # Each gate also carries a `--self-test` mode exercised here: it feeds the
  # gate deliberately-broken fixtures (malformed YAML, a duplicate id, a
  # missing required field) and asserts the gate goes RED on every one of
  # them, plus a well-formed fixture asserting it does not fail on
  # everything indiscriminately. A gate that cannot fail is not a gate.
  #
  # v1.3.5 assurance wave 2 (2026-08-25, F19 / ADR-0010 A13): the 2026-08-25
  # architectural audit measured `icc readiness --target gpu-execution`
  # returning `ready/94` with ZERO evidence, because its sole criterion was
  # `severity: medium` and ICC's grader degrades an absent-evidence miss to
  # WARN rather than FAIL unless severity is `high`. Fixed in
  # .icc/completion-oracles.yaml (every criterion whose label asserts a
  # correctness/capability claim is now `severity: high`, with explicit
  # ADVISORY comments on the handful that are legitimately fixture
  # bookkeeping). Two new gates keep it fixed:
  #   - audit_oracle_false_green.py re-derives ICC's own status arithmetic
  #     and fails if ANY oracle target has zero severity:high criteria —
  #     the exact condition that let gpu-execution escape `blocked` on
  #     total absence of evidence.
  #   - check_evidence_staleness.py arms the other half of ADR-0010 A13
  #     ("no evidence in N days = FAIL"), which ICC's `runtime_event`
  #     grading path has no support for (only `performance_budget` does) —
  #     see the script's docstring. Repo-side until that lands upstream.
  assurance-gates:
    name: assurance-gates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install PyYAML
        shell: bash
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Self-test — each gate must be able to fail
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_no_silent_wrong.py --self-test
          python3 scripts/check_ledger_integrity.py --self-test
          python3 scripts/check_oracle_schema.py --self-test
          python3 scripts/audit_oracle_false_green.py --self-test
          python3 scripts/check_evidence_staleness.py --self-test
          python3 scripts/gate_ad_shared_node_model.py --self-test
          python3 scripts/check_required_context_consistency.py --self-test
          python3 scripts/check_package_manifest.py --self-test
          python3 scripts/check_diagnostic_corpus.py --self-test

      - name: No open, unwaived SILENT-WRONG flaw ships
        shell: bash
        run: python3 scripts/gate_no_silent_wrong.py --no-trace

      - name: Silent-wrong ledger has no duplicate ids and every entry is well-formed
        shell: bash
        run: python3 scripts/check_ledger_integrity.py --no-trace

      - name: Completion-oracle file parses and every criterion is gradeable
        shell: bash
        run: python3 scripts/check_oracle_schema.py --no-trace

      - name: No oracle target can read ready on zero evidence (F19 / A13)
        shell: bash
        run: python3 scripts/audit_oracle_false_green.py --no-trace

      - name: No high-severity criterion's evidence is stale (ADR-0010 A13)
        shell: bash
        run: python3 scripts/check_evidence_staleness.py --no-trace

      # Structural, not comparative. The VM-parity differential compares
      # program output between engines, so two independent AD implementations
      # agree and it stays green (SW-52); INV-ad-exact-no-finite-differences
      # checks that an exact constructor is present on the native engine, never
      # that a finite difference is absent on either (SW-51). This step asks
      # the question neither could: which carrier actually answers each AD op,
      # re-derived from the source rather than declared.
      - name: Every AD op routes through a declared, exact, source-verified carrier
        shell: bash
        run: python3 scripts/gate_ad_shared_node_model.py --no-trace

      # --offline deliberately: reading branch-protection settings needs
      # administration:read, which the default workflow token does not
      # carry, and this job's `permissions:` are not widened just to grant
      # it. This step grades the committed INTENDED target file
      # (.icc/required-status-contexts.json) alone — which is what this gate
      # always grades regardless of LIVE availability, precisely so a live
      # required-context set that is temporarily narrower than intended
      # cannot read as "nothing to fix" — so this step's result is
      # deterministic rather than depending on the runner's incidental `gh`
      # auth state. Run `python3 scripts/check_required_context_consistency.py`
      # locally with an authenticated `gh` (or GITHUB_TOKEN/GH_TOKEN with
      # administration:read) to additionally fold in and diff against LIVE
      # branch-protection contexts, and update the target file by hand when
      # the INTENDED policy itself changes.
      - name: Every required status context is reportable on every PR shape (docs-only included)
        shell: bash
        run: python3 scripts/check_required_context_consistency.py --offline --no-trace

  # Moonlab is deliberately opt-in, so keep its networked macOS coverage in a
  # separate advisory job. `continue-on-error` makes the lane informative
  # without turning the default required CI set into a Moonlab availability
  # gate; branch-protection configuration must not add this check as required.
  quantum-macos:
    name: quantum-macos (advisory)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only == 'false'
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm@${LLVM_MAJOR} cmake ninja readline pcre2 sqlite

      - name: Configure quantum build
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_PREFIX="$(brew --prefix llvm@${LLVM_MAJOR})"
          export PATH="$LLVM_PREFIX/bin:$PATH"
          cmake -S . -B build-quantum -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_PREFIX/bin/llvm-config" \
            -DESHKOL_QUANTUM_ENABLED=ON \
            -DESHKOL_BUILD_TESTS=ON \
            -DESHKOL_BUILD_AGENT_FFI=ON

      - name: Build quantum runtime and test tools
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-quantum --parallel

      - name: Run quantum integration gates
        shell: bash
        env:
          ESHKOL_LANGUAGE_COVERAGE_TRACE_DIR: ${{ runner.temp }}/eshkol-language-coverage/quantum
        run: |
          set -euo pipefail
          mkdir -p "$ESHKOL_LANGUAGE_COVERAGE_TRACE_DIR"
          runner="$PWD/build-quantum/eshkol-run"
          libflag="-L$PWD/build-quantum"
          for test in tests/quantum/*.esk; do
            echo "== $test =="
            output="$($runner -r "$test" "$libflag" 2>&1)"
            printf '%s\n' "$output"
            case "$(basename "$test")" in
              quantum_smoke_test.esk)
                grep -q 'Bell-pair correlation over 200 shots: 200/200  PASS' <<<"$output"
                grep -q 'quantum_smoke_test: PASS' <<<"$output"
                ;;
              vqe_test.esk)
                grep -q 'VQE H2: PASS' <<<"$output"
                ;;
              vqe_ad_test.esk)
                grep -q 'vqe_ad_test: PASS (5/5)' <<<"$output"
                ;;
              pqc_mlkem_test.esk)
                grep -q 'pqc_mlkem_test: PASS (9/9)' <<<"$output"
                ;;
              bell_chsh_test.esk)
                grep -q 'bell_chsh_test: PASS' <<<"$output"
                ;;
              quantum_surface_coverage_test.esk)
                grep -q 'quantum_surface_coverage_test: PASS (3/3)' <<<"$output"
                ;;
              vqe_ad_adversarial.esk)
                grep -q 'vqe_ad_adversarial: PASS' <<<"$output"
                ;;
              *)
                echo "Unhandled quantum test: $test" >&2
                exit 1
                ;;
            esac
          done

          # `-r` resolves Moonlab from the already-linked compiler process.
          # Compile and execute one representative standalone binary as well,
          # so CI proves that the generated AOT link closure and loader rpath
          # carry Moonlab without an agent-FFI require or ambient DYLD paths.
          aot_dir="${RUNNER_TEMP}/eshkol-quantum-aot"
          aot_bin="${aot_dir}/quantum-smoke${{ runner.os == 'Windows' && '.exe' || '' }}"
          mkdir -p "$aot_dir"
          "$runner" tests/quantum/quantum_smoke_test.esk -o "$aot_bin" "$libflag"
          aot_output="$("$aot_bin" 2>&1)"
          printf '%s\n' "$aot_output"
          grep -q 'Bell-pair correlation over 200 shots: 200/200  PASS' <<<"$aot_output"
          grep -q 'quantum_smoke_test: PASS' <<<"$aot_output"

      # The default AD oracle remains Moonlab-free. This opt-in invocation
      # enables its VQE-energy AD-vs-finite-difference probe on the same
      # quantum build that compiled the agent.quantum bridge.
      - name: Run quantum AD adversarial probe
        shell: bash
        env:
          BUILD_DIR: build-quantum
          ESHKOL_QUANTUM_ENABLED: 'ON'
          ESHKOL_LANGUAGE_COVERAGE_TRACE_DIR: ${{ runner.temp }}/eshkol-language-coverage/quantum
        run: |
          set -euxo pipefail
          ./scripts/run_ad_adversarial.sh --quick

      # This advisory lane owns the complete executable-language oracle: the
      # quantum build can execute both the ordinary deterministic corpus and
      # the opt-in Moonlab/PQC corpus in one environment, then aggregate fresh
      # per-process traces. No checked-in/token-only evidence is accepted.
      - name: Run complete traced core corpus
        shell: bash
        env:
          BUILD_DIR: build-quantum
          ESHKOL_LANGUAGE_COVERAGE_TRACE_DIR: ${{ runner.temp }}/eshkol-language-coverage/core
        run: |
          set -euxo pipefail
          mkdir -p "$ESHKOL_LANGUAGE_COVERAGE_TRACE_DIR"
          ./scripts/run_all_tests.sh

      # The build-free half of this gate (policy floor / deficit ratchet /
      # "can the gate actually go red" self-test) now also runs, unconditional
      # and required, in the surface-manifest job. What stays here is the part
      # that genuinely needs this environment: FRESH execution evidence from
      # the just-built native + VM + Moonlab/quantum corpus is what the deficit
      # ratchet below is evaluated against.
      - name: Enforce execution-backed language coverage (deficit ratchet, no lexical credit)
        shell: bash
        env:
          BUILD_DIR: build-quantum
          LANGUAGE_COVERAGE_RUNTIME_TRACE_DIRS: ${{ runner.temp }}/eshkol-language-coverage/core:${{ runner.temp }}/eshkol-language-coverage/quantum
          LANGUAGE_COVERAGE_TRACE: ${{ runner.temp }}/eshkol-language-coverage/language_surface_coverage.jsonl
        run: |
          set -euxo pipefail
          # A1: certification is EXECUTION-backed only. A construct counts as
          # covered only when it dispatched/executed in a passing run (O/C/V) or,
          # for the bounded compile-time-form allowlist, was parsed and
          # accepted/code-generated (A/G). Lexical name-presence earns zero
          # credit. The committed deficit ledger is monotonic: this gate fails if
          # execution-backed coverage drops below its floor or the deficit list
          # grows (a construct that used to execute stops executing).
          ./scripts/run_language_coverage.sh \
            --execution-deficit tests/coverage/execution_deficit.json \
            --json "${{ runner.temp }}/eshkol-language-coverage/coverage_run.json"

      - name: Upload executable language-coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eshkol-language-coverage
          path: ${{ runner.temp }}/eshkol-language-coverage
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # bench-smoke: proves bench/run_public_benchmarks.sh still RUNS and
  # produces valid JSON — a harness-correctness check, explicitly NOT the
  # full timing suite (which is far too noisy on a shared hosted runner to
  # gate anything on). The job name says "not a measurement" so nobody
  # mistakes a green check here for a performance verdict, and this job is
  # deliberately advisory (continue-on-error) so it can never become a
  # branch-protection required context that a docs-only PR would need the
  # stub-job trick (immediately below) to satisfy.
  # ─────────────────────────────────────────────────────────────────────
  bench-smoke:
    name: "bench-smoke (not a measurement)"
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only == 'false'
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm@${LLVM_MAJOR} cmake ninja readline pcre2 sqlite

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_PREFIX="$(brew --prefix llvm@${LLVM_MAJOR})"
          export PATH="$LLVM_PREFIX/bin:$PATH"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_PREFIX/bin/llvm-config"

      - name: Build eshkol-run (bench-smoke does not need the full test suite)
        shell: bash
        run: cmake --build build --target eshkol-run stdlib --parallel

      - name: bench/run_public_benchmarks.sh --smoke
        shell: bash
        run: |
          set -euxo pipefail
          bench/run_public_benchmarks.sh --build-dir build --smoke \
            --out-dir "${{ runner.temp }}/bench-smoke" \
            --work-root "${{ runner.temp }}/bench-smoke-work"

      - name: verify results.json is well-formed and marked smoke_mode
        shell: bash
        run: |
          set -euxo pipefail
          python3 -c "
          import json
          with open('${{ runner.temp }}/bench-smoke/results.json') as f:
              d = json.load(f)
          assert d['schema'] == 'eshkol-public-benchmarks-v1'
          assert d['smoke_mode'] is True
          for name, axis in d['axes'].items():
              assert axis is not None, f'{name} produced no data'
          print('bench-smoke: results.json is well-formed, smoke_mode=True, all 4 axes present')
          "

      - name: Upload bench-smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke-results
          path: ${{ runner.temp }}/bench-smoke
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────
  # Stub job that exists ONLY to satisfy branch protection's literal
  # per-lane required context names on a docs-only PR. This is not
  # optional decoration: GitHub Actions does NOT expand a matrix job's
  # `${{ matrix.x }}` name expressions into individual check runs when the
  # job itself is skipped via a job-level `if:` — a skipped matrix job
  # instead produces exactly ONE check run, named with the literal,
  # unresolved string "${{ matrix.name }}" (verified empirically; see the
  # proof-PR evidence under .worktrees/v135/evidence/ci-wave/, cited in full
  # in PR #455). That unresolved name matches none of branch protection's
  # required contexts, so without this stub, every matrix-derived required
  # context below would go right back to never reporting on a docs-only PR
  # — the exact permanent-block failure this whole job exists to fix.
  # `wasm-execute-diff` needs no such stub because it isn't matrix-based;
  # its job-level skip already produces a correctly-named, SKIPPED check
  # run, and PR #455's own proof PR measured this directly (`gh pr checks`
  # and the check-runs API both showed `wasm-execute-diff` SKIPPED and
  # counted among the satisfied required contexts on a real docs-only PR —
  # do not re-add it here without new counter-evidence).
  #
  # 2026-08-25: branch protection grew 5 more matrix-derived required
  # contexts after PR #455 landed with only the original 7 (windows-arm64-
  # lite, macos-arm64-xla, macos-x64-xla, macos-arm64-lite, macos-x64-lite —
  # all produced by unix-matrix/windows-matrix's `${{ matrix.name }}`, never
  # this job's), and nobody extended this matrix to match. That reopened the
  # identical failure PR #455 closed, for those 5 names — confirmed directly
  # on a real docs-only PR (#484): MERGEABLE/BLOCKED with those 5 required,
  # MERGEABLE/CLEAN the instant they were removed from branch protection, no
  # other change. A required context and its stub coverage are two lists
  # that must be kept in sync by hand, and this is the second time they
  # drifted out of sync. scripts/check_required_context_consistency.py
  # (assurance-gates) now fails the build the day they drift again, on
  # EITHER side: a name required but missing here, or a name added here
  # that no real job ever emits. It grades against the INTENDED full set
  # committed in .icc/required-status-contexts.json, not just whatever
  # branch protection currently requires — branch protection is temporarily
  # narrowed to exclude these 5 while this fix ships, and grading live
  # alone would have read that narrowed state as already-correct. See
  # .icc/silent-wrong-ledger.yaml VA-01.
  #
  # This job's own matrix DOES expand correctly, because it only runs
  # (job-level `if` true) on docs-only PRs — the opposite condition from
  # unix-matrix/windows-matrix — so its check runs and theirs are never
  # produced for the same PR at once, and the real matrix legs below take
  # over normally the moment a change touches non-doc paths.
  # ─────────────────────────────────────────────────────────────────────
  docs-only-required-context-stubs:
    name: ${{ matrix.name }}
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        name:
          - linux-x64-xla
          - linux-arm64-xla
          - linux-x64-cuda
          - linux-arm64-cuda
          - linux-x64-asan-ubsan
          - windows-arm64-xla
          - windows-x64-cuda
          - windows-arm64-lite
          - macos-arm64-xla
          - macos-x64-xla
          - macos-arm64-lite
          - macos-x64-lite
    steps:
      - name: Docs-only PR — real lane skipped, this stub satisfies branch protection
        shell: bash
        run: |
          echo "docs-only PR: ${{ matrix.name }} did not run. See the unix-matrix / windows-matrix jobs (reported skipped under an unresolved matrix.name check run) for why. This stub exists solely to give branch protection's required context '${{ matrix.name }}' a status."

  unix-matrix:
    name: ${{ matrix.name }}
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-lite
            runner: ubuntu-22.04
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
            upload_artifact: 'true'
            artifact_name: eshkol-linux-x64
          - name: linux-arm64-lite
            runner: ubuntu-22.04-arm
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
            upload_artifact: 'true'
            artifact_name: eshkol-linux-arm64
          - name: linux-x64-xla
            runner: ubuntu-22.04
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh
            upload_artifact: 'false'
            artifact_name: ''
          - name: linux-arm64-xla
            runner: ubuntu-22.04-arm
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh
            upload_artifact: 'false'
            artifact_name: ''
          - name: linux-x64-cuda
            runner: ubuntu-22.04
            build_dir: build-cuda
            xla_enabled: 'OFF'
            gpu_enabled: 'ON'
            test_command: ./scripts/run_gpu_tests.sh
            upload_artifact: 'false'
            artifact_name: ''
          - name: linux-arm64-cuda
            runner: ubuntu-22.04-arm
            build_dir: build-cuda
            xla_enabled: 'OFF'
            gpu_enabled: 'ON'
            test_command: ./scripts/run_gpu_tests.sh
            upload_artifact: 'false'
            artifact_name: ''
          - name: macos-arm64-lite
            runner: macos-14
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
            upload_artifact: 'true'
            artifact_name: eshkol-macos-arm64
          - name: macos-x64-lite
            runner: macos-15-intel
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
            upload_artifact: 'true'
            artifact_name: eshkol-macos-x64
          - name: macos-arm64-xla
            runner: macos-14
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh
            upload_artifact: 'false'
            artifact_name: ''
          - name: macos-x64-xla
            runner: macos-15-intel
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh
            upload_artifact: 'false'
            artifact_name: ''
          # Sanitizer lanes (per v1.2 release audit, blocker #10).
          # ASan and UBSan are compatible together; both run the v1.2
          # edge-case suite which is the most likely place to surface
          # memory-safety / UB regressions.  TSan and MSan are deferred
          # — TSan needs LLVM-21-built-with-tsan-runtime which the
          # apt.llvm.org packages don't ship; MSan needs an MSan-built
          # libstdc++ which is even more involved.
          - name: linux-x64-asan-ubsan
            runner: ubuntu-22.04
            build_dir: build-asan
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            sanitizer_flags: '-DESHKOL_ENABLE_ASAN=ON -DESHKOL_ENABLE_UBSAN=ON'
            # This is the only lane that runs under sanitizers, so it must
            # exercise the code most likely to read or write out of bounds:
            # the tensor and autodiff paths, which do their own index and
            # rank arithmetic over arena memory. It previously ran the v1.2
            # edge-case corpus alone, which touches none of them — several
            # memory-safety fixes were credited to a green here that never
            # executed the paths they repaired.
            test_command: ./scripts/run_v1_2_edge_cases_tests.sh && ./scripts/run_ml_tests.sh && ./scripts/run_ad_oracle.sh
            upload_artifact: 'false'
            artifact_name: ''

    steps:
      - uses: actions/checkout@v6

      # Every network fetch below goes through scripts/ci_retry.sh — the
      # single definition of this repo's CI retry policy (bounded attempts,
      # exponential backoff, explicit per-command timeouts) — rather than a
      # hand-rolled loop per call site. linux-x64-cuda / linux-arm64-cuda /
      # linux-arm64-lite have all failed a required PR check with apt's
      # generic exit code 100 during a momentary apt.llvm.org or CUDA-repo
      # outage, on commits that built cleanly on rerun; the base
      # `apt-get install` in "Install Dependencies (Linux)" below had NO
      # retry at all before this change.
      - name: Add LLVM Repository (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          scripts/ci_retry.sh --attempts 3 --base-delay 10 -- \
            wget --timeout=20 --tries=1 -qO "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc < "$RUNNER_TEMP/llvm-snapshot.gpg.key" >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          scripts/ci_retry.sh --attempts 4 --base-delay 15 -- \
            sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

      - name: Add NVIDIA CUDA Repository (Linux CUDA)
        if: runner.os == 'Linux' && matrix.gpu_enabled == 'ON'
        shell: bash
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            x86_64) cuda_repo_arch=x86_64 ;;
            aarch64) cuda_repo_arch=sbsa ;;
            *) echo "Unsupported native CUDA architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          keyring="$RUNNER_TEMP/cuda-keyring.deb"
          scripts/ci_retry.sh --attempts 3 --base-delay 10 -- \
            wget --timeout=20 --tries=1 -O "$keyring" \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/${cuda_repo_arch}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i "$keyring"
          scripts/ci_retry.sh --attempts 4 --base-delay 15 -- \
            sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          scripts/ci_retry.sh --attempts 3 --base-delay 15 -- \
            sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            cmake ninja-build \
            llvm-${LLVM_MAJOR} llvm-${LLVM_MAJOR}-dev lld-${LLVM_MAJOR} \
            libreadline-dev pkg-config \
            libssl-dev libncurses-dev \
            libpcre2-dev libsqlite3-dev \
            libpng-dev libjpeg-dev libwebp-dev \
            git python3
          if [[ "${{ matrix.gpu_enabled }}" == "ON" ]]; then
            scripts/ci_retry.sh --attempts 3 --base-delay 15 -- \
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
              -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
              "cuda-nvcc-${CUDA_PACKAGE_SERIES}" \
              "cuda-cudart-dev-${CUDA_PACKAGE_SERIES}" \
              "libcublas-dev-${CUDA_PACKAGE_SERIES}"
            echo "/usr/local/cuda-12.4/bin" >> "$GITHUB_PATH"
            echo "CUDAToolkit_ROOT=/usr/local/cuda-12.4" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/local/cuda-12.4/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            /usr/local/cuda-12.4/bin/nvcc --version
          fi
          # eshkol's codegen passes -fuse-ld=lld for AArch64 Linux
          # (GNU ld 2.38 hits range/erratum bugs on the big static
          # runtime; see lib/backend/llvm_codegen.cpp). The
          # lld-${LLVM_MAJOR} package installs `ld.lld-${LLVM_MAJOR}`
          # but `-fuse-ld=lld` looks for unversioned `ld.lld` in PATH.
          sudo ln -sf "/usr/bin/ld.lld-${LLVM_MAJOR}" /usr/bin/ld.lld
          ld.lld --version

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm@${LLVM_MAJOR} cmake ninja readline pcre2 sqlite

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_DIR="${{ matrix.build_dir }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            LLVM_PREFIX="$(brew --prefix llvm@${LLVM_MAJOR})"
            export PATH="$LLVM_PREFIX/bin:$PATH"
            LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config"
          else
            LLVM_CONFIG="/usr/bin/llvm-config-${LLVM_MAJOR}"
          fi

          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_CONFIG" \
            -DESHKOL_XLA_ENABLED=${{ matrix.xla_enabled }} \
            -DESHKOL_GPU_ENABLED=${{ matrix.gpu_enabled }} \
            -DESHKOL_REQUIRE_GPU_BACKEND=${{ matrix.gpu_enabled }} \
            -DCUDAToolkit_ROOT=/usr/local/cuda-12.4 \
            ${{ matrix.sanitizer_flags }}

      - name: Verify real CUDA build graph
        if: matrix.gpu_enabled == 'ON'
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/verify_gpu_backend.py \
            --build-dir "${{ matrix.build_dir }}" \
            --expected CUDA

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ matrix.sanitizer_flags }}" == *"ESHKOL_ENABLE_ASAN=ON"* ]]; then
            export ASAN_OPTIONS="${ASAN_OPTIONS:-detect_leaks=0:halt_on_error=1:allocator_may_return_null=1}"
            export UBSAN_OPTIONS="${UBSAN_OPTIONS:-halt_on_error=1:print_stacktrace=1}"
          fi
          cmake --build "${{ matrix.build_dir }}" --parallel

      # Catches the failure mode where a new C runtime helper
      # (eshkol_intern_symbol_lookup, region_create, …) is added on the
      # host side and the codegen emits a WASM `env` import for it, but
      # the JS glue (web/eshkol-repl.js + site/static/eshkol-runtime.js)
      # is never updated — the website then fails with `function import
      # requires a callable` at WebAssembly.instantiate().  Compiles a
      # tiny smoke set, parses each .wasm import section, diffs against
      # the JS env keys.  Skipped on the GPU/XLA/sanitizer lanes — those
      # don't change the WASM-side surface and their ASan instrumentation
      # confuses the wasm32 codegen path.
      - name: Check WASM env imports
        if: matrix.xla_enabled == 'OFF' && matrix.gpu_enabled == 'OFF' && matrix.build_dir == 'build'
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          python3 scripts/check_wasm_imports.py --build-dir "$BUILD_DIR"

      # Guards the stdlib dead-strip on the --wasm path (issue #240 follow-up):
      # a stdlib-using program compiled WITHOUT --no-stdlib must dead-strip the
      # unused stdlib and stay small + instantiable, rather than pinning the
      # whole stdlib against DCE via the homoiconic display registry.
      - name: Check WASM stdlib dead-strip size
        if: matrix.xla_enabled == 'OFF' && matrix.gpu_enabled == 'OFF' && matrix.build_dir == 'build'
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          python3 scripts/check_wasm_size.py --build-dir "$BUILD_DIR"

      # ADR-0010 gap A11: the diagnostic golden corpus (tests/diagnostics/)
      # needs a real built compiler, so — unlike its --self-test, which runs
      # in the lightweight assurance-gates job — the actual per-fixture run
      # belongs in a lane that has one. Runs on the plain default build only
      # (not GPU/XLA/sanitizer): span assertions read source text, which is
      # OS/backend-independent, so one lane is enough evidence per PR.
      - name: Diagnostic golden corpus matches its pinned text and span
        if: matrix.xla_enabled == 'OFF' && matrix.gpu_enabled == 'OFF' && matrix.build_dir == 'build'
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          python3 scripts/check_diagnostic_corpus.py --build-dir "$BUILD_DIR"

      # ADR-0010 gap A12: prove the leak detector armed above is actually
      # live BEFORE trusting the test run's silence. Runs only on the ASan
      # lane, before "Run Tests", so a suppression file that quietly grew
      # broad enough to swallow a real leak is reported as a gate failure
      # here rather than as a suspiciously clean sanitizer run below.
      - name: Leak detection is armed and can still see a real leak
        if: contains(matrix.sanitizer_flags, 'ESHKOL_ENABLE_ASAN=ON')
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          ./scripts/check_leak_detection_selftest.sh

      # ADR-0010 gap A12, second half. The step above proves the DETECTOR is
      # armed; this one proves the PRODUCT is clean under it. It runs an AOT
      # compile, the compiled program, the VM and the REPL under
      # detect_leaks=1 with the checked-in suppression file, and fails on any
      # leak that file does not already name and justify — plus a slope check
      # on the one retention the suppressions do hide (the front-end AST,
      # epic #182), so a per-form growth regression cannot slip in behind a
      # suppression rule. Verified to go red: with a 4321-byte unfreed
      # allocation added to eshkol_runtime_init() and nothing else changed,
      # this step fails and names eshkol_runtime_init as the site.
      - name: No unsuppressed leak in the real workloads
        if: contains(matrix.sanitizer_flags, 'ESHKOL_ENABLE_ASAN=ON')
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          ./tests/memory/leak_audit_gate.sh

      - name: Run Tests
        timeout-minutes: 120
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/eshkol-test-logs"
          export ESHKOL_HTTP_SERVER_SMOKE_TIMEOUT="${ESHKOL_HTTP_SERVER_SMOKE_TIMEOUT:-600}"
          export ESHKOL_REPL_MACHINE_READY_TIMEOUT="${ESHKOL_REPL_MACHINE_READY_TIMEOUT:-600}"
          export ESHKOL_REPL_MACHINE_DONE_TIMEOUT="${ESHKOL_REPL_MACHINE_DONE_TIMEOUT:-180}"
          export ESHKOL_EDGE_FAILURE_LINES="${ESHKOL_EDGE_FAILURE_LINES:-80}"
          if [[ "${{ matrix.sanitizer_flags }}" == *"ESHKOL_ENABLE_ASAN=ON"* ]]; then
            # ADR-0010 gap A12. This step used to set detect_leaks=0 with the
            # reasoning "leak detection turns arena/JIT lifetime caches into
            # false process-exit failures and hides the actionable signal."
            # The premise is true (the arena and JIT object cache ARE
            # retained for process lifetime by design), but turning the
            # instrument off entirely does not hide only the noise — it
            # hides the signal too, silently: this lane read green whether
            # or not a leak had been introduced, with nothing in the output
            # distinguishing "no leaks" from "not looking". Leak detection
            # is now ON, with every known-acceptable retention named
            # one-by-one, with a reason, in .icc/lsan-suppressions.txt —
            # never a blanket suppression. See
            # scripts/check_leak_detection_selftest.sh for the proof that
            # this configuration still catches a real leak.
            export ASAN_OPTIONS="${ASAN_OPTIONS:-detect_leaks=1:halt_on_error=1:allocator_may_return_null=1}"
            export LSAN_OPTIONS="${LSAN_OPTIONS:-suppressions=$GITHUB_WORKSPACE/.icc/lsan-suppressions.txt:print_suppressions=0}"
            export UBSAN_OPTIONS="${UBSAN_OPTIONS:-halt_on_error=1:print_stacktrace=1}"
          fi
          ${{ matrix.test_command }} 2>&1 | tee "$RUNNER_TEMP/eshkol-test-logs/${{ matrix.name }}.log"
          test -x "${{ matrix.build_dir }}/eshkol-agent-http-test"
          "${{ matrix.build_dir }}/eshkol-agent-http-test"
          test -x "${{ matrix.build_dir }}/eshkol-agent-sse-test"
          "${{ matrix.build_dir }}/eshkol-agent-sse-test"
          test -x "${{ matrix.build_dir }}/eshkol-agent-capabilities-test"
          "${{ matrix.build_dir }}/eshkol-agent-capabilities-test"

      # The exactness guarantee, gated so that it can fail.
      #
      # `(= (ad-finite-difference-evals) 0)` is the executable form of "exact
      # gradients … no finite-difference fallback anywhere in the gradient
      # path". It shipped green while the counter it reads had no writer at all
      # on the native back end — true by construction, and unable to go red
      # under the exact regression it names. Worse, the Phase A gate that
      # asserts it (scripts/run_one_pass_gradient_gate.sh) had no callers in
      # any workflow, runner or oracle, so nothing ran it either.
      #
      # This step runs both halves: the positive case, and the NEGATIVE control
      # that drives the counter above zero through a real central-difference
      # backward and checks the assertion goes #f. Both engines, because the
      # native and bytecode back ends keep separate FD counters — the asymmetry
      # that let one stay dead while the other worked. One Linux and one macOS
      # lane is enough to cover both platforms without paying for it six times.
      - name: AD exactness gate (finite-difference counter is live; matmul tape ratchet)
        if: matrix.name == 'linux-x64-lite' || matrix.name == 'macos-arm64-lite'
        timeout-minutes: 25
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          ESHKOL_JIT_CACHE_DIR: ${{ runner.temp }}/eshkol-ad-exactness-jit-cache
        run: |
          set -euxo pipefail
          mkdir -p "$ESHKOL_JIT_CACHE_DIR"
          ./scripts/run_ad_exactness_gate.sh

      - name: Upload Test Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-test-log
          path: ${{ runner.temp }}/eshkol-test-logs/${{ matrix.name }}.log
          if-no-files-found: ignore

      - name: Upload Artifacts
        if: matrix.upload_artifact == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_dir }}/eshkol-run
            ${{ matrix.build_dir }}/eshkol-repl
            ${{ matrix.build_dir }}/stdlib.o
            ${{ matrix.build_dir }}/stdlib.bc

      # Evidence must survive CI (ADR-0010 §2.2; closes AR1 gap A5). Any lane
      # that emits ICC oracle traces — the execution-backed coverage step, the
      # pillar runners — writes them under scripts/icc_traces/ and the .icc
      # oracle-view dirs, which are git-ignored and were therefore discarded
      # when the runner was torn down, so "readiness=100" never had CI-side
      # evidence behind it. Upload whatever a lane produced as a per-lane
      # artifact. `if: always()` keeps evidence from failing lanes;
      # `if-no-files-found: ignore` makes this a no-op on lanes that emit
      # nothing. Append-only and deliberately a distinct step from the
      # trace-emitting steps that sibling branches add, so those merge without
      # a conflict here.
      - name: Upload ICC evidence traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: icc-evidence-${{ matrix.name }}
          path: |
            scripts/icc_traces/
            .icc/runtime-traces/
            .icc/runtime-traces-oracle-view/
          if-no-files-found: ignore

  # The Windows lanes' own curl-from-llvm-project path is where the
  # stall/slow-download risk lives (see "Install LLVM SDK" below and
  # llvm-sdk-cache-keepalive above). Linux runner egress to GitHub release
  # assets is fast and has not hung a single lane. This job pre-fetches the
  # raw, still-compressed LLVM SDK archives on Linux and stashes them under
  # a short, in-workspace, OS-agnostic relative path via
  # enableCrossOsArchive: a compressed .tar.xz is byte-identical cache
  # content no matter which OS wrote it. This is deliberately a SEPARATE
  # cache key/path from the *extracted* SDK the Windows jobs restore into
  # C:\src — an absolute, drive-lettered path outside the workspace, which
  # actions/cache's own docs say cross-OS archiving cannot reconcile
  # ("avoid directory pointers... which evaluate to an absolute path that
  # does not match across OSs"); that extraction step and its cache key are
  # untouched. windows-matrix only needs to extract on a hit, skipping its
  # own curl entirely; a miss here falls back unchanged to that curl.
  prefetch-windows-llvm-archives:
    name: prefetch-windows-llvm-archives (${{ matrix.arch }})
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            llvm_suffix: aarch64
          - arch: x64
            llvm_suffix: x86_64
    steps:
      - name: Restore LLVM SDK archive cache
        id: archive-cache
        uses: actions/cache/restore@v5
        with:
          path: llvm-archive-cache/clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz
          key: windows-llvm-archive-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}
          enableCrossOsArchive: true

      - name: Download LLVM SDK archive
        if: steps.archive-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p llvm-archive-cache
          llvm_version='${{ env.WINDOWS_LLVM_SDK_VERSION }}'
          suffix='${{ matrix.llvm_suffix }}'
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${llvm_version}/clang+llvm-${llvm_version}-${suffix}-pc-windows-msvc.tar.xz"
          out="llvm-archive-cache/clang+llvm-${llvm_version}-${suffix}-pc-windows-msvc.tar.xz"
          echo "Downloading $url"
          curl --fail --location --connect-timeout 30 --speed-limit 102400 --speed-time 60 --retry 5 --retry-delay 5 --retry-all-errors --output "$out" "$url"

      - name: Save LLVM SDK archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: llvm-archive-cache/clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz
          key: windows-llvm-archive-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}
          enableCrossOsArchive: true

  windows-matrix:
    name: ${{ matrix.name }}
    needs: [changes, prefetch-windows-llvm-archives]
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only == 'false'
    runs-on: ${{ matrix.runner }}
    # windows-arm64-lite alone (full build+test, LLVM SDK cache-hit so no
    # extraction) has run ~51 minutes end to end; windows-x64-cuda adds the
    # CUDA toolkit install and GPU build/test on top. 90 minutes leaves that
    # real baseline comfortable headroom while still making the platform's
    # unbounded 360-minute default (what let "Install LLVM SDK" run
    # undetected for ~6h below) unreachable.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # Native Windows ARM64 covers the portable lite/XLA compiler. NVIDIA
          # ships the Windows CUDA toolkit only for x86_64, so CUDA compilation
          # is a separate hosted x64 lane below.
          - name: windows-arm64-lite
            runner: windows-11-arm
            arch: arm64
            llvm_suffix: aarch64
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_mode: windows-lite
            upload_artifact: 'true'
            artifact_name: eshkol-windows-arm64
          - name: windows-arm64-xla
            runner: windows-11-arm
            arch: arm64
            llvm_suffix: aarch64
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_mode: xla
            upload_artifact: 'false'
            artifact_name: ''
          - name: windows-x64-cuda
            runner: windows-2022
            arch: x64
            llvm_suffix: x86_64
            build_dir: build-cuda
            xla_enabled: 'OFF'
            gpu_enabled: 'ON'
            test_mode: gpu
            upload_artifact: 'false'
            artifact_name: ''
    steps:
      - uses: actions/checkout@v6

      - name: Install NVIDIA CUDA Toolkit (Windows x64 CUDA)
        if: matrix.gpu_enabled == 'ON'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          # CUDA 12.4's Windows installer has no standalone `crt` or `nvvm`
          # subpackages; nvcc carries those compiler internals. Passing names
          # from newer toolkit layouts makes NVIDIA exit with 3772776473.
          sub-packages: '["cudart", "cublas", "cublas_dev", "nvcc", "visual_studio_integration"]'
          log-file-suffix: ci-${{ matrix.name }}

      - name: Restore LLVM SDK Cache
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\src\clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc
          key: windows-llvm-sdk-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}

      # Populated by prefetch-windows-llvm-archives above, which this job
      # `needs:`. On a hit, "Install LLVM SDK" below extracts straight from
      # this file and never calls curl at all.
      - name: Restore prefetched LLVM SDK archive
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        id: archive-cache
        uses: actions/cache/restore@v5
        with:
          path: llvm-archive-cache/clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz
          key: windows-llvm-archive-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}
          enableCrossOsArchive: true

      - name: Install LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        # Pure extraction of an already-local archive should never come
        # close to this. If it does, something is genuinely stuck and
        # failing fast beats silently riding the platform's 360-minute
        # default to the same outcome six hours later.
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmVersion = '${{ env.WINDOWS_LLVM_SDK_VERSION }}'
          $llvmRoot    = "C:\src\clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc"
          $llvmCmakeDir = "$llvmRoot\lib\cmake\llvm"
          $prefetched = "llvm-archive-cache\clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz"
          $archive = "$env:RUNNER_TEMP\llvm-${{ matrix.arch }}-$llvmVersion.tar.xz"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz"

          New-Item -ItemType Directory -Force -Path 'C:\src' | Out-Null
          if (Test-Path $llvmRoot) {
            Remove-Item -LiteralPath $llvmRoot -Recurse -Force
          }

          # Windows Defender's real-time scanner inspecting each of the SDK's
          # tens of thousands of small files as they're written is a known
          # cause of extraction taking hours instead of minutes on hosted
          # Windows runners. This needs admin, which hosted runners grant;
          # if it fails for any reason, proceed without it rather than fail
          # the step over an optimization.
          try {
            Add-MpPreference -ExclusionPath 'C:\src', $env:RUNNER_TEMP -ErrorAction Stop
            Write-Host "Added Windows Defender exclusions for C:\src and $env:RUNNER_TEMP"
          } catch {
            Write-Host "Add-MpPreference failed (non-fatal, proceeding): $_"
          }

          if ('${{ steps.archive-cache.outputs.cache-hit }}' -eq 'true' -and (Test-Path $prefetched)) {
            Write-Host "Using prefetched archive at $prefetched (skipping curl)"
            $archive = $prefetched
          } else {
            Write-Host "Downloading $url"
            # --retry only fires on curl's own error exits; a connection that
            # opens and then goes silent (stalled transfer) is not an error to
            # curl and --retry never sees it, so the step can hang to the job
            # timeout. --connect-timeout bounds the TCP/TLS handshake and
            # --speed-limit/--speed-time make curl abort (exit 28) once the
            # transfer drops below 100 KB/s for 60s straight, which --retry-all-errors
            # then retries like any other failure.
            curl.exe --fail --location --connect-timeout 30 --speed-limit 102400 --speed-time 60 --retry 5 --retry-delay 5 --retry-all-errors --output $archive $url
            if ($LASTEXITCODE -ne 0) { throw "curl download failed (exit $LASTEXITCODE)" }
          }

          Write-Host "Extracting..."
          # `tar -xf` on this archive has been observed to hang for hours on
          # these runners even with the archive already local — this is an
          # extraction problem, not a download problem. 7-Zip handles each
          # format (.xz then .tar) in a single pass and is preinstalled on
          # hosted Windows runners; fall back to tar only if 7z is
          # unexpectedly absent.
          $use7z = [bool](Get-Command 7z -ErrorAction SilentlyContinue)
          if ($use7z) {
            $archiveLeaf = Split-Path -Leaf $archive
            $innerTar = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetFileNameWithoutExtension($archiveLeaf))
            & 7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z extraction of .tar.xz failed (exit $LASTEXITCODE)" }
            & 7z x $innerTar "-oC:\src" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z extraction of .tar failed (exit $LASTEXITCODE)" }
            Remove-Item -LiteralPath $innerTar -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "7z not found on PATH, falling back to tar"
            tar -xf $archive -C C:\src
            if ($LASTEXITCODE -ne 0) { throw "tar extraction failed (exit $LASTEXITCODE)" }
          }

          if (-not (Test-Path "$llvmCmakeDir\LLVMConfig.cmake")) {
            throw "LLVMConfig.cmake not found at $llvmCmakeDir - extraction may have failed"
          }

          Write-Host "LLVM $llvmVersion ${{ matrix.arch }} ready at $llvmRoot"

      - name: Resolve LLVM SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmVersion = '${{ env.WINDOWS_LLVM_SDK_VERSION }}'
          $llvmRoot    = "C:\src\clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc"
          $llvmCmakeDir = "$llvmRoot\lib\cmake\llvm"

          if (-not (Test-Path "$llvmCmakeDir\LLVMConfig.cmake")) {
            throw "LLVMConfig.cmake not found at $llvmCmakeDir - extraction may have failed"
          }

          Write-Host "LLVM $llvmVersion ${{ matrix.arch }} ready at $llvmRoot"
          "LLVM_DIR=$llvmCmakeDir"   | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append
          "LLVM_HOME=$llvmRoot"       | Out-File -FilePath $env:GITHUB_ENV  -Encoding utf8 -Append
          "$llvmRoot\bin"             | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save LLVM SDK Cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\src\clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc
          key: windows-llvm-sdk-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          $hostCxx = "$env:LLVM_HOME\bin\clang++.exe"
          if (-not (Test-Path $hostCxx)) {
            throw "clang++.exe not found in LLVM SDK at $hostCxx"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found; cannot locate a Visual Studio generator"
          }
          $cmakeArgs = @(
            '-S', '.',
            '-B', '${{ matrix.build_dir }}',
            '-DBUILD_REPL=ON',
            '-DESHKOL_BUILD_TESTS=OFF',
            '-DESHKOL_REQUIRED_LLVM_MAJOR=${{ env.LLVM_MAJOR }}',
            "-DESHKOL_HOST_CXX_COMPILER=$hostCxx",
            '-DESHKOL_XLA_ENABLED=${{ matrix.xla_enabled }}',
            '-DESHKOL_GPU_ENABLED=${{ matrix.gpu_enabled }}',
            '-DESHKOL_REQUIRE_GPU_BACKEND=${{ matrix.gpu_enabled }}',
            "-DLLVM_DIR=$env:LLVM_DIR"
          )
          if ('${{ matrix.gpu_enabled }}' -eq 'ON') {
            if (-not $env:CUDA_PATH -or -not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
              throw "CUDA toolkit action did not provide a usable CUDA_PATH"
            }
            $install = & $vswhere -latest -products * `
              -requires Microsoft.Component.MSBuild `
              -version '[17.0,18.0)' -property installationPath
            if ($LASTEXITCODE -ne 0 -or -not $install) {
              throw "Visual Studio 2022 is required for the CUDA 12.4 host toolchain"
            }
            $devCmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
            if (-not (Test-Path $devCmd -PathType Leaf)) {
              throw "VsDevCmd.bat not found at $devCmd"
            }
            # CUDA 12.4 supports MSVC 19.2x/19.3x, while the hosted image's
            # default v143 compiler has already advanced to 19.4x. Activate
            # the installed v142 toolset only for nvcc's host compilation.
            $devEnvironment = & $env:ComSpec /d /s /c `
              "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=14.29 && set"
            if ($LASTEXITCODE -ne 0) {
              throw "Visual Studio v142 developer environment activation failed"
            }
            foreach ($line in $devEnvironment) {
              if ($line -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
              }
            }
            $cudaHostCxx = (Get-Command cl.exe -ErrorAction Stop).Source
            if ($cudaHostCxx -notmatch '\\MSVC\\14\.29[^\\]*\\bin\\') {
              throw "CUDA host compiler is not the supported v142 toolset: $cudaHostCxx"
            }
            # CMake forwards this cache entry to nvcc's -ccbin option. Native
            # backslashes are consumed as escapes there, so use CMake's
            # platform-independent forward-slash spelling for the same file.
            $cudaHostCxxCMake = $cudaHostCxx.Replace('\', '/')
            $clangCl = "$env:LLVM_HOME\bin\clang-cl.exe"
            if (-not (Test-Path $clangCl -PathType Leaf)) {
              throw "clang-cl.exe not found in LLVM SDK at $clangCl"
            }
            if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
              throw "Ninja is required for the Windows ClangCL + CUDA build"
            }
            # Visual Studio generators ignore CMAKE_CUDA_HOST_COMPILER and
            # CUDA's MSBuild targets reject ClangCL with MSB4023. Ninja Multi-
            # Config keeps the existing Release/ layout while compiling Eshkol
            # C/C++ with LLVM 21 and CUDA translation units with nvcc + v142 cl.
            $cmakeArgs += @(
              '-G', 'Ninja Multi-Config',
              '-DCMAKE_CONFIGURATION_TYPES=Release',
              "-DCMAKE_C_COMPILER=$clangCl",
              "-DCMAKE_CXX_COMPILER=$clangCl",
              "-DCMAKE_CUDA_COMPILER=$env:CUDA_PATH\bin\nvcc.exe",
              "-DCMAKE_CUDA_HOST_COMPILER=$cudaHostCxxCMake",
              "-DCUDAToolkit_ROOT=$env:CUDA_PATH"
            )
          } else {
            $cmakeHelp = (cmake --help) -join "`n"
            $generator = $null
            foreach ($candidate in @(
                @{ name = 'Visual Studio 18 2026'; version = '[18.0,19.0)' },
                @{ name = 'Visual Studio 17 2022'; version = '[17.0,18.0)' }
              )) {
              if ($cmakeHelp -notmatch [regex]::Escape($candidate.name)) {
                continue
              }
              $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -version $candidate.version -property installationPath
              if ($LASTEXITCODE -eq 0 -and $install) {
                $generator = $candidate.name
                Write-Host "Using CMake generator '$generator' from $install"
                break
              }
            }
            if (-not $generator) {
              throw "No supported Visual Studio CMake generator found. Install VS 2022+ with MSBuild, or update the generator candidate list."
            }
            $cmakeArgs += @('-G', $generator, '-A', $platform, '-T', 'ClangCL')
          }
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify real CUDA build graph
        if: matrix.gpu_enabled == 'ON'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc version probe failed" }
          python scripts/verify_gpu_backend.py `
            --build-dir '${{ matrix.build_dir }}' `
            --expected CUDA

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @('eshkol-run', 'eshkol-repl', 'eshkol-agent-ffi', 'eshkol-windows-agent-test', 'eshkol-agent-http-test', 'eshkol-agent-sse-test', 'eshkol-agent-capabilities-test')
          if ('${{ matrix.test_mode }}' -eq 'xla') {
            $targets += 'xla_codegen_test'
          }
          cmake --build '${{ matrix.build_dir }}' --config Release --target @($targets) --parallel

      - name: Run Tests
        timeout-minutes: 120
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\eshkol-test-logs" | Out-Null
          & .\scripts\run_all_tests.ps1 -BuildDir ".\${{ matrix.build_dir }}" -SkipConfigureBuild -Mode '${{ matrix.test_mode }}' *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\eshkol-test-logs\${{ matrix.name }}.log"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $agentNativeTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-windows-agent-test.exe'
          $agentHttpTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-agent-http-test.exe'
          $agentSseTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-agent-sse-test.exe'
          $agentCapabilitiesTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-agent-capabilities-test.exe'
          foreach ($test in @($agentNativeTest, $agentHttpTest, $agentSseTest, $agentCapabilitiesTest)) {
            if (-not (Test-Path $test -PathType Leaf)) {
              throw "Required native agent contract test is missing: $test"
            }
            & $test
            if ($LASTEXITCODE -ne 0) {
              throw "Native agent contract test failed: $test (exit $LASTEXITCODE)"
            }
          }

      - name: Upload Test Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-test-log
          path: ${{ runner.temp }}/eshkol-test-logs/${{ matrix.name }}.log
          if-no-files-found: ignore

      - name: Upload Artifacts
        if: matrix.upload_artifact == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_dir }}/Release/eshkol-run.exe
            ${{ matrix.build_dir }}/Release/eshkol-repl.exe
            ${{ matrix.build_dir }}/stdlib.o
            ${{ matrix.build_dir }}/stdlib.bc

  # ─────────────────────────────────────────────────────────────────────
  # WASM execute-and-diff lane.  Closes the WASM-correctness cell in the
  # assurance matrix: the rest of CI only asserts a produced .wasm is a
  # valid binary (magic bytes) + that its env-import surface matches the JS
  # glue — nothing else EXECUTES Eshkol-compiled WASM and diffs its output
  # against native.  This self-contained job builds the bytecode VM to
  # WebAssembly (Emscripten, from lib/backend/vm_wasm_repl.c — the same
  # module family that powers the browser REPL, whose C display/number-format
  # code is what actually runs in WASM), then runs
  # scripts/run_wasm_differential.sh: it executes the VM-supported corpus
  # (tests/vm_parity/corpus) under node via the run_program export and
  # byte-diffs the captured stdout against native `eshkol-run -r`.  Runs in
  # parallel with unix-matrix (so it does not extend the critical path) and
  # only builds eshkol-run + stdlib (lite) plus the tiny VM WASM, keeping the
  # cost bounded.  The bounded subset runs on every PR; a scheduled/dispatch
  # workflow can set WASM_DIFF_FULL=1 to additionally sweep the differential
  # corpus (tests/differential/corpus).
  # ─────────────────────────────────────────────────────────────────────
  wasm-execute-diff:
    name: wasm-execute-diff
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # See the unix-matrix job's identical-in-spirit step for why every
      # fetch here goes through scripts/ci_retry.sh. This block's prior
      # `apt-get update` retry loop (`... && break` inside `for`, falling
      # through silently after the last failed attempt with no non-zero
      # exit) could never actually fail the step even after 3 real
      # failures — replaced with the same wrapper used everywhere else so
      # the retry policy has one definition and a real failure is still
      # terminal.
      - name: Add LLVM Repository (Linux)
        shell: bash
        run: |
          set -euxo pipefail
          scripts/ci_retry.sh --attempts 3 --base-delay 10 -- \
            wget --timeout=20 --tries=1 -qO "$RUNNER_TEMP/llvm-snapshot.gpg.key" \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc < "$RUNNER_TEMP/llvm-snapshot.gpg.key" >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          scripts/ci_retry.sh --attempts 4 --base-delay 15 -- \
            sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

      - name: Install Dependencies (Linux)
        shell: bash
        run: |
          set -euxo pipefail
          scripts/ci_retry.sh --attempts 3 --base-delay 15 -- \
            sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            cmake ninja-build \
            llvm-${LLVM_MAJOR} llvm-${LLVM_MAJOR}-dev lld-${LLVM_MAJOR} \
            libreadline-dev pkg-config libssl-dev libncurses-dev \
            libpcre2-dev libsqlite3-dev libpng-dev libjpeg-dev libwebp-dev \
            git python3
          sudo ln -sf "/usr/bin/ld.lld-${LLVM_MAJOR}" /usr/bin/ld.lld

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.22
          actions-cache-folder: emsdk-cache-4.0.22

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure (lite)
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_BUILD_TESTS=OFF \
            -DESHKOL_XLA_ENABLED=OFF \
            -DESHKOL_GPU_ENABLED=OFF

      - name: Build eshkol-run + stdlib
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --target eshkol-run stdlib --parallel

      - name: Run WASM execute-and-diff
        shell: bash
        env:
          BUILD_DIR: build
        run: |
          set -euxo pipefail
          emcc --version
          node --version
          ./scripts/run_wasm_differential.sh --quick

      - name: Upload WASM diff trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-execute-diff-trace
          path: scripts/icc_traces/wasm_parity.jsonl
          if-no-files-found: ignore

  # actions/cache evicts entries that go unaccessed for 7 days, and the
  # windows-llvm-sdk-* caches only get touched by pushes/PRs that actually
  # exercise the windows-matrix lane on a cold cache. In a quiet stretch that
  # is enough idle time for eviction, which strands the *next* run on the
  # ~800MB download+extract path above — with no warning until it happens to
  # hit the job timeout (this is what happened to windows-x64-cuda after 12
  # idle days). A weekly restore is a cheap access that resets the idle
  # clock; if the entry is already gone by the time this runs, it rebuilds
  # and re-saves it so the gap never has a chance to compound.
  llvm-sdk-cache-keepalive:
    name: llvm-sdk-cache-keepalive (${{ matrix.arch }})
    if: github.event_name == 'schedule' && github.repository == 'tsotchke/eshkol'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            llvm_suffix: aarch64
          - arch: x64
            runner: windows-2022
            llvm_suffix: x86_64
    steps:
      - name: Restore LLVM SDK Cache
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\src\clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc
          key: windows-llvm-sdk-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}

      - name: Install LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmVersion = '${{ env.WINDOWS_LLVM_SDK_VERSION }}'
          $llvmRoot    = "C:\src\clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc"
          $llvmCmakeDir = "$llvmRoot\lib\cmake\llvm"
          $archive = "$env:RUNNER_TEMP\llvm-${{ matrix.arch }}-$llvmVersion.tar.xz"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz"

          New-Item -ItemType Directory -Force -Path 'C:\src' | Out-Null
          if (Test-Path $llvmRoot) {
            Remove-Item -LiteralPath $llvmRoot -Recurse -Force
          }

          try {
            Add-MpPreference -ExclusionPath 'C:\src', $env:RUNNER_TEMP -ErrorAction Stop
            Write-Host "Added Windows Defender exclusions for C:\src and $env:RUNNER_TEMP"
          } catch {
            Write-Host "Add-MpPreference failed (non-fatal, proceeding): $_"
          }

          Write-Host "Downloading $url"
          curl.exe --fail --location --connect-timeout 30 --speed-limit 102400 --speed-time 60 --retry 5 --retry-delay 5 --retry-all-errors --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "curl download failed (exit $LASTEXITCODE)" }

          Write-Host "Extracting..."
          # See windows-matrix's "Install LLVM SDK" for why: tar has been
          # observed to hang for hours on this archive even with it already
          # local, so use 7-Zip (preinstalled on hosted Windows runners) and
          # only fall back to tar if it is unexpectedly absent.
          $use7z = [bool](Get-Command 7z -ErrorAction SilentlyContinue)
          if ($use7z) {
            $archiveLeaf = Split-Path -Leaf $archive
            $innerTar = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetFileNameWithoutExtension($archiveLeaf))
            & 7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z extraction of .tar.xz failed (exit $LASTEXITCODE)" }
            & 7z x $innerTar "-oC:\src" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z extraction of .tar failed (exit $LASTEXITCODE)" }
            Remove-Item -LiteralPath $innerTar -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "7z not found on PATH, falling back to tar"
            tar -xf $archive -C C:\src
            if ($LASTEXITCODE -ne 0) { throw "tar extraction failed (exit $LASTEXITCODE)" }
          }

          if (-not (Test-Path "$llvmCmakeDir\LLVMConfig.cmake")) {
            throw "LLVMConfig.cmake not found at $llvmCmakeDir - extraction may have failed"
          }

          Write-Host "LLVM $llvmVersion ${{ matrix.arch }} ready at $llvmRoot"

      - name: Save LLVM SDK Cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\src\clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc
          key: windows-llvm-sdk-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}
