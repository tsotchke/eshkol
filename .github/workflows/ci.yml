name: CI

# THIS WORKFLOW IS NO LONGER THE MERGE GATE.
#
# The merge gate for this repository is the maintainer's own heterogeneous
# compute mesh, not GitHub Actions. It runs the same lane batteries this file
# used to run — linux x64 (+asan, +cuda), linux arm64 (+cuda), macOS arm64,
# Windows x64, wasm — on real hardware, including real GPUs, and ends in an
# `icc readiness` check. One invocation produces one verdict document:
#
#     mesh gates run --lane eshkol --ref <sha>      # -> MERGE-OK | BLOCKED
#     mesh gates status --lane eshkol               # last verdict
#     mesh gates plan   --lane eshkol --ref <sha>   # lane -> node map, no side effects
#
# Why the build/test matrix left this file:
#
#   * The hosted CUDA lanes had NO GPU. eshkol_gpu_init() returned zero devices
#     and every "GPU" tensor op silently fell through to the CPU path, so those
#     lanes were a compilation gate wearing an execution gate's name — see the
#     header of .github/workflows/gpu-execution-gate.yml, which has said so all
#     along. The mesh lanes run on an RTX card and a Jetson.
#   * Both Linux runner pools reclaimed jobs mid-suite for weeks (exit 143 with
#     "Passed: 32 Failed: 0" already printed, BlobNotFound on the arm64 side),
#     and macOS runner availability was the pacing item on every release.
#   * The mesh nodes keep warm per-node mirrors and incremental build trees, so
#     a full matrix costs a fraction of a cold hosted matrix.
#
# WHAT REMAINS HERE, deliberately: the surface-manifest tripwire below. It is
# free, finishes in well under a minute, and answers a question that otherwise
# only surfaces at the very end of the slowest lane. The identity guard stays in
# .github/workflows/identity-guard.yml for the same reason. Neither is a build.
#
# Uncovered platforms are NOT silently dropped: the mesh lane set declares
# macos-x64 as awaiting-node (hardware in flight) and windows-arm64 as a no-node
# gap, and prints both in every verdict. See computer_mesh/gates/eshkol/lanes.json.
#
# DO NOT re-add build or test jobs here. If a lane needs to exist, it belongs in
# the mesh lane set, where it runs on hardware that actually has the device.

on:
  push:
    branches: [master, develop, 'feat/**']
    # Docs/markdown-only changes cannot make the language-surface manifest
    # stale, so they do not need the tripwire. Research ADRs and documentation
    # live under docs/ and **/*.md.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notes/**'
      - 'press/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notes/**'
      - 'press/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only the tripwire runs here now, and it is idempotent and cheap, so a newer
  # push may cancel an in-flight one on a branch. Master runs are left alone.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The language-surface manifest is the ground truth the execution-backed
  # coverage floor is measured against, so a stale manifest fails the coverage
  # gate. That floor now lives in the mesh's quantum-macos lane — advisory, and
  # the slowest lane to report — and four separate changes have burned a full
  # matrix cycle discovering a one-second staleness error there. This job
  # answers the same question in well under a minute, for free, on every pull
  # request, which is the only reason it is still hosted here.
  surface-manifest:
    name: surface-manifest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Manifest matches the source-extracted surface
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gen_language_surface.py
          if ! git diff --quiet -- tests/coverage/language_surface.json; then
            echo "::error file=tests/coverage/language_surface.json::The language-surface manifest is stale. Regenerate it with 'python3 scripts/gen_language_surface.py' and commit the result — a new builtin, special form or AST op must be declared before the execution-backed coverage floor can measure it."
            git --no-pager diff -- tests/coverage/language_surface.json
            exit 1
          fi
          echo "manifest is current"
