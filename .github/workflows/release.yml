name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Candidate tag label used only for dry-run asset names
        required: true
        default: v1.3.3-evolve
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  LLVM_MAJOR: '21'
  WINDOWS_LLVM_SDK_VERSION: '21.1.8'
  CUDA_VERSION: '12.4.1'
  CUDA_PACKAGE_SERIES: '12-4'
  # A manual dispatch is always non-publishing. Its explicit candidate label
  # lets the dry-run archives use the exact names the later tag run will use.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || github.ref_name }}

jobs:
  unix-release-matrix:
    name: release-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-lite
            runner: ubuntu-22.04
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
          - name: linux-arm64-lite
            runner: ubuntu-22.04-arm
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
          - name: linux-x64-xla
            runner: ubuntu-22.04
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh
          - name: linux-arm64-xla
            runner: ubuntu-22.04-arm
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh
          - name: linux-x64-cuda
            runner: ubuntu-22.04
            build_dir: build-cuda
            xla_enabled: 'OFF'
            gpu_enabled: 'ON'
            test_command: ./scripts/run_gpu_tests.sh
          - name: linux-arm64-cuda
            runner: ubuntu-22.04-arm
            build_dir: build-cuda
            xla_enabled: 'OFF'
            gpu_enabled: 'ON'
            test_command: ./scripts/run_gpu_tests.sh
          - name: macos-arm64-lite
            runner: macos-14
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
          - name: macos-x64-lite
            runner: macos-15-intel
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_all_tests.sh
          - name: macos-arm64-xla
            runner: macos-14
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh
          - name: macos-x64-xla
            runner: macos-15-intel
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_command: ./scripts/run_xla_tests.sh

    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag label
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag label: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Add LLVM Repository (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          apt_update() {
            for attempt in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=5; then
                return 0
              fi
              sudo rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 15))
            done
            sudo apt-get update -o Acquire::Retries=5
          }
          apt_update

      - name: Add NVIDIA CUDA Repository (Linux CUDA)
        if: runner.os == 'Linux' && matrix.gpu_enabled == 'ON'
        shell: bash
        run: |
          set -euxo pipefail
          case "$(uname -m)" in
            x86_64) cuda_repo_arch=x86_64 ;;
            aarch64) cuda_repo_arch=sbsa ;;
            *) echo "Unsupported native CUDA architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          keyring="$RUNNER_TEMP/cuda-keyring.deb"
          wget -O "$keyring" \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/${cuda_repo_arch}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i "$keyring"
          sudo apt-get update -o Acquire::Retries=5

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          packages=(
            cmake ninja-build
            llvm-${LLVM_MAJOR} llvm-${LLVM_MAJOR}-dev lld-${LLVM_MAJOR}
            libreadline-dev pkg-config patchelf
            libssl-dev libncurses-dev
            libpcre2-dev libsqlite3-dev
            libpng-dev libjpeg-dev libwebp-dev
            git python3
          )
          if [[ "${{ matrix.gpu_enabled }}" == "ON" ]]; then
            packages+=(
              "cuda-nvcc-${CUDA_PACKAGE_SERIES}"
              "cuda-cudart-dev-${CUDA_PACKAGE_SERIES}"
              "libcublas-dev-${CUDA_PACKAGE_SERIES}"
            )
          fi
          apt_install() {
            for attempt in 1 2 3; do
              if sudo env DEBIAN_FRONTEND=noninteractive \
                  apt-get install -y -o Acquire::Retries=5 "${packages[@]}"; then
                return 0
              fi
              if (( attempt == 3 )); then
                echo "apt dependency installation failed after ${attempt} attempts" >&2
                return 1
              fi
              sleep $((attempt * 15))
              sudo apt-get update -o Acquire::Retries=5
            done
          }
          apt_install
          # Keep release builds aligned with CI: generated AArch64
          # executables use -fuse-ld=lld, which resolves unversioned
          # ld.lld from PATH.
          sudo ln -sf "/usr/bin/ld.lld-${LLVM_MAJOR}" /usr/bin/ld.lld
          ld.lld --version
          if [[ "${{ matrix.gpu_enabled }}" == "ON" ]]; then
            echo "/usr/local/cuda-12.4/bin" >> "$GITHUB_PATH"
            echo "CUDAToolkit_ROOT=/usr/local/cuda-12.4" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/local/cuda-12.4/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            /usr/local/cuda-12.4/bin/nvcc --version
          fi

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          brew install llvm@${LLVM_MAJOR} cmake ninja readline pcre2 sqlite

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_DIR="${{ matrix.build_dir }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            LLVM_PREFIX="$(brew --prefix llvm@${LLVM_MAJOR})"
            export PATH="$LLVM_PREFIX/bin:$PATH"
            LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config"
          else
            LLVM_CONFIG="/usr/bin/llvm-config-${LLVM_MAJOR}"
          fi

          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_CONFIG" \
            -DESHKOL_STDLIB_TARGET_CPU=generic \
            -DESHKOL_STDLIB_TARGET_FEATURES= \
            -DESHKOL_XLA_ENABLED=${{ matrix.xla_enabled }} \
            -DESHKOL_GPU_ENABLED=${{ matrix.gpu_enabled }} \
            -DESHKOL_REQUIRE_GPU_BACKEND=${{ matrix.gpu_enabled }} \
            -DCUDAToolkit_ROOT=/usr/local/cuda-12.4

      - name: Verify real CUDA build graph
        if: matrix.gpu_enabled == 'ON'
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/verify_gpu_backend.py \
            --build-dir "${{ matrix.build_dir }}" \
            --expected CUDA

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "${{ matrix.build_dir }}" --parallel

      - name: Verify portable standard library
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            LLVM_DIS="$(brew --prefix llvm@${LLVM_MAJOR})/bin/llvm-dis"
          else
            LLVM_DIS="/usr/bin/llvm-dis-${LLVM_MAJOR}"
          fi
          test -x "$LLVM_DIS"
          python3 scripts/verify_portable_stdlib.py \
            --bitcode "${{ matrix.build_dir }}/stdlib.bc" \
            --llvm-dis "$LLVM_DIS" \
            --cmake-cache "${{ matrix.build_dir }}/CMakeCache.txt" \
            --expected-cpu generic

      - name: Check WASM env imports
        if: matrix.xla_enabled == 'OFF' && matrix.gpu_enabled == 'OFF' && matrix.build_dir == 'build'
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          python3 scripts/check_wasm_imports.py --build-dir "$BUILD_DIR"

      - name: Run Tests
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -euxo pipefail
          export ESHKOL_HTTP_SERVER_SMOKE_TIMEOUT="${ESHKOL_HTTP_SERVER_SMOKE_TIMEOUT:-600}"
          export ESHKOL_REPL_MACHINE_READY_TIMEOUT="${ESHKOL_REPL_MACHINE_READY_TIMEOUT:-600}"
          export ESHKOL_REPL_MACHINE_DONE_TIMEOUT="${ESHKOL_REPL_MACHINE_DONE_TIMEOUT:-180}"
          export ESHKOL_EDGE_FAILURE_LINES="${ESHKOL_EDGE_FAILURE_LINES:-80}"
          ${{ matrix.test_command }}
          test -x "$BUILD_DIR/eshkol-agent-http-test"
          "$BUILD_DIR/eshkol-agent-http-test"
          test -x "$BUILD_DIR/eshkol-agent-sse-test"
          "$BUILD_DIR/eshkol-agent-sse-test"
          test -x "$BUILD_DIR/eshkol-agent-capabilities-test"
          "$BUILD_DIR/eshkol-agent-capabilities-test"

      - name: Package Release Asset
        shell: bash
        run: |
          set -euxo pipefail
          archive_root="eshkol-${RELEASE_TAG}-${{ matrix.name }}"
          pkg_dir="$RUNNER_TEMP/$archive_root"
          mkdir -p "$pkg_dir/bin" "$pkg_dir/lib/eshkol" "$pkg_dir/share/eshkol/lib"

          cp "${{ matrix.build_dir }}/eshkol-run" "$pkg_dir/bin/"
          cp "${{ matrix.build_dir }}/eshkol-repl" "$pkg_dir/bin/"
          cp "${{ matrix.build_dir }}/stdlib.o" "$pkg_dir/lib/"
          cp "${{ matrix.build_dir }}/stdlib.o" "$pkg_dir/lib/eshkol/"
          cp "${{ matrix.build_dir }}/stdlib.bc" "$pkg_dir/lib/"
          cp "${{ matrix.build_dir }}/stdlib.bc" "$pkg_dir/lib/eshkol/"
          runtime_archive="${{ matrix.build_dir }}/libeshkol-runtime.a"
          agent_ffi_archive="${{ matrix.build_dir }}/libeshkol-agent-ffi.a"
          agent_pcre2_archive="${{ matrix.build_dir }}/eshkol-agent-pcre2.a"
          agent_sqlite_archive="${{ matrix.build_dir }}/eshkol-agent-sqlite3.a"
          agent_zlib_archive="${{ matrix.build_dir }}/eshkol-agent-zlib.a"
          agent_tree_sitter_grammars_archive="${{ matrix.build_dir }}/eshkol-agent-tree-sitter-grammars.a"
          agent_tree_sitter_archive="${{ matrix.build_dir }}/eshkol-agent-tree-sitter.a"
          agent_yoga_archive="${{ matrix.build_dir }}/eshkol-agent-yoga.a"
          test -s "$runtime_archive"
          test -s "$agent_ffi_archive"
          test -s "$agent_pcre2_archive"
          test -s "$agent_sqlite_archive"
          test -s "$agent_zlib_archive"
          test -s "$agent_tree_sitter_grammars_archive"
          test -s "$agent_tree_sitter_archive"
          test -s "$agent_yoga_archive"
          cp "$runtime_archive" "$pkg_dir/lib/"
          cp "$runtime_archive" "$pkg_dir/lib/eshkol/"
          cp "$agent_ffi_archive" "$pkg_dir/lib/"
          cp "$agent_ffi_archive" "$pkg_dir/lib/eshkol/"
          cp "$agent_pcre2_archive" "$pkg_dir/lib/"
          cp "$agent_pcre2_archive" "$pkg_dir/lib/eshkol/"
          cp "$agent_sqlite_archive" "$pkg_dir/lib/"
          cp "$agent_sqlite_archive" "$pkg_dir/lib/eshkol/"
          cp "$agent_zlib_archive" "$pkg_dir/lib/"
          cp "$agent_zlib_archive" "$pkg_dir/lib/eshkol/"
          cp "$agent_tree_sitter_grammars_archive" "$pkg_dir/lib/"
          cp "$agent_tree_sitter_grammars_archive" "$pkg_dir/lib/eshkol/"
          cp "$agent_tree_sitter_archive" "$pkg_dir/lib/"
          cp "$agent_tree_sitter_archive" "$pkg_dir/lib/eshkol/"
          cp "$agent_yoga_archive" "$pkg_dir/lib/"
          cp "$agent_yoga_archive" "$pkg_dir/lib/eshkol/"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            agent_curl_archive="${{ matrix.build_dir }}/eshkol-agent-curl.a"
            test -s "$agent_curl_archive"
            cp "$agent_curl_archive" "$pkg_dir/lib/"
            cp "$agent_curl_archive" "$pkg_dir/lib/eshkol/"
          fi

          cp "lib/stdlib.esk" "$pkg_dir/share/eshkol/"
          if [[ -f "lib/math.esk" ]]; then
            cp "lib/math.esk" "$pkg_dir/share/eshkol/"
          fi

          while IFS= read -r -d '' source_file; do
            rel_path="${source_file#lib/}"
            dest_path="$pkg_dir/share/eshkol/lib/$rel_path"
            mkdir -p "$(dirname "$dest_path")"
            cp "$source_file" "$dest_path"
          done < <(find lib -type f -name '*.esk' -print0)

          for doc in README.md LICENSE CHANGELOG.md RELEASE_NOTES.md; do
            if [[ -f "$doc" ]]; then
              cp "$doc" "$pkg_dir/"
            fi
          done

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python3 scripts/stage_linux_runtime_dependencies.py \
              --build-dir "${{ matrix.build_dir }}" \
              --package-dir "$pkg_dir"
          fi

          python3 scripts/stage_third_party_licenses.py \
            --build-dir "${{ matrix.build_dir }}" \
            --package-dir "$pkg_dir"

          python3 scripts/verify_release_package.py \
            --package-dir "$pkg_dir" \
            --smoke-source "tests/toolchain/windows-smoke.esk" \
            --agent-smoke-source "tests/toolchain/release-agent-smoke.esk" \
            --expected-version "$RELEASE_TAG"

          tar -czf "$RUNNER_TEMP/$archive_root.tar.gz" -C "$RUNNER_TEMP" "$archive_root"

      - name: Upload Packaged Asset
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.name }}
          path: ${{ runner.temp }}/eshkol-${{ env.RELEASE_TAG }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  # Same rationale as ci.yml's prefetch-windows-llvm-archives: the Windows
  # lanes' own curl-from-llvm-project path (below, "Install LLVM SDK") is
  # where a stalled/slow download can hang a job, while Linux egress to
  # GitHub release assets is fast and reliable. Pre-fetch the raw archives
  # on Linux into a short, in-workspace, OS-agnostic relative path via
  # enableCrossOsArchive, kept as a separate cache key/path from the
  # *extracted* SDK the Windows jobs restore into C:\src (an absolute,
  # drive-lettered path outside the workspace that cross-OS archiving
  # cannot target directly, per actions/cache's own docs). A release run is
  # infrequent and high-stakes, so this stays self-contained here rather
  # than assuming ci.yml's cache population already ran for this ref.
  prefetch-windows-llvm-archives:
    name: prefetch-windows-llvm-archives (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            llvm_suffix: aarch64
          - arch: x64
            llvm_suffix: x86_64
    steps:
      - name: Restore LLVM SDK archive cache
        id: archive-cache
        uses: actions/cache/restore@v5
        with:
          path: llvm-archive-cache/clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz
          key: windows-llvm-archive-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}
          enableCrossOsArchive: true

      - name: Download LLVM SDK archive
        if: steps.archive-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p llvm-archive-cache
          llvm_version='${{ env.WINDOWS_LLVM_SDK_VERSION }}'
          suffix='${{ matrix.llvm_suffix }}'
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${llvm_version}/clang+llvm-${llvm_version}-${suffix}-pc-windows-msvc.tar.xz"
          out="llvm-archive-cache/clang+llvm-${llvm_version}-${suffix}-pc-windows-msvc.tar.xz"
          echo "Downloading $url"
          curl --fail --location --connect-timeout 30 --speed-limit 102400 --speed-time 60 --retry 5 --retry-delay 5 --retry-all-errors --output "$out" "$url"

      - name: Save LLVM SDK archive cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: llvm-archive-cache/clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz
          key: windows-llvm-archive-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}
          enableCrossOsArchive: true

  windows-release-matrix:
    name: release-${{ matrix.name }}
    needs: prefetch-windows-llvm-archives
    runs-on: ${{ matrix.runner }}
    # See ci.yml's windows-matrix for the baseline this is set against: a
    # full build+test with the LLVM SDK cache already warm has been
    # observed to take ~50 minutes; windows-x64-cuda adds the CUDA toolkit
    # install and GPU build/test on top. 90 minutes leaves that comfortable
    # headroom while making the platform's unbounded 360-minute default
    # unreachable.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: windows-x64-lite
            runner: windows-latest
            arch: x64
            llvm_suffix: x86_64
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_mode: windows-lite
          - name: windows-arm64-lite
            runner: windows-11-arm
            arch: arm64
            llvm_suffix: aarch64
            build_dir: build
            xla_enabled: 'OFF'
            gpu_enabled: 'OFF'
            test_mode: windows-lite
          - name: windows-x64-xla
            runner: windows-latest
            arch: x64
            llvm_suffix: x86_64
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_mode: xla
          - name: windows-arm64-xla
            runner: windows-11-arm
            arch: arm64
            llvm_suffix: aarch64
            build_dir: build-xla
            xla_enabled: 'ON'
            gpu_enabled: 'OFF'
            test_mode: xla
          - name: windows-x64-cuda
            runner: windows-2022
            arch: x64
            llvm_suffix: x86_64
            build_dir: build-cuda
            xla_enabled: 'OFF'
            gpu_enabled: 'ON'
            test_mode: gpu
    steps:
      - uses: actions/checkout@v6

      - name: Validate release tag label
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Invalid release tag label: $env:RELEASE_TAG"
          }

      - name: Install NVIDIA CUDA Toolkit (Windows x64 CUDA)
        if: matrix.gpu_enabled == 'ON'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          # CUDA 12.4's Windows installer has no standalone `crt` or `nvvm`
          # subpackages; nvcc carries those compiler internals. Passing names
          # from newer toolkit layouts makes NVIDIA exit with 3772776473.
          sub-packages: '["cudart", "cublas", "cublas_dev", "nvcc", "visual_studio_integration"]'
          log-file-suffix: release-${{ matrix.name }}

      - name: Restore LLVM SDK Cache
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\src\clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc
          key: windows-llvm-sdk-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}

      # Populated by prefetch-windows-llvm-archives above, which this job
      # `needs:`. On a hit, "Install LLVM SDK" below extracts straight from
      # this file and never calls curl at all.
      - name: Restore prefetched LLVM SDK archive
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        id: archive-cache
        uses: actions/cache/restore@v5
        with:
          path: llvm-archive-cache/clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz
          key: windows-llvm-archive-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}
          enableCrossOsArchive: true

      - name: Install LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        # Pure extraction of an already-local archive should never come
        # close to this. If it does, something is genuinely stuck and
        # failing fast beats silently riding the platform's 360-minute
        # default to the same outcome six hours later.
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmVersion = '${{ env.WINDOWS_LLVM_SDK_VERSION }}'
          $llvmRoot = "C:\src\clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc"
          $llvmCmakeDir = "$llvmRoot\lib\cmake\llvm"
          $prefetched = "llvm-archive-cache\clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz"
          $archive = "$env:RUNNER_TEMP\llvm-${{ matrix.arch }}-$llvmVersion.tar.xz"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc.tar.xz"

          New-Item -ItemType Directory -Force -Path 'C:\src' | Out-Null
          if (Test-Path $llvmRoot) {
            Remove-Item -LiteralPath $llvmRoot -Recurse -Force
          }

          # Windows Defender's real-time scanner inspecting each of the SDK's
          # tens of thousands of small files as they're written is a known
          # cause of extraction taking hours instead of minutes on hosted
          # Windows runners. This needs admin, which hosted runners grant;
          # if it fails for any reason, proceed without it rather than fail
          # the step over an optimization.
          try {
            Add-MpPreference -ExclusionPath 'C:\src', $env:RUNNER_TEMP -ErrorAction Stop
            Write-Host "Added Windows Defender exclusions for C:\src and $env:RUNNER_TEMP"
          } catch {
            Write-Host "Add-MpPreference failed (non-fatal, proceeding): $_"
          }

          if ('${{ steps.archive-cache.outputs.cache-hit }}' -eq 'true' -and (Test-Path $prefetched)) {
            Write-Host "Using prefetched archive at $prefetched (skipping curl)"
            $archive = $prefetched
          } else {
            Write-Host "Downloading $url"
            # --retry only fires on curl's own error exits; a connection that
            # opens and then goes silent (stalled transfer) is not an error to
            # curl and --retry never sees it, so the step can hang to the job
            # timeout. --connect-timeout bounds the TCP/TLS handshake and
            # --speed-limit/--speed-time make curl abort (exit 28) once the
            # transfer drops below 100 KB/s for 60s straight, which --retry-all-errors
            # then retries like any other failure.
            curl.exe --fail --location --connect-timeout 30 --speed-limit 102400 --speed-time 60 --retry 5 --retry-delay 5 --retry-all-errors --output $archive $url
            if ($LASTEXITCODE -ne 0) { throw "curl download failed (exit $LASTEXITCODE)" }
          }

          Write-Host "Extracting..."
          # `tar -xf` on this archive has been observed to hang for hours on
          # these runners even with the archive already local — this is an
          # extraction problem, not a download problem. 7-Zip handles each
          # format (.xz then .tar) in a single pass and is preinstalled on
          # hosted Windows runners; fall back to tar only if 7z is
          # unexpectedly absent.
          $use7z = [bool](Get-Command 7z -ErrorAction SilentlyContinue)
          if ($use7z) {
            $archiveLeaf = Split-Path -Leaf $archive
            $innerTar = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetFileNameWithoutExtension($archiveLeaf))
            & 7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z extraction of .tar.xz failed (exit $LASTEXITCODE)" }
            & 7z x $innerTar "-oC:\src" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z extraction of .tar failed (exit $LASTEXITCODE)" }
            Remove-Item -LiteralPath $innerTar -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "7z not found on PATH, falling back to tar"
            tar -xf $archive -C C:\src
            if ($LASTEXITCODE -ne 0) { throw "tar extraction failed (exit $LASTEXITCODE)" }
          }

          if (-not (Test-Path "$llvmCmakeDir\LLVMConfig.cmake")) {
            throw "LLVMConfig.cmake not found at $llvmCmakeDir - extraction may have failed"
          }

          Write-Host "LLVM $llvmVersion ${{ matrix.arch }} ready at $llvmRoot"

      - name: Resolve LLVM SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmVersion = '${{ env.WINDOWS_LLVM_SDK_VERSION }}'
          $llvmRoot = "C:\src\clang+llvm-$llvmVersion-${{ matrix.llvm_suffix }}-pc-windows-msvc"
          $llvmCmakeDir = "$llvmRoot\lib\cmake\llvm"

          if (-not (Test-Path "$llvmCmakeDir\LLVMConfig.cmake")) {
            throw "LLVMConfig.cmake not found at $llvmCmakeDir - extraction may have failed"
          }

          Write-Host "LLVM $llvmVersion ${{ matrix.arch }} ready at $llvmRoot"
          "LLVM_DIR=$llvmCmakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_HOME=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save LLVM SDK Cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\src\clang+llvm-${{ env.WINDOWS_LLVM_SDK_VERSION }}-${{ matrix.llvm_suffix }}-pc-windows-msvc
          key: windows-llvm-sdk-${{ matrix.arch }}-${{ env.WINDOWS_LLVM_SDK_VERSION }}

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          $hostCxx = "$env:LLVM_HOME\bin\clang++.exe"
          if (-not (Test-Path $hostCxx)) {
            throw "clang++.exe not found in LLVM SDK at $hostCxx"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found; cannot locate a Visual Studio generator"
          }
          $cmakeArgs = @(
            '-S', '.',
            '-B', '${{ matrix.build_dir }}',
            '-DBUILD_REPL=ON',
            '-DESHKOL_BUILD_TESTS=OFF',
            '-DESHKOL_REQUIRED_LLVM_MAJOR=${{ env.LLVM_MAJOR }}',
            "-DESHKOL_HOST_CXX_COMPILER=$hostCxx",
            '-DESHKOL_STDLIB_TARGET_CPU=generic',
            '-DESHKOL_STDLIB_TARGET_FEATURES=',
            '-DESHKOL_XLA_ENABLED=${{ matrix.xla_enabled }}',
            '-DESHKOL_GPU_ENABLED=${{ matrix.gpu_enabled }}',
            '-DESHKOL_REQUIRE_GPU_BACKEND=${{ matrix.gpu_enabled }}',
            "-DLLVM_DIR=$env:LLVM_DIR"
          )
          if ('${{ matrix.gpu_enabled }}' -eq 'ON') {
            if (-not $env:CUDA_PATH -or -not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
              throw "CUDA toolkit action did not provide a usable CUDA_PATH"
            }
            $install = & $vswhere -latest -products * `
              -requires Microsoft.Component.MSBuild `
              -version '[17.0,18.0)' -property installationPath
            if ($LASTEXITCODE -ne 0 -or -not $install) {
              throw "Visual Studio 2022 is required for the CUDA 12.4 host toolchain"
            }
            $devCmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
            if (-not (Test-Path $devCmd -PathType Leaf)) {
              throw "VsDevCmd.bat not found at $devCmd"
            }
            # CUDA 12.4 supports MSVC 19.2x/19.3x, while the hosted image's
            # default v143 compiler has already advanced to 19.4x. Activate
            # the installed v142 toolset only for nvcc's host compilation.
            $devEnvironment = & $env:ComSpec /d /s /c `
              "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=14.29 && set"
            if ($LASTEXITCODE -ne 0) {
              throw "Visual Studio v142 developer environment activation failed"
            }
            foreach ($line in $devEnvironment) {
              if ($line -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
              }
            }
            $cudaHostCxx = (Get-Command cl.exe -ErrorAction Stop).Source
            if ($cudaHostCxx -notmatch '\\MSVC\\14\.29[^\\]*\\bin\\') {
              throw "CUDA host compiler is not the supported v142 toolset: $cudaHostCxx"
            }
            # CMake forwards this cache entry to nvcc's -ccbin option. Native
            # backslashes are consumed as escapes there, so use CMake's
            # platform-independent forward-slash spelling for the same file.
            $cudaHostCxxCMake = $cudaHostCxx.Replace('\', '/')
            $clangCl = "$env:LLVM_HOME\bin\clang-cl.exe"
            if (-not (Test-Path $clangCl -PathType Leaf)) {
              throw "clang-cl.exe not found in LLVM SDK at $clangCl"
            }
            if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
              throw "Ninja is required for the Windows ClangCL + CUDA build"
            }
            # Visual Studio generators ignore CMAKE_CUDA_HOST_COMPILER and
            # CUDA's MSBuild targets reject ClangCL with MSB4023. Ninja Multi-
            # Config keeps the existing Release/ layout while compiling Eshkol
            # C/C++ with LLVM 21 and CUDA translation units with nvcc + v142 cl.
            $cmakeArgs += @(
              '-G', 'Ninja Multi-Config',
              '-DCMAKE_CONFIGURATION_TYPES=Release',
              "-DCMAKE_C_COMPILER=$clangCl",
              "-DCMAKE_CXX_COMPILER=$clangCl",
              "-DCMAKE_CUDA_COMPILER=$env:CUDA_PATH\bin\nvcc.exe",
              "-DCMAKE_CUDA_HOST_COMPILER=$cudaHostCxxCMake",
              "-DCUDAToolkit_ROOT=$env:CUDA_PATH"
            )
          } else {
            $cmakeHelp = (cmake --help) -join "`n"
            $generator = $null
            foreach ($candidate in @(
                @{ name = 'Visual Studio 18 2026'; version = '[18.0,19.0)' },
                @{ name = 'Visual Studio 17 2022'; version = '[17.0,18.0)' }
              )) {
              if ($cmakeHelp -notmatch [regex]::Escape($candidate.name)) {
                continue
              }
              $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -version $candidate.version -property installationPath
              if ($LASTEXITCODE -eq 0 -and $install) {
                $generator = $candidate.name
                Write-Host "Using CMake generator '$generator' from $install"
                break
              }
            }
            if (-not $generator) {
              throw "No supported Visual Studio CMake generator found. Install VS 2022+ with MSBuild, or update the generator candidate list."
            }
            $cmakeArgs += @('-G', $generator, '-A', $platform, '-T', 'ClangCL')
          }
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify real CUDA build graph
        if: matrix.gpu_enabled == 'ON'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "nvcc version probe failed" }
          python scripts/verify_gpu_backend.py `
            --build-dir '${{ matrix.build_dir }}' `
            --expected CUDA

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @('eshkol-run', 'eshkol-repl', 'eshkol-runtime', 'eshkol-agent-ffi', 'eshkol-windows-agent-test', 'eshkol-agent-http-test', 'eshkol-agent-sse-test', 'eshkol-agent-capabilities-test', 'stdlib')
          if ('${{ matrix.test_mode }}' -eq 'xla') {
            $targets += 'xla_codegen_test'
          }
          cmake --build '${{ matrix.build_dir }}' --config Release --target @($targets) --parallel

      - name: Verify portable standard library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmDis = "$env:LLVM_HOME\bin\llvm-dis.exe"
          if (-not (Test-Path $llvmDis -PathType Leaf)) {
            throw "llvm-dis.exe not found in LLVM SDK at $llvmDis"
          }
          python scripts/verify_portable_stdlib.py `
            --bitcode '${{ matrix.build_dir }}\stdlib.bc' `
            --llvm-dis "$llvmDis" `
            --cmake-cache '${{ matrix.build_dir }}\CMakeCache.txt' `
            --expected-cpu generic

      - name: Verify Windows cache-disabled JIT exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmReadobj = "$env:LLVM_HOME\bin\llvm-readobj.exe"
          if (-not (Test-Path $llvmReadobj -PathType Leaf)) {
            throw "llvm-readobj.exe not found in LLVM SDK at $llvmReadobj"
          }
          python scripts/verify_windows_runtime_exports.py `
            --binary '${{ matrix.build_dir }}\Release\eshkol-run.exe' `
            --llvm-readobj "$llvmReadobj"

      - name: Run Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\run_all_tests.ps1 -BuildDir ".\${{ matrix.build_dir }}" -SkipConfigureBuild -Mode '${{ matrix.test_mode }}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $agentNativeTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-windows-agent-test.exe'
          if (-not (Test-Path $agentNativeTest -PathType Leaf)) {
            throw "Native Windows agent test executable is missing: $agentNativeTest"
          }
          & $agentNativeTest
          if ($LASTEXITCODE -ne 0) {
            throw "Native Windows agent test failed (exit $LASTEXITCODE)"
          }
          $agentHttpTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-agent-http-test.exe'
          if (-not (Test-Path $agentHttpTest -PathType Leaf)) {
            throw "Agent HTTP contract test executable is missing: $agentHttpTest"
          }
          & $agentHttpTest
          if ($LASTEXITCODE -ne 0) {
            throw "Agent HTTP contract test failed (exit $LASTEXITCODE)"
          }
          $agentSseTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-agent-sse-test.exe'
          if (-not (Test-Path $agentSseTest -PathType Leaf)) {
            throw "Agent SSE parser test executable is missing: $agentSseTest"
          }
          & $agentSseTest
          if ($LASTEXITCODE -ne 0) {
            throw "Agent SSE parser test failed (exit $LASTEXITCODE)"
          }
          $agentCapabilitiesTest = Join-Path '${{ matrix.build_dir }}' 'Release\eshkol-agent-capabilities-test.exe'
          if (-not (Test-Path $agentCapabilitiesTest -PathType Leaf)) {
            throw "Agent production capabilities test executable is missing: $agentCapabilitiesTest"
          }
          & $agentCapabilitiesTest
          if ($LASTEXITCODE -ne 0) {
            throw "Agent production capabilities test failed (exit $LASTEXITCODE)"
          }

      - name: Package Release Asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archiveRoot = "eshkol-$env:RELEASE_TAG-${{ matrix.name }}"
          $pkgDir = Join-Path $env:RUNNER_TEMP $archiveRoot
          $binDir = Join-Path $pkgDir 'bin'
          $libDir = Join-Path $pkgDir 'lib'
          $libEshkolDir = Join-Path $libDir 'eshkol'
          $shareDir = Join-Path $pkgDir 'share\eshkol'
          $shareLibDir = Join-Path $shareDir 'lib'
          $binaryDir = Join-Path '${{ matrix.build_dir }}' 'Release'
          $stdlibObject = Join-Path '${{ matrix.build_dir }}' 'stdlib.o'
          $stdlibBitcode = Join-Path '${{ matrix.build_dir }}' 'stdlib.bc'
          $runtimeLibrary = Join-Path $binaryDir 'eshkol-runtime.lib'
          $agentFfiLibrary = Join-Path $binaryDir 'eshkol-agent-ffi.lib'
          $agentPcre2Library = Join-Path $binaryDir 'eshkol-agent-pcre2.lib'
          $agentSqliteLibrary = Join-Path $binaryDir 'eshkol-agent-sqlite3.lib'
          $agentZlibLibrary = Join-Path $binaryDir 'eshkol-agent-zlib.lib'
          $agentTreeSitterGrammarsLibrary = Join-Path $binaryDir 'eshkol-agent-tree-sitter-grammars.lib'
          $agentTreeSitterLibrary = Join-Path $binaryDir 'eshkol-agent-tree-sitter.lib'
          $agentYogaLibrary = Join-Path $binaryDir 'eshkol-agent-yoga.lib'
          if (-not (Test-Path $stdlibObject)) {
            $stdlibCandidate = Join-Path $binaryDir 'stdlib.o'
            if (Test-Path $stdlibCandidate) {
              $stdlibObject = $stdlibCandidate
            } else {
              throw "stdlib.o was not found in '${{ matrix.build_dir }}' or '$binaryDir'"
            }
          }
          if (-not (Test-Path $stdlibBitcode)) {
            $stdlibBitcodeCandidate = Join-Path $binaryDir 'stdlib.bc'
            if (Test-Path $stdlibBitcodeCandidate) {
              $stdlibBitcode = $stdlibBitcodeCandidate
            } else {
              throw "stdlib.bc was not found in '${{ matrix.build_dir }}' or '$binaryDir'"
            }
          }
          if (-not (Test-Path $runtimeLibrary -PathType Leaf)) {
            $runtimeLibraryCandidate = Join-Path '${{ matrix.build_dir }}' 'eshkol-runtime.lib'
            if (Test-Path $runtimeLibraryCandidate -PathType Leaf) {
              $runtimeLibrary = $runtimeLibraryCandidate
            } else {
              throw "eshkol-runtime.lib was not found in '${{ matrix.build_dir }}' or '$binaryDir'"
            }
          }
          if (-not (Test-Path $agentFfiLibrary -PathType Leaf)) {
            $agentFfiLibraryCandidate = Join-Path '${{ matrix.build_dir }}' 'eshkol-agent-ffi.lib'
            if (Test-Path $agentFfiLibraryCandidate -PathType Leaf) {
              $agentFfiLibrary = $agentFfiLibraryCandidate
            } else {
              throw "eshkol-agent-ffi.lib was not found in '${{ matrix.build_dir }}' or '$binaryDir'"
            }
          }
          if (-not (Test-Path $agentPcre2Library -PathType Leaf)) {
            $candidate = Join-Path '${{ matrix.build_dir }}' 'eshkol-agent-pcre2.lib'
            if (Test-Path $candidate -PathType Leaf) {
              $agentPcre2Library = $candidate
            } else {
              throw "eshkol-agent-pcre2.lib was not found in '${{ matrix.build_dir }}' or '$binaryDir'"
            }
          }
          if (-not (Test-Path $agentSqliteLibrary -PathType Leaf)) {
            $candidate = Join-Path '${{ matrix.build_dir }}' 'eshkol-agent-sqlite3.lib'
            if (Test-Path $candidate -PathType Leaf) {
              $agentSqliteLibrary = $candidate
            } else {
              throw "eshkol-agent-sqlite3.lib was not found in '${{ matrix.build_dir }}' or '$binaryDir'"
            }
          }
          $additionalAgentLibraries = @(
            @{ Name = 'eshkol-agent-zlib.lib'; Path = $agentZlibLibrary },
            @{ Name = 'eshkol-agent-tree-sitter-grammars.lib'; Path = $agentTreeSitterGrammarsLibrary },
            @{ Name = 'eshkol-agent-tree-sitter.lib'; Path = $agentTreeSitterLibrary },
            @{ Name = 'eshkol-agent-yoga.lib'; Path = $agentYogaLibrary }
          )
          foreach ($library in $additionalAgentLibraries) {
            if (-not (Test-Path $library.Path -PathType Leaf)) {
              $candidate = Join-Path '${{ matrix.build_dir }}' $library.Name
              if (Test-Path $candidate -PathType Leaf) {
                $library.Path = $candidate
              } else {
                throw "$($library.Name) was not found in '${{ matrix.build_dir }}' or '$binaryDir'"
              }
            }
          }

          New-Item -ItemType Directory -Force -Path $binDir, $libDir, $libEshkolDir, $shareDir, $shareLibDir | Out-Null

          Copy-Item -LiteralPath (Join-Path $binaryDir 'eshkol-run.exe') -Destination $binDir
          Copy-Item -LiteralPath (Join-Path $binaryDir 'eshkol-repl.exe') -Destination $binDir

          Get-ChildItem -Path (Join-Path $binaryDir '*.dll') -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $binDir
          }

          Copy-Item -LiteralPath $stdlibObject -Destination $libDir
          Copy-Item -LiteralPath $stdlibObject -Destination $libEshkolDir
          Copy-Item -LiteralPath $stdlibBitcode -Destination $libDir
          Copy-Item -LiteralPath $stdlibBitcode -Destination $libEshkolDir
          Copy-Item -LiteralPath $runtimeLibrary -Destination $libDir
          Copy-Item -LiteralPath $runtimeLibrary -Destination $libEshkolDir
          Copy-Item -LiteralPath $agentFfiLibrary -Destination $libDir
          Copy-Item -LiteralPath $agentFfiLibrary -Destination $libEshkolDir
          Copy-Item -LiteralPath $agentPcre2Library -Destination $libDir
          Copy-Item -LiteralPath $agentPcre2Library -Destination $libEshkolDir
          Copy-Item -LiteralPath $agentSqliteLibrary -Destination $libDir
          Copy-Item -LiteralPath $agentSqliteLibrary -Destination $libEshkolDir
          foreach ($library in $additionalAgentLibraries) {
            Copy-Item -LiteralPath $library.Path -Destination $libDir
            Copy-Item -LiteralPath $library.Path -Destination $libEshkolDir
          }

          Copy-Item -LiteralPath 'lib\stdlib.esk' -Destination $shareDir
          if (Test-Path 'lib\math.esk') {
            Copy-Item -LiteralPath 'lib\math.esk' -Destination $shareDir
          }

          $libRoot = (Resolve-Path 'lib').Path
          Get-ChildItem -Path 'lib' -Recurse -File -Filter '*.esk' | ForEach-Object {
            $relativePath = [System.IO.Path]::GetRelativePath($libRoot, $_.FullName)
            $destinationPath = Join-Path $shareLibDir $relativePath
            $destinationDir = Split-Path -Parent $destinationPath
            if (-not (Test-Path $destinationDir)) {
              New-Item -ItemType Directory -Force -Path $destinationDir | Out-Null
            }
            Copy-Item -LiteralPath $_.FullName -Destination $destinationPath
          }

          foreach ($doc in @('README.md', 'LICENSE', 'CHANGELOG.md', 'RELEASE_NOTES.md')) {
            if (Test-Path $doc) {
              Copy-Item -LiteralPath $doc -Destination $pkgDir
            }
          }

          python scripts/stage_third_party_licenses.py `
            --build-dir '${{ matrix.build_dir }}' `
            --package-dir "$pkgDir"
          if ($LASTEXITCODE -ne 0) {
            throw "third-party license staging failed with exit code $LASTEXITCODE"
          }

          # Preserve a full user-mode dump if the relocated package smoke
          # faults inside generated JIT code. This is failure-only evidence;
          # WER still returns the original nonzero process status.
          $dumpDir = Join-Path $env:RUNNER_TEMP "eshkol-crash-dumps-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $dumpKey = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\eshkol-run.exe'
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null

          python scripts/verify_release_package.py `
            --package-dir "$pkgDir" `
            --smoke-source "tests/toolchain/windows-smoke.esk" `
            --agent-smoke-source "tests/toolchain/release-agent-smoke.esk" `
            --expected-version "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "release package smoke failed with exit code $LASTEXITCODE"
          }

          $archivePath = Join-Path $env:RUNNER_TEMP "$archiveRoot.zip"
          if (Test-Path $archivePath) {
            Remove-Item -LiteralPath $archivePath -Force
          }
          Compress-Archive -Path $pkgDir -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Upload Windows Package Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ matrix.name }}
          path: |
            ${{ matrix.build_dir }}\stdlib.bc
            ${{ matrix.build_dir }}\stdlib.o
            ${{ matrix.build_dir }}\CMakeCache.txt
            ${{ matrix.build_dir }}\Release\eshkol-run.exe
            ${{ matrix.build_dir }}\Release\eshkol-run.pdb
            ${{ runner.temp }}\eshkol-${{ env.RELEASE_TAG }}-${{ matrix.name }}\bin\eshkol-run.exe
            ${{ runner.temp }}\eshkol-${{ env.RELEASE_TAG }}-${{ matrix.name }}\lib\stdlib-jit-v4-*.o
            ${{ runner.temp }}\eshkol-crash-dumps-${{ matrix.name }}\*.dmp
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Packaged Asset
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.name }}
          path: ${{ runner.temp }}\eshkol-${{ env.RELEASE_TAG }}-${{ matrix.name }}.zip
          if-no-files-found: error

  # Release-blocking readiness gate (ADR-0010 section 2.5; closes AR1 gap A5).
  # Regenerates the oracle evidence AT THE TAGGED SHA and runs the canonical
  # v1.3-evolve readiness check. `publish-release` needs this job, so no asset
  # is published on a real tag push unless ICC certifies ready/100. This turns
  # "readiness=100" from a workstation verdict into a property of the released
  # artifact.
  #
  # Event handling:
  #   push (real tag)         -> BLOCKING: any verdict but ready/100 fails the
  #                             job and, via `needs`, blocks publish-release.
  #   workflow_dispatch (dry) -> ADVISORY: never publishes anything, so an
  #                             unready verdict or a missing ICC is a loud
  #                             warning, not a hard failure. This is not a
  #                             fail-open: the dry-run ships no artifact.
  #
  # ICC provisioning: the ICC binary is not on stock GitHub runners. Set the
  # ICC_BIN repository variable to a provisioned ICC install (self-hosted or a
  # runner that installs it) and register the checkout under ICC_REPO. On a
  # real tag push, if ICC is unavailable the gate emits a loud error and BLOCKS
  # — it never fail-opens to a green publish. See CONTRIBUTING.md
  # "Release-blocking readiness".
  release-readiness-gate:
    name: release-readiness-gate
    runs-on: ubuntu-22.04
    env:
      # Name intentionally distinct from ICC_BIN: the resolved binary path is
      # published to $GITHUB_ENV as ICC_BIN by the resolve step below, and a
      # job-level env of the same name would shadow that write in later steps.
      ICC_BIN_OVERRIDE: ${{ vars.ICC_BIN }}
      ICC_REPO: ${{ vars.ICC_REPO || 'eshkol_lang' }}
      # Arms release-blocking enforcement.  Set to 1 in the same change that
      # provisions ICC on the release runner; until then the gate reports
      # loudly without blocking a release it cannot certify.
      REQUIRE_READINESS_GATE: ${{ vars.ESHKOL_REQUIRE_READINESS_GATE }}
    steps:
      - uses: actions/checkout@v6

      # Resolve ICC FIRST so a runner without it decides fast, before spending
      # ~20 min on a build it could never certify. On a real tag push, absence
      # of the oracle is a blocked release, never a green one.
      - name: Resolve ICC binary (block on push, never fail-open)
        shell: bash
        run: |
          set -uo pipefail
          ICC_BIN="${ICC_BIN_OVERRIDE:-$HOME/Desktop/infinite_context_coder/bin/icc}"
          if [[ -n "$ICC_BIN" && -x "$ICC_BIN" ]]; then
            echo "ICC_BIN=$ICC_BIN" >> "$GITHUB_ENV"
            echo "ICC_AVAILABLE=true" >> "$GITHUB_ENV"
            "$ICC_BIN" --version || true
            exit 0
          fi
          echo "ICC_AVAILABLE=false" >> "$GITHUB_ENV"
          msg="ICC_BIN='${ICC_BIN:-unset}' is not present or executable on this runner. The release cannot be certified without the readiness oracle. Provision ICC on the release runner and set the ICC_BIN repository variable — see CONTRIBUTING.md 'Release-blocking readiness'."
          # Enforcement is armed by the repository variable ESHKOL_REQUIRE_READINESS_GATE=1.
          # Until ICC is provisioned on the release runner, an unarmed gate warns loudly
          # rather than blocking a release it cannot yet certify: a gate that always
          # blocks would be turned off, and a gate that is off is worse than one that
          # is honest about not running.  Arm it in the same change that provisions ICC.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${REQUIRE_READINESS_GATE}" != "1" ]]; then
            echo "::warning title=Release readiness gate NOT ARMED::$msg Publication continues because ESHKOL_REQUIRE_READINESS_GATE is not set to 1. This release is certified by the maintainer-side battery instead."
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "::error title=Release readiness gate: ICC unavailable::$msg Publication is BLOCKED (never fail-open)."
            exit 1
          fi
          echo "::warning title=Readiness gate skipped (dry-run)::$msg This non-publishing dry-run continues; a real tag push would be BLOCKED here."

      - name: Add LLVM Repository (Linux)
        if: env.ICC_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          apt_update() {
            for attempt in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=5; then
                return 0
              fi
              sudo rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 15))
            done
            sudo apt-get update -o Acquire::Retries=5
          }
          apt_update

      - name: Install Dependencies (Linux)
        if: env.ICC_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get install -y \
            cmake ninja-build \
            llvm-${LLVM_MAJOR} llvm-${LLVM_MAJOR}-dev lld-${LLVM_MAJOR} \
            libreadline-dev pkg-config \
            libssl-dev libncurses-dev \
            libpcre2-dev libsqlite3-dev \
            libpng-dev libjpeg-dev libwebp-dev \
            git python3 jq
          sudo ln -sf "/usr/bin/ld.lld-${LLVM_MAJOR}" /usr/bin/ld.lld
          ld.lld --version

      - name: Configure and build (readiness evidence)
        if: env.ICC_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          LLVM_CONFIG="/usr/bin/llvm-config-${LLVM_MAJOR}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DESHKOL_REQUIRED_LLVM_MAJOR="${LLVM_MAJOR}" \
            -DLLVM_CONFIG_EXECUTABLE="$LLVM_CONFIG" \
            -DESHKOL_BUILD_TESTS=ON \
            -DESHKOL_BUILD_AGENT_FFI=ON
          # Full build: run_vm_parity.sh needs the VM standalone binary, and it
          # is the canonical test_result emitter the dispatch-table invariant
          # consumes — without it architecture-verify false-FAILs.
          cmake --build build --parallel

      # Regenerate the oracle evidence at the tagged SHA (the readiness recipe's
      # trace-emitting steps): language-surface coverage, then VM parity.
      - name: Emit evidence traces
        if: env.ICC_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          scripts/run_language_coverage.sh
          scripts/run_vm_parity.sh

      # Register the checkout so --repo resolves, then run the incident-class
      # architecture invariants and emit the architecture_model event the
      # readiness oracle reads.
      - name: ICC architecture-verify
        if: env.ICC_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          "$ICC_BIN" index --repo "$ICC_REPO"
          "$ICC_BIN" architecture-verify \
            --repo "$ICC_REPO" \
            --model .icc/architecture-model.yaml \
            --trace-dir scripts/icc_traces \
            --emit-trace

      # The gate. run_v1_3_readiness.sh refreshes the smoke trace, asks ICC for
      # trace-aware v1.3-evolve readiness, and exits nonzero unless status ==
      # ready. The explicit re-read then asserts score == 100 so the gate is
      # literally "ready/100"; a wrong/absent score field leaves the canonical
      # status check as the sole bar (never a spurious block). On a tag push an
      # unready verdict blocks publication; on a dry-run it is advisory.
      - name: ICC readiness gate (fail unless ready/100 on tag push)
        if: env.ICC_AVAILABLE == 'true'
        shell: bash
        run: |
          set -uxo pipefail
          block=0
          [[ "${GITHUB_EVENT_NAME}" == "push" ]] && block=1

          verdict() {
            # verdict "<message>"  -> error+exit on push, warning on dry-run
            if [[ "$block" == 1 ]]; then
              echo "::error title=Release blocked::$1"
              exit 1
            fi
            echo "::warning title=Readiness (advisory on dry-run)::$1"
          }

          if ! scripts/run_v1_3_readiness.sh; then
            verdict "scripts/run_v1_3_readiness.sh reported v1.3-evolve is not ready."
          fi

          readiness_json="$(mktemp)"
          "$ICC_BIN" readiness \
            --repo "$ICC_REPO" \
            --target v1.3-evolve \
            --trace-dir scripts/icc_traces \
            --format json > "$readiness_json"
          status="$(jq -r '.status // ""' "$readiness_json")"
          score="$(jq -r '.score // .readiness // empty' "$readiness_json")"
          echo "v1.3-evolve readiness: status=$status score=${score:-<none>}"

          if [[ "$status" != "ready" ]]; then
            verdict "v1.3-evolve readiness is '$status', expected 'ready'."
          fi
          if [[ -n "$score" && "$score" != "100" ]]; then
            verdict "v1.3-evolve readiness score is '$score', expected 100."
          fi

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-evidence
          path: |
            scripts/icc_traces/
            .icc/runtime-traces/
            .icc/runtime-traces-oracle-view/
          if-no-files-found: ignore

  publish-release:
    name: publish-release
    runs-on: ubuntu-22.04
    needs:
      - unix-release-matrix
      - windows-release-matrix
      - release-readiness-gate

    steps:
      - uses: actions/checkout@v6

      - name: Download Packaged Assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-asset-*
          merge-multiple: true

      - name: Validate Release Asset Set
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            "eshkol-${RELEASE_TAG}-linux-x64-lite.tar.gz"
            "eshkol-${RELEASE_TAG}-linux-arm64-lite.tar.gz"
            "eshkol-${RELEASE_TAG}-linux-x64-xla.tar.gz"
            "eshkol-${RELEASE_TAG}-linux-arm64-xla.tar.gz"
            "eshkol-${RELEASE_TAG}-linux-x64-cuda.tar.gz"
            "eshkol-${RELEASE_TAG}-linux-arm64-cuda.tar.gz"
            "eshkol-${RELEASE_TAG}-macos-arm64-lite.tar.gz"
            "eshkol-${RELEASE_TAG}-macos-x64-lite.tar.gz"
            "eshkol-${RELEASE_TAG}-macos-arm64-xla.tar.gz"
            "eshkol-${RELEASE_TAG}-macos-x64-xla.tar.gz"
            "eshkol-${RELEASE_TAG}-windows-x64-lite.zip"
            "eshkol-${RELEASE_TAG}-windows-arm64-lite.zip"
            "eshkol-${RELEASE_TAG}-windows-x64-xla.zip"
            "eshkol-${RELEASE_TAG}-windows-arm64-xla.zip"
            "eshkol-${RELEASE_TAG}-windows-x64-cuda.zip"
          )

          cd dist
          missing=0
          for asset in "${expected[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              missing=1
            fi
          done

          asset_count="$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l | tr -d ' ')"
          if [[ "$asset_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release assets, found $asset_count:" >&2
            find . -maxdepth 1 -type f -print | sort >&2
            missing=1
          fi

          exit "$missing"

      - name: Generate Checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Prepare Curated Release Notes
        shell: bash
        run: |
          set -euo pipefail
          expected_heading="# Eshkol ${RELEASE_TAG} — Release Notes"
          actual_heading="$(head -n 1 RELEASE_NOTES.md)"
          if [[ "$actual_heading" != "$expected_heading" ]]; then
            echo "Release-notes heading mismatch" >&2
            echo "expected: $expected_heading" >&2
            echo "actual:   $actual_heading" >&2
            exit 1
          fi
          awk 'NR == 1 { print; next } /^---$/ { exit } { print }' \
            RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Upload Validated Dry-Run Assets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite or append assets."
            echo "Delete the failed draft/release manually before rerunning this tag workflow."
            exit 1
          fi

          prerelease_flags=()
          if [[ "$RELEASE_TAG" == *alpha* ||
                "$RELEASE_TAG" == *beta* ||
                "$RELEASE_TAG" == *rc* ]]; then
            prerelease_flags+=(--prerelease)
          fi

          # gh creates the release as a draft, uploads assets, then publishes it.
          # That avoids a public partial release if the upload is interrupted.
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Eshkol $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease_flags[@]}" \
            dist/*

  bump-homebrew-tap:
    name: bump-homebrew-tap
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    needs:
      - publish-release
    steps:
      - name: Update Formula in tsotchke/homebrew-eshkol
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN secret not configured; skipping tap bump." \
                 "Add a repo-scoped PAT with write access to tsotchke/homebrew-eshkol to enable it."
            exit 0
          fi

          case "$RELEASE_TAG" in
            *alpha*|*beta*|*rc*)
              echo "::notice::Prerelease tag $RELEASE_TAG; not bumping the tap."
              exit 0;;
          esac

          tag="$RELEASE_TAG"
          tarball_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"

          # GitHub source archives are generated on demand; fetch and hash.
          curl -fsSL -o /tmp/src.tar.gz "$tarball_url"
          sha="$(sha256sum /tmp/src.tar.gz | awk '{print $1}')"
          echo "tag=$tag sha256=$sha"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tsotchke/homebrew-eshkol.git" /tmp/tap
          cd /tmp/tap

          formula=Formula/eshkol.rb
          # Only rewrite the TOP-LEVEL url/sha256 (2-space indent). The formula
          # also carries `resource` blocks whose own sha256 lines (4-space
          # indent) pin the bundled agent-FFI dependencies — those must survive
          # the bump untouched, so both substitutions are anchored to column 3.
          sed -i -E "s|^  url \"https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/[^\"]+\"|  url \"${tarball_url}\"|" "$formula"
          sed -i -E "s|^  sha256 \"[0-9a-f]{64}\"|  sha256 \"${sha}\"|" "$formula"

          if git diff --quiet; then
            echo "::notice::Formula already at ${tag}; nothing to do."
            exit 0
          fi

          # Sanity: the new url and sha must both be present.
          grep -q "$tarball_url" "$formula"
          grep -q "$sha" "$formula"

          git -c user.name=tsotchke -c user.email=tsotchkele@gmail.com \
              commit -am "eshkol ${tag}"
          git push origin HEAD
