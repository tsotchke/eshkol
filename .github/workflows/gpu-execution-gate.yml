name: GPU Execution Gate

# WHY THIS WORKFLOW EXISTS (read before touching runs-on below)
#
# The `linux-x64-cuda` / `linux-arm64-cuda` / `windows-x64-cuda` jobs in
# ci.yml build Eshkol with -DESHKOL_GPU_ENABLED=ON and run
# scripts/run_gpu_tests.sh against that build. Those jobs run on
# GitHub-hosted runners (ubuntu-22.04, ubuntu-22.04-arm, windows-2022),
# and hosted runners have NO GPU. nvcc/the CUDA toolkit compiles the
# .cu kernels fine, and vm_gpu_dispatch.h's `eshkol_gpu_init()` returns 0
# devices, so every "GPU" tensor op in that lane silently falls through to
# the CPU path. Those lanes are a COMPILATION gate, not an EXECUTION gate
# — they will not catch a real bug in gpu_cuda_kernels.cu, gpu_memory_cuda.cpp,
# or gpu_memory.mm (Metal). Ad hoc GPU execution otherwise only happened
# on a Jetson AGX Xavier (nix/jetson/), run by hand.
#
# This workflow is the missing execution gate: tests/gpu/gpu_correctness_gate.sh
# builds Eshkol with GPU acceleration ON *and* OFF, runs the same
# differentiable workload (tests/gpu/gpu_correctness_gate.esk) through
# both, and diffs GPU-vs-CPU numeric output within tolerance. It only
# produces a verdict on a host with a real GPU device; everywhere else it
# exits 0 with a SKIP message (see the script's step-1/step-4 checks), so
# it is always safe to invoke.
#
# IT WILL NOT RUN ON A GITHUB-HOSTED RUNNER, BY DESIGN. `runs-on` below
# targets a self-hosted runner carrying the `[self-hosted, gpu]` labels.
# Until such a runner is registered against this repository, the job
# queues and does nothing harmful — it does not fail CI, and it is not a
# required check on any branch protection rule. Candidates for that
# runner label: this repo's own Apple Silicon / Metal development
# machines, or the Jetson AGX Xavier described in nix/jetson/README.md
# (attach via `nix-shell nix/jetson/shell.nix` + the standard GitHub
# Actions self-hosted runner agent). Do NOT repoint this at a
# GitHub-hosted runner — that silently turns it back into a
# compile-only gate, defeating the point of this file.
#
# Registering that runner — which is what closes ADR-0010 gap A13 and
# silences the warning gpu-gate-visibility emits below — is written up
# step by step in docs/platform/SELF_HOSTED_RUNNERS.md. Note in
# particular its label rule: `gpu` means a real, addressable GPU DEVICE,
# not merely a GPU toolchain. A runner carrying `gpu` without a device
# would let this job report success while measuring the CPU fallback,
# which is the exact failure this workflow exists to detect.
on:
  workflow_dispatch: {}
  schedule:
    # Nightly, well off the hour to avoid the herd of on-the-hour jobs.
    - cron: '17 9 * * *'
  push:
    branches: [master]
    paths:
      - 'lib/backend/gpu/**'
      - 'lib/backend/vm_gpu_dispatch.h'
      - 'tests/gpu/gpu_correctness_gate.*'
      - 'web/**'
      - 'site/static/eshkol-webgpu.js'
      - 'site/static/eshkol-runtime.js'
      - 'scripts/lib/webgpu_diff_runner.mjs'
      - '.github/workflows/gpu-execution-gate.yml'

concurrency:
  group: gpu-execution-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-execution:
    name: GPU execution correctness (real GPU, not compile-only)
    # Requires a self-hosted runner registered with BOTH labels below.
    # See the file-level comment for why this deliberately does not
    # target a GitHub-hosted runner.
    runs-on: [self-hosted, gpu]
    # A missing self-hosted runner leaves this job queued rather than
    # failed; cap the wait so a permanently-absent runner doesn't hang
    # the workflow run indefinitely.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Run GPU execution correctness gate
        shell: bash
        env:
          # Fresh build every run — correctness is the point, not build
          # caching. Self-hosted runners can set REUSE_BUILDS=1 in their
          # own environment if they persist build-gpu-gate*/ between runs.
          GPU_GATE_TOL: '1e-9'
        run: ./tests/gpu/gpu_correctness_gate.sh

      - name: Run browser WebGPU differential gate
        shell: bash
        env:
          GPU_GATE_TOL: '1e-9'
        run: |
          set +e
          node scripts/lib/webgpu_diff_runner.mjs
          rc=$?
          if [ "$rc" -eq 77 ]; then
            echo 'webgpu_diff_runner: SKIP - browser WebGPU evidence is unavailable on this runner'
            exit 0
          fi
          exit "$rc"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-execution-gate-logs
          path: |
            build-gpu-gate.configure.log
            build-gpu-gate.build.log
            build-gpu-gate-cpuref.configure.log
            build-gpu-gate-cpuref.build.log
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────
  # Visibility, not coverage.
  #
  # The job above has produced ZERO evidence since it was written: no
  # self-hosted `[self-hosted, gpu]` runner is registered, so every
  # scheduled run queues until `timeout-minutes` cancels it. A cancelled
  # job is easy to read as noise, which is exactly how a permanently
  # unrun correctness gate stays invisible.
  #
  # This job runs on a HOSTED runner on purpose — its whole purpose is to
  # report whether the real gate ran, so it must not depend on the
  # hardware whose absence it reports. It never fabricates GPU coverage
  # and it never fails the run: it emits a WARNING annotation, a job
  # summary, and an uploaded status marker naming exactly why there is no
  # GPU evidence and how long there has been none.
  # ───────────────────────────────────────────────────────────────────
  gpu-gate-visibility:
    name: GPU gate staleness report (hosted — reports whether the real gate ran)
    needs: gpu-execution
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Report whether the GPU execution gate ran
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GATE_RESULT: ${{ needs.gpu-execution.result }}
        run: |
          set -u
          marker=gpu-gate-status.txt

          # Best-effort: listing self-hosted runners needs administration:read,
          # which GITHUB_TOKEN does not have by default. An unavailable count is
          # reported as unknown rather than guessed.
          runners=$(gh api "repos/$REPO/actions/runners" \
                      --jq '[.runners[] | select([.labels[].name] | index("gpu"))] | length' \
                    2>/dev/null || echo unknown)

          last_success=$(gh api \
              "repos/$REPO/actions/workflows/gpu-execution-gate.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].updated_at // empty' 2>/dev/null || echo "")
          if [ -n "$last_success" ]; then
            days=$(( ( $(date -u +%s) - $(date -u -d "$last_success" +%s) ) / 86400 ))
            history="last successful run: $last_success (${days} days ago)"
          else
            history="last successful run: NEVER — this gate has produced no GPU evidence at any point in its history"
          fi

          {
            echo "gate_job_result: $GATE_RESULT"
            echo "gpu_labelled_self_hosted_runners: $runners"
            echo "$history"
            echo "commit: $GITHUB_SHA"
            echo "reported_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$marker"

          {
            echo "## GPU execution gate — did it actually run?"
            echo
            echo '| Fact | Value |'
            echo '|---|---|'
            echo "| \`gpu-execution\` job result | \`$GATE_RESULT\` |"
            echo "| self-hosted runners carrying the \`gpu\` label | $runners |"
            echo "| history | $history |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GATE_RESULT" = "success" ]; then
            echo "GPU execution gate ran and passed on a real GPU device."
            echo "verdict: GPU evidence produced by this run" >> "$marker"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "GPU evidence was produced by this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          reason="job result '$GATE_RESULT'"
          if [ "$runners" = "0" ]; then
            reason="no self-hosted runner carrying the [self-hosted, gpu] labels is registered"
          elif [ "$runners" = "unknown" ]; then
            reason="$reason; runner registration could not be read (token lacks administration:read)"
          fi

          echo "::warning title=GPU gate did not run::GPU execution gate produced NO evidence: $reason. $history. Every GPU/Metal correctness claim (including the exact-Ozaki/Ozaki-II GEMM tiers) is therefore unverified by automation — it is a manual attestation until a GPU runner is registered."
          echo "verdict: NO GPU evidence — $reason" >> "$marker"
          {
            echo
            echo "**GPU gate did not run: $reason.**"
            echo
            echo "No GPU/Metal correctness claim is verified by automation on this commit."
            echo "Until a \`[self-hosted, gpu]\` runner is registered, GPU correctness is a"
            echo "MANUAL attestation. On a Metal-capable host, the equivalent local evidence is:"
            echo
            echo '```'
            echo 'tests/gpu/gpu_correctness_gate.sh          # GPU-vs-CPU numeric diff'
            echo 'scripts/run_gpu_tests.sh                   # GPU suite + exact-Ozaki certification'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Visibility, never a false red: this job reports, it does not gate.
          exit 0

      - name: Upload GPU gate status marker
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-gate-status
          path: gpu-gate-status.txt
          if-no-files-found: warn
