# Custom self-hosted runner labels used by this repository.
# Keep this list in sync with docs/platform/SELF_HOSTED_RUNNERS.md.
self-hosted-runner:
  labels:
    - eshkol           # provisioned for this repo's build
    - grid-controller # trusted tailnet fan-out controller
    - linux-mesh      # pinned ephemeral Linux runner image
    - gpu             # real, addressable GPU device
    - cuda            # CUDA device plus nvcc; implies gpu
    - metal           # Apple Silicon Metal device; implies gpu
    - xla             # pinned StableHLO/XLA toolchain
    - wasm            # pinned emsdk and Node toolchain
