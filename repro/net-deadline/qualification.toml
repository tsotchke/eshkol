format = "eshkol-net-deadline-qualification-v2"
# Qualification of the deadline property on the socket lease layer: the wait
# inside lib/core/resource_lease.c consults the event loop only while deadline
# budget remains, so readiness that persists across a nonblocking system call
# answering EAGAIN cannot extend the deadline. Cancellation still takes
# precedence over an exhausted budget.
compiler_flags = ["-std=c11", "-O2", "-Wall", "-Wextra", "-pthread", "-I", "inc"]
tests = ["net_deadline_ready_test", "net_lease_test", "net_clock_failure_test", "net_runtime_test"]
scoped_native_c_tests_only = true
macos_windows_qualified = false
clock_and_event_loop_poll_injected = true

